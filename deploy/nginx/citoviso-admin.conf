# Admin subdomain → internal console (:4600). More-specific server_name wins over
# the wildcard *.citoviso.com block, so admin.citoviso.com serves the console, not
# the public site. Behind operatorAuth (login required on all internal routes).
server {
    listen 80;
    listen 443 ssl;
    server_name admin.citoviso.com;
    ssl_certificate     /etc/nginx/ssl/citoviso.crt;
    ssl_certificate_key /etc/nginx/ssl/citoviso.key;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:4600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
