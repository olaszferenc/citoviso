# Installed by deploy/tenant-tls/install.sh → /etc/nginx/sites-enabled/citoviso-acme-default
# (ADR-0394). The plain-HTTP catch-all for a tenant custom domain that has NO certificate
# yet: Let's Encrypt validates the name over port 80 (HTTP-01) before any per-domain block
# exists. Only the challenge is answered here; anything else is a 404 (the site itself is
# served only after the certificate, from the generated per-domain file).
# citoviso.com / *.citoviso.com / admin.citoviso.com keep matching their own blocks by name.
server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}
# The per-domain HTTPS blocks the certificate job generates (one file per custom domain).
include /etc/nginx/citoviso-tenants/*.conf;
