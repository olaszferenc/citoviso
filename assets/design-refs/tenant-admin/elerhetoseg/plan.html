<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vázlat B — Önálló „Elérhetőség” menüpont</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>/*
 * Citoviso UI — the central design core ("dizájn-mag").
 * ADR-0021 ①: ONE source of truth for ALL first-party Citoviso surfaces
 * (public homepage, login, internal console, tenant-admin chrome).
 *
 * SCOPE BOUNDARY: this is the CONTROL-PLANE product brand — ONE stable Citoviso
 * identity. It is NOT the engine's per-skin `--cit-*` token contract, which themes
 * GENERATED tenant sites (data plane, variable per skin). Namespace is `--citui-*`
 * on purpose, to never collide with the engine tokens.
 *
 * Design language: navy/cyan brand, Space Grotesk (display) + Inter (text),
 * dark-gradient heroes, glassy surfaces. Icons are inline SVG (no emoji).
 */

/* ─────────────────────────────────────────────────────────────────────────
   1. DESIGN TOKENS
   ───────────────────────────────────────────────────────────────────────── */
:root {
  /* Brand palette */
  --citui-navy-950: #0a1f36; /* near-black navy — dark gradient end (sidebar) */
  --citui-navy-900: #0e2a47; /* deepest navy — hero/footer/CTA base */
  --citui-navy-800: #16283f; /* brand navy (logo) */
  --citui-navy-700: #203a59;
  --citui-cyan-500: #1fb6d6; /* accent cyan */
  --citui-cyan-400: #35c4e0; /* bright cyan */
  --citui-cyan-300: #6fd8eb; /* light cyan */
  --citui-glow-blue: #5081ff; /* decorative aurora glow (hero backgrounds only) */
  --citui-white:    #ffffff;

  /* Ink / neutrals (light-first) */
  --citui-ink:         #10243a; /* primary text */
  --citui-ink-inverse: #eaf3f8; /* text on dark navy surfaces */
  --citui-muted:       #5a6d82; /* secondary text — ≥4,6:1 on every light fill it sits on (surface-2, ok-soft, field, accent-soft); was #60748b = 4,17–4,48 there (console-dark-scan --light, 2026-09-25) */
  --citui-surface:     #f6fbfd; /* alt section background */
  --citui-surface-2:   #eef7fa; /* raised subtle */
  --citui-line:        rgba(14, 42, 71, 0.12);
  --citui-line-strong: rgba(14, 42, 71, 0.22);

  /* Semantic (for console / admin status) */
  --citui-ok:   #2fa96b;
  --citui-ok-soft: #e7f8ef; /* soft success background (saved pill) */
  --citui-warn: #d29922;
  --citui-bad:  #e5484d;
  --citui-info: var(--citui-cyan-500);

  /* ── SZÖVEG-VÁLTOZAT a jelentés-vivő színekhez (tulajdonosi döntés, 2026-09-15) ──
     ⛔⛔ MÉRT HIBA: a fenti hue-k JELZÉS-színek (keret, háttér, pötty) — világos
     háttéren FELIRATNAK viszont olvashatatlanok. Mérve a renderelt konzolon:
       --citui-ok      #2fa96b → 3,00 (a „Fizetek ▸" és a „Jóváhagyás" gomb, .q-good)
       --citui-bad     #e5484d → 3,91 (.con button.bad, .pg-head, .q-bad)
       --citui-warn    #d29922 → 2,52 (.q-mid, „elavult" jelvény)
       --citui-cyan-500 #1fb6d6 → 2,41 (MINDEN link a konzolon)
     A 4,5-ös küszöb alatt mind. A HUE VÁLTOZATLAN marad (keret/háttér/akcent), csak a
     FELIRAT kap sötétebb változatot — így a „színhang" megmarad, és a destruktív gomb
     nem lesz hangsúlyosabb, mint ma (a tulaj az „A — sötétebb felirat" változatot
     hagyta jóvá, `assets/design-refs/console/semantic-contrast/`).
     ⚠️ Az értékek nem tippeltek: minden TÉNYLEGES háttérre megoldva (fehér · felület ·
     felület-2 · ok-soft · a pill/pg-box színkeverékei), és a legrosszabb eset is
     TARTALÉKKAL megy át (≥5,3) — egy épphogy-átmenő érték a következő érme-feldobás.
     ⚠️ A `--citui-muted` SZÁNDÉKOSAN nem változik (tulajdonosi döntés): a 4,42–4,81
     a küszöb határán van, és a token átütne a tenant-adminra és a vendég-oldalra is.
     ⚠️ NYITOTT: a `[data-citui-theme="dark"]` hatókör ezeket NEM írja felül. Ma ez
     ártalmatlan — mérve: a sötét hatókörnek 0 használata van a repóban —, de aki
     bekapcsolja, annak ezt a négy értéket ki kell mérnie a sötét felületre. */
  --citui-ok-ink:   #19733f; /* legrosszabb mért: 5,35 (ok-soft pill) */
  --citui-bad-ink:  #b3262b; /* legrosszabb mért: 5,57 (rejected pill) */
  --citui-warn-ink: #7d5a12; /* legrosszabb mért: 5,67 (outdated pill) */
  --citui-link-ink: #10697a; /* legrosszabb mért: 5,81 (felület-2) */
  /* Text sitting ON a solid --citui-bad fill (danger button, alert head, frozen panel).
     Light: white on #e5484d → 3,91 (bold labels). The dark scope flips it. */
  --citui-on-bad: var(--citui-white);

  /* Elevation */
  --citui-shadow-sm: 0 10px 30px rgba(14, 42, 71, 0.08);
  --citui-shadow-md: 0 24px 60px rgba(14, 42, 71, 0.14);

  /* Radius */
  --citui-radius-sm:   14px;
  --citui-radius:      22px;
  --citui-radius-lg:   32px;
  --citui-radius-pill: 999px;

  /* Typography */
  --citui-font-display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --citui-font-text:    "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Layout / motion */
  --citui-container: 1180px;
  --citui-transition: 220ms ease;

  /* A lap alján FENNTARTOTT sáv, amit a lap aljára rögzített elemeknek ki kell
     kerülniük (ma: a süti-hozzájárulás sáv, `assets/runtime/cit-consent.css`).
     Alapból 0 — a honlapon és a jogi lapokon nincs mit kerülni. A mobil
     tenant-admin viszont saját alsó fül-sávot visel, ezért ott felüldefiniálódik
     (`citui-admin.css`) — nélküle a sáv MÉRTEN 11 fülből 6-ot eltakart. A GAZDALAP
     deklarálja, mennyi helyet tart fenn magának; nem a sáv találgat. */
  --citui-consent-bottom: 0px;

  /* A süti-sáv MÉRT magassága, amíg kinn van — a hozzájárulás-kezelő
     (`assets/runtime/cit-consent.js`) írja a gyökérre, és a döntés után TÖRLI.
     Így egy felület fenn tudja tartani a sáv helyét magának (a tenant-admin
     oldalsávja ezzel emeli a „Kilépés" gombot a sáv fölé) anélkül, hogy bárki
     egy kitalált magasság-konstanst hordozna. Alapból 0: nincs sáv, nincs foglalás. */
  --citui-consent-h: 0px;

  /* A kiküldött terv (/p/<token>) alján ülő RÖGZÍTETT réteg MÉRT magassága: a
     süti-sáv + a sablon saját Foglalás-sávja + a fölé mászó hívó pirula, együtt.
     A konfigurátor-futó (`assets/runtime/cit-configurator.js`, placeLaunch) írja
     a gyökérre, mert egyedül ő tudja, meddig kellett felmásznia. A jogi lábléc
     (`prospectNotice.ts`) ebből tart magának alsó térközt — mérve 2026-09-26,
     390 px-en 19 sablonból 19-en e nélkül a leiratkozó link a réteg ALATT volt.
     Alapból 0: pirula nélkül (már megvett oldal, JS nélkül) a süti-sáv magassága
     a tartalék. */
  --citui-cfg-clear: 0px;

  /* A tenant-admin MOBIL alsó fül-sávjának MÉRT magassága (a `citui-admin.css`
     állítja a ≤899px ágon; asztalin nincs alsó sáv, ezért 0). EGY forrás, KÉT
     fogyasztó: ennyi alsó tartalom-térköz kell, hogy a lap alja ne a fül-sáv alá
     essen, ÉS ennyivel ül feljebb a süti-sáv. Mérve 390px-en 186px — 11 fül HÁROM
     sorba tördelve (ADR-0084). ⛔ Ne írd át szabad kézzel: mérd újra. */
  --citui-admin-bottomnav-h: 0px;

  /* ── Felület-rétegek (ADR-0224, tenant-admin „Linear" nyelv) ──────────────────
     A `--citui-white` KÉT szerepet vitt: kártya-HÁTTÉR és fehér FELIRAT sötét
     mezőn. Sötét módban a kettő szétválik — a kártya sötét lesz, a felirat fehér
     marad —, ezért a HÁTTÉR-szerep saját tokent kap. Világosban az értékek a
     Linear-terv semleges szürkéi (nem brand-tintált), hogy a szín csak jelentést
     vigyen; a konzol/honlap ezeket nem használja, tehát változatlan marad. */
  --citui-bg:     #ffffff; /* the admin page canvas */
  --citui-panel:  #ffffff; /* card / drawer / dialog / top bar surface */
  --citui-side:   #fafafa; /* desktop sidebar */
  --citui-field:  #f6f7f8; /* input background */
  --citui-hover:  #f2f3f5; /* hover / active row */
  --citui-accent-ink: #06131b; /* text ON the cyan accent (measured 7,81:1) */
  --citui-accent-soft: color-mix(in srgb, var(--citui-cyan-500) 12%, transparent); /* active row / selected segment */

  /* ── Márka-navy SZÖVEG-szerepben (2026-09-25, konzol sötét módja) ──────────────
     A `--citui-navy-*` KÉT szerepet vitt: FELÜLET (sávok, gombok) és FELIRAT (alcím,
     aktív fül, másodlagos gomb, jelvény). Sötét módban a felirat-szerep 1,2:1-re esett
     a sötét panelen (mérve: scripts/console-dark-scan.mts, 21 lelet 12 képernyőn),
     ezért a felirat-szerep saját tokent kap. Világosban AZONOS a mai navyval. */
  --citui-ink-brand:   var(--citui-navy-900);
  --citui-ink-brand-2: var(--citui-navy-700);
}

/* Dark surface scope — flips neutrals; brand hues stay.
   Use on any wrapper (internal console shell, dark hero, etc.). */
[data-citui-theme="dark"] {
  --citui-ink:         #e6e9ef;
  --citui-muted:       #8a93a3;
  --citui-surface:     #12151c;
  --citui-surface-2:   #1b1f29;
  --citui-line:        #262b37;
  --citui-line-strong: #343a48;
  /* ADR-0224: a tenant-admin sötét módja. Semleges (nem navy-tintált) sötét
     rétegek — a Linear-terv sötét képei ezekből készültek. */
  --citui-bg:     #0f1116;
  --citui-panel:  #151821;
  --citui-side:   #12151c;
  --citui-field:  #1b1f29;
  --citui-hover:  #1e2330;
  /* A jelzés-hue-k VILÁGOSABB változata: a világos-módú telített zöld/piros a
     sötét panelen 2,5–3,5 kontrasztot adna keretként és pöttyként. */
  --citui-ok:      #3ddc97;
  --citui-warn:    #f0b35a;
  --citui-bad:     #ff7b7b;
  --citui-ok-soft: #14352a;
  /* ⛔ A négy FELIRAT-token a sötét panelre (#151821) KIMÉRVE (WCAG, ≥ 4,5, tartalékkal;
     mérés: node-os luminancia-számítás, 2026-09-24):
       ok-ink   #4fe3a3 → 10,85 · bad-ink #ff8e8e → 8,03 · warn-ink #f5c06b → 10,67 ·
       link-ink #4fd0ea → 9,74 (a --citui-field #1b1f29 mezőn a legrosszabb: bad-ink 7,46;
       a --citui-muted #8a93a3 a panelen 5,73). */
  --citui-ok-ink:   #4fe3a3;
  --citui-bad-ink:  #ff8e8e;
  --citui-warn-ink: #f5c06b;
  --citui-link-ink: #4fd0ea;
  /* The dark --citui-bad (#ff7b7b) is light: white on it is 2,51, navy is 5,81. */
  --citui-on-bad: var(--citui-navy-900);
  --citui-accent-soft: color-mix(in srgb, var(--citui-cyan-500) 16%, transparent);
  --citui-ink-brand:   var(--citui-ink);
  --citui-ink-brand-2: color-mix(in srgb, var(--citui-ink) 80%, var(--citui-muted));
}

/* ─────────────────────────────────────────────────────────────────────────
   2. BASE / RESET
   ───────────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--citui-font-text);
  color: var(--citui-ink);
  background: var(--citui-white);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.citui-menu-open { overflow: hidden; }

h1, h2, h3, h4 {
  font-family: var(--citui-font-display);
  color: var(--citui-ink-brand);
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin: 0 0 0.6em;
}

p { margin: 0 0 1rem; }

a { color: var(--citui-cyan-500); text-decoration: none; }
a:hover { text-decoration: underline; }

img, svg { display: block; max-width: 100%; }

button, input, select, textarea { font: inherit; }
button { border: 0; cursor: pointer; background: none; }

:focus-visible { outline: 2px solid var(--citui-cyan-500); outline-offset: 2px; border-radius: 4px; }

/* ─────────────────────────────────────────────────────────────────────────
   3. LAYOUT PRIMITIVES
   ───────────────────────────────────────────────────────────────────────── */
.citui-container { width: min(calc(100% - 32px), var(--citui-container)); margin-inline: auto; }
.citui-container--narrow { --citui-container: 820px; }

.citui-section { padding: 104px 0; }
.citui-section--alt { background: var(--citui-surface); }

.citui-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  margin: 0 0 18px;
  font-size: 0.8rem; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--citui-cyan-500);
}
.citui-eyebrow::before { content: ""; width: 28px; height: 2px; border-radius: 999px; background: currentColor; }

.citui-section-heading { max-width: 760px; margin-bottom: 52px; }
.citui-section-heading h2 {
  margin: 0 0 18px;
  font-size: clamp(2.15rem, 5vw, 4rem);
  line-height: 1.02; letter-spacing: -0.045em;
}
.citui-section-heading p { margin: 0; max-width: 690px; font-size: 1.08rem; color: var(--citui-muted); }

/* ─────────────────────────────────────────────────────────────────────────
   4. COMPONENTS
   ───────────────────────────────────────────────────────────────────────── */

/* Buttons */
.citui-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 22px;
  border-radius: var(--citui-radius-sm);
  font-family: var(--citui-font-text); font-weight: 800; text-decoration: none;
  transition: transform var(--citui-transition), box-shadow var(--citui-transition), background var(--citui-transition);
}
.citui-btn:hover { transform: translateY(-2px); text-decoration: none; }
.citui-btn:active { transform: translateY(0); }
.citui-btn:disabled, .citui-btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }

.citui-btn--primary {
  color: var(--citui-navy-900);
  background: linear-gradient(135deg, var(--citui-cyan-400), #8be8f3);
  box-shadow: 0 14px 36px rgba(31, 182, 214, 0.3);
}
.citui-btn--primary:hover { box-shadow: 0 18px 42px rgba(31, 182, 214, 0.38); }

.citui-btn--secondary { /* glass — for dark backgrounds */
  color: var(--citui-white);
  border: 1px solid rgba(255, 255, 255, 0.24);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(14px);
}
.citui-btn--dark {
  color: var(--citui-white); background: var(--citui-navy-900);
  box-shadow: 0 14px 34px rgba(14, 42, 71, 0.18);
}
.citui-btn--ghost { /* outline — for light app surfaces */
  color: var(--citui-navy-900); background: var(--citui-white);
  border: 1px solid var(--citui-line-strong);
}
.citui-btn--ghost:hover { border-color: var(--citui-navy-900); }
.citui-btn--sm { min-height: 42px; padding: 0 16px; font-size: 0.9rem; }

.citui-icon { width: 22px; height: 22px; flex: 0 0 auto; }

/* Chip (filled cyan tag — e.g. industry pills) */
.citui-chip {
  display: inline-flex; align-items: center;
  padding: 10px 14px; border-radius: var(--citui-radius-pill);
  color: var(--citui-navy-900); background: #e3f8fb;
  border: 1px solid rgba(31, 182, 214, 0.18);
  font-size: 0.9rem; font-weight: 700;
}

/* Status pill (outline — console/admin) */
.citui-pill {
  display: inline-flex; align-items: center; gap: 0.35em;
  padding: 0.15rem 0.6rem; border-radius: var(--citui-radius-pill);
  font-size: 0.78rem; font-weight: 600;
  border: 1px solid var(--citui-line-strong); color: var(--citui-muted);
}
.citui-pill--ok   { color: var(--citui-ok);   border-color: var(--citui-ok); }
.citui-pill--warn { color: var(--citui-warn); border-color: var(--citui-warn); }
.citui-pill--bad  { color: var(--citui-bad);  border-color: var(--citui-bad); }
.citui-pill--info { color: var(--citui-info); border-color: var(--citui-info); }

/* Card + panel */
.citui-card {
  padding: 28px; border: 1px solid var(--citui-line);
  border-radius: var(--citui-radius); background: var(--citui-white);
  box-shadow: var(--citui-shadow-sm);
}
.citui-panel {
  padding: 16px 18px; border: 1px solid var(--citui-line);
  border-radius: var(--citui-radius-sm); background: var(--citui-white);
}
.citui-panel__label {
  font-family: var(--citui-font-display); font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--citui-muted); margin: 0 0 12px;
}

/* Forms */
.citui-field { display: block; margin-bottom: 1rem; }
.citui-label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--citui-ink); margin-bottom: 0.5rem; }
.citui-input, .citui-select, .citui-textarea {
  width: 100%; color: var(--citui-ink); background: var(--citui-white);
  border: 1px solid var(--citui-line-strong); border-radius: var(--citui-radius-sm);
  padding: 0.7rem 0.9rem;
  transition: border-color var(--citui-transition), box-shadow var(--citui-transition);
}
.citui-input:focus, .citui-select:focus, .citui-textarea:focus {
  outline: none; border-color: var(--citui-cyan-500);
  box-shadow: 0 0 0 3px rgba(31, 182, 214, 0.18);
}
.citui-textarea { min-height: 7rem; resize: vertical; }
.citui-hint { font-size: 0.78rem; color: var(--citui-muted); margin-top: 0.5rem; }

/* Table */
.citui-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.citui-table th {
  text-align: left; font-family: var(--citui-font-display);
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--citui-muted); padding: 0.75rem; border-bottom: 1px solid var(--citui-line);
}
.citui-table td { padding: 0.75rem; border-bottom: 1px solid var(--citui-line); }
.citui-table tbody tr:hover td { background: var(--citui-surface-2); }

/* ── Shared chrome: header / nav / brand / footer ── */
.citui-nav { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }

.citui-brand {
  display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--citui-font-display); font-size: 1.32rem; font-weight: 700; letter-spacing: -0.03em;
  color: var(--citui-white); text-decoration: none;
}
.citui-brand:hover { text-decoration: none; }
.citui-brand__mark { width: 38px; height: 38px; flex: 0 0 auto; }
.citui-brand--ink { color: var(--citui-navy-900); }

/* The Citoviso lockup "B" (src/ui/brand.ts, ADR-0236): the E4 mark IS the letter C,
   then "itoviso". Mark = 1.6× the letter size, the word centred on it (the /pay/* ratio
   the owner approved). Size it with font-size on the lockup. Dark surface → the dark mark
   + white word; light surface → the light mark + navy word; "themed" follows the theme. */
.citui-lockup {
  display: inline-flex; color: var(--citui-navy-900); text-decoration: none;
  font-family: var(--citui-font-display); font-weight: 700; letter-spacing: -0.01em; line-height: 1;
  white-space: nowrap;
}
.citui-lockup.citui-lockup:hover { text-decoration: none; }
.citui-lockup--lg { font-size: 1.32rem; } /* header / login size: word 21 px, mark 34 px (= /pay/*) */
.citui-lockup__row { display: inline-flex; align-items: center; }
.citui-lockup__mark { height: 1.6em; width: auto; flex: 0 0 auto; margin-right: 0.02em; }
.citui-lockup__word { line-height: 1; }
.citui-lockup__word small {
  display: block; margin-top: 2px; font: 400 11px/1.3 var(--citui-font-text); letter-spacing: 0; color: var(--citui-muted);
}
/* ⚠️ Doubled class + :hover: a surface link rule (`.con a` 0,1,1 · `.con a:hover` 0,2,1)
   otherwise paints the word link-cyan. */
.citui-lockup.citui-lockup--on-dark, .citui-lockup.citui-lockup--on-dark:hover { color: var(--citui-white); }
.citui-lockup.citui-lockup--on-light, .citui-lockup.citui-lockup--on-light:hover { color: var(--citui-navy-900); }
.citui-lockup.citui-lockup--on-themed, .citui-lockup.citui-lockup--on-themed:hover { color: var(--citui-ink-brand); }
.citui-mark-themed { display: inline-flex; flex: 0 0 auto; }
.citui-mark-themed svg { height: var(--citui-mark-size, 26px); width: auto; }
/* Theme switch. ⚠️ Element-qualified on purpose: a sizing rule like `.x svg{display:block}`
   (0,1,1) beat a bare `.citui-mark--dark{display:none}` and showed BOTH marks. */
svg.citui-mark--dark { display: none; }
[data-citui-theme="dark"] svg.citui-mark--light { display: none; }
[data-citui-theme="dark"] svg.citui-mark--dark { display: block; }
.citui-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.citui-nav-links { display: flex; align-items: center; gap: 28px; font-size: 0.95rem; font-weight: 600; color: rgba(255, 255, 255, 0.8); }
.citui-nav-links a { color: inherit; transition: color var(--citui-transition); }
.citui-nav-links a:hover { color: var(--citui-white); text-decoration: none; }

.citui-nav-actions { display: flex; align-items: center; gap: 12px; }
.citui-nav-cta {

  border-radius: 12px; color: var(--citui-navy-900); background: var(--citui-cyan-400); font-weight: 800;
}
.citui-nav-cta:hover { text-decoration: none; }

.citui-menu-toggle {
  display: none; width: 44px; height: 44px; border-radius: 12px;
  color: var(--citui-white); background: rgba(255, 255, 255, 0.08);
  align-items: center; justify-content: center;
}
.citui-menu-toggle svg { width: 24px; height: 24px; }

/* ─────────────────────────────────────────────────────────────────────────
   5. REVEAL — progressive enhancement (NO-JS SAFE: content visible by default)
   Doctrine: no empty band without JS. The hidden state applies ONLY when the
   `citui-js` class is present on <html> (added by citui.js / inline head snippet).
   ───────────────────────────────────────────────────────────────────────── */
.citui-js .citui-reveal {
  opacity: 0; transform: translateY(28px);
  transition: opacity 700ms ease, transform 700ms ease;
}
.citui-js .citui-reveal.citui-visible { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .citui-js .citui-reveal { opacity: 1 !important; transform: none !important; transition: none; }
  * , *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

<div class="w-stage" id="stage"><iframe id="f" title="Vázlat"></iframe></div><script>var PAGES={"terkep":"<!DOCTYPE html><html lang=\"hu\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"robots\" content=\"noindex\"><script>(function(){try{var d=document.documentElement,t=localStorage.getItem('citui-theme');if(t==='dark'||t==='light')d.setAttribute('data-citui-theme',t);if(localStorage.getItem('citui-admin-rail')==='1')d.classList.add('is-rail');}catch(e){}})();<\/script><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap\" rel=\"stylesheet\"><link rel=\"icon\" href=\"/favicon.ico\" type=\"image/svg+xml\"><style>/*\n * Citoviso UI — the central design core (\"dizájn-mag\").\n * ADR-0021 ①: ONE source of truth for ALL first-party Citoviso surfaces\n * (public homepage, login, internal console, tenant-admin chrome).\n *\n * SCOPE BOUNDARY: this is the CONTROL-PLANE product brand — ONE stable Citoviso\n * identity. It is NOT the engine's per-skin `--cit-*` token contract, which themes\n * GENERATED tenant sites (data plane, variable per skin). Namespace is `--citui-*`\n * on purpose, to never collide with the engine tokens.\n *\n * Design language: navy/cyan brand, Space Grotesk (display) + Inter (text),\n * dark-gradient heroes, glassy surfaces. Icons are inline SVG (no emoji).\n */\n\n/* ─────────────────────────────────────────────────────────────────────────\n   1. DESIGN TOKENS\n   ───────────────────────────────────────────────────────────────────────── */\n:root {\n  /* Brand palette */\n  --citui-navy-950: #0a1f36; /* near-black navy — dark gradient end (sidebar) */\n  --citui-navy-900: #0e2a47; /* deepest navy — hero/footer/CTA base */\n  --citui-navy-800: #16283f; /* brand navy (logo) */\n  --citui-navy-700: #203a59;\n  --citui-cyan-500: #1fb6d6; /* accent cyan */\n  --citui-cyan-400: #35c4e0; /* bright cyan */\n  --citui-cyan-300: #6fd8eb; /* light cyan */\n  --citui-glow-blue: #5081ff; /* decorative aurora glow (hero backgrounds only) */\n  --citui-white:    #ffffff;\n\n  /* Ink / neutrals (light-first) */\n  --citui-ink:         #10243a; /* primary text */\n  --citui-ink-inverse: #eaf3f8; /* text on dark navy surfaces */\n  --citui-muted:       #5a6d82; /* secondary text — ≥4,6:1 on every light fill it sits on (surface-2, ok-soft, field, accent-soft); was #60748b = 4,17–4,48 there (console-dark-scan --light, 2026-09-25) */\n  --citui-surface:     #f6fbfd; /* alt section background */\n  --citui-surface-2:   #eef7fa; /* raised subtle */\n  --citui-line:        rgba(14, 42, 71, 0.12);\n  --citui-line-strong: rgba(14, 42, 71, 0.22);\n\n  /* Semantic (for console / admin status) */\n  --citui-ok:   #2fa96b;\n  --citui-ok-soft: #e7f8ef; /* soft success background (saved pill) */\n  --citui-warn: #d29922;\n  --citui-bad:  #e5484d;\n  --citui-info: var(--citui-cyan-500);\n\n  /* ── SZÖVEG-VÁLTOZAT a jelentés-vivő színekhez (tulajdonosi döntés, 2026-09-15) ──\n     ⛔⛔ MÉRT HIBA: a fenti hue-k JELZÉS-színek (keret, háttér, pötty) — világos\n     háttéren FELIRATNAK viszont olvashatatlanok. Mérve a renderelt konzolon:\n       --citui-ok      #2fa96b → 3,00 (a „Fizetek ▸\" és a „Jóváhagyás\" gomb, .q-good)\n       --citui-bad     #e5484d → 3,91 (.con button.bad, .pg-head, .q-bad)\n       --citui-warn    #d29922 → 2,52 (.q-mid, „elavult\" jelvény)\n       --citui-cyan-500 #1fb6d6 → 2,41 (MINDEN link a konzolon)\n     A 4,5-ös küszöb alatt mind. A HUE VÁLTOZATLAN marad (keret/háttér/akcent), csak a\n     FELIRAT kap sötétebb változatot — így a „színhang\" megmarad, és a destruktív gomb\n     nem lesz hangsúlyosabb, mint ma (a tulaj az „A — sötétebb felirat\" változatot\n     hagyta jóvá, `assets/design-refs/console/semantic-contrast/`).\n     ⚠️ Az értékek nem tippeltek: minden TÉNYLEGES háttérre megoldva (fehér · felület ·\n     felület-2 · ok-soft · a pill/pg-box színkeverékei), és a legrosszabb eset is\n     TARTALÉKKAL megy át (≥5,3) — egy épphogy-átmenő érték a következő érme-feldobás.\n     ⚠️ A `--citui-muted` SZÁNDÉKOSAN nem változik (tulajdonosi döntés): a 4,42–4,81\n     a küszöb határán van, és a token átütne a tenant-adminra és a vendég-oldalra is.\n     ⚠️ NYITOTT: a `[data-citui-theme=\"dark\"]` hatókör ezeket NEM írja felül. Ma ez\n     ártalmatlan — mérve: a sötét hatókörnek 0 használata van a repóban —, de aki\n     bekapcsolja, annak ezt a négy értéket ki kell mérnie a sötét felületre. */\n  --citui-ok-ink:   #19733f; /* legrosszabb mért: 5,35 (ok-soft pill) */\n  --citui-bad-ink:  #b3262b; /* legrosszabb mért: 5,57 (rejected pill) */\n  --citui-warn-ink: #7d5a12; /* legrosszabb mért: 5,67 (outdated pill) */\n  --citui-link-ink: #10697a; /* legrosszabb mért: 5,81 (felület-2) */\n  /* Text sitting ON a solid --citui-bad fill (danger button, alert head, frozen panel).\n     Light: white on #e5484d → 3,91 (bold labels). The dark scope flips it. */\n  --citui-on-bad: var(--citui-white);\n\n  /* Elevation */\n  --citui-shadow-sm: 0 10px 30px rgba(14, 42, 71, 0.08);\n  --citui-shadow-md: 0 24px 60px rgba(14, 42, 71, 0.14);\n\n  /* Radius */\n  --citui-radius-sm:   14px;\n  --citui-radius:      22px;\n  --citui-radius-lg:   32px;\n  --citui-radius-pill: 999px;\n\n  /* Typography */\n  --citui-font-display: \"Space Grotesk\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --citui-font-text:    \"Inter\", system-ui, -apple-system, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n\n  /* Layout / motion */\n  --citui-container: 1180px;\n  --citui-transition: 220ms ease;\n\n  /* A lap alján FENNTARTOTT sáv, amit a lap aljára rögzített elemeknek ki kell\n     kerülniük (ma: a süti-hozzájárulás sáv, `assets/runtime/cit-consent.css`).\n     Alapból 0 — a honlapon és a jogi lapokon nincs mit kerülni. A mobil\n     tenant-admin viszont saját alsó fül-sávot visel, ezért ott felüldefiniálódik\n     (`citui-admin.css`) — nélküle a sáv MÉRTEN 11 fülből 6-ot eltakart. A GAZDALAP\n     deklarálja, mennyi helyet tart fenn magának; nem a sáv találgat. */\n  --citui-consent-bottom: 0px;\n\n  /* A süti-sáv MÉRT magassága, amíg kinn van — a hozzájárulás-kezelő\n     (`assets/runtime/cit-consent.js`) írja a gyökérre, és a döntés után TÖRLI.\n     Így egy felület fenn tudja tartani a sáv helyét magának (a tenant-admin\n     oldalsávja ezzel emeli a „Kilépés\" gombot a sáv fölé) anélkül, hogy bárki\n     egy kitalált magasság-konstanst hordozna. Alapból 0: nincs sáv, nincs foglalás. */\n  --citui-consent-h: 0px;\n\n  /* A kiküldött terv (/p/<token>) alján ülő RÖGZÍTETT réteg MÉRT magassága: a\n     süti-sáv + a sablon saját Foglalás-sávja + a fölé mászó hívó pirula, együtt.\n     A konfigurátor-futó (`assets/runtime/cit-configurator.js`, placeLaunch) írja\n     a gyökérre, mert egyedül ő tudja, meddig kellett felmásznia. A jogi lábléc\n     (`prospectNotice.ts`) ebből tart magának alsó térközt — mérve 2026-09-26,\n     390 px-en 19 sablonból 19-en e nélkül a leiratkozó link a réteg ALATT volt.\n     Alapból 0: pirula nélkül (már megvett oldal, JS nélkül) a süti-sáv magassága\n     a tartalék. */\n  --citui-cfg-clear: 0px;\n\n  /* A tenant-admin MOBIL alsó fül-sávjának MÉRT magassága (a `citui-admin.css`\n     állítja a ≤899px ágon; asztalin nincs alsó sáv, ezért 0). EGY forrás, KÉT\n     fogyasztó: ennyi alsó tartalom-térköz kell, hogy a lap alja ne a fül-sáv alá\n     essen, ÉS ennyivel ül feljebb a süti-sáv. Mérve 390px-en 186px — 11 fül HÁROM\n     sorba tördelve (ADR-0084). ⛔ Ne írd át szabad kézzel: mérd újra. */\n  --citui-admin-bottomnav-h: 0px;\n\n  /* ── Felület-rétegek (ADR-0224, tenant-admin „Linear\" nyelv) ──────────────────\n     A `--citui-white` KÉT szerepet vitt: kártya-HÁTTÉR és fehér FELIRAT sötét\n     mezőn. Sötét módban a kettő szétválik — a kártya sötét lesz, a felirat fehér\n     marad —, ezért a HÁTTÉR-szerep saját tokent kap. Világosban az értékek a\n     Linear-terv semleges szürkéi (nem brand-tintált), hogy a szín csak jelentést\n     vigyen; a konzol/honlap ezeket nem használja, tehát változatlan marad. */\n  --citui-bg:     #ffffff; /* the admin page canvas */\n  --citui-panel:  #ffffff; /* card / drawer / dialog / top bar surface */\n  --citui-side:   #fafafa; /* desktop sidebar */\n  --citui-field:  #f6f7f8; /* input background */\n  --citui-hover:  #f2f3f5; /* hover / active row */\n  --citui-accent-ink: #06131b; /* text ON the cyan accent (measured 7,81:1) */\n  --citui-accent-soft: color-mix(in srgb, var(--citui-cyan-500) 12%, transparent); /* active row / selected segment */\n\n  /* ── Márka-navy SZÖVEG-szerepben (2026-09-25, konzol sötét módja) ──────────────\n     A `--citui-navy-*` KÉT szerepet vitt: FELÜLET (sávok, gombok) és FELIRAT (alcím,\n     aktív fül, másodlagos gomb, jelvény). Sötét módban a felirat-szerep 1,2:1-re esett\n     a sötét panelen (mérve: scripts/console-dark-scan.mts, 21 lelet 12 képernyőn),\n     ezért a felirat-szerep saját tokent kap. Világosban AZONOS a mai navyval. */\n  --citui-ink-brand:   var(--citui-navy-900);\n  --citui-ink-brand-2: var(--citui-navy-700);\n}\n\n/* Dark surface scope — flips neutrals; brand hues stay.\n   Use on any wrapper (internal console shell, dark hero, etc.). */\n[data-citui-theme=\"dark\"] {\n  --citui-ink:         #e6e9ef;\n  --citui-muted:       #8a93a3;\n  --citui-surface:     #12151c;\n  --citui-surface-2:   #1b1f29;\n  --citui-line:        #262b37;\n  --citui-line-strong: #343a48;\n  /* ADR-0224: a tenant-admin sötét módja. Semleges (nem navy-tintált) sötét\n     rétegek — a Linear-terv sötét képei ezekből készültek. */\n  --citui-bg:     #0f1116;\n  --citui-panel:  #151821;\n  --citui-side:   #12151c;\n  --citui-field:  #1b1f29;\n  --citui-hover:  #1e2330;\n  /* A jelzés-hue-k VILÁGOSABB változata: a világos-módú telített zöld/piros a\n     sötét panelen 2,5–3,5 kontrasztot adna keretként és pöttyként. */\n  --citui-ok:      #3ddc97;\n  --citui-warn:    #f0b35a;\n  --citui-bad:     #ff7b7b;\n  --citui-ok-soft: #14352a;\n  /* ⛔ A négy FELIRAT-token a sötét panelre (#151821) KIMÉRVE (WCAG, ≥ 4,5, tartalékkal;\n     mérés: node-os luminancia-számítás, 2026-09-24):\n       ok-ink   #4fe3a3 → 10,85 · bad-ink #ff8e8e → 8,03 · warn-ink #f5c06b → 10,67 ·\n       link-ink #4fd0ea → 9,74 (a --citui-field #1b1f29 mezőn a legrosszabb: bad-ink 7,46;\n       a --citui-muted #8a93a3 a panelen 5,73). */\n  --citui-ok-ink:   #4fe3a3;\n  --citui-bad-ink:  #ff8e8e;\n  --citui-warn-ink: #f5c06b;\n  --citui-link-ink: #4fd0ea;\n  /* The dark --citui-bad (#ff7b7b) is light: white on it is 2,51, navy is 5,81. */\n  --citui-on-bad: var(--citui-navy-900);\n  --citui-accent-soft: color-mix(in srgb, var(--citui-cyan-500) 16%, transparent);\n  --citui-ink-brand:   var(--citui-ink);\n  --citui-ink-brand-2: color-mix(in srgb, var(--citui-ink) 80%, var(--citui-muted));\n}\n\n/* ─────────────────────────────────────────────────────────────────────────\n   2. BASE / RESET\n   ───────────────────────────────────────────────────────────────────────── */\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--citui-font-text);\n  color: var(--citui-ink);\n  background: var(--citui-white);\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nbody.citui-menu-open { overflow: hidden; }\n\nh1, h2, h3, h4 {\n  font-family: var(--citui-font-display);\n  color: var(--citui-ink-brand);\n  line-height: 1.05;\n  letter-spacing: -0.03em;\n  margin: 0 0 0.6em;\n}\n\np { margin: 0 0 1rem; }\n\na { color: var(--citui-cyan-500); text-decoration: none; }\na:hover { text-decoration: underline; }\n\nimg, svg { display: block; max-width: 100%; }\n\nbutton, input, select, textarea { font: inherit; }\nbutton { border: 0; cursor: pointer; background: none; }\n\n:focus-visible { outline: 2px solid var(--citui-cyan-500); outline-offset: 2px; border-radius: 4px; }\n\n/* ─────────────────────────────────────────────────────────────────────────\n   3. LAYOUT PRIMITIVES\n   ───────────────────────────────────────────────────────────────────────── */\n.citui-container { width: min(calc(100% - 32px), var(--citui-container)); margin-inline: auto; }\n.citui-container--narrow { --citui-container: 820px; }\n\n.citui-section { padding: 104px 0; }\n.citui-section--alt { background: var(--citui-surface); }\n\n.citui-eyebrow {\n  display: inline-flex; align-items: center; gap: 10px;\n  margin: 0 0 18px;\n  font-size: 0.8rem; font-weight: 800; letter-spacing: 0.14em;\n  text-transform: uppercase; color: var(--citui-cyan-500);\n}\n.citui-eyebrow::before { content: \"\"; width: 28px; height: 2px; border-radius: 999px; background: currentColor; }\n\n.citui-section-heading { max-width: 760px; margin-bottom: 52px; }\n.citui-section-heading h2 {\n  margin: 0 0 18px;\n  font-size: clamp(2.15rem, 5vw, 4rem);\n  line-height: 1.02; letter-spacing: -0.045em;\n}\n.citui-section-heading p { margin: 0; max-width: 690px; font-size: 1.08rem; color: var(--citui-muted); }\n\n/* ─────────────────────────────────────────────────────────────────────────\n   4. COMPONENTS\n   ───────────────────────────────────────────────────────────────────────── */\n\n/* Buttons */\n.citui-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n  min-height: 52px; padding: 0 22px;\n  border-radius: var(--citui-radius-sm);\n  font-family: var(--citui-font-text); font-weight: 800; text-decoration: none;\n  transition: transform var(--citui-transition), box-shadow var(--citui-transition), background var(--citui-transition);\n}\n.citui-btn:hover { transform: translateY(-2px); text-decoration: none; }\n.citui-btn:active { transform: translateY(0); }\n.citui-btn:disabled, .citui-btn[aria-disabled=\"true\"] { opacity: 0.5; pointer-events: none; }\n\n.citui-btn--primary {\n  color: var(--citui-navy-900);\n  background: linear-gradient(135deg, var(--citui-cyan-400), #8be8f3);\n  box-shadow: 0 14px 36px rgba(31, 182, 214, 0.3);\n}\n.citui-btn--primary:hover { box-shadow: 0 18px 42px rgba(31, 182, 214, 0.38); }\n\n.citui-btn--secondary { /* glass — for dark backgrounds */\n  color: var(--citui-white);\n  border: 1px solid rgba(255, 255, 255, 0.24);\n  background: rgba(255, 255, 255, 0.08);\n  backdrop-filter: blur(14px);\n}\n.citui-btn--dark {\n  color: var(--citui-white); background: var(--citui-navy-900);\n  box-shadow: 0 14px 34px rgba(14, 42, 71, 0.18);\n}\n.citui-btn--ghost { /* outline — for light app surfaces */\n  color: var(--citui-navy-900); background: var(--citui-white);\n  border: 1px solid var(--citui-line-strong);\n}\n.citui-btn--ghost:hover { border-color: var(--citui-navy-900); }\n.citui-btn--sm { min-height: 42px; padding: 0 16px; font-size: 0.9rem; }\n\n.citui-icon { width: 22px; height: 22px; flex: 0 0 auto; }\n\n/* Chip (filled cyan tag — e.g. industry pills) */\n.citui-chip {\n  display: inline-flex; align-items: center;\n  padding: 10px 14px; border-radius: var(--citui-radius-pill);\n  color: var(--citui-navy-900); background: #e3f8fb;\n  border: 1px solid rgba(31, 182, 214, 0.18);\n  font-size: 0.9rem; font-weight: 700;\n}\n\n/* Status pill (outline — console/admin) */\n.citui-pill {\n  display: inline-flex; align-items: center; gap: 0.35em;\n  padding: 0.15rem 0.6rem; border-radius: var(--citui-radius-pill);\n  font-size: 0.78rem; font-weight: 600;\n  border: 1px solid var(--citui-line-strong); color: var(--citui-muted);\n}\n.citui-pill--ok   { color: var(--citui-ok);   border-color: var(--citui-ok); }\n.citui-pill--warn { color: var(--citui-warn); border-color: var(--citui-warn); }\n.citui-pill--bad  { color: var(--citui-bad);  border-color: var(--citui-bad); }\n.citui-pill--info { color: var(--citui-info); border-color: var(--citui-info); }\n\n/* Card + panel */\n.citui-card {\n  padding: 28px; border: 1px solid var(--citui-line);\n  border-radius: var(--citui-radius); background: var(--citui-white);\n  box-shadow: var(--citui-shadow-sm);\n}\n.citui-panel {\n  padding: 16px 18px; border: 1px solid var(--citui-line);\n  border-radius: var(--citui-radius-sm); background: var(--citui-white);\n}\n.citui-panel__label {\n  font-family: var(--citui-font-display); font-size: 0.75rem; font-weight: 700;\n  text-transform: uppercase; letter-spacing: 0.05em; color: var(--citui-muted); margin: 0 0 12px;\n}\n\n/* Forms */\n.citui-field { display: block; margin-bottom: 1rem; }\n.citui-label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--citui-ink); margin-bottom: 0.5rem; }\n.citui-input, .citui-select, .citui-textarea {\n  width: 100%; color: var(--citui-ink); background: var(--citui-white);\n  border: 1px solid var(--citui-line-strong); border-radius: var(--citui-radius-sm);\n  padding: 0.7rem 0.9rem;\n  transition: border-color var(--citui-transition), box-shadow var(--citui-transition);\n}\n.citui-input:focus, .citui-select:focus, .citui-textarea:focus {\n  outline: none; border-color: var(--citui-cyan-500);\n  box-shadow: 0 0 0 3px rgba(31, 182, 214, 0.18);\n}\n.citui-textarea { min-height: 7rem; resize: vertical; }\n.citui-hint { font-size: 0.78rem; color: var(--citui-muted); margin-top: 0.5rem; }\n\n/* Table */\n.citui-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }\n.citui-table th {\n  text-align: left; font-family: var(--citui-font-display);\n  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;\n  color: var(--citui-muted); padding: 0.75rem; border-bottom: 1px solid var(--citui-line);\n}\n.citui-table td { padding: 0.75rem; border-bottom: 1px solid var(--citui-line); }\n.citui-table tbody tr:hover td { background: var(--citui-surface-2); }\n\n/* ── Shared chrome: header / nav / brand / footer ── */\n.citui-nav { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }\n\n.citui-brand {\n  display: inline-flex; align-items: center; gap: 12px;\n  font-family: var(--citui-font-display); font-size: 1.32rem; font-weight: 700; letter-spacing: -0.03em;\n  color: var(--citui-white); text-decoration: none;\n}\n.citui-brand:hover { text-decoration: none; }\n.citui-brand__mark { width: 38px; height: 38px; flex: 0 0 auto; }\n.citui-brand--ink { color: var(--citui-navy-900); }\n\n/* The Citoviso lockup \"B\" (src/ui/brand.ts, ADR-0236): the E4 mark IS the letter C,\n   then \"itoviso\". Mark = 1.6× the letter size, the word centred on it (the /pay/* ratio\n   the owner approved). Size it with font-size on the lockup. Dark surface → the dark mark\n   + white word; light surface → the light mark + navy word; \"themed\" follows the theme. */\n.citui-lockup {\n  display: inline-flex; color: var(--citui-navy-900); text-decoration: none;\n  font-family: var(--citui-font-display); font-weight: 700; letter-spacing: -0.01em; line-height: 1;\n  white-space: nowrap;\n}\n.citui-lockup.citui-lockup:hover { text-decoration: none; }\n.citui-lockup--lg { font-size: 1.32rem; } /* header / login size: word 21 px, mark 34 px (= /pay/*) */\n.citui-lockup__row { display: inline-flex; align-items: center; }\n.citui-lockup__mark { height: 1.6em; width: auto; flex: 0 0 auto; margin-right: 0.02em; }\n.citui-lockup__word { line-height: 1; }\n.citui-lockup__word small {\n  display: block; margin-top: 2px; font: 400 11px/1.3 var(--citui-font-text); letter-spacing: 0; color: var(--citui-muted);\n}\n/* ⚠️ Doubled class + :hover: a surface link rule (`.con a` 0,1,1 · `.con a:hover` 0,2,1)\n   otherwise paints the word link-cyan. */\n.citui-lockup.citui-lockup--on-dark, .citui-lockup.citui-lockup--on-dark:hover { color: var(--citui-white); }\n.citui-lockup.citui-lockup--on-light, .citui-lockup.citui-lockup--on-light:hover { color: var(--citui-navy-900); }\n.citui-lockup.citui-lockup--on-themed, .citui-lockup.citui-lockup--on-themed:hover { color: var(--citui-ink-brand); }\n.citui-mark-themed { display: inline-flex; flex: 0 0 auto; }\n.citui-mark-themed svg { height: var(--citui-mark-size, 26px); width: auto; }\n/* Theme switch. ⚠️ Element-qualified on purpose: a sizing rule like `.x svg{display:block}`\n   (0,1,1) beat a bare `.citui-mark--dark{display:none}` and showed BOTH marks. */\nsvg.citui-mark--dark { display: none; }\n[data-citui-theme=\"dark\"] svg.citui-mark--light { display: none; }\n[data-citui-theme=\"dark\"] svg.citui-mark--dark { display: block; }\n.citui-sr {\n  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;\n  clip: rect(0 0 0 0); white-space: nowrap; border: 0;\n}\n\n.citui-nav-links { display: flex; align-items: center; gap: 28px; font-size: 0.95rem; font-weight: 600; color: rgba(255, 255, 255, 0.8); }\n.citui-nav-links a { color: inherit; transition: color var(--citui-transition); }\n.citui-nav-links a:hover { color: var(--citui-white); text-decoration: none; }\n\n.citui-nav-actions { display: flex; align-items: center; gap: 12px; }\n.citui-nav-cta {\n  min-height: 44px; display: inline-flex; align-items: center; padding-inline: 18px;\n  border-radius: 12px; color: var(--citui-navy-900); background: var(--citui-cyan-400); font-weight: 800;\n}\n.citui-nav-cta:hover { text-decoration: none; }\n\n.citui-menu-toggle {\n  display: none; width: 44px; height: 44px; border-radius: 12px;\n  color: var(--citui-white); background: rgba(255, 255, 255, 0.08);\n  align-items: center; justify-content: center;\n}\n.citui-menu-toggle svg { width: 24px; height: 24px; }\n\n/* ─────────────────────────────────────────────────────────────────────────\n   5. REVEAL — progressive enhancement (NO-JS SAFE: content visible by default)\n   Doctrine: no empty band without JS. The hidden state applies ONLY when the\n   `citui-js` class is present on <html> (added by citui.js / inline head snippet).\n   ───────────────────────────────────────────────────────────────────────── */\n.citui-js .citui-reveal {\n  opacity: 0; transform: translateY(28px);\n  transition: opacity 700ms ease, transform 700ms ease;\n}\n.citui-js .citui-reveal.citui-visible { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  .citui-js .citui-reveal { opacity: 1 !important; transform: none !important; transition: none; }\n  * , *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }\n}\n<\/style><title>Admin<\/title><style>\n.pl-row{display:flex;gap:8px;align-items:stretch}\n.pl-row .citui-input{flex:1;min-width:0}\n.pl-map{height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--citui-line);margin-top:14px;background:var(--citui-surface-2)}\n@media (max-width:700px){.pl-row{flex-direction:column}.pl-map{height:300px}}\n.pl-status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-size:13px;color:var(--citui-muted)}\n.pl-dot{width:8px;height:8px;border-radius:50%;background:var(--citui-ok);display:inline-block;margin-right:6px}\n.pl-status[data-s=\"moved\"] .pl-dot,.pl-status[data-s=\"found\"] .pl-dot{background:var(--citui-warn)}\n.pl-status[data-s=\"err\"] .pl-dot{background:var(--citui-bad)}\n.pl-status b{color:var(--citui-ink)}\n.pl-coords{font-variant-numeric:tabular-nums}\n.pl-link{background:none;border:0;padding:0;color:var(--citui-link-ink);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}\n.pl-tip{margin:8px 0 0}\n.pl-err{color:var(--citui-bad);font-size:13px;margin:6px 0 0}\n.pl-ok{color:var(--citui-muted);font-size:12.5px;margin:6px 0 0}\n.pl-save{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}\n.pl-dirty{font-size:13px;color:var(--citui-muted)}\n.pl-dirty[data-s=\"dirty\"]{color:var(--citui-warn-ink)}\n.pl-dirty[data-s=\"saved\"]{color:var(--citui-ok-ink)}\n.pl-where{font-size:12.5px;color:var(--citui-muted);margin:6px 0 0}\n.pl-2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}\n@media (max-width:700px){.pl-2{grid-template-columns:1fr}}\n.pl-crumb{font-size:13px;color:var(--citui-muted);margin:-4px 0 14px}\n<\/style><\/head><body class=\"adm-body\"><style>/*\n * Citoviso UI — tenant-admin layer (ADR-0021 ⑤, scoped .adm-*).\n * ALL tenant-admin styling comes from the central design core (ADR-0021 ①):\n * citui.css (tokens + components) + citui-admin.css (this file, token-driven).\n * NO inline stylesheet in adminViews.ts — change the core, the admin follows.\n * Brand-derived alphas use color-mix() over tokens so a skin swap propagates.\n *\n * ── ADR-0224 (2026-09-24): the „Linear\" language ──────────────────────────────\n * Contract: assets/design-refs/tenant-admin/admin-linear/ (README = what binds).\n * Colour ONLY for meaning: ONE accent (the logo's cyan) on the primary button, the\n * active menu item, the badge, the sparkline, the cover marker and the link;\n * green/amber/red only for state; everything else grey/ink. 13 px dense type, hairline\n * borders, NO card shadow, 6–8 px radii, thin line icons (src/ui/icons.ts ICON_THIN).\n * Light/dark: every surface reads its own layer token (--citui-panel/field/hover/bg),\n * never --citui-white as a background — that is what a „white hole\" in dark mode is.\n */\n\n/* ═══ 0. SCOPE: the admin re-tunes the core's shape tokens for itself ═══════════\n   The rest of the product keeps its 14/22 px radii and the display face; inside the\n   admin the Linear language is one family (Inter) and small radii. Setting the tokens\n   on the shell (not on :root) keeps the login page and the console untouched. */\n.adm-shell{\n  --citui-radius-sm:8px;--citui-radius:8px;--citui-radius-lg:10px;\n  --citui-font-display:var(--citui-font-text);\n  display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh;\n  background:var(--citui-bg);color:var(--citui-ink);font-size:13px;line-height:1.5}\n.is-rail .adm-shell{grid-template-columns:56px 1fr}\nbody.adm-body{background:var(--citui-bg);color:var(--citui-ink)}\n.adm-shell h1,.adm-shell h2,.adm-shell h3,.adm-shell h4{color:var(--citui-ink);letter-spacing:-.01em}\n.adm-shell a{color:var(--citui-link-ink)}\n.adm-shell svg{flex:0 0 auto}\n.adm-sp{flex:1}\n/* Core components, re-dressed for the admin (higher specificity than citui.css). */\n.adm-shell .citui-btn{min-height:36px;padding:0 14px;border-radius:6px;font-weight:600;font-size:.92em;\n  box-shadow:none;transition:background .15s,border-color .15s}\n.adm-shell .citui-btn:hover{transform:none;box-shadow:none}\n.adm-shell .citui-btn--sm{min-height:32px;padding:0 11px;font-size:.86em}\n.adm-shell .citui-btn--primary{background:var(--citui-cyan-500);color:var(--citui-accent-ink);border:1px solid transparent}\n.adm-shell .citui-btn--primary:hover{filter:brightness(1.06)}\n.adm-shell .citui-btn--ghost{background:var(--citui-panel);color:var(--citui-ink);border:1px solid var(--citui-line)}\n.adm-shell .citui-btn--ghost:hover{background:var(--citui-hover);border-color:var(--citui-line-strong)}\n.adm-shell .citui-btn--dark{background:var(--citui-ink);color:var(--citui-bg);box-shadow:none}\n.adm-shell .citui-input,.adm-shell .citui-select,.adm-shell .citui-textarea{\n  background:var(--citui-field);border:1px solid var(--citui-line);border-radius:6px;padding:8px 10px;font-size:.95em;color:var(--citui-ink)}\n.adm-shell .citui-input:focus,.adm-shell .citui-select:focus,.adm-shell .citui-textarea:focus{\n  border-color:var(--citui-cyan-500);box-shadow:0 0 0 3px color-mix(in srgb,var(--citui-cyan-500) 22%,transparent);background:var(--citui-panel)}\n.adm-shell .citui-label{font-size:.9em}\n.adm-shell .citui-hint{font-size:.85em}\n.adm-shell .citui-panel,.adm-shell .citui-card{background:var(--citui-panel);box-shadow:none}\n.adm-shell .citui-pill{font-size:.8em}\n.adm-shell .citui-pill--ok{color:var(--citui-ok-ink)}\n.adm-shell .citui-pill--warn{color:var(--citui-warn-ink)}\n.adm-shell .citui-pill--bad{color:var(--citui-bad-ink)}\n.adm-shell .citui-pill--info{color:var(--citui-link-ink)}\n.adm-shell .citui-table td,.adm-shell .citui-table th{border-color:var(--citui-line)}\n.adm-shell .citui-table tbody tr:hover td{background:var(--citui-hover)}\n\n/* ═══ 1. BUTTONS / ICON BUTTONS / TAGS (the Linear kit) ═════════════════════════ */\n.adm-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--citui-line);\n  background:var(--citui-panel);color:var(--citui-ink);font:600 .86em/1 var(--citui-font-text);padding:9px 13px;\n  border-radius:6px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,transform .1s}\n.adm-btn:hover{background:var(--citui-hover);text-decoration:none}\n.adm-btn:active{transform:scale(.98)}\n.adm-btn--p{background:var(--citui-cyan-500);border-color:transparent;color:var(--citui-accent-ink)}\n.adm-btn--p:hover{background:var(--citui-cyan-500);filter:brightness(1.06)}\n.adm-btn--danger{color:var(--citui-bad-ink);border-color:color-mix(in srgb,var(--citui-bad) 35%,transparent)}\n.adm-btn--danger:hover{background:color-mix(in srgb,var(--citui-bad) 10%,var(--citui-panel))}\n.adm-btn--sm{padding:6px 10px;font-size:.8em}\n.adm-btn[disabled],.adm-btn[aria-disabled=\"true\"]{opacity:.45;cursor:not-allowed;pointer-events:none}\n.adm-ib{width:32px;height:32px;border-radius:6px;border:1px solid var(--citui-line);background:var(--citui-panel);\n  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--citui-ink);padding:0;text-decoration:none}\n.adm-ib:hover{background:var(--citui-hover);text-decoration:none}\n.adm-ib[disabled]{opacity:.35;cursor:not-allowed}\n.adm-ib--ghost{border-color:transparent;background:transparent}\n.adm-ib--del{color:var(--citui-bad-ink)}\n.adm-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--citui-radius-pill);font-size:.76em;\n  font-weight:600;border:1px solid var(--citui-line);background:var(--citui-panel);white-space:nowrap;color:var(--citui-ink)}\n.adm-tag i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}\n.adm-tag--ok{color:var(--citui-ok-ink);background:color-mix(in srgb,var(--citui-ok) 12%,var(--citui-panel));border-color:transparent}\n.adm-tag--warn{color:var(--citui-warn-ink);background:color-mix(in srgb,var(--citui-warn) 14%,var(--citui-panel));border-color:transparent}\n.adm-tag--info{color:var(--citui-link-ink);background:var(--citui-accent-soft);border-color:transparent}\n.adm-tag--bad{color:var(--citui-bad-ink);background:color-mix(in srgb,var(--citui-bad) 12%,var(--citui-panel));border-color:transparent}\n.adm-tag--mute{color:var(--citui-muted)}\n.adm-bdg{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:var(--citui-radius-pill);background:var(--citui-cyan-500);\n  color:var(--citui-accent-ink);font-size:.7em;font-weight:700;align-items:center;justify-content:center;line-height:1}\n.adm-muted{color:var(--citui-muted)}\n\n/* ═══ 2. SIDEBAR (desktop) — white/grey, grouped, counted, collapsible to a rail ══ */\n/* ⭐ The `padding-bottom` keeps the consent bar's MEASURED height free while the bar is\n   out (`--citui-consent-h`, published by the consent runtime and cleared after the\n   decision) — the bar must never cover the account row (consent-style-check). */\n.adm-side{grid-row:1/3;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;\n  background:var(--citui-side);border-right:1px solid var(--citui-line);padding:10px 8px calc(10px + var(--citui-consent-h,0px));\n  overflow:hidden;min-width:0}\n.adm-side__top{display:flex;align-items:center;gap:8px;padding:4px 6px 12px}\n.adm-side__top svg{width:26px;height:26px}\n.adm-side__top b{font-size:.95em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}\n.adm-side__top small{display:block;color:var(--citui-muted);font-weight:400;font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.adm-side__top .adm-ib{width:24px;height:24px;border:0;background:transparent;color:var(--citui-muted)}\n.adm-side__top .adm-ib:hover{background:var(--citui-hover);color:var(--citui-ink)}\n.adm-nav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;\n  scrollbar-width:thin;scrollbar-color:var(--citui-line) transparent}\n/* Owner (2026-09-25): the stock scrollbar looked foreign next to the rail — a thin,\n   line-coloured thumb (stronger under the pointer), on the tokens the rail itself uses. */\n.adm-nav::-webkit-scrollbar{width:6px}\n.adm-nav::-webkit-scrollbar-track{background:transparent}\n.adm-nav::-webkit-scrollbar-thumb{background:var(--citui-line);border-radius:3px}\n.adm-nav::-webkit-scrollbar-thumb:hover{background:var(--citui-muted)}\n.adm-nav__g{font-size:.72em;font-weight:600;color:var(--citui-muted);padding:12px 8px 4px;white-space:nowrap}\n.adm-nav a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;color:var(--citui-ink);font-size:.95em;\n  text-decoration:none;white-space:nowrap;font-weight:500;position:relative}\n.adm-nav a:hover{background:var(--citui-hover);text-decoration:none}\n.adm-nav a.is-active{background:var(--citui-accent-soft);font-weight:600}\n.adm-nav a svg{color:var(--citui-muted)}\n.adm-nav a.is-active svg{color:var(--citui-link-ink)}\n.adm-nav__n{margin-left:auto;color:var(--citui-muted);font-size:.85em}\n.adm-nav a .adm-bdg{margin-left:auto}\n/* Module sub-list under „Modulok\" — contract: design-refs/tenant-admin/module-subnav. */\n.adm-nav__mod,.adm-menu__mod{display:flex;align-items:center;position:relative}\n.adm-nav__mod>a,.adm-menu__mod>a{flex:1;min-width:0}\n.adm-nav__tg{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border:0;\n  border-radius:6px;background:none;color:var(--citui-muted);cursor:pointer;position:absolute;right:4px;top:50%;transform:translateY(-50%)}\n.adm-nav__tg[hidden]{display:none}\n.adm-nav__tg:hover{background:var(--citui-hover);color:var(--citui-ink)}\n.adm-nav__tg svg{transition:transform .15s}\n.adm-nav__mod.is-open .adm-nav__tg svg,.adm-menu__mod.is-open .adm-nav__tg svg{transform:rotate(180deg)}\n.adm-nav__mod>a .adm-nav__n{margin-right:26px}\n.adm-nav__mod.is-parent>a,.adm-menu__mod.is-parent>a{font-weight:600}\n.adm-nav__mod.is-parent>a svg,.adm-menu__mod.is-parent>a svg{color:var(--citui-link-ink)}\n.adm-nav__sub,.adm-menu__sub{display:none;flex-direction:column;gap:1px;margin:1px 0 4px;position:relative}\n.adm-nav__mod.is-open+.adm-nav__sub,.adm-menu__mod.is-open+.adm-menu__sub{display:flex}\n.adm-nav__sub::before,.adm-menu__sub::before{content:\"\";position:absolute;left:16px;top:2px;bottom:2px;width:1px;background:var(--citui-line)}\n.adm-nav .adm-nav__sub a{font-size:.9em;font-weight:400;padding:5px 8px 5px 33px}\n.adm-nav__sub a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.adm-nav .adm-nav__sub a.is-active,.adm-menu .adm-menu__sub a.is-active{background:var(--citui-accent-soft);font-weight:600}\n.adm-nav__sub a.is-active::before,.adm-menu__sub a.is-active::before{content:\"\";position:absolute;left:15px;width:3px;height:16px;border-radius:2px;background:var(--citui-link-ink)}\n.adm-user{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--citui-line);margin-top:8px;font-size:.9em;white-space:nowrap}\n.adm-user__av{width:26px;height:26px;border-radius:50%;background:var(--citui-ink);color:var(--citui-bg);display:inline-flex;align-items:center;\n  justify-content:center;font-size:.7em;font-weight:700;flex:0 0 auto}\n[data-citui-theme=\"dark\"] .adm-user__av{background:var(--citui-cyan-500);color:var(--citui-accent-ink)}\n.adm-user__t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}\n.adm-user__t small{display:block;color:var(--citui-muted);font-size:.8em}\n.adm-user .adm-ib{color:var(--citui-muted)}\n.adm-user .adm-ib:hover{color:var(--citui-ink)}\n/* Rail: 56 px, icons only, tooltips carry the labels (title=). The choice persists. */\n.is-rail .adm-side__top b,.is-rail .adm-nav a span,.is-rail .adm-nav__g,.is-rail .adm-nav__n,.is-rail .adm-plan,.is-rail .adm-user__t{display:none}\n.is-rail .adm-nav a{justify-content:center;padding:8px 0}\n.is-rail .adm-nav a .adm-bdg{position:absolute;top:2px;right:4px;min-width:16px;height:16px;font-size:.62em}\n.is-rail .adm-side__top{justify-content:center;flex-direction:column;gap:6px}\n.is-rail .adm-user{flex-direction:column;gap:4px;padding:8px 0}\n.is-rail .adm-nav__tg,.is-rail .adm-nav__sub{display:none!important}\n.is-rail .adm-nav__mod>a .adm-nav__n{margin-right:0}\n/* Subscription card (from the Midnight round) — REAL data, see adminViews subscriptionCard(). */\n.adm-plan{border:1px solid var(--citui-line);border-radius:8px;padding:10px;margin:8px 0 0;font-size:.86em;\n  background:radial-gradient(120% 100% at 100% 0%,color-mix(in srgb,var(--citui-cyan-500) 18%,transparent),transparent 60%),var(--citui-panel)}\n.adm-plan b{display:flex;align-items:center;gap:6px;font-size:.95em}\n.adm-plan b svg{color:var(--citui-link-ink)}\n.adm-plan small{display:block;color:var(--citui-muted);margin:3px 0 8px;line-height:1.4}\n.adm-plan__bars{display:flex;gap:2px;height:10px;margin-bottom:8px}\n.adm-plan__bars i{flex:1;border-radius:2px;background:var(--citui-line)}\n.adm-plan__bars i.on{background:var(--citui-cyan-500)}\n.adm-plan__meter{height:10px;border-radius:2px;background:var(--citui-line);overflow:hidden;margin-bottom:8px}\n.adm-plan__meter i{display:block;height:100%;background:var(--citui-cyan-500)}\n.adm-plan .adm-btn{width:100%}\n.adm-plan--m{margin:14px 0 0}\n\n/* ═══ 3. TOP BAR (every page): ← + path · search slot · theme · Oldal · primary ═══ */\n.adm-top{grid-column:2;display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--citui-line);\n  background:var(--citui-panel);min-height:48px;position:sticky;top:0;z-index:40;min-width:0}\n.adm-top>*{flex:0 0 auto}\n.adm-top>.adm-crumb{flex:1 1 auto}\n.adm-top .adm-ib--ghost{color:var(--citui-ink)}\n.adm-back.is-hidden{visibility:hidden}\n.adm-crumb{display:flex;align-items:center;gap:4px;font-size:.92em;min-width:0;flex:1}\n.adm-crumb a{color:var(--citui-muted);text-decoration:none;padding:3px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}\n.adm-crumb a:hover{background:var(--citui-hover);color:var(--citui-link-ink)}\n.adm-crumb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;max-width:55%}\n.adm-crumb svg{color:var(--citui-line-strong)}\n.adm-topsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--citui-line);border-radius:6px;padding:5px 9px;width:230px;flex:0 0 auto;\n  color:var(--citui-muted);font-size:.9em;background:var(--citui-field)}\n.adm-topsearch kbd{margin-left:auto;font:600 .8em var(--citui-font-text);border:1px solid var(--citui-line);border-radius:4px;padding:1px 5px;color:var(--citui-muted)}\n.adm-viewbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--citui-line);background:var(--citui-panel);color:var(--citui-ink);\n  font:600 .8em/1 var(--citui-font-text);padding:6px 10px;border-radius:6px;text-decoration:none;white-space:nowrap}\n.adm-viewbtn:hover{background:var(--citui-hover);text-decoration:none}\n.adm-topbar{display:none}\n\n/* ═══ 4. MAIN / PAGE HEAD / CARD ═══════════════════════════════════════════════ */\n.adm-main{grid-column:2;min-width:0}\n.adm-main__inner{max-width:1040px;margin:0 auto;padding:24px 32px 32px}\n.adm-ph{margin-bottom:14px}\n.adm-ph h1{font-size:1.7em;margin:0 0 2px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}\n.adm-ph p{margin:0;color:var(--citui-muted);font-size:.92em;line-height:1.5}\n.adm-ph__row{display:flex;align-items:flex-start;gap:10px}\n.adm-ph__row>div{flex:1;min-width:0}\n.adm-ph__acts{display:flex;gap:6px;flex-wrap:wrap}\n.adm-pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}\n.adm-pagehead h1{margin:0;font-size:1.7em;font-weight:600}\n.adm-card{background:var(--citui-panel);border:1px solid var(--citui-line);border-radius:8px;box-shadow:none;padding:16px 18px;margin-bottom:14px;overflow:hidden}\n/* Card head: a plain titled row (the navy band of the previous language is retired). */\n.adm-card__head{display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid var(--citui-line)}\n.adm-card__head .adm-ico{display:inline-flex;color:var(--citui-muted);flex:0 0 auto}\n.adm-card__head .adm-ico svg{width:18px;height:18px}\n.adm-card__head h2{margin:0;font-size:1.05em;font-weight:600;color:var(--citui-ink)}\n.adm-card p.adm-lead{color:var(--citui-muted);margin:0 0 14px;font-size:.95em}\n.adm-help{display:inline-flex;align-items:center;justify-content:center;margin-left:auto;width:28px;height:28px;border-radius:6px;\n  color:var(--citui-muted);border:1px solid transparent;text-decoration:none}\n.adm-help:hover{color:var(--citui-link-ink);background:var(--citui-hover);text-decoration:none}\n.adm-ph .adm-help{margin-left:0}\n.adm-saved{display:inline-flex;align-items:center;gap:8px;background:var(--citui-ok-soft);color:var(--citui-ok-ink);\n  border:1px solid color-mix(in srgb,var(--citui-ok) 30%,transparent);border-radius:var(--citui-radius-pill);padding:7px 14px;font-weight:600;font-size:.9em;margin-bottom:14px}\n\n/* ═══ 5. OVERVIEW: 3 widgets · cover showcase · to-do list ═════════════════════ */\n.adm-w{display:grid;grid-template-columns:1fr;gap:10px}\n.adm-w>.adm-wc{min-width:0}\n.adm-wc{border:1px solid var(--citui-line);border-radius:8px;padding:12px 14px;background:var(--citui-panel)}\n.adm-wc__h{display:flex;align-items:center;gap:8px;font-size:.85em;color:var(--citui-muted);margin-bottom:8px}\n.adm-wc__h svg{color:var(--citui-link-ink)}\n.adm-wc__h .adm-ib{width:24px;height:24px;border:0;background:transparent;color:var(--citui-muted);margin-left:auto}\n.adm-wc__h .adm-ib:hover{background:var(--citui-hover);color:var(--citui-ink)}\n.adm-wc__v{font-size:1.5em;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}\n.adm-wc__s{font-size:.82em;color:var(--citui-muted);margin-top:2px;overflow-wrap:anywhere}\n.adm-wc__s a{color:var(--citui-muted)}\n.adm-spark{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:8px}\n.adm-spark i{flex:1;background:var(--citui-cyan-500);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}\n.adm-spark i.z{background:var(--citui-line)}\n.adm-mrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--citui-line);font-size:.9em;text-decoration:none;color:var(--citui-ink)}\n.adm-mrow:first-of-type{border-top:0}\n.adm-mrow:hover{text-decoration:none;color:var(--citui-link-ink)}\n.adm-mrow i{width:6px;height:6px;border-radius:50%;background:var(--citui-cyan-500);flex:0 0 auto}\n.adm-mrow.is-read i{background:transparent}\n.adm-mrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}\n.adm-mrow .d{margin-left:auto;color:var(--citui-muted);font-size:.85em;white-space:nowrap;font-style:normal}\n.adm-wc__empty{font-size:.85em;color:var(--citui-muted);padding:6px 0}\n/* Cover showcase (from the Bento round): photos[0] as the guest sees it on top. */\n.adm-covc{position:relative;border-radius:8px;overflow:hidden;background:var(--citui-navy-900);min-height:200px;display:flex;\n  flex-direction:column;justify-content:flex-end;margin-top:12px;border:1px solid var(--citui-line)}\n.adm-covc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.88;cursor:zoom-in}\n.adm-covc__b{position:relative;padding:16px;background:linear-gradient(transparent,color-mix(in srgb,var(--citui-navy-900) 88%,transparent));color:var(--citui-white);pointer-events:none}\n.adm-covc__b>div{pointer-events:auto}\n.adm-covc__b b{display:block;font-size:1.05em;
