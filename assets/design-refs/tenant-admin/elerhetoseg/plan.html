 resetje különben\n   kitörné a sorból (mérve a súgó bevezetőjén). */\n.adm-inline-ic svg{display:inline;vertical-align:-2px}\n/* ⛔ Telefonon a gomb mellett a mező ~200 px, a helyőrző viszont hosszabb → elvágódik\n   (a konzol keresőjén mérve, ugyanez a szerkezet). Ezért keskenyen a mező egész sort kap. */\n.adm-kb-search{display:flex;gap:8px;margin:4px 0 16px;flex-wrap:wrap}\n.adm-kb-search .citui-input{flex:1 1 100%}\n.adm-kb-search .citui-btn{margin-left:auto}\n@media (min-width:720px){\n  .adm-kb-search .citui-input{flex:1 1 auto}\n  .adm-kb-search .citui-btn{margin-left:0}\n}\n.adm-kb-list{display:flex;flex-direction:column;gap:10px}\n/* Súgó-kategória fejléc (2026-09-12): 19 cikk egyetlen listában olvashatatlan fal\n   volt. Ugyanaz a vizuális nyelv, mint a konzol .con-kb-ghead-je; minden szín a magból. */\n.adm-kb-ghead{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;\n  color:var(--citui-muted);margin:18px 0 8px;padding-top:10px;border-top:1px solid var(--citui-line)}\n.adm-kb-g:first-of-type .adm-kb-ghead{margin-top:0;padding-top:0;border-top:0}\n/* Összecsukható csoport: a fejléc `<summary>`, hogy JS nélkül is nyíljon. */\nsummary.adm-kb-ghead{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;\n  user-select:none;padding-bottom:4px}\nsummary.adm-kb-ghead::-webkit-details-marker{display:none}\nsummary.adm-kb-ghead:hover{color:var(--citui-ink)}\n.adm-kb-n{font-weight:700;font-size:10px;letter-spacing:0;color:var(--citui-muted);\n  background:var(--citui-surface-2);border-radius:var(--citui-radius-pill);padding:1px 8px}\n.adm-kb-cv{margin-left:auto;flex:0 0 auto;transition:transform .18s}\n.adm-kb-g[open]>summary.adm-kb-ghead .adm-kb-cv{transform:rotate(180deg)}\n.adm-kb-g[open]>summary.adm-kb-ghead{color:var(--citui-ink)}\n/* ⛔ A `display:flex` ERŐSEBB, mint a `[hidden]` böngésző-alapértelmezése (0,1,0 vs 0,0,0):\n   enélkül JS nélkül HALOTT gombpár látszik. Mérve az őrrel, nem feltételezve. */\n.adm-kb-tools[hidden]{display:none}\n.adm-kb-tools{display:flex;justify-content:flex-end;gap:6px;align-items:center;\n  font-size:11px;color:var(--citui-muted);margin:14px 0 0}\n.adm-kb-tools button{font:inherit;font-weight:600;cursor:pointer;background:none;border:0;padding:0;\n  /* ink, nem cián: a cián-500 fehéren 2,2 kontraszt — kis aláhúzott szövegnek kevés. */\n  color:var(--citui-ink);text-decoration:underline}\n.adm-kb-item{display:block;padding:14px 16px;border:1px solid var(--citui-line);border-radius:8px;\n  text-decoration:none;color:inherit;background:var(--citui-panel)}\n.adm-kb-item:hover{border-color:var(--citui-cyan-500)}\n.adm-kb-item strong{font-family:var(--citui-font-display)}\n.adm-kb-item .citui-hint{display:block;margin:3px 0 0}\n.adm-kb-back{display:inline-block;margin-bottom:4px;font-weight:600;text-decoration:none}\n.adm-kb-article h3{font-family:var(--citui-font-display);font-size:13px;margin:20px 0 6px}\n.adm-kb-article p{margin:8px 0;line-height:1.55}\n.adm-kb-article ul,.adm-kb-article ol{padding-left:20px;margin:8px 0}\n.adm-kb-article li{margin:6px 0;line-height:1.5}\n.adm-kb-article img{max-width:100%;border:1px solid var(--citui-line);border-radius:8px;display:block}\n\n/* ── Room card photo picker (approved plan B, 2026-08-25) ───────────────────\n   The owner was editing a room and had to leave for the Fotók tab to give it a\n   picture. Now the card itself offers the shared library: picked thumbnails +\n   a <details> grid, so it works with ZERO JavaScript (same rule as the\n   availability calendar). Contract: assets/design-refs/tenant-admin/. */\n.mcfg-pf__sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}\n.mcfg-pf__mini{width:64px;height:46px;object-fit:cover;border-radius:8px;\n  border:1px solid var(--citui-line)}\n.mcfg-pf>summary{list-style:none;cursor:pointer;display:inline-block}\n.mcfg-pf>summary::-webkit-details-marker{display:none}\n.mcfg-pf__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));\n  gap:10px;margin-top:12px}\n.mcfg-pf__cell{position:relative;border:2px solid var(--citui-line);border-radius:8px;\n  overflow:hidden;cursor:pointer;display:block;background:var(--citui-panel)}\n.mcfg-pf__cell img{width:100%;height:78px;object-fit:cover;display:block}\n.mcfg-pf__cell span{display:block;font-size:10px;line-height:1.3;padding:5px 6px;\n  color:var(--citui-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.mcfg-pf__cell input{position:absolute;top:6px;left:6px;width:20px;height:20px;\n  accent-color:var(--citui-cyan-500);margin:0;cursor:pointer}\n.mcfg-pf__cell.is-on{border-color:var(--citui-cyan-500)}\n/* Checked state without JS: the label follows its own checkbox. */\n.mcfg-pf__cell:has(input:checked){border-color:var(--citui-cyan-500)}\n@media(max-width:520px){.mcfg-pf__grid{grid-template-columns:repeat(2,1fr)}}\n\n/* ── Amenity picker (plan F, frozen: assets/design-refs/tenant-admin/amenity-picker-f*.html)\n   E's head (chips + search) over D's icon tiles; two columns even at 390px. ── */\n.ampick__chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}\n.ampick__chips--empty{font-size:11px;color:var(--citui-muted)}\n.ampick__chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 8px;\n  border-radius:999px;border:1.5px solid var(--citui-cyan-500);\n  background:color-mix(in srgb,var(--citui-cyan-500) 10%,var(--citui-panel));\n  font:600 10px/1 var(--citui-font-text);color:var(--citui-ink);cursor:pointer}\n.ampick__chip svg{width:14px;height:14px;color:var(--citui-cyan-500)}\n.ampick__chip-x{font-weight:700;font-size:12px;color:var(--citui-muted)}\n.ampick__search{position:relative;margin:0 0 4px}\n.ampick__search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);\n  width:18px;height:18px;color:var(--citui-muted);pointer-events:none}\n.ampick__search input{width:100%;box-sizing:border-box;padding:11px 12px 11px 38px;\n  border-radius:8px;border:1.5px solid var(--citui-line);background:var(--citui-panel);\n  font:400 12px/1.2 var(--citui-font-text);color:var(--citui-ink)}\n.ampick__search input:focus{outline:none;border-color:var(--citui-cyan-500)}\n.ampick__count{font:600 10px/1.4 var(--citui-font-text);color:var(--citui-muted);margin:8px 0 2px}\n.ampick__cat{font:700 10px/1 var(--citui-font-text);letter-spacing:.06em;\n  text-transform:uppercase;color:var(--citui-muted);margin:18px 0 8px}\n.ampick__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px}\n@media(min-width:700px){.ampick__grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}}\n.ampick__tile{display:flex;align-items:center;gap:8px;padding:9px;border:1.5px solid var(--citui-line);\n  border-radius:8px;background:var(--citui-panel);cursor:pointer;\n  font-size:10px;line-height:1.2;min-height:44px;box-sizing:border-box}\n.ampick__tile input{position:absolute;opacity:0;pointer-events:none}\n.ampick__ico{display:grid;place-items:center;width:20px;height:20px;flex:0 0 auto;color:var(--citui-muted)}\n.ampick__ico svg{width:19px;height:19px}\n.ampick__tile:has(input:checked){border-color:var(--citui-cyan-500);\n  background:color-mix(in srgb,var(--citui-cyan-500) 8%,var(--citui-panel))}\n.ampick__tile:has(input:checked) .ampick__ico{color:var(--citui-cyan-500)}\n/* House-level picks on the room card (ADR-0232): toggleable like the rest, with a\n   tag that says the Felszereltség screen lists them too — orientation, not a lock. */\n.ampick__inhtag{display:block;font:600 9px/1.3 var(--citui-font-text);letter-spacing:.04em;\n  text-transform:uppercase;color:var(--citui-muted);margin-top:1px}\n.ampick__tile:has(input:checked) .ampick__inhtag{color:var(--citui-link-ink)}\n\n/* ADR-0232 — the whole place is a CHOICE (approved plan whole-property-choice B):\n   the card above the rooms grid, and the question inside the add form. */\n.rs-wcard{display:grid;gap:10px;border:1px solid var(--citui-line-strong);border-radius:14px;padding:12px 14px;\n  margin:0 0 12px;background:var(--citui-surface)}\n.rs-wcard.is-on{border-color:var(--citui-cyan-500);background:var(--citui-accent-soft)}\n.rs-wcard__t>b{display:flex;align-items:center;gap:7px;font:600 .9rem/1.2 var(--citui-font-display);color:var(--citui-ink)}\n.rs-wcard__t>b svg{width:15px;height:15px;color:var(--citui-cyan-500)}\n.rs-wcard__t p{margin:5px 0 0;color:var(--citui-muted);font-size:.78rem;line-height:1.5}\n.rs-wcard__t p b{color:var(--citui-ink)}\n.rs-wcard__c{display:grid;gap:8px;align-items:center}\n.rs-wtoggle{display:flex;align-items:center;gap:8px;font:600 .84rem/1 var(--citui-font-text);color:var(--citui-ink);cursor:pointer}\n.rs-wtoggle input{accent-color:var(--citui-cyan-500);width:16px;height:16px;margin:0}\n.rs-wpick{font-size:.84rem}\n@media(min-width:900px){\n  .rs-wcard{grid-template-columns:minmax(0,1fr) 440px;align-items:center}\n  .rs-wcard__c{grid-template-columns:auto minmax(0,1fr) auto}\n}\n.rs-wq{flex:1 1 100%;display:grid;gap:8px;margin:0 0 6px;padding:10px 12px;border:1px solid var(--citui-line-strong);\n  border-radius:12px;background:var(--citui-surface)}\n.rs-wq legend{font:600 .9rem/1.2 var(--citui-font-display);color:var(--citui-ink);padding:0 4px}\n.rs-wq>p{margin:0;font-size:.82rem;line-height:1.5;color:var(--citui-muted)}\n.rs-wq>p b{color:var(--citui-ink)}\n.rs-wq__o{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--citui-line-strong);border-radius:12px;\n  padding:10px 12px;background:var(--citui-panel);cursor:pointer}\n.rs-wq__o:has(input:checked){border-color:var(--citui-cyan-500);background:var(--citui-accent-soft)}\n.rs-wq__o input{margin:3px 0 0;accent-color:var(--citui-cyan-500);flex:none;width:16px;height:16px}\n.rs-wq__o b{display:block;font-size:.86rem;color:var(--citui-ink)}\n.rs-wq__o small{display:block;color:var(--citui-muted);font-size:.76rem;line-height:1.45;margin-top:3px}\n.ampick__empty{font-size:11px;color:var(--citui-muted);padding:14px 2px}\n.ampick__foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--citui-line)}\n/* Locked state (module not bought): a conversion surface, not an error. */\n.amlock{border:1.5px solid var(--citui-cyan-500);border-radius:8px;padding:16px;\n  background:color-mix(in srgb,var(--citui-cyan-500) 6%,var(--citui-panel));margin:0 0 14px}\n.amlock h3{font:700 13px/1.3 var(--citui-font-display);color:var(--citui-ink);margin:0 0 6px}\n.amlock p{font:400 11px/1.5 var(--citui-font-text);color:var(--citui-muted);margin:0 0 12px}\n.amlock__prev{margin-top:14px}\n.amlock__prev .ampick__grid{opacity:.42;filter:saturate(.25);pointer-events:none}\n.amlock__prev .ampick__cat{opacity:.55}\n.amlock__cap{font:400 10px/1.4 var(--citui-font-text);color:var(--citui-muted);\n  text-align:center;padding:12px 2px 0}\n/* ── ADR-0080 (approved B plan): subscription card + collected module changes ── */\n.adm-sub{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}\n@media(min-width:700px){.adm-sub{grid-template-columns:1fr 1fr 1fr}}\n.adm-sub__cell{background:var(--citui-surface-2);border-radius:var(--citui-radius-sm);padding:10px 12px}\n.adm-sub__l{font:600 10px/1.4 var(--citui-font-text);color:var(--citui-muted)}\n.adm-sub__v{font:700 13px/1.4 var(--citui-font-display);color:var(--citui-ink)}\n.adm-sub__dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--citui-ok);margin-right:8px}\n.adm-sub__dot--warn{background:var(--citui-warn)}\n.adm-sub__dot--bad{background:var(--citui-bad)}\n.adm-sub__items{margin-top:8px}\n.adm-sub__items summary{cursor:pointer;font-size:11px;color:var(--citui-cyan-500)}\n.adm-sub__row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;\n  border-bottom:1px dashed var(--citui-line)}\n.adm-sub__new{color:var(--citui-ok);font-weight:700}\n/* ── ADR-0080 ⑥ state card: \"A — Teendő-kártya\" (approved 2026-09-11,\n   assets/design-refs/console/freeze-state/). Its own card ABOVE the subscription\n   panel — the old thin banner lived INSIDE that card, where .adm-card__head's\n   -26px top margin overlapped its bottom edge (measured on a 390px phone). */\n.adm-state{padding:0}\n.adm-state__head{margin:0;padding:15px 28px;border-bottom:0}\n.adm-state__head h2,.adm-state__head .adm-ico{color:var(--citui-white)}\n.adm-state--bad .adm-state__head{background:var(--citui-bad)}\n.adm-state--bad .adm-state__head h2,.adm-state--bad .adm-state__head .adm-ico{color:var(--citui-on-bad)}\n.adm-state--ok .adm-state__head{background:var(--citui-ok)}\n.adm-state__dot{background:var(--citui-panel);margin-right:2px}\n.adm-state__grid{display:grid;gap:16px;padding:20px 28px 24px}\n.adm-state__text p{margin:0 0 8px;font-size:12px;line-height:1.6}\n.adm-state__text ul{margin:0;padding-left:18px;display:grid;gap:7px;\n  font-size:11px;line-height:1.55;color:var(--citui-muted)}\n.adm-state__text ul b{color:var(--citui-ink)}\n/* ── Elek FK-006b ZAVAROS-1/2: MELY időszak van rendezve, és hol a bizonylat ──\n   A kifizetett időszak a sáv MÁSODIK legfontosabb állítása (az első az, hogy megint\n   elérhető) — ezért kiemelt, de nem hangosabb a főcímnél. */\n.adm-state__period{font-weight:600;color:var(--citui-ink)}\n.adm-state__doc{display:inline-block;margin-top:4px;font-weight:600;color:var(--citui-ink)}\n.adm-state__doc:hover{color:var(--citui-ink)}\n.adm-owe__l{font-size:10px;letter-spacing:.05em;text-transform:uppercase;\n  font-weight:700;color:var(--citui-muted)}\n/* The figure the owner must PAY is the largest thing on the screen — the whole\n   point of the redesign (the old page only showed FUTURE amounts). */\n.adm-owe__v{font:700 30px/1.05 var(--citui-font-display);color:var(--citui-bad);margin-top:2px}\n.adm-owe__sub{font-size:11px;color:var(--citui-muted);margin-top:4px}\n/* Red, not the cyan brand primary: the approved plan shows it red, and the plan\n   is the contract (feedback_approved_draft_is_the_contract — the house style may\n   not quietly overwrite a decision the owner made on a picture). */\n.adm-owe__pay{display:flex;justify-content:center;width:100%;margin-top:14px;\n  font-size:14px;padding:14px 24px;\n  background:var(--citui-bad);color:var(--citui-on-bad);border-color:var(--citui-bad)}\n.adm-owe__pay:hover{background:color-mix(in srgb,var(--citui-bad) 88%,black);\n  color:var(--citui-on-bad)}\n.adm-owe__note{font-size:10px;color:var(--citui-muted);line-height:1.5;margin:8px 0 0}\n/* Phone first: money and button BEFORE the explanation, so the decision is not\n   behind a scroll. Desktop puts the text left and the money in a raised panel. */\n@media (min-width:760px){\n  .adm-state__grid{grid-template-columns:1.15fr .85fr;gap:26px;align-items:start}\n  .adm-state__money{order:2;background:var(--citui-surface);border-radius:var(--citui-radius-sm);padding:18px}\n  .adm-state__text{order:1}\n  .adm-owe__v{font-size:35px}\n  .adm-owe__pay{width:auto}\n}\n\n/* ══ FREEZE BLOCK — approved plan \"B — Rendezés-képernyő\" ════════════════════\n   (assets/design-refs/console/freeze-state-v2/, owner ruling 2026-09-14)\n\n   Two things the first round did not do:\n   ① the DEADLINE is a figure of its own, beside the amount. It used to be the\n      second bullet of a prose list — the one fact that makes the sum urgent was\n      the least visible thing in the block.\n   ② the block appears on EVERY tab, so it is NOT an .adm-card any more: a card\n      would sit inside the page flow of screens that are about something else.\n\n   ⛔ Solid red panel, white type — the colour IS the message here, and the\n   approved plan shows it that way (feedback_approved_draft_is_the_contract).\n   Every colour comes from the design core; no raw hex (ADR-0021 ①). */\n.adm-frz{background:linear-gradient(160deg,var(--citui-bad),\n    color-mix(in srgb,var(--citui-bad) 72%,var(--citui-navy-900)));\n  color:var(--citui-on-bad);border-radius:var(--citui-radius);\n  padding:22px;margin:0 0 18px;box-shadow:none}\n.adm-frz__head{display:flex;align-items:center;gap:10px;margin-bottom:16px}\n.adm-frz__head h2{font:700 16px var(--citui-font-display);margin:0;color:var(--citui-on-bad)}\n.adm-frz__dot{width:11px;height:11px;border-radius:50%;background:var(--citui-panel);\n  flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--citui-white) 28%,transparent)}\n.adm-frz__grid{display:grid;gap:18px}\n/* The block overrides the shared .adm-owe__* tones: on the red panel the muted\n   grey label and the red figure would both be unreadable (contrast measured). */\n.adm-frz .adm-owe__l{color:color-mix(in srgb,var(--citui-on-bad) 90%,transparent)}\n.adm-frz .adm-owe__v{color:var(--citui-on-bad);font-size:39px}\n.adm-frz .adm-owe__sub,\n.adm-frz .adm-owe__note{color:color-mix(in srgb,var(--citui-on-bad) 88%,transparent)}\n/* Inverted button: white on red beats red-on-red, which the first cut produced\n   (feedback_link_rule_eats_button_label — measure the contrast, don't assume). */\n.adm-frz .adm-owe__pay{background:var(--citui-panel);color:var(--citui-bad);\n  border-color:var(--citui-white);font-weight:700}\n.adm-frz .adm-owe__pay:hover{background:var(--citui-surface);color:var(--citui-bad)}\n.adm-owe__dl{background:color-mix(in srgb,var(--citui-white) 14%,transparent);\n  border-radius:var(--citui-radius-sm);padding:16px;display:flex;flex-direction:column;gap:6px}\n.adm-owe__dlv{font:700 22px/1.1 var(--citui-font-display);color:var(--citui-on-bad)}\n.adm-owe__dl p{margin:0;font-size:10px;line-height:1.5;\n  color:color-mix(in srgb,var(--citui-on-bad) 92%,transparent)}\n.adm-owe__dl p b{color:var(--citui-on-bad)}\n.adm-owe__bar{height:7px;border-radius:var(--citui-radius-pill);overflow:hidden;margin:4px 0;\n  background:color-mix(in srgb,var(--citui-white) 28%,transparent)}\n.adm-owe__bar i{display:block;height:100%;background:var(--citui-panel)}\n/* Compact: the tabs that are NOT about money keep the statement and the way out,\n   but give the screen back to whatever the owner came for. */\n.adm-frz--compact{padding:16px 18px;margin-bottom:14px}\n.adm-frz--compact .adm-frz__head{margin-bottom:10px}\n.adm-frz--compact .adm-owe__v{font-size:26px}\n.adm-frz--compact .adm-owe__note{display:none}\n/* ⑨ „Mit lát közben a látogató\" — a blokk alsó sora, a rács ALATT, teljes szélességben.\n   Ez a sor válaszol a tulaj legnagyobb félelmére (elveszítem a vendégeket?), ezért a\n   kompakt változatból sem esik ki: ott is ez a leghasznosabb mondat. */\n.adm-frz__guest{margin:16px 0 0;padding-top:14px;font-size:11px;line-height:1.55;\n  border-top:1px solid color-mix(in srgb,var(--citui-white) 28%,transparent);\n  color:color-mix(in srgb,var(--citui-on-bad) 92%,transparent)}\n.adm-frz__guest b{color:var(--citui-on-bad)}\n/* Aláhúzott, fehér link a piros panelen — a konzol `.con a` szabálya cián színt adna,\n   ami ezen a háttéren mérhetetlenül gyenge kontraszt (feedback_link_rule_eats_button_label). */\n.adm-frz__glink{color:var(--citui-on-bad);font-weight:700;text-decoration:underline;\n  white-space:nowrap}\n.adm-frz__glink:hover{color:var(--citui-on-bad);text-decoration:none}\n.adm-frz--compact .adm-frz__guest{margin-top:12px;padding-top:11px}\n@media (min-width:760px){\n  .adm-frz{padding:28px 30px}\n  .adm-frz__grid{grid-template-columns:1.1fr .9fr;gap:26px;align-items:start}\n  .adm-frz .adm-owe__v{font-size:47px}\n  .adm-frz .adm-owe__pay{align-self:flex-start;display:inline-flex}\n  .adm-frz--compact .adm-frz__grid{grid-template-columns:1fr}\n  .adm-frz--compact .adm-owe__v{font-size:29px}\n}\n/* Read-only module row under a freeze: no price chip, no on/off control, so the\n   row is text + preview only. The grid must not keep empty columns for controls\n   that are no longer rendered. */\n.adm-mine__row--ro{grid-template-columns:1fr auto}\n/* The next-invoice cell states a DATE under a freeze, never a second amount. */\n.adm-sub__v--date{font-size:14px}\n.adm-sub__note{font-size:10px;color:var(--citui-muted);margin-top:4px;line-height:1.45}\n/* The forward action on the stuck-charge block, and the demoted revoke. */\n/* ⛔ KÉTOSZTÁLYOS szelektor (0,2,0), nem egyosztályos: a `.adm-mand__btn` alapszabály\n   a fájlban KÉSŐBB áll, tehát azonos fajsúlynál MINDIG ő nyerne, és az elsődleges\n   gomb ugyanolyan fehér lenne, mint a másodlagos. Mérve: a két gomb háttere bitre\n   azonos volt (rgb(255,255,255) mindkettő) — vagyis a „fizetés útja a leghalkabb\n   elem\" hibaosztály, épp abban a blokkban, ami ellene készült\n   (feedback_link_rule_eats_button_label: a szabály-ütközést MÉRNI kell, nem nézni). */\n.adm-mand__btn.adm-mand__btn--go{background:var(--citui-cyan-500);color:var(--citui-accent-ink);\n  border-color:var(--citui-cyan-500);font-weight:700}\n.adm-mand__btn.adm-mand__btn--go:hover{background:var(--citui-cyan-400);\n  border-color:var(--citui-cyan-400);color:var(--citui-accent-ink)}\n.adm-mand__quiet{background:none;border:0;padding:0;cursor:pointer;\n  font:inherit;color:var(--citui-muted);text-decoration:underline}\n.adm-banner{border-radius:var(--citui-radius-sm);padding:12px;margin:0 0 12px;font-size:12px;line-height:1.5}\n.adm-banner--warn{background:color-mix(in srgb,var(--citui-warn) 12%,var(--citui-panel));border:1px solid var(--citui-warn)}\n.adm-banner--bad{background:color-mix(in srgb,var(--citui-bad) 10%,var(--citui-panel));border:1px solid var(--citui-bad)}\n.adm-banner .citui-btn{margin-top:8px}\n/* A kézi terhelés-újrapróba redirectje MAGÁRA A SÁVRA horgonyoz (`#terheles-uzenet`),\n   hogy az üzenet teljes egészében látszódjon, és a benne ülő kijárat vele együtt.\n   A `scroll-margin-top` NEM elrendezés: csak azt mondja meg, hol álljon meg a\n   horgony-görgetés — a lap statikus képe változatlan. Itt csak levegő a képernyő\n   tetejéig; a sáv MAGASSÁGA nincs beleégetve, ezért egy hosszabb vagy lefordított\n   üzenet sem tudja némán levágni a tetejét. */\n/* ⛔ Az `.adm-applied` 2026-09-22-ig kimaradt ebből a sorból, és a hiánya MÉRHETŐ\n   volt: az elutasított kártyaterhelés sávjára horgonyzott redirect 390 ÉS 1280 px-en\n   is LEVÁGTA a sáv tetejét — pont a félkövér első mondatot („A tárolt kártyáját nem\n   sikerült megterhelni.\"), vagyis azt az egyetlen sort, amiért a sáv létezik. A\n   szabály megvolt, csak nem ért el az új sávig. */\n/* ⛔ ADR-0224: the top bar is STICKY (48 px, z 40) — a fragment jump would park the\n   target under it (price-on-request-check measured the back button covering the row).\n   Every anchorable element in the content keeps the bar's height + air above it. */\n.adm-main__inner [id]{scroll-margin-top:64px}\n.adm-banner,.adm-saved,.adm-applied{scroll-margin-top:64px}\n.adm-note{font-size:10px;line-height:1.45;margin-top:7px;border-radius:6px;padding:7px 9px}\n.adm-note--ok{background:var(--citui-ok-soft)}\n.adm-note--warn{background:color-mix(in srgb,var(--citui-warn) 14%,var(--citui-panel))}\n.adm-note a{color:var(--citui-ink);font-weight:700;text-decoration:underline;cursor:pointer}\n.adm-modrow.is-dirty .adm-mod{border-color:var(--citui-cyan-500);\n  box-shadow:0 0 0 2px color-mix(in srgb,var(--citui-cyan-500) 15%,transparent)}\n.adm-planbar{position:sticky;bottom:10px;background:var(--citui-navy-900);color:var(--citui-ink-inverse);\n  border-radius:var(--citui-radius);padding:12px 14px;margin-top:14px;display:none;\n  box-shadow:var(--citui-shadow-md)}\n.adm-planbar.show{display:block}\n/* ⛔ MÉRT HIBA (2026-09-24, wallet-tour): on the phone layout the bar stuck at bottom:10px,\n   i.e. UNDER the fixed bottom tab bar — its pay button sat at y=770 of 844 px, covered for as\n   long as the bar was \"helpfully\" sticky. Lift it above the tab bar (same token as the cookie\n   bar). ⚠️ Must stay AFTER the base rule: an earlier copy inside the @media(max-width:899px)\n   block above lost to it on source order and changed nothing (measured). */\n@media(max-width:899px){\n  .adm-planbar{bottom:calc(var(--citui-admin-bottomnav-h) + env(safe-area-inset-bottom) + 10px)}\n}\n.adm-planbar__row{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:3px 0}\n.adm-planbar__tag{font-weight:700}\n.adm-planbar__tag--add{color:color-mix(in srgb,var(--citui-ok) 55%,var(--citui-panel))}\n.adm-planbar__tag--del{color:color-mix(in srgb,var(--citui-warn) 65%,var(--citui-panel))}\n.adm-planbar__foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}\n.adm-planbar__sum{font-size:12px}\n.adm-planbar__delta--up{color:color-mix(in srgb,var(--citui-warn) 65%,var(--citui-panel));font-weight:700}\n.adm-planbar__delta--down{color:color-mix(in srgb,var(--citui-ok) 55%,var(--citui-panel));font-weight:700}\n.adm-planbar .citui-btn--ghost{background:transparent;color:var(--citui-ink-inverse);\n  border:1px solid color-mix(in srgb,var(--citui-ink-inverse) 35%,transparent)}\n.adm-applied{background:var(--citui-ok-soft);border-radius:var(--citui-radius-sm);\n  padding:12px;margin-top:12px;font-size:12px;line-height:1.6}\n/* ── nyugta-levezetés a vásárlás visszaigazolásán (jóváhagyott terv: C változat) ──\n   Akkor jelenik meg, ha kupon csökkentette az árat: díj → kedvezmény → terhelve.\n   Kupon nélkül a sáv a régi egymondatos marad — egy „−0 Ft\" sor csak zaj volna. */\n.adm-rcpt{margin-top:10px;background:var(--citui-panel);border:1px solid var(--citui-line);\n  border-radius:8px;padding:4px 12px;\n  /* Asztalin a sáv 830 px széles, és a felirat meg az összeg közé 570 px üresség került —\n     vezetőpont nélkül nehéz összepárosítani őket. Egy nyugta keskeny. */\n  max-width:520px}\n/* A modul neve nem törhet KETTÉ: a nevek maguk is vesszősek, és 390 px-en a sor pont a\n   „Környék, látnivalók\" belső vesszőjénél tört — lógó vesszővel, öt tétel látszatával. */\n.adm-nowrap{white-space:nowrap}\n.adm-rcpt__row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:11px;\n  color:var(--citui-muted)}\n.adm-rcpt__row+.adm-rcpt__row{border-top:1px solid var(--citui-line)}\n/* tabular-nums: a három összeg egymás alatt áll, ezért a számjegyeknek egy szélességen\n   kell lenniük — különben a levezetés nem olvasható le egy pillantással. */\n.adm-rcpt__v{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--citui-ink)}\n/* ⛔ MÉRT kontraszt, nem érzés: a nyers --citui-ok (#2fa96b) fehér dobozon 3,00:1 — a WCAG\n   AA 4,5-öt kér, és ez épp az a szám, ami a kedvezményt IGAZOLJA. A 75 %-os keverés 4,51\n   volna (épp-hogy), ezért 70 %: MÉRVE 4,87:1. A szín így is a dizájn-magból származik. */\n.adm-rcpt__row--neg .adm-rcpt__v{color:color-mix(in srgb,var(--citui-ok) 70%,var(--citui-navy-950));\n  font-weight:700}\n.adm-rcpt__row--tot{font-weight:700;color:var(--citui-ink)}\n.adm-rcpt__row--tot .adm-rcpt__v{font-size:12px}\n.adm-rcpt__note{display:block;margin-top:6px;font-size:11px;color:var(--citui-muted)}\n.adm-danger{border:1px dashed var(--citui-line-strong);border-radius:var(--citui-radius-sm);\n  padding:12px;margin-top:18px}\n.adm-danger h3{font:700 12px/1.3 var(--citui-font-display);color:var(--citui-bad);margin:0 0 6px}\n.adm-danger summary{cursor:pointer;font-size:11px;font-weight:700;margin-top:6px}\n.adm-danger__done{background:color-mix(in srgb,var(--citui-warn) 14%,var(--citui-panel));\n  border-radius:6px;padding:9px;margin-top:8px;font-size:11px}\n.adm-btn-bad{background:var(--citui-bad);color:var(--citui-on-bad)}\n\n/* ══ ADR-0084 — „Dokumentumok\" és „Üzenetek\" fül ═══════════════════════════════\n   Kontraktus: assets/design-refs/tenant-admin/dokumentumok-uzenetek-a*.\n   Minden szín/rádiusz/betű a dizájn-magból (ADR-0021 ①); nyers hex nincs. */\n\n/* Aldivat-sáv (Számlák / Szerződések) — egyszerre EGY lista látszik. */\n.adm-subtabs{display:flex;gap:6px;background:var(--citui-surface-2);padding:4px;\n  border-radius:8px;margin-bottom:16px}\n.adm-subtabs a{flex:1;text-align:center;text-decoration:none;padding:10px 8px;border-radius:8px;\n  font:700 11px/1.2 var(--citui-font-text);color:var(--citui-muted)}\n.adm-subtabs a.is-active{background:var(--citui-panel);color:var(--citui-ink);\n  box-shadow:none;border:1px solid var(--citui-line)}\n\n/* Összegző sáv — ⚠️ EGYÜTT MOZOG a szűrővel (a terv köti).\n   ⚠️ 390px-en HÁROM oszlop, nem kettő: két oszloppal a harmadik cella új sorba\n   csúszott, és az egész sáv a hajtás alá tolta MAGÁT A SZÁMLA-LISTÁT — a lista\n   viszont a lényeg, az összegző csak kíséret (feedback_main_motivation_over_checkbox). */\n.adm-docsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}\n.adm-docsum div{background:var(--citui-surface-2);border-radius:var(--citui-radius-sm);padding:8px 9px;min-width:0}\n.adm-docsum .l{font:600 10px/1.3 var(--citui-font-text);color:var(--citui-muted)}\n.adm-docsum .v{font:700 11px/1.3 var(--citui-font-display);color:var(--citui-ink);\n  margin-top:2px;overflow-wrap:break-word}\n@media(min-width:700px){\n  .adm-docsum{gap:14px}\n  .adm-docsum div{padding:10px 12px}\n  .adm-docsum .l{font-size:10px}\n  .adm-docsum .v{font-size:13px}\n}\n\n/* Kereső + szűrő-chipek (mindkét fülön ugyanaz a nyelv). */\n.adm-tools{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap;align-items:center}\n.adm-search{position:relative;flex:1 1 100%;min-width:0}\n.adm-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);\n  width:17px;height:17px;color:var(--citui-muted);pointer-events:none}\n.adm-search input{width:100%;box-sizing:border-box;padding:11px 12px 11px 36px;border-radius:8px;\n  border:1.5px solid var(--citui-line);font:400 11px/1.2 var(--citui-font-text);\n  color:var(--citui-ink);background:var(--citui-panel)}\n.adm-search input:focus{outline:none;border-color:var(--citui-cyan-500)}\n@media(min-width:700px){.adm-search{flex:1 1 240px}}\n.adm-fchip{border:1.5px solid var(--citui-line);background:var(--citui-panel);\n  border-radius:var(--citui-radius-pill);padding:7px 13px;text-decoration:none;\n  font:700 10px/1 var(--citui-font-text);color:var(--citui-muted);min-height:32px;\n  display:inline-flex;align-items:center}\n.adm-fchip.is-active{border-color:var(--citui-cyan-500);color:var(--citui-ink);\n  background:color-mix(in srgb,var(--citui-cyan-500) 10%,var(--citui-panel))}\n.adm-clearf{margin-left:auto;color:var(--citui-cyan-500);text-decoration:none;\n  font:700 10px/1 var(--citui-font-text);padding:8px 2px}\n/* ── Üzenetek: KÉT SOROS szűrő-sáv (jóváhagyott „A\" terv, 2026-09-13) ──────────\n   Kontraktus: assets/design-refs/tenant-admin/uzenetek-tema-szuro/README.md ②/⑥.\n   ⛔ A téma-sor SORBA TÖR, nem görget vízszintesen. Az első vázlatomban görgethető\n   volt, és 390px-en mérve a „Számlázás / A honlapom / Fiók\" a keret alatt maradt —\n   egy elrejtett szűrő ugyanaz a hibaosztály, mint a bejelentés, ami létrehozta. */\n.adm-frow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px}\n.adm-flab{font:700 10px/1 var(--citui-font-text);color:var(--citui-muted);\n  text-transform:uppercase;letter-spacing:.04em;flex:0 0 auto}\n/* A chip DARABSZÁMA — a szám ugyanabból a predikátumból jön, ami a listát szűri. */\n.adm-fchip em{font-style:normal;font-weight:700;margin-left:5px;\n  color:color-mix(in srgb,var(--citui-navy-900) 55%,transparent)}\n.adm-fchip.is-active em{color:var(--citui-ink)}\n/* Találat-sor + a MÁSIK aldivat kereszt-találata (a terv KÖTI: ez oldja fel,\n   hogy az „A\" változatban két külön helyen kellene keresni). */\n.adm-cnt{font-size:10px;color:var(--citui-muted);margin:-4px 0 13px;line-height:1.5}\n.adm-cnt a{color:var(--citui-cyan-500);font-weight:700;text-decoration:underline}\n\n/* Számla-sor. A PDF az ELSŐDLEGES művelet → a becsukott soron, egy koppintásra. */\n.adm-inv{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--citui-line);\n  border-radius:8px;margin-bottom:9px;background:var(--citui-panel)}\n.adm-inv:hover{border-color:var(--citui-line-strong)}\n.adm-inv__ico{flex:0 0 auto;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;\n  background:var(--citui-surface-2);color:var(--citui-ink)}\n.adm-inv__t{flex:1;min-width:0}\n.adm-inv__t strong{display:block;font-size:12px;font-family:var(--citui-font-display)}\n.adm-inv__t .sub{display:block;color:var(--citui-muted);font-size:10px;margin-top:1px}\n.adm-inv__r{text-align:right;flex:0 0 auto}\n.adm-inv__amt{font:700 13px/1.3 var(--citui-font-display);white-space:nowrap}\n/* A státusz-címke inline-block MARAD: a `.adm-inv__t .sub{display:block}` erősebb\n   szelektor különben teljes szélességűre nyújtaná (asztali nézetben feltűnő). */\n.adm-inv__t .adm-chip2{display:inline-block;width:fit-content}\n.adm-chip2{font:700 10px/1 var(--citui-font-text);border-radius:var(--citui-radius-pill);\n  padding:4px 9px;margin-top:5px;white-space:nowrap}\n.adm-chip2--ok{background:var(--citui-ok-soft);color:var(--citui-ok)}\n.adm-chip2--warn{background:color-mix(in srgb,var(--citui-warn) 16%,var(--citui-panel));\n  color:color-mix(in srgb,var(--citui-warn) 80%,var(--citui-ink))}\n/* Elek FK-001 Z1: „ez az üzenet már nem az aktuális állapot\". Szürke és\n   szaggatott — állapot-jelölés, NEM figyelmeztetés: a sor tartalma érvényes\n   volt, csak túlhaladott. */\n.adm-chip2--past{background:var(--citui-surface-2);color:var(--citui-muted);\n  border:1px dashed var(--citui-line-strong)}\n/* A sikertelen számlázás NEM hiba a tenantnak: „folyamatban\", bizonylat nélkül. */\n.adm-inv--pending{background:var(--citui-surface-2);border-style:dashed}\n.adm-inv--pending .adm-inv__t strong{color:var(--citui-muted)}\n.adm-dl{display:inline-flex;align-items:center;gap:6px;margin-top:5px;background:var(--citui-panel);\n  color:var(--citui-ink);border:1px solid var(--citui-line-strong);\n  border-radius:var(--citui-radius-pill);padding:6px 12px;text-decoration:none;\n  font:700 10px/1 var(--citui-font-text);min-height:32px}\n.adm-dl:hover{border-color:var(--citui-cyan-500);color:var(--citui-cyan-500)}\n\n/* Szerződés-kártya. */\n.adm-doc{border:1px solid var(--citui-line);border-radius:8px;padding:14px;margin-bottom:10px;\n  background:var(--citui-panel)}\n.adm-doc h3{margin:0 0 4px;font:700 12px/1.3 var(--citui-font-display)}\n.adm-doc .meta{font-size:10px;color:var(--citui-muted);margin-bottom:8px}\n.adm-doc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:11px}\n.adm-doc dt{color:var(--citui-muted)}\n.adm-doc dd{margin:0;font-weight:600;text-align:right}\n.adm-doc .quote{background:var(--citui-surface-2);border-radius:8px;padding:10px;font-size:10px;\n  line-height:1.5;color:color-mix(in srgb,var(--citui-ink) 82%,var(--citui-panel));margin-top:9px}\n\n/* Üzenet-sor (postaláda). Olvasatlan = vastag + cián keret + pötty. */\n.adm-msg{border:1px solid var(--citui-line);border-radius:8px;margin-bottom:9px;\n  background:var(--citui-panel);overflow:hidden}\n.adm-msg__hd{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;text-decoration:none;color:inherit}\n.adm-msg__hd:hover{background:var(--citui-surface)}\n.adm-msg__ch{position:relative;flex:0 0 auto;width:34px;height:34px;border-radius:8px;\n  display:grid;place-items:center;background:var(--citui-surface-2);color:var(--citui-ink)}\n.adm-msg__ch--sms{background:color-mix(in srgb,var(--citui-cyan-500) 14%,var(--citui-panel));\n  color:var(--citui-cyan-500)}\n.adm-msg__t{flex:1;min-width:0}\n.adm-msg__t strong{display:block;font-size:12px;line-height:1.35;font-weight:600}\n.adm-msg__t .pv{display:block;color:var(--citui-muted);font-size:10px;margin-top:2px;\n  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.adm-msg__d{flex:0 0 auto;font-size:10px;color:var(--citui-muted);white-space:nowrap;padding-top:2px;\n  text-align:right}\n/* ── Elek FK-001 Z2: A CSATORNA SZÖVEGGEL ─────────────────────────────────\n   Mérve: e-mail és SMS ugyanazt a 19px-es ikont viselte a szemnek, és a vevő\n   csak a SZŰRŐVEL tudta kideríteni, melyiken jött — miközben a fül bevezetője\n   „e-mailben és SMS-ben\"-t ígér. Az ikon jelzés, nem felirat. */\n.adm-msg__chan{display:block;margin-top:4px;font:700 10px/1 var(--citui-font-text);\n  letter-spacing:.05em;text-transform:uppercase;color:var(--citui-ink);\n  background:var(--citui-surface-2);border-radius:var(--citui-radius-pill);padding:3px 7px}\n.adm-msg__chan--sms{background:color-mix(in srgb,var(--citui-cyan-500) 14%,var(--citui-panel));\n  color:var(--citui-cyan-500)}\n/* ── Elek FK-001 Z1: TÚLHALADOTT üzenet ───────────────────────────────────\n   Halkítva, de OLVASHATÓAN — a sor tartalma érvényes volt, csak már nem ez az\n   állapot. ⛔ Nem rejtjük el és nem tesszük kattinthatatlanná: a jelölés\n   állapot-állítás, nem cenzúra. */\n.adm-msg.is-past{background:var(--citui-surface);border-style:dashed}\n.adm-msg.is-past .adm-msg__t strong{font-weight:600;color:var(--citui-muted);\n  text-decoration:line-through;text-decoration-color:var(--citui-line-strong)}\n/* A „Felülírta: …\" sor MEGNEVEZI, mi váltotta le — különben a jelölés csak\n   annyit mondana, hogy „ne hidd el\", azt nem, hogy mit higgy helyette. */\n.adm-msg__sup{display:block;margin-top:5px;font-size:10px;color:var(--citui-muted);line-height:1.45}\n.adm-msg.is-current{border-color:color-mix(in srgb,var(--citui-ok) 40%,transparent)}\n.adm-msg.is-unread{border-color:color-mix(in srgb,var(--citui-cyan-500) 45%,transparent)}\n.adm-msg.is-unread .adm-msg__t strong{font-weight:800}\n.adm-msg.is-unread .adm-msg__ch::after{content:\"\";position:absolute;top:-3px;right:-3px;\n  width:10px;height:10px;border-radius:50%;background:var(--citui-cyan-500);\n  border:2px solid var(--citui-white)}\n.adm-msg__body{padding:0 14px 14px;border-top:1px solid var(--citui-line)}\n.adm-msg__body p{font-size:11px;line-height:1.6;margin:12px 0 0;white-space:pre-line}\n.adm-msg__meta{font-size:10px;color:var(--citui-muted);margin-top:11px;padding-top:9px;\n  border-top:1px dashed var(--citui-line)}\n/* Asztalin elfér a dátum MELLETT — mobilon alatta marad (a jóváhagyott terv\n   mindkét méretre KÜLÖN döntés, nem ugyanaz kétszer lelőve). */\n@media(min-width:700px){\n  .adm-msg__d{min-width:150px}\n  .adm-msg__chan{display:inline-block;margin:0 0 0 8px}\n}\n/* ── Elek FK-001 KK3: a sor MEGMONDJA, hogy megnyitható (kontraktus ④) ────────\n   A 90 karakternél csonkolt előnézet mellett semmi nem jelezte, hogy a kártya\n   kattintható; a mérő-futás meg sem próbálta megnyitni. */\n.adm-msg__more{display:block;margin-top:4px;font:600 10px/1 var(--citui-font-text);\n  color:var(--citui-ink);white-space:nowrap}\n.adm-msg__hd:hover .adm-msg__more{text-decoration:underline}\n\n/* ── AZ ÜGY A SOR (kontraktus ①) ──────────────────────────────────────────────\n   A szál feje a listában áll, a korábbi lépései EGY megnevezett nyitó mögött. A\n   csoport bal oldali vonala teszi láthatóvá, hogy a lépések EHHEZ az ügyhöz\n   tartoznak — enélkül a kinyitott sorok önálló üzeneteknek látszanának. */\n.adm-thr{margin-bottom:9px}\n.adm-thr>.adm-msg{margin-bottom:0}\n.adm-thr__more{display:block;padding:9px 13px;font-size:10px;\n  color:var(--citui-ink);background:var(--citui-surface-2);text-decoration:none;\n  border:1px dashed var(--citui-line);border-top:0;\n  border-radius:0 0 var(--citui-radius-sm) var(--citui-radius-sm)}\n.adm-thr__more:hover{background:var(--citui-surface);color:var(--citui-ink)}\n.adm-thr__steps{margin:7px 0 0 14px;padding-left:12px;\n  border-left:2px solid color-mix(in srgb,var(--citui-cyan-500) 30%,transparent)}\n.adm-thr__steps .adm-msg{margin-bottom:7px}\n\n/* ── A tömeges jelölés MEGERŐSÍTÉSE (kontraktus ⑤) ────────────────────────────\n   JS nélkül: a gomb GET-linkje hozza vissza a lapot ezzel a dobozzal, és CSAK\n   itt áll POST. Natív confirm() nem járható út — stílustalan böngésző-ablak. */\n.adm-confirm{border:1px solid color-mix(in srgb,var(--citui-warn) 45%,transparent);\n  background:color-mix(in srgb,var(--citui-warn) 8%,var(--citui-panel));\n  border-radius:var(--citui-radius-sm);padding:12px 14px;margin:-4px 0 12px;\n  font-size:11px;line-height:1.55}\n.adm-confirm__act{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:10px}\n\n/* Az összegző harmadik, magyarázó sora (kontraktus ⑦): megmondja, MIBŐL áll a szám. */\n.adm-docsum .n{font:400 10px/1.35 var(--citui-font-text);color:var(--citui-muted);margin-top:3px}\n\n.adm-empty{text-align:center;color:var(--citui-muted);font-size:11px;padding:26px 10px;line-height:1.6}\n\n/* ── ADR-0087 „Modulok\" fül: az én moduljaim + bővítés-kirakat + előnézet ──\n   Két külön szerkezeti blokk: a megvásárolt modul MUNKA-felület (beállít,\n   kikapcsol), a többi KIRAKAT (mit kapna, mennyiért, hogy néz ki). Modult csak\n   láthatóan adunk el — ezért van a kártyán a szekció valódi mini-renderje. */\n.adm-mine{margin:0 -4px}\n/* ── „Csendes lista\" (jóváhagyott kontraktus: design-refs/console/modules-quiet-list/) ──\n   ⛔ A sor RÁCS, nem `flex-wrap`. A korábbi tördelés a LEMONDÁST emelte külön sorba,\n   a sor BAL szélére — és mérve nem csak telefonon: a valódi vázban (248 px oldalsáv +\n   `.adm-main__inner{max-width:900px}`) 1280 px-en is (Kikapcsolom x=377, a Megnézem\n   x=821 ALATT). A rács-területek ezt szerkezetileg zárják ki.\n   Mobil:  „név | ár\" az első sorban, a műveletek a másodikban, JOBBRA zárva.\n   Asztali: „név | ár | műveletek\" egy sorban. */\n.adm-mine__row{display:grid;gap:4px 12px;padding:13px 4px;\n  grid-template-columns:1fr auto;grid-template-areas:\"n p\" \"d d\" \"a a\";\n  border-bottom:1px solid var(--citui-line)}\n/* ── ADR-0192 · jóváhagyott kontraktus: design-refs/console/module-dependency ──\n   A SOR mondja meg MIT: cián pirula a név mellett + a katalógus indoklása a sor\n   alatt, SAJÁT rács-területen (\"d\"). ⛔ Nem flex-sorban: a magyarázatnak külön\n   sávot kell kapnia, különben a nevet szűk oszlopba préseli és kilóg a kártyából\n   (mérve a terv-körben). */\n.dep-rail{grid-area:d;display:none;align-items:flex-start;gap:8px;margin:8px 0 0;\n  padding:9px 12px;border-left:3px solid var(--citui-cyan-500);\n  border-radius:0 var(--citui-radius-sm) var(--citui-radius-sm) 0;\n  background:color-mix(in srgb,var(--citui-cyan-500) 9%,transparent);\n  font-size:11px;line-height:1.5;color:var(--citui-ink)}\n.adm-mine__row.is-dep .dep-rail{display:flex}\n.dep-rail svg{color:var(--citui-cyan-500);flex:0 0 auto;margin-top:1px}\n/* ⛔ SPECIFICITÁS: a `.adm-mine__t span{display:block}` (0,1,1) VERNÉ a sima\n   `.dep-tag`-et (0,1,0), és a pirula teljes szélességű sávvá hízna (mérve). */\n.adm-mine__t .dep-tag{display:none;align-items:center;gap:5px;margin-left:7px;\n  vertical-align:2px;font:700 10px/1 var(--citui-font-text);text-transform:uppercase;\n  letter-spacing:.03em;color:var(--citui-accent-ink);background:var(--citui-cyan-400);\n  border-radius:var(--citui-radius-pill);padding:5px 10px}\n.adm-mine__row.is-dep .adm-mine__t .dep-tag{display:inline-flex}\n.adm-mine__row:last-child{border-bottom:0}\n.adm-mine__row.is-dirty{background:color-mix(in srgb,var(--citui-cyan-500) 7%,transparent);\n  border-radius:var(--citui-radius-sm)}\n.adm-mine__t{grid-area:n;min-width:0}\n.adm-mine__t strong{display:block;font-size:13px;color:var(--citui-ink)}\n.adm-mine__t span{display:block;font-size:10px;color:var(--citui-muted);line-height:1.45;margin-top:2px}\n.adm-mine__p{grid-area:p;text-align:right;align-self:start}\n.adm-mine__a{grid-area:a;display:flex;align-items:center;gap:8px;justify-content:flex-end;\n  flex-wrap:nowrap;min-width:0}\n.adm-mine__a .citui-btn{padding:7px 12px;font-size:11px;white-space:nowrap}\n@media(min-width:700px){\n  .adm-mine__row{grid-template-columns:1fr auto auto;\n    grid-template-areas:\"n p a\" \"d d d\";\n    align-items:center}\n  .dep-rail{margin-left:0}\n}\n/* ⭐ Az ÉVES összeg a kiemelt éves fiókon — a legnagyobb szám az, amit fizet\n   (a modules-annual-pricing §1 „havi elöl\" szabályát a tulaj 2026-09-14-én\n   felülírta). A havi a kíséret: ezen hasonlítja össze a modulokat. */\n.adm-price{display:inline-block;white-space:nowrap}\n.adm-price__lead{display:block;font-family:var(--citui-font-display);font-weight:700;\n  font-size:13px;color:var(--citui-ink)}\n.adm-price__alt{display:block;font-style:normal;font-size:10px;font-weight:500;\n  color:var(--citui-muted)}\n.adm-price--coupon s{font-size:10px;color:var(--citui-muted)}\n/* ⭐ A lemondás HALK: szöveges hivatkozás, nem gomb. Egy kattintással elérhető\n   marad (§J), csak nem ez kapja a lap legnagyobb önálló felületét 11-szer. */\n.adm-mine__off{cursor:pointer;font-size:10px;font-weight:600;color:var(--citui-muted);\n  text-decoration:underline;text-underline-offset:3px;white-space:nowrap;padding:4px 2px}\n.adm-mine__off:hover{color:var(--citui-bad)}\n.adm-mine__off:focus-within{outline:2px solid var(--citui-cyan-500);outline-offset:2px;border-radius:6px}\n/* ⛔ NEM cián: a --citui-cyan-500 (#1fb6d6) világos háttéren ~2,2 kontrasztot ad\n   10px-es szövegnél — pontosan az a csapda, ami a fizetés-bukás kiút-gombját\n   olvashatatlanná tette (feedback_link_rule_eats_button_label). A visszakapcsolt\n   állapotot a FELIRAT jelöli, a színe pedig kimondottan olvasható marad. */\n.adm-mine__off .adm-when-off{color:var(--citui-ink)}\n/* ⭐ A végösszeg a kártya FEJLÉCÉBEN is — a görgetés előtt (mérve: az összegző\n   a lap 79 %-ánál kezdődik 390 px-en). */\n.adm-mine__now{margin-left:auto;background:var(--citui-cyan-500);\n  color:var(--citui-accent-ink);border-radius:var(--citui-radius-pill);padding:5px 13px;\n  font-size:11px;font-weight:700;white-space:nowrap}\n/* ⭐ Az alapeset EGYSZER, a lista fölött (a 11× ismételt sor helyett) + a\n   12 ≠ 11 feloldása ott, ahol a szám áll. */\n.adm-mine__all{margin:0 0 10px;font-size:11px;color:var(--citui-muted)}\n.adm-mine__recon{margin:10px 0 0;font-size:10px;color:var(--citui-muted);line-height:1.5}\n\n/* ── Modul-összegző (jóváhagyott kontraktus: design-refs/console/modules-annual-pricing/) ──\n   A fül eddig végösszeg NÉLKÜL ért véget: ~12 árazott sor, és semmi nem mondta meg,\n   együtt mennyibe kerülnek (Elek FK-002 Z2). Az Előfizetés-kártya SAJÁT formanyelve\n   (.adm-sub__cell), hogy a lap egy nyelven beszéljen a pénzről.\n   ⚠️ A legnagyobb szám az, amit FIZET — éves fiónál az éves összeg, havinál a havi. */\n.adm-sumbar{display:grid;grid-template-columns:1fr;gap:10px;margin:18px -4px 0;\n  border-top:1px solid var(--citui-line);padding-top:16px}\n@media(min-width:700px){.adm-sumbar{grid-template-columns:1fr 1fr 1.3fr}}\n.adm-sumbar__c{background:var(--citui-surface-2);border-radius:var(--citui-radius-sm);padding:11px 13px}\n.adm-sumbar__c--tot{background:linear-gradient(180deg,var(--citui-surface),var(--citui-white));\n  border:1px solid color-mix(in srgb,var(--citui-cyan-500) 40%,transparent)}\n.adm-sumbar__l{font:600 10px/1.4 var(--citui-font-text);color:var(--citui-muted)}\n.adm-sumbar__v{font:700 13px/1.35 var(--citui-font-display);color:var(--citui-ink);\n  font-variant-numeric:tabular-nums}\n.adm-sumbar__c--tot .adm-sumbar__v{font-size:20px}\n.adm-sumbar__s{font-size:10px;color:var(--citui-muted);margin-top:2px;line-height:1.45}\n/* A ÷12 olvasat ITT él, nem a fenti összeadós sorban: a három cella ugyanazt az\n   egységet mondja (a SZÁMLÁZOTT havidíjat), így a részek kiadják az egészet. */\n.adm-sumbar__note{grid-column:1/-1;margin:2px 4px 0;font-size:10px;line-height:1.5;\n  color:var(--citui-muted)}\n\n/* The submitting checkbox is invisible; its <label> is the visible control, so\n   the tab keeps working with JS off (label click still toggles the checkbox). */\n.adm-mod__cb{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}\n.adm-when-on,.adm-when-off{display:none}\n.adm-mod__cb:checked~.adm-when-on{display:inline}\n.adm-mod__cb:not(:checked)~.adm-when-off{display:inline}\n.adm-mine__off,.adm-shop__add{position:relative;cursor:pointer}\n.adm-mine__off:focus-within,.adm-shop__add:focus-within{outline:2px solid var(--citui-cyan-500);outline-offset:2px}\n.adm-shop__add:has(.adm-mod__cb:checked){background:transparent;color:var(--citui-ink);\n  border:1px solid var(--citui-line-strong)}\n\n.adm-shop{display:grid;gap:14px;grid-template-columns:1fr;margin:4px 0 18px}\n@media (min-width:720px){.adm-shop{grid-template-columns:repeat(2,1fr)}}\n@media (min-width:1100px){.adm-shop{grid-template-columns:repeat(3,1fr)}}\n.adm-shop__card{border:1px solid var(--citui-line);border-radius:var(--citui-radius-sm);\n  background:var(--citui-panel);overflow:hidden;display:flex;flex-direction:column;\n  transition:border-color var(--citui-transition),box-shadow var(--citui-transition)}\n.adm-shop__card.is-dirty{border-color:var(--citui-cyan-500);\n  box-shadow:0 0 0 3px color-mix(in srgb,var(--citui-cyan-500) 16%,transparent)}\n.adm-shop__thumb{position:relative;height:132px;overflow:hidden;background:var(--citui-panel);\n  border-bottom:1px solid var(--citui-line)}\n/* 620px natural width, not the full desktop 1200: scaled into a ~300px card the\n   desktop layout is unreadable confetti — the point is that the owner RECOGNISES\n   the section, so the narrow layout wins here. */\n.adm-shop__thumb iframe{position:absolute;top:0;left:0;width:620px;height:420px;border:0;\n  transform-origin:top left;transform:scale(.48);pointer-events:none}\n.adm-shop__thumb::after{content:\"\";position:absolute;inset:0;\n  background:linear-gradient(180deg,transparent 70%,var(--citui-white))}\n.adm-shop__body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}\n.adm-shop__body h3{margin:0;font-size:13px;font-family:var(--citui-font-display);color:var(--citui-ink)}\n.adm-shop__body p{margin:0;font-size:11px;line-height:1.5;color:var(--citui-muted);flex:1}\n.adm-shop__foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.adm-shop__foot .adm-chip{margin-right:auto}\n\n/* Teljes oldalas előnézet — a kosár állapotával, mobil/asztali váltóval. */\n.adm-pv{position:fixed;inset:0;z-index:80;background:var(--citui-navy-950);display:flex;flex-direction:column}\n.adm-pv[hidden]{display:none}\n.adm-pv__bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 12px;\n  background:var(--citui-navy-950);color:var(--citui-ink-inverse)}\n.adm-pv__warn{font-size:10px;font-weight:700;border-radius:var(--citui-radius-pill);padding:5px 11px;\n  background:color-mix(in srgb,var(--citui-warn) 22%,transparent);color:var(--citui-warn);\n  border:1px solid color-mix(in srgb,var(--citui-warn) 45%,transparent)}\n.adm-pv__ttl{display:none;flex:1;min-width:120px;font-family:var(--citui-font-display);font-size:12px}\n@media (min-width:820px){.adm-pv__ttl{display:block}}\n.adm-pv__tools{display:flex;gap:5px;margin-left:auto}\n.adm-pv__b{font:inherit;font-size:10px;font-weight:600;cursor:pointer;padding:6px 11px;min-height:32px;\n  border-radius:var(--citui-radius-pill);background:transparent;color:var(--citui-ink-inverse);\n  border:1px solid color-mix(in srgb,var(--citui-ink-inverse) 28%,transparent)}\n.adm-pv__b[aria-pressed=\"true\"]{background:var(--citui-cyan-500);border-color:var(--citui-cyan-500);\n  color:var(--citui-accent-ink)}\n.adm-pv__x{width:34px;height:34px;border-radius:50%;cursor:pointer;background:transparent;\n  color:var(--citui-ink-inverse);border:1px solid color-mix(in srgb,var(--citui-ink-inverse) 28%,transparent)}\n.adm-pv__body{flex:1;overflow:auto;background:var(--citui-surface-2)}\n.adm-pv__body iframe{border:0;display:block;margin:0 auto}\n/* The iframe keeps its NATURAL width and is scaled to fit, so „Asztali\" shows a real\n   desktop layout even on a 390px phone instead of a stretched mobile one. `zoom`\n   (not transform) because it affects layout: centring and scroll height stay honest. */\n.adm-pv__body[data-vw=\"desktop\"] iframe{width:1200px}\n.adm-pv__body[data-vw=\"phone\"] iframe{width:390px}\n.adm-pv__foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 12px;\n  background:var(--citui-panel);border-top:1px solid var(--citui-line)}\n.adm-pv__foot .adm-chip{margin-right:auto}\n\n/* ── ADR-0088 §8 (approved B plan): monthly→annual switch on the subscription card ── */\n.adm-annual{margin-top:14px;border:1px solid color-mix(in srgb,var(--citui-cyan-500) 35%,transparent);\n  background:linear-gradient(180deg,var(--citui-surface),var(--citui-white));border-radius:var(--citui-radius-sm);padding:16px 18px}\n.adm-annual h3{margin:0 0 4px;font:700 13px/1.3 var(--citui-font-display);color:var(--citui-ink)}\n.adm-annual p{margin:0 0 12px;font-size:11px;color:var(--citui-muted)}\n.adm-annual__nums{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}\n.adm-annual__nums b{font:700 20px/1.2 var(--citui-font-display);color:var(--citui-ink);font-variant-numeric:tabular-nums}\n.adm-annual__nums span{font-size:11px;color:var(--citui-muted)}\n.adm-annual__cta{border:none;background:var(--citui-navy-900);color:var(--citui-white);border-radius:var(--citui-radius-pill);\n  padding:11px 18px;font:600 12px/1.2 var(--citui-font-text);cursor:pointer}\n.adm-annual__cta:hover{background:var(--citui-navy-700)}\n@media(max-width:560px){.adm-annual__cta{width:100%;padding:13px}}\n.adm-annual__undo{display:inline-block;margin-top:8px;border:1px solid var(--citui-line-strong);background:var(--citui-panel);\n  border-radius:var(--citui-radius-pill);padding:7px 14px;font:600 11px/1.2 var(--citui-font-text);color:var(--citui-ink);cursor:pointer}\n.adm-annual__now{margin:12px 0 0;font-size:12px;color:var(--citui-muted)}\n.adm-sub__evchip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:var(--citui-radius-pill);\n  background:var(--citui-ok-soft);color:var(--citui-ok);font:700 10px/1.4 var(--citui-font-text);vertical-align:middle}\n\n/* ── ADR-0088 ⑨ (approved B plan): recurring-card mandate block + confirm dialog ── */\n.adm-mand{margin-top:14px;border:1px solid var(--citui-line);border-radius:var(--citui-radius-sm);\n  padding:14px 16px;display:flex;gap:14px;align-items:flex-start}\n.adm-mand__ico{flex:0 0 auto;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--citui-surface-2)}\n.adm-mand__ico svg{width:20px;height:20px}\n.adm-mand__txt{flex:1;min-width:0}\n.adm-mand__txt h3{margin:0 0 3px;font:700 12px/1.3 var(--citui-font-display)}\n.adm-mand__txt p{margin:0 0 10px;font-size:11px;color:var(--citui-muted)}\n.adm-mand__hint{font-size:10px}\n.adm-mand__pill{display:inline-block;padding:3px 10px;border-radius:var(--citui-radius-pill);\n  font:700 10px/1.5 var(--citui-font-text);margin-bottom:8px;background:var(--citui-surface-2);color:var(--citui-muted)}\n.adm-mand__pill--on{background:var(--citui-ok-soft);color:var(--citui-ok)}\n/* Sits next to --on deliberately: placed before the base rule it would LOSE the\n   background to it (same specificity, later wins) and the failed charge would\n   read as a neutral pill. */\n.adm-mand__pill--off{background:color-mix(in srgb,var(--citui-bad) 12%,var(--citui-panel));\n  color:var(--citui-bad)}\n/* ADR-0119 ⑦: the shop card keeps its shape while the site is suspended, but the\n   buy control is replaced by a plain statement — not a dead-looking button. */\n.adm-shop__shut{display:inline-flex;align-items:center;padding:8px 14px;\n  border-radius:var(--citui-radius-pill);border:1px dashed var(--citui-line-strong);\n  background:var(--citui-surface);color:var(--citui-muted);\n  font:600 11px/1.2 var(--citui-font-text)}\n.adm-mand__btn{display:inline-block;border:1px solid var(--citui-line-strong);background:var(--citui-panel);\n  border-radius:var(--citui-radius-pill);padding:8px 14px;font:600 11px/1.2 var(--citui-font-text);\n  color:var(--citui-ink);text-decoration:none;cursor:pointer}\n.adm-mand__btn:hover{border-color:var(--citui-cyan-500)}\n.adm-mdlveil{position:fixed;inset:0;z-index:120;background:color-mix(in srgb,var(--citui-navy-900) 55%,transparent)}\n.adm-mdl{position:fixed;z-index:121;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);\n  background:var(--citui-panel);border-radius:8px;padding:22px 22px 18px;box-shadow:var(--citui-shadow-md)}\n.adm-mdl h3{margin:0 0 8px;font:700 14px/1.3 var(--citui-font-display)}\n.adm-mdl ul{margin:0 0 14px;padding-left:18px;font-size:11px;line-height:1.6}\n.adm-mdl li{margin-bottom:5px}\n.adm-mdl__keep{display:block;width:100%;border:none;border-radius:8px;padding:12px;\n  background:var(--citui-navy-900);color:var(--citui-white);font:600 12px/1.2 var(--citui-font-text);cursor:pointer}\n.adm-mdl__go{display:block;width:100%;margin-top:8px;border:1px solid var(--citui-bad);background:var(--citui-panel);\n  border-radius:8px;padding:11px;color:var(--citui-bad);font:600 11px/1.2 var(--citui-font-text);cursor:pointer}\n/* ADR-0088 ⑨: coupon visibility in the shop */\n.adm-coupon{margin:12px 0 0;border:2px dashed var(--citui-warn);background:color-mix(in srgb,var(--citui-warn) 7%,var(--citui-panel));\n  border-radius:var(--citui-radius-sm);padding:14px 16px}\n.adm-coupon b{display:block;font:700 17px/1.2 var(--citui-font-display);color:color-mix(in srgb,var(--citui-warn) 78%,var(--citui-ink))}\n.adm-coupon span{font-size:11px;color:var(--citui-muted)}\n.adm-chip--coupon s{color:var(--citui-muted);font-weight:600;margin-right:5px;text-decoration-color:var(--citui-bad)}\n.adm-shop__card{position:relative}\n.adm-shop__coupon{position:absolute;top:-9px;right:10px;z-index:2;\n  background:color-mix(in srgb,var(--citui-warn) 10%,var(--citui-panel));border:1.5px dashed var(--citui-warn);\n  color:color-mix(in srgb,var(--citui-warn) 78%,var(--citui-ink));border-radius:8px;padding:3px 8px;\n  font:700 10px/1.3 var(--citui-font-text)}\n\n/* ══ ADR-0094 ② — Lemondás-elszámolás lap (jóváhagyott B terv) ═════════════════\n   Kontraktus: assets/design-refs/console/domain-settlement/. Minden szín/rádiusz\n   a dizájn-magból (ADR-0021 ①); nyers hex nincs. */\n.adm-settle__dombar{display:flex;align-items:center;gap:11px;background:var(--citui-surface-2);\n  border:1px solid var(--citui-line);border-radius:var(--citui-radius);padding:12px 14px;margin:0 0 14px}\n.adm-settle__ico{color:var(--citui-cyan-500);flex:none;display:grid;place-items:center}\n.adm-settle__dombar b{font-family:var(--citui-font-display);word-break:break-all}\n.adm-settle__dombar span{display:block;font-size:11px;color:var(--citui-muted);margin-t //camping-carina.citoviso.com\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5\"/><\/svg> Oldal<\/a><\/div><main class=\"adm-main\"><div class=\"adm-main__inner\"><div class=\"adm-ph\"><h1>Elérhetőség<\/h1><\/div><p class=\"pl-crumb\">Ahol a vendég megtalálja és eléri — egy helyen.<\/p>\n<section class=\"adm-card\" data-place>\n  <div class=\"adm-card__head\"><span class=\"adm-ico\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z\"/><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"/><\/svg><\/span><h2>A szállás helye<\/h2><\/div>\n  <p class=\"adm-lead\">A honlap tetején, a kapcsolat részben és a térképen ez a cím és ez a pont látszik.<\/p>\n  <div class=\"citui-field\">\n    <label class=\"citui-label\" for=\"pl_addr\">Cím<\/label>\n    <div class=\"pl-row\">\n      <input class=\"citui-input\" id=\"pl_addr\" name=\"address\" value=\"Ráckevei út 083/2 hrsz. 083/2\" autocomplete=\"street-address\">\n      <button class=\"citui-btn citui-btn--ghost\" type=\"button\" id=\"pl_find\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"m20 20-4.2-4.2\"/><\/svg> Megkeresem a térképen<\/button>\n    <\/div>\n    <p class=\"pl-err\" id=\"pl_addr_err\" hidden><\/p>\n    <p class=\"citui-hint pl-where\">Így jelenik meg az oldal tetején, a kapcsolat részben és a Google-nak szóló adatokban.<\/p>\n  <\/div>\n  <div class=\"pl-map\" id=\"pl_map\" role=\"application\" aria-label=\"Térkép — húzza a tűt a szállás bejáratához\"><\/div>\n  <div class=\"pl-status\" id=\"pl_status\" data-s=\"saved\"><span><span class=\"pl-dot\"><\/span><b id=\"pl_state\">A mentett helyen áll a tű<\/b><\/span><span class=\"pl-coords\" id=\"pl_coords\"><\/span><button class=\"pl-link\" type=\"button\" id=\"pl_undo\" hidden>Vissza a mentett helyre<\/button><\/div>\n  <p class=\"citui-hint pl-tip\">Koppintson a térképre, vagy húzza a tűt oda, ahol a vendég megáll: a bejárathoz, a kapuhoz. Ha a ház nem látszik, váltson <b>Műhold<\/b> nézetre.<\/p>\n<\/section><section class=\"adm-card\"><div class=\"adm-card__head\"><span class=\"adm-ico\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2\"/><\/svg><\/span><h2>Telefon és e-mail<\/h2><\/div>\n<div class=\"pl-2\">\n  <div class=\"citui-field\">\n    <label class=\"citui-label\" for=\"ct_phone\">Telefon<\/label>\n    <input class=\"citui-input\" id=\"ct_phone\" name=\"phone\" type=\"tel\" inputmode=\"tel\" value=\"06305161631\" autocomplete=\"tel\">\n    <p class=\"pl-err\" id=\"ct_phone_err\" hidden><\/p>\n    <p class=\"pl-ok\" id=\"ct_phone_ok\" hidden><\/p>\n  <\/div>\n  <div class=\"citui-field\">\n    <label class=\"citui-label\" for=\"ct_email\">E-mail<\/label>\n    <input class=\"citui-input\" id=\"ct_email\" name=\"email\" type=\"email\" inputmode=\"email\" value=\"olaszferenc@gmail.com\" autocomplete=\"email\">\n    <p class=\"pl-err\" id=\"ct_email_err\" hidden><\/p>\n  <\/div>\n<\/div>\n<p class=\"citui-hint\" style=\"margin:0\">Mindkettő <b>nyilvános<\/b>: a honlap kapcsolat részében és a gombokon jelenik meg. Az értesítéseinket nem ide, hanem a <b>Fiók › Kommunikációs e-mail<\/b> címre küldjük.<\/p><\/section><div class=\"pl-save\"><button class=\"citui-btn citui-btn--primary\" type=\"button\" id=\"pl_save\">Mentés és frissítés<\/button><span class=\"pl-dirty\" id=\"pl_dirty\" data-s=\"clean\">Nincs mentetlen változás<\/span><\/div><script>\n(function(){\n  var S={\"address\":\"Ráckevei út 083/2 hrsz. 083/2\",\"lat\":46.7505998,\"lon\":17.3498717,\"phone\":\"06305161631\",\"email\":\"olaszferenc@gmail.com\"};\n  var $=function(i){return document.getElementById(i)};\n  var saved={lat:S.lat,lng:S.lon,addr:S.address,phone:S.phone,email:S.email};\n  var cur={lat:S.lat,lng:S.lon};\n  var map,marker,geocoder;\n  function fmtC(p){return p.lat.toFixed(5)+', '+p.lng.toFixed(5)}\n  function setStatus(s,txt){var st=$('pl_status');if(!st)return;st.dataset.s=s;$('pl_state').textContent=txt;$('pl_coords').textContent=fmtC(cur);$('pl_undo').hidden=(s==='saved')}\n  function dirty(){\n    var d=$('pl_dirty');if(!d)return;\n    var ch=[];\n    if($('pl_addr')&&$('pl_addr').value.replace(/\\s+/g,' ').trim()!==saved.addr)ch.push('cím');\n    if(map&&(Math.abs(cur.lat-saved.lat)>1e-7||Math.abs(cur.lng-saved.lng)>1e-7))ch.push('térkép-tű');\n    if($('ct_phone')&&normPhone($('ct_phone').value)!==normPhone(saved.phone))ch.push('telefon');\n    if($('ct_email')&&$('ct_email').value.trim()!==saved.email)ch.push('e-mail');\n    document.querySelectorAll('[data-watch]').forEach(function(el){if(el.dataset.v!==(el.type==='checkbox'?String(el.checked):el.value))ch.push(el.dataset.watch)});\n    d.dataset.s=ch.length?'dirty':'clean';d.textContent=ch.length?('Mentetlen: '+ch.join(', ')):'Nincs mentetlen változás';\n  }\n  // Mirrors src/sms/sender.ts normalizePhone(): digits + '+', 06/36 → +36.\n  function normPhone(raw){var c=String(raw||'').replace(/[\\s\\-().\\/]/g,'');if(!/^\\+?[0-9]{8,15}$/.test(c))return null;if(c.indexOf('06')===0)return '+36'+c.slice(2);if(c[0]==='+')return c;if(c.indexOf('36')===0)return '+'+c;return null}\n  function prettyPhone(e){if(!e||e.indexOf('+36')!==0)return e;var n=e.slice(3);if(n[0]==='1')return '+36 1 '+n.slice(1,4)+' '+n.slice(4);var a=n.slice(0,2),r=n.slice(2);return '+36 '+a+' '+(r.length===7?r.slice(0,3)+' '+r.slice(3):r.slice(0,3)+' '+r.slice(3))}\n  function checkPhone(commit){var i=$('ct_phone');if(!i)return true;var v=i.value.trim(),er=$('ct_phone_err'),ok=$('ct_phone_ok');\n    if(!v){er.hidden=true;ok.hidden=false;ok.textContent='Üresen hagyva a honlapon nem lesz telefonszám.';return true}\n    var n=normPhone(v);if(!n){er.hidden=false;er.textContent='Ez nem telefonszám. Így írja: 06 30 123 4567';ok.hidden=true;i.setAttribute('aria-invalid','true');return false}\n    i.removeAttribute('aria-invalid');er.hidden=true;if(commit)i.value=prettyPhone(n);ok.hidden=false;ok.textContent='A honlapon így: '+prettyPhone(n);return true}\n  function checkEmail(){var i=$('ct_email');if(!i)return true;var v=i.value.trim(),er=$('ct_email_err');\n    if(v&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(v)){er.hidden=false;er.textContent='Ez nem e-mail-cím. Így néz ki: nev@pelda.hu';i.setAttribute('aria-invalid','true');return false}\n    er.hidden=true;i.removeAttribute('aria-invalid');return true}\n  function checkAddr(){var i=$('pl_addr');if(!i)return true;var v=i.value.replace(/\\s+/g,' ').trim(),er=$('pl_addr_err');\n    if(v.length<5){er.hidden=false;er.textContent='Adja meg a címet (település, utca, házszám vagy helyrajzi szám).';return false}\n    er.hidden=true;return true}\n  function place(p,how){cur={lat:p.lat,lng:p.lng};if(marker)marker.setPosition(cur);setStatus(how,how==='moved'?'Kézzel pontosítva — mentésre vár':how==='found'?'A cím alapján áll — ellenőrizze, és húzza pontosra':'A mentett helyen áll a tű');dirty()}\n  window.plInit=function(){\n    if(!$('pl_map'))return;\n    map=new google.maps.Map($('pl_map'),{center:cur,zoom:16,mapTypeControl:true,streetViewControl:false,fullscreenControl:true,gestureHandling:'cooperative',clickableIcons:false});\n    marker=new google.maps.Marker({position:cur,map:map,draggable:true,title:'A szállás bejárata'});\n    marker.addListener('dragend',function(e){place({lat:e.latLng.lat(),lng:e.latLng.lng()},'moved')});\n    map.addListener('click',function(e){place({lat:e.latLng.lat(),lng:e.latLng.lng()},'moved')});\n    geocoder=new google.maps.Geocoder();\n    setStatus('saved','A mentett helyen áll a tű');\n    window.PL_READY=1;\n  };\n  function wire(){\n    var f=$('pl_find');\n    if(f)f.addEventListener('click',function(){\n      if(!checkAddr())return;\n      if(!geocoder){setStatus('err','A térkép még töltődik');return}\n      f.disabled=true;f.lastChild.textContent=' Keresem…';\n      geocoder.geocode({address:$('pl_addr').value,region:'hu'},function(res,st){\n        f.disabled=false;f.lastChild.textContent=' Megkeresem a térképen';\n        if(st==='OK'&&res[0]){var l=res[0].geometry.location;map.panTo(l);map.setZoom(17);place({lat:l.lat(),lng:l.lng()},'found')}\n        else{setStatus('err','Ezt a címet a térkép nem ismeri — húzza a tűt a helyére kézzel')}\n      });\n    });\n    var u=$('pl_undo');if(u)u.addEventListener('click',function(){place({lat:saved.lat,lng:saved.lng},'saved');if(map)map.panTo(cur)});\n    ['pl_addr','ct_phone','ct_email'].forEach(function(id){var i=$(id);if(!i)return;i.addEventListener('input',function(){dirty();if(id==='ct_phone')checkPhone(false)});i.addEventListener('blur',function(){if(id==='ct_phone')checkPhone(true);if(id==='ct_email')checkEmail();if(id==='pl_addr')checkAddr();dirty()})});\n    document.querySelectorAll('[data-watch]').forEach(function(el){el.dataset.v=el.type==='checkbox'?String(el.checked):el.value;el.addEventListener('input',dirty);el.addEventListener('change',dirty)});\n    if($('ct_phone'))checkPhone(false);\n    var s=$('pl_save');if(s)s.addEventListener('click',function(){\n      var ok=[checkAddr(),checkPhone(true),checkEmail()].every(Boolean);var d=$('pl_dirty');\n      if(!ok){d.dataset.s='dirty';d.textContent='Javítsa a pirossal jelölt mezőt, utána mentünk.';return}\n      s.disabled=true;s.textContent='Mentés…';\n
