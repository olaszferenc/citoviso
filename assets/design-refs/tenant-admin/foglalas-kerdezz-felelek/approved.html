<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERV B — Foglalás beállítása: Ellenőrzőlista</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>/*
 * Citoviso UI — the central design core ("dizájn-mag").
 * ADR-0021 ①: ONE source of truth for ALL first-party Citoviso surfaces
 * (public homepage, login, internal console, tenant-admin chrome).
 *
 * SCOPE BOUNDARY: this is the CONTROL-PLANE product brand — ONE stable Citoviso
 * identity. It is NOT the engine's per-skin `--cit-*` token contract, which themes
 * GENERATED tenant sites (data plane, variable per skin). Namespace is `--citui-*`
 * on purpose, to never collide with the engine tokens.
 *
 * Design language: navy/cyan brand, Space Grotesk (display) + Inter (text),
 * dark-gradient heroes, glassy surfaces. Icons are inline SVG (no emoji).
 */

/* ─────────────────────────────────────────────────────────────────────────
   1. DESIGN TOKENS
   ───────────────────────────────────────────────────────────────────────── */
:root {
  /* Brand palette */
  --citui-navy-950: #0a1f36; /* near-black navy — dark gradient end (sidebar) */
  --citui-navy-900: #0e2a47; /* deepest navy — hero/footer/CTA base */
  --citui-navy-800: #16283f; /* brand navy (logo) */
  --citui-navy-700: #203a59;
  --citui-cyan-500: #1fb6d6; /* accent cyan */
  --citui-cyan-400: #35c4e0; /* bright cyan */
  --citui-cyan-300: #6fd8eb; /* light cyan */
  --citui-glow-blue: #5081ff; /* decorative aurora glow (hero backgrounds only) */
  --citui-white:    #ffffff;

  /* Ink / neutrals (light-first) */
  --citui-ink:         #10243a; /* primary text */
  --citui-ink-inverse: #eaf3f8; /* text on dark navy surfaces */
  --citui-muted:       #5a6d82; /* secondary text — ≥4,6:1 on every light fill it sits on (surface-2, ok-soft, field, accent-soft); was #60748b = 4,17–4,48 there (console-dark-scan --light, 2026-09-25) */
  --citui-surface:     #f6fbfd; /* alt section background */
  --citui-surface-2:   #eef7fa; /* raised subtle */
  --citui-line:        rgba(14, 42, 71, 0.12);
  --citui-line-strong: rgba(14, 42, 71, 0.22);

  /* Semantic (for console / admin status) */
  --citui-ok:   #2fa96b;
  --citui-ok-soft: #e7f8ef; /* soft success background (saved pill) */
  --citui-warn: #d29922;
  --citui-bad:  #e5484d;
  --citui-info: var(--citui-cyan-500);

  /* ── SZÖVEG-VÁLTOZAT a jelentés-vivő színekhez (tulajdonosi döntés, 2026-09-15) ──
     ⛔⛔ MÉRT HIBA: a fenti hue-k JELZÉS-színek (keret, háttér, pötty) — világos
     háttéren FELIRATNAK viszont olvashatatlanok. Mérve a renderelt konzolon:
       --citui-ok      #2fa96b → 3,00 (a „Fizetek ▸" és a „Jóváhagyás" gomb, .q-good)
       --citui-bad     #e5484d → 3,91 (.con button.bad, .pg-head, .q-bad)
       --citui-warn    #d29922 → 2,52 (.q-mid, „elavult" jelvény)
       --citui-cyan-500 #1fb6d6 → 2,41 (MINDEN link a konzolon)
     A 4,5-ös küszöb alatt mind. A HUE VÁLTOZATLAN marad (keret/háttér/akcent), csak a
     FELIRAT kap sötétebb változatot — így a „színhang" megmarad, és a destruktív gomb
     nem lesz hangsúlyosabb, mint ma (a tulaj az „A — sötétebb felirat" változatot
     hagyta jóvá, `assets/design-refs/console/semantic-contrast/`).
     ⚠️ Az értékek nem tippeltek: minden TÉNYLEGES háttérre megoldva (fehér · felület ·
     felület-2 · ok-soft · a pill/pg-box színkeverékei), és a legrosszabb eset is
     TARTALÉKKAL megy át (≥5,3) — egy épphogy-átmenő érték a következő érme-feldobás.
     ⚠️ A `--citui-muted` SZÁNDÉKOSAN nem változik (tulajdonosi döntés): a 4,42–4,81
     a küszöb határán van, és a token átütne a tenant-adminra és a vendég-oldalra is.
     ⚠️ NYITOTT: a `[data-citui-theme="dark"]` hatókör ezeket NEM írja felül. Ma ez
     ártalmatlan — mérve: a sötét hatókörnek 0 használata van a repóban —, de aki
     bekapcsolja, annak ezt a négy értéket ki kell mérnie a sötét felületre. */
  --citui-ok-ink:   #19733f; /* legrosszabb mért: 5,35 (ok-soft pill) */
  --citui-bad-ink:  #b3262b; /* legrosszabb mért: 5,57 (rejected pill) */
  --citui-warn-ink: #7d5a12; /* legrosszabb mért: 5,67 (outdated pill) */
  --citui-link-ink: #10697a; /* legrosszabb mért: 5,81 (felület-2) */
  /* Text sitting ON a solid --citui-bad fill (danger button, alert head, frozen panel).
     Light: white on #e5484d → 3,91 (bold labels). The dark scope flips it. */
  --citui-on-bad: var(--citui-white);

  /* Elevation */
  --citui-shadow-sm: 0 10px 30px rgba(14, 42, 71, 0.08);
  --citui-shadow-md: 0 24px 60px rgba(14, 42, 71, 0.14);

  /* Radius */
  --citui-radius-sm:   14px;
  --citui-radius:      22px;
  --citui-radius-lg:   32px;
  --citui-radius-pill: 999px;

  /* Typography */
  --citui-font-display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --citui-font-text:    "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Layout / motion */
  --citui-container: 1180px;
  --citui-transition: 220ms ease;

  /* A lap alján FENNTARTOTT sáv, amit a lap aljára rögzített elemeknek ki kell
     kerülniük (ma: a süti-hozzájárulás sáv, `assets/runtime/cit-consent.css`).
     Alapból 0 — a honlapon és a jogi lapokon nincs mit kerülni. A mobil
     tenant-admin viszont saját alsó fül-sávot visel, ezért ott felüldefiniálódik
     (`citui-admin.css`) — nélküle a sáv MÉRTEN 11 fülből 6-ot eltakart. A GAZDALAP
     deklarálja, mennyi helyet tart fenn magának; nem a sáv találgat. */
  --citui-consent-bottom: 0px;

  /* A süti-sáv MÉRT magassága, amíg kinn van — a hozzájárulás-kezelő
     (`assets/runtime/cit-consent.js`) írja a gyökérre, és a döntés után TÖRLI.
     Így egy felület fenn tudja tartani a sáv helyét magának (a tenant-admin
     oldalsávja ezzel emeli a „Kilépés" gombot a sáv fölé) anélkül, hogy bárki
     egy kitalált magasság-konstanst hordozna. Alapból 0: nincs sáv, nincs foglalás. */
  --citui-consent-h: 0px;

  /* A kiküldött terv (/p/<token>) alján ülő RÖGZÍTETT réteg MÉRT magassága: a
     süti-sáv + a sablon saját Foglalás-sávja + a fölé mászó hívó pirula, együtt.
     A konfigurátor-futó (`assets/runtime/cit-configurator.js`, placeLaunch) írja
     a gyökérre, mert egyedül ő tudja, meddig kellett felmásznia. A jogi lábléc
     (`prospectNotice.ts`) ebből tart magának alsó térközt — mérve 2026-09-26,
     390 px-en 19 sablonból 19-en e nélkül a leiratkozó link a réteg ALATT volt.
     Alapból 0: pirula nélkül (már megvett oldal, JS nélkül) a süti-sáv magassága
     a tartalék. */
  --citui-cfg-clear: 0px;

  /* A tenant-admin MOBIL alsó fül-sávjának MÉRT magassága (a `citui-admin.css`
     állítja a ≤899px ágon; asztalin nincs alsó sáv, ezért 0). EGY forrás, KÉT
     fogyasztó: ennyi alsó tartalom-térköz kell, hogy a lap alja ne a fül-sáv alá
     essen, ÉS ennyivel ül feljebb a süti-sáv. Mérve 390px-en 186px — 11 fül HÁROM
     sorba tördelve (ADR-0084). ⛔ Ne írd át szabad kézzel: mérd újra. */
  --citui-admin-bottomnav-h: 0px;

  /* ── Felület-rétegek (ADR-0224, tenant-admin „Linear" nyelv) ──────────────────
     A `--citui-white` KÉT szerepet vitt: kártya-HÁTTÉR és fehér FELIRAT sötét
     mezőn. Sötét módban a kettő szétválik — a kártya sötét lesz, a felirat fehér
     marad —, ezért a HÁTTÉR-szerep saját tokent kap. Világosban az értékek a
     Linear-terv semleges szürkéi (nem brand-tintált), hogy a szín csak jelentést
     vigyen; a konzol/honlap ezeket nem használja, tehát változatlan marad. */
  --citui-bg:     #ffffff; /* the admin page canvas */
  --citui-panel:  #ffffff; /* card / drawer / dialog / top bar surface */
  --citui-side:   #fafafa; /* desktop sidebar */
  --citui-field:  #f6f7f8; /* input background */
  --citui-hover:  #f2f3f5; /* hover / active row */
  --citui-accent-ink: #06131b; /* text ON the cyan accent (measured 7,81:1) */
  --citui-accent-soft: color-mix(in srgb, var(--citui-cyan-500) 12%, transparent); /* active row / selected segment */

  /* ── Márka-navy SZÖVEG-szerepben (2026-09-25, konzol sötét módja) ──────────────
     A `--citui-navy-*` KÉT szerepet vitt: FELÜLET (sávok, gombok) és FELIRAT (alcím,
     aktív fül, másodlagos gomb, jelvény). Sötét módban a felirat-szerep 1,2:1-re esett
     a sötét panelen (mérve: scripts/console-dark-scan.mts, 21 lelet 12 képernyőn),
     ezért a felirat-szerep saját tokent kap. Világosban AZONOS a mai navyval. */
  --citui-ink-brand:   var(--citui-navy-900);
  --citui-ink-brand-2: var(--citui-navy-700);
}

/* Dark surface scope — flips neutrals; brand hues stay.
   Use on any wrapper (internal console shell, dark hero, etc.). */
[data-citui-theme="dark"] {
  --citui-ink:         #e6e9ef;
  --citui-muted:       #8a93a3;
  --citui-surface:     #12151c;
  --citui-surface-2:   #1b1f29;
  --citui-line:        #262b37;
  --citui-line-strong: #343a48;
  /* ADR-0224: a tenant-admin sötét módja. Semleges (nem navy-tintált) sötét
     rétegek — a Linear-terv sötét képei ezekből készültek. */
  --citui-bg:     #0f1116;
  --citui-panel:  #151821;
  --citui-side:   #12151c;
  --citui-field:  #1b1f29;
  --citui-hover:  #1e2330;
  /* A jelzés-hue-k VILÁGOSABB változata: a világos-módú telített zöld/piros a
     sötét panelen 2,5–3,5 kontrasztot adna keretként és pöttyként. */
  --citui-ok:      #3ddc97;
  --citui-warn:    #f0b35a;
  --citui-bad:     #ff7b7b;
  --citui-ok-soft: #14352a;
  /* ⛔ A négy FELIRAT-token a sötét panelre (#151821) KIMÉRVE (WCAG, ≥ 4,5, tartalékkal;
     mérés: node-os luminancia-számítás, 2026-09-24):
       ok-ink   #4fe3a3 → 10,85 · bad-ink #ff8e8e → 8,03 · warn-ink #f5c06b → 10,67 ·
       link-ink #4fd0ea → 9,74 (a --citui-field #1b1f29 mezőn a legrosszabb: bad-ink 7,46;
       a --citui-muted #8a93a3 a panelen 5,73). */
  --citui-ok-ink:   #4fe3a3;
  --citui-bad-ink:  #ff8e8e;
  --citui-warn-ink: #f5c06b;
  --citui-link-ink: #4fd0ea;
  /* The dark --citui-bad (#ff7b7b) is light: white on it is 2,51, navy is 5,81. */
  --citui-on-bad: var(--citui-navy-900);
  --citui-accent-soft: color-mix(in srgb, var(--citui-cyan-500) 16%, transparent);
  --citui-ink-brand:   var(--citui-ink);
  --citui-ink-brand-2: color-mix(in srgb, var(--citui-ink) 80%, var(--citui-muted));
}

/* ─────────────────────────────────────────────────────────────────────────
   2. BASE / RESET
   ───────────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--citui-font-text);
  color: var(--citui-ink);
  background: var(--citui-white);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.citui-menu-open { overflow: hidden; }

h1, h2, h3, h4 {
  font-family: var(--citui-font-display);
  color: var(--citui-ink-brand);
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin: 0 0 0.6em;
}

p { margin: 0 0 1rem; }

a { color: var(--citui-cyan-500); text-decoration: none; }
a:hover { text-decoration: underline; }

img, svg { display: block; max-width: 100%; }

button, input, select, textarea { font: inherit; }
button { border: 0; cursor: pointer; background: none; }

:focus-visible { outline: 2px solid var(--citui-cyan-500); outline-offset: 2px; border-radius: 4px; }

/* ─────────────────────────────────────────────────────────────────────────
   3. LAYOUT PRIMITIVES
   ───────────────────────────────────────────────────────────────────────── */
.citui-container { width: min(calc(100% - 32px), var(--citui-container)); margin-inline: auto; }
.citui-container--narrow { --citui-container: 820px; }

.citui-section { padding: 104px 0; }
.citui-section--alt { background: var(--citui-surface); }

.citui-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  margin: 0 0 18px;
  font-size: 0.8rem; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--citui-cyan-500);
}
.citui-eyebrow::before { content: ""; width: 28px; height: 2px; border-radius: 999px; background: currentColor; }

.citui-section-heading { max-width: 760px; margin-bottom: 52px; }
.citui-section-heading h2 {
  margin: 0 0 18px;
  font-size: clamp(2.15rem, 5vw, 4rem);
  line-height: 1.02; letter-spacing: -0.045em;
}
.citui-section-heading p { margin: 0; max-width: 690px; font-size: 1.08rem; color: var(--citui-muted); }

/* ─────────────────────────────────────────────────────────────────────────
   4. COMPONENTS
   ───────────────────────────────────────────────────────────────────────── */

/* Buttons */
.citui-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  /* A label that wraps (a long label on a phone) stays centred too: `justify-content`
     centres the text box, `text-align` the lines inside it (a <button> does it by default,
     an <a> does not — Elek FK-016: „Vissza a szállás oldalára” hung left). */
  text-align: center;
  min-height: 52px; padding: 0 22px;
  border-radius: var(--citui-radius-sm);
  font-family: var(--citui-font-text); font-weight: 800; text-decoration: none;
  transition: transform var(--citui-transition), box-shadow var(--citui-transition), background var(--citui-transition);
}
.citui-btn:hover { transform: translateY(-2px); text-decoration: none; }
.citui-btn:active { transform: translateY(0); }
.citui-btn:disabled, .citui-btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }

.citui-btn--primary {
  color: var(--citui-navy-900);
  background: linear-gradient(135deg, var(--citui-cyan-400), #8be8f3);
  box-shadow: 0 14px 36px rgba(31, 182, 214, 0.3);
}
.citui-btn--primary:hover { box-shadow: 0 18px 42px rgba(31, 182, 214, 0.38); }

.citui-btn--secondary { /* glass — for dark backgrounds */
  color: var(--citui-white);
  border: 1px solid rgba(255, 255, 255, 0.24);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(14px);
}
.citui-btn--dark {
  color: var(--citui-white); background: var(--citui-navy-900);
  box-shadow: 0 14px 34px rgba(14, 42, 71, 0.18);
}
.citui-btn--ghost { /* outline — for light app surfaces */
  color: var(--citui-navy-900); background: var(--citui-white);
  border: 1px solid var(--citui-line-strong);
}
.citui-btn--ghost:hover { border-color: var(--citui-navy-900); }
.citui-btn--sm { min-height: 42px; padding: 0 16px; font-size: 0.9rem; }

.citui-icon { width: 22px; height: 22px; flex: 0 0 auto; }

/* Chip (filled cyan tag — e.g. industry pills) */
.citui-chip {
  display: inline-flex; align-items: center;
  padding: 10px 14px; border-radius: var(--citui-radius-pill);
  color: var(--citui-navy-900); background: #e3f8fb;
  border: 1px solid rgba(31, 182, 214, 0.18);
  font-size: 0.9rem; font-weight: 700;
}

/* Status pill (outline — console/admin) */
.citui-pill {
  display: inline-flex; align-items: center; gap: 0.35em;
  padding: 0.15rem 0.6rem; border-radius: var(--citui-radius-pill);
  font-size: 0.78rem; font-weight: 600;
  border: 1px solid var(--citui-line-strong); color: var(--citui-muted);
}
.citui-pill--ok   { color: var(--citui-ok);   border-color: var(--citui-ok); }
.citui-pill--warn { color: var(--citui-warn); border-color: var(--citui-warn); }
.citui-pill--bad  { color: var(--citui-bad);  border-color: var(--citui-bad); }
.citui-pill--info { color: var(--citui-info); border-color: var(--citui-info); }

/* Card + panel */
.citui-card {
  padding: 28px; border: 1px solid var(--citui-line);
  border-radius: var(--citui-radius); background: var(--citui-white);
  box-shadow: var(--citui-shadow-sm);
}
.citui-panel {
  padding: 16px 18px; border: 1px solid var(--citui-line);
  border-radius: var(--citui-radius-sm); background: var(--citui-white);
}
.citui-panel__label {
  font-family: var(--citui-font-display); font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--citui-muted); margin: 0 0 12px;
}

/* Forms */
.citui-field { display: block; margin-bottom: 1rem; }
.citui-label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--citui-ink); margin-bottom: 0.5rem; }
.citui-input, .citui-select, .citui-textarea {
  width: 100%; color: var(--citui-ink); background: var(--citui-white);
  border: 1px solid var(--citui-line-strong); border-radius: var(--citui-radius-sm);
  padding: 0.7rem 0.9rem;
  transition: border-color var(--citui-transition), box-shadow var(--citui-transition);
}
.citui-input:focus, .citui-select:focus, .citui-textarea:focus {
  outline: none; border-color: var(--citui-cyan-500);
  box-shadow: 0 0 0 3px rgba(31, 182, 214, 0.18);
}
.citui-textarea { min-height: 7rem; resize: vertical; }
.citui-hint { font-size: 0.78rem; color: var(--citui-muted); margin-top: 0.5rem; }

/* Table */
.citui-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.citui-table th {
  text-align: left; font-family: var(--citui-font-display);
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--citui-muted); padding: 0.75rem; border-bottom: 1px solid var(--citui-line);
}
.citui-table td { padding: 0.75rem; border-bottom: 1px solid var(--citui-line); }
.citui-table tbody tr:hover td { background: var(--citui-surface-2); }

/* ── Shared chrome: header / nav / brand / footer ── */
.citui-nav { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }

.citui-brand {
  display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--citui-font-display); font-size: 1.32rem; font-weight: 700; letter-spacing: -0.03em;
  color: var(--citui-white); text-decoration: none;
}
.citui-brand:hover { text-decoration: none; }
.citui-brand__mark { width: 38px; height: 38px; flex: 0 0 auto; }
.citui-brand--ink { color: var(--citui-navy-900); }

/* The Citoviso lockup "B" (src/ui/brand.ts, ADR-0236): the E4 mark IS the letter C,
   then "itoviso". Mark = 1.6× the letter size, the word centred on it (the /pay/* ratio
   the owner approved). Size it with font-size on the lockup. Dark surface → the dark mark
   + white word; light surface → the light mark + navy word; "themed" follows the theme. */
.citui-lockup {
  display: inline-flex; color: var(--citui-navy-900); text-decoration: none;
  font-family: var(--citui-font-display); font-weight: 700; letter-spacing: -0.01em; line-height: 1;
  white-space: nowrap;
}
.citui-lockup.citui-lockup:hover { text-decoration: none; }
.citui-lockup--lg { font-size: 1.32rem; } /* header / login size: word 21 px, mark 34 px (= /pay/*) */
.citui-lockup__row { display: inline-flex; align-items: center; }
.citui-lockup__mark { height: 1.6em; width: auto; flex: 0 0 auto; margin-right: 0.02em; }
.citui-lockup__word { line-height: 1; }
.citui-lockup__word small {
  display: block; margin-top: 2px; font: 400 11px/1.3 var(--citui-font-text); letter-spacing: 0; color: var(--citui-muted);
}
/* ⚠️ Doubled class + :hover: a surface link rule (`.con a` 0,1,1 · `.con a:hover` 0,2,1)
   otherwise paints the word link-cyan. */
.citui-lockup.citui-lockup--on-dark, .citui-lockup.citui-lockup--on-dark:hover { color: var(--citui-white); }
.citui-lockup.citui-lockup--on-light, .citui-lockup.citui-lockup--on-light:hover { color: var(--citui-navy-900); }

<script>/* A SZEZON-ILLESZTÉS SZABÁLYA — EGY példányban, mindkét oldalnak.
 *
 * WHY THIS FILE EXISTS. "Which price row applies to this night?" lived TWICE, and the
 * two copies were never compared: src/tenant/prices.ts (seasonCovers + priceOn, the
 * number that is FROZEN onto the booking request and mailed to the guest) and
 * assets/runtime/cit-runtime.js (the same two functions, the number the guest READS
 * before submitting). The money FORMATTER is also duplicated (cit-money.js), but that
 * one is deliberate and held by a parity guard — an unequal formatter prints an ugly
 * string. An unequal PRICE SELECTOR quotes a different amount than it charges, which is
 * the ADR-0193 ② harm class. So this predicate is loaded by both sides and cannot drift,
 * because there is only one of it.
 *
 * ⛔ THE GUARD IS NOT A THIRD CONSUMER. scripts/booking-price-coherence-check.mts keeps
 * its OWN re-implementation on purpose, and must keep it: an oracle that imports the
 * code under test cannot disagree with it. When this rule changes, that oracle is
 * updated INDEPENDENTLY — that separation is the whole point of it.
 *
 * ⚠️ WHAT IS DELIBERATELY ENCODED HERE, in one place, so the next change has one site:
 * a season is a RECURRING MONTH-DAY ("06-15"), with no year, so it holds every year
 * (moduleConfigViews.ts: "making them re-enter it each January would guarantee stale
 * prices"). Measured 2026-09-22: a stay in July 2027 — inside the 12-month booking
 * horizon — is quoted the SAME amount as July 2026, and that amount is frozen onto the
 * request. Year-bound rows (migration 0072: valid_from/valid_to) landed HERE, once —
 * see rowFor's precedence — instead of in two places that would silently disagree.
 *
 * `.cjs` on purpose: package.json says "type": "module", so a `.js` here could not be
 * require()d from the server at all. The browser gets the text spliced into the runtime
 * <script>, where the trailing module.exports line is inert.
 */
var CitSeason = (function () {
  /* Does a recurring 'MM-DD' range cover this month-day? Handles the year-end wrap
   * (a "Téli szünet 12-20 – 01-05" range runs December → January). */
  function covers(from, to, monthDay) {
    if (!from || !to || !monthDay) return false;
    return from <= to
      ? monthDay >= from && monthDay <= to
      : monthDay >= from || monthDay <= to;
  }

  /* 'YYYY-MM-DD' (or a full ISO stamp) → 'MM-DD'. The `slice(5, 10)` assumption lived
   * in three files; it lives here now, so a year-aware rule has ONE place to change. */
  function monthDayOf(isoDate) {
    return String(isoDate).slice(5, 10);
  }

  /* Is a 'YYYY-MM-DD' date inside a row's YEAR-BOUND window (inclusive)? A row with
   * no window (both ends null) is timeless and always "inside". Plain string compare
   * is exact for zero-padded ISO dates. (migration 0072) */
  function inWindow(row, isoDay) {
    var a = row.validFrom, b = row.validTo;
    if (!a || !b) return true;
    return isoDay >= a && isoDay <= b;
  }

  function hasWindow(row) {
    return !!(row.validFrom && row.validTo);
  }

  /* The row in effect on a given NIGHT ('YYYY-MM-DD'), or null for an unpriced night,
   * which every caller must turn into "no quote at all" (§B.17).
   *
   * Precedence, most specific first (approved plan booking-offer, 2026-09-23):
   *   1. a YEAR-BOUND season covering the night ("Főszezon 2027" beats the recurring one)
   *   2. a recurring season covering the night
   *   3. a DATED base whose window holds the night (the offer page writes these: a price
   *      for the nights no season covers, until the owner's chosen day)
   *   4. the timeless base
   * Rows whose window does not hold the night do not exist for it. Inside each tier the
   * owner's own order decides (first wins), so an overlap resolves the way the list
   * reads top-down instead of by some hidden rule.
   *
   * `rows` is shape-agnostic on purpose — the server calls it with UnitPrice objects
   * (`isBase`/`from`/`to`/`validFrom`/`validTo`) and the browser with the JSON the
   * endpoint ships (`base`/…). `isBaseRow` tells the two apart without a second copy of
   * the selection logic.
   *
   * ⛔ The second argument used to be a MONTH-DAY. It is a full date now, because a
   * year-bound row cannot be judged from 'MM-DD' — a caller still passing '07-10' would
   * silently skip every dated row, so a short argument is refused loudly. */
  function rowFor(rows, isoDay, isBaseRow) {
    if (!rows || !rows.length) return null;
    if (String(isoDay).length < 10) throw new Error("CitSeason.rowFor: full YYYY-MM-DD date required, got " + isoDay);
    var day = String(isoDay).slice(0, 10);
    var md = monthDayOf(day);
    var yearSeason = null, season = null, datedBase = null, base = null;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!inWindow(r, day)) continue;
      if (isBaseRow(r)) {
        if (hasWindow(r)) { if (!datedBase) datedBase = r; }
        else if (!base) base = r;
        continue;
      }
      if (!covers(r.from, r.to, md)) continue;
      if (hasWindow(r)) { if (!yearSeason) yearSeason = r; }
      else if (!season) season = r;
    }
    return yearSeason || season || datedBase || base;
  }

  /* One YEAR's occurrence of a recurring season, named by the year it STARTS in
   * (migration 0074, approved plan season-year-price). A range that wraps the year end
   * (11-01 → 03-01) ends in the next calendar year, so its label is "2026/27" and its
   * window runs 2026-11-01 … 2027-03-01. The Árazás page, the year-price writer and the
   * public price table all name and date a year the SAME way — from here. */
  function occurrence(from, to, year) {
    var y = Number(year);
    var wraps = from > to;
    return {
      year: y,
      start: y + "-" + from,
      end: (wraps ? y + 1 : y) + "-" + to,
      label: wraps ? y + "/" + String(y + 1).slice(2) : String(y)
    };
  }

  /* The first year whose occurrence has not ended by `isoToday` — the leftmost year the
   * owner can still price (a season that closed yesterday offers next year first). */
  function firstOpenYear(from, to, isoToday) {
    var y = Number(String(isoToday).slice(0, 4)) - 1;
    while (occurrence(from, to, y).end < String(isoToday).slice(0, 10)) y++;
    return y;
  }

  /* What the owner typed → 'MM-DD', or null when it is not a real day of the year.
   * "11-01", "11.01", "11. 01.", "11/1", "1101" all mean November 1 (approved plan
   * season-year-price). Here, once: the Árazás page previews with it while the owner
   * types, and the server stores with it — a preview that normalised differently
   * would promise days the saved season does not have. */
  var DIM = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  function normMonthDay(raw) {
    var t = String(raw == null ? "" : raw).replace(/\s+/g, "").replace(/\.$/, "");
    var m = /^(\d{1,2})[.\-\/](\d{1,2})$/.exec(t) || /^(\d{2})(\d{2})$/.exec(t);
    if (!m) return null;
    var mo = Number(m[1]), d = Number(m[2]);
    if (mo < 1 || mo > 12 || d < 1 || d > DIM[mo - 1]) return null;
    return (mo < 10 ? "0" : "") + mo + "-" + (d < 10 ? "0" : "") + d;
  }

  return {
    covers: covers, monthDayOf: monthDayOf, inWindow: inWindow, rowFor: rowFor,
    occurrence: occurrence, firstOpenYear: firstOpenYear, normMonthDay: normMonthDay
  };
})();

/* Node (server) requires this file; a browser gets the same binding from the var. */
if (typeof module !== "undefined" && module.exports) module.exports = CitSeason;

      { id: "u3", name: "Kis faház", cap: 3, base: 15000, por: false, seasons: [{ label: "Ünnepek", from: "12-20", to: "01-05", amount: 22000, min: null }] }
    ];
    s.priceUnit = "per_night"; s.seasonalOnly = false;
    s.minNights = 2; s.maxNights = 14; s.horizon = 12; s.lead = 0;
    s.taxState = "amount"; s.tax = "500"; s.includes = "Az ár tartalmazza a reggelit.";
    s.notify = "info@nyugalom.example"; s.expiry = 48;
    QS.forEach(function (q) { s.answered[q.id] = true; });
    return s;
  }

  var S = emptyState();
  var uid = 10;

  /* ── formatting ─────────────────────────────────────────── */
  function money(n) {
    if (n == null || n === "") return "—";
    var v = Math.round(Number(n));
    var t = String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return S.currency === "EUR" ? t + " €" : t + " Ft";
  }
  var UNIT_TXT = { per_night: "éjszakánként", per_person_night: "fő / éjszaka", per_stay: "a teljes tartózkodásra" };
  var MON = ["jan.", "febr.", "márc.", "ápr.", "máj.", "jún.", "júl.", "aug.", "szept.", "okt.", "nov.", "dec."];
  function md(mmdd) { var p = mmdd.split("-"); return MON[Number(p[0]) - 1] + " " + Number(p[1]) + "."; }
  function huDate(iso) { var p = iso.split("-"); return p[0] + ". " + MON[Number(p[1]) - 1] + " " + Number(p[2]) + "."; }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function addDays(isoD, n) { var d = new Date(isoD + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  function today() { return iso(new Date()); }
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function bookable() {
    return S.units.filter(function (u) { return S.mode === "single" ? u.whole : S.mode === "rooms" ? !u.whole : true; });
  }

  /* ── mode change keeps units coherent with the real model ─ */
  function setMode(m) {
    S.mode = m;
    var whole = S.units.filter(function (u) { return u.whole; })[0];
    var rooms = S.units.filter(function (u) { return !u.whole; });
    if (m === "single") {
      if (!whole) S.units.unshift({ id: "w" + uid++, name: "A szállás egésze", whole: true, cap: null, base: null, por: false, seasons: [] });
    } else {
      if (!rooms.length) S.units.push({ id: "u" + uid++, name: "", cap: null, base: null, por: false, seasons: [] });
      if (m === "both" && !whole) S.units.unshift({ id: "w" + uid++, name: "A szállás egésze", whole: true, cap: null, base: null, por: false, seasons: [] });
      if (m === "rooms" && whole) S.units = S.units.filter(function (u) { return !u.whole; });
    }
  }

  /* ── validation (real messages) ─────────────────────────── */
  function seasonErrors(u, sz, skipIdx) {
    var errs = [];
    if (!String(sz.label || "").trim()) errs.push("Adjon nevet az időszaknak (például: Főszezon).");
    if (!CitSeason.normMonthDay(sz.from) || !CitSeason.normMonthDay(sz.to)) errs.push("Az időszak dátumait HÓNAP-NAP alakban kérjük (például: 06-15).");
    if (!(Number(sz.amount) > 0)) errs.push("Adjon meg egy árat.");
    if (sz.min !== null && sz.min !== "" && !(Number.isInteger(Number(sz.min)) && sz.min >= 1 && sz.min <= 60)) errs.push("A minimum 1 és 60 éj között lehet.");
    var twin = u.seasons.filter(function (x, i) { return i !== skipIdx && x.label.trim().toLowerCase() === String(sz.label).trim().toLowerCase(); })[0];
    if (twin) errs.push("Ennél a szobánál már van „" + twin.label + "” nevű időszak — a listán szerkesztheti.");
    return errs;
  }
  function stayErrors() {
    var e = [];
    if (!(S.minNights >= 1 && S.minNights <= 30)) e.push("A legrövidebb foglalás 1 és 30 éj között lehet.");
    if (!(S.maxNights >= 1 && S.maxNights <= 365)) e.push("A leghosszabb foglalás 1 és 365 éj között lehet.");
    if (S.minNights > S.maxNights) e.push("A legrövidebb foglalás nem lehet hosszabb, mint a leghosszabb.");
    return e;
  }
  function emailErrors() {
    if (!S.notify.trim()) return [];
    var bad = S.notify.split(",").map(function (x) { return x.trim(); }).filter(function (x) { return x && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x); });
    return bad.length ? ["Ez nem tűnik e-mail címnek: " + bad.join(", ")] : [];
  }

  /* ── silent blockers, made loud ─────────────────────────── */
  function blockers() {
    var out = [];
    bookable().forEach(function (u) {
      var nm = u.name || "Névtelen szoba";
      if (S.seasonalOnly && !u.seasons.length) out.push({ q: "seasonal", sev: "bad", t: nm + ": egyetlen napra sem lehet foglalni — csak az időszakokban adja ki, de nincs időszaka." });
      if (!S.seasonalOnly && !(u.base > 0) && !u.por && S.answered.base) out.push({ q: "base", sev: "warn", t: nm + ": az időszakokon kívüli éjszakáknak nincs ára. A vendég nem lát végösszeget, ajánlatot kér." });
      u.seasons.forEach(function (sz) {
        if (sz.min && sz.min > S.maxNights) out.push({ q: "stay", sev: "bad", t: nm + " · " + sz.label + ": legalább " + sz.min + " éj kell, de a leghosszabb foglalás " + S.maxNights + " éj — erre az időszakra senki nem tud foglalni." });
      });
    });
    if (S.minNights > S.maxNights) out.push({ q: "stay", sev: "bad", t: "A legrövidebb foglalás hosszabb, mint a leghosszabb." });
    return out;
  }

  /* ── trial booking: the guest-side rules (requests.ts) ──── */
  function rowsOf(u) {
    var rows = u.seasons.map(function (sz) { return { from: sz.from, to: sz.to, amount: sz.amount, min: sz.min, label: sz.label }; });
    if (u.base > 0) rows.push({ base: true, amount: u.base });
    return rows;
  }
  function trial(unitId, arrive, nights, guests) {
    var u = S.units.filter(function (x) { return x.id === unitId; })[0];
    if (!u || !arrive) return { errors: ["Kérjük, adja meg az érkezés és a távozás napját."] };
    nights = Number(nights); guests = Number(guests);
    if (!(nights >= 1)) return { errors: ["A távozás napja az érkezés után kell legyen."] };
    var errors = [], notes = [];
    var rows = rowsOf(u);
    var isBase = function (r) { return !!r.base; };
    var need = 0, total = 0, unpriced = false, closed = false;
    for (var i = 0; i < nights; i++) {
      var night = addDays(arrive, i);
      var inSeason = u.seasons.some(function (sz) { return CitSeason.covers(sz.from, sz.to, CitSeason.monthDayOf(night)); });
      if (S.seasonalOnly && !inSeason) closed = true;
      var r = CitSeason.rowFor(rows, night, isBase);
      var m = r && !r.base && r.min ? r.min : S.minNights;
      if (m > need) need = m;
      if (!r) { unpriced = true; continue; }
      if (S.priceUnit === "per_stay") { if (i === 0) total = r.amount; }
      else total += r.amount * (S.priceUnit === "per_person_night" ? guests : 1);
    }
    if (closed) errors.push("Ebben az időszakban nem adjuk ki.");
    if (nights < need) errors.push("Legalább " + need + " éjszakára lehet foglalni.");
    if (nights > S.maxNights) errors.push("Legfeljebb " + S.maxNights + " éjszakára lehet foglalni.");
    var earliest = addDays(today(), Number(S.lead) || 0);
    if (arrive < earliest) errors.push("A legkorábbi foglalható érkezés: " + huDate(earliest).replace(/\.$/, "") + ".");
    var limit = new Date(today() + "T12:00:00Z"); limit.setUTCMonth(limit.getUTCMonth() + Number(S.horizon));
    if (arrive > iso(limit)) errors.push("Ennyire előre még nem lehet foglalni.");
    if (u.cap && guests > u.cap) notes.push("A férőhely " + u.cap + " fő, a vendég " + guests + " főre kér. Ma a rendszer ezt nem szűri ki — a kérést Ön látja és dönti el.");
    var tax = null;
    if (S.taxState === "amount" && Number(S.tax) > 0) tax = Number(S.tax) * guests * nights;
    return { errors: errors, notes: notes, unpriced: unpriced, total: unpriced ? null : total, tax: tax, need: need, u: u };
  }

  /* ── questions ──────────────────────────────────────────── */
  var SECS = [
    { id: "rooms", t: "Szállás és szobák" },
    { id: "prices", t: "Árak" },
    { id: "rules", t: "Foglalás szabályai" },
    { id: "guest", t: "Amit a vendég lát" },
    { id: "notify", t: "Értesítés" },
    { id: "check", t: "Kipróbálás" }
  ];
  var QS = [
    { id: "mode", sec: "rooms", t: "Hogyan adja ki a szállását?" },
    { id: "rooms", sec: "rooms", t: function () { return S.mode === "single" ? "Hány vendég fér el?" : "Melyek a kiadó szobái?"; } },
    { id: "unit", sec: "prices", t: "Mire szól az ára?" },
    { id: "base", sec: "prices", t: "Mennyi az ára egy átlagos éjszakára?" },
    { id: "seasons", sec: "prices", t: "Van olyan időszak, amikor más az ár?" },
    { id: "seasonal", sec: "prices", t: "Az időszakokon kívül is kiadja?", skip: function () { return !bookable().some(function (u) { return u.seasons.length; }); } },
    { id: "stay", sec: "rules", t: "Hány éjszakára lehet foglalni?" },
    { id: "ahead", sec: "rules", t: "Mennyivel előre lehet foglalni?" },
    { id: "tax", sec: "guest", t: "Kér idegenforgalmi adót?" },
    { id: "includes", sec: "guest", t: "Mi van benne az árban?", optional: true },
    { id: "notify", sec: "notify", t: "Hová küldjük a foglalási kéréseket?" },
    { id: "check", sec: "check", t: "Próbáljuk ki: így foglalna egy vendég" }
  ];
  function qById(id) { return QS.filter(function (q) { return q.id === id; })[0]; }
  function title(q) { return typeof q.t === "function" ? q.t() : q.t; }
  function visibleQs() { return QS.filter(function (q) { return !(q.skip && q.skip()); }); }

  function isDone(id) {
    switch (id) {
      case "mode": return !!S.mode;
      case "rooms": if (S.mode === "single") { var w = bookable()[0]; return w && w.cap ? w.cap + " fő" : "férőhely nincs megadva"; }
        return bookable().length > 0 && bookable().every(function (u) { return u.whole || String(u.name).trim(); });
      case "unit": return !!S.priceUnit;
      case "base": return !!S.answered.base && bookable().every(function (u) { return u.base > 0 || u.por; });
      case "seasons": return !!S.answered.seasons;
      case "seasonal": return S.seasonalOnly !== null;
      case "stay": return !!S.answered.stay && !stayErrors().length;
      case "ahead": return !!S.answered.ahead;
      case "tax": return S.taxState !== null && (S.taxState !== "amount" || Number(S.tax) > 0);
      case "includes": return !!S.answered.includes;
      case "notify": return !!S.answered.notify && !emailErrors().length;
      case "check": return !blockers().some(function (b) { return b.sev === "bad"; }) && visibleQs().every(function (q) { return q.id === "check" || q.optional || isDone(q.id); });
    }
    return false;
  }
  function answerLine(id) {
    switch (id) {
      case "mode": return { single: "Egyben, egy egységként", rooms: "Szobánként", both: "Szobánként és egyben is" }[S.mode] || "—";
      case "rooms": if (S.mode === "single") { var w = bookable()[0]; return w && w.cap ? w.cap + " fő" : "férőhely nincs megadva"; }
        return bookable().map(function (u) { return (u.name || "névtelen") + (u.cap ? " (" + u.cap + " fő)" : ""); }).join(", ");
      case "unit": return S.priceUnit ? UNIT_TXT[S.priceUnit] + " · " + (S.currency === "EUR" ? "euró" : "forint") : "—";
      case "base": return bookable().map(function (u) { return (u.name || "névtelen") + ": " + (u.por ? "ajánlatot küld" : money(u.base)); }).join(" · ");
      case "seasons": var n = 0; bookable().forEach(function (u) { n += u.seasons.length; }); return n ? n + " időszak" : (S.answered.seasons ? "nincs, egész évben az alapár" : "—");
      case "seasonal": return S.seasonalOnly === null ? "—" : S.seasonalOnly ? "Csak az időszakokban" : "Egész évben";
      case "stay": return S.minNights + "–" + S.maxNights + " éj";
      case "ahead": return "legfeljebb " + S.horizon + " hónappal előre · " + (Number(S.lead) ? "legkorábban " + S.lead + " nap múlva" : "akár mára is");
      case "tax": return S.taxState === "none" ? "Nincs" : S.taxState === "amount" ? money(S.tax) + " / fő / éj, a helyszínen" : S.taxState === "unknown" ? "Még nem tudja" : "—";
      case "includes": return S.includes || (S.answered.includes ? "nem írt semmit" : "—");
      case "notify": return (S.notify || ACCOUNT_EMAIL) + " · " + (Number(S.expiry) ? S.expiry + " óra után lejár" : "nem jár le");
      case "check": var b = blockers(); return b.length ? b.length + " teendő" : "rendben";

    return "";
  }

  /* Render one question's controls into `el`. `onChange(structural)` notifies the variant. */

  function answer(text, ctx) {
    var t = String(text);

      var map = { "mi a különbség": "egyben", "mit írjak ide": null, "mi van az időszakon kívül": null, "átnyúlhat újévre": "szezon" };

  /* Wire a chat panel (any variant). `root` contains .chat-log, .chips, form. */
  function mountChat(root, getCtx) {

    function push(cls, html) { var d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
    function ask(text) {
      push("me", esc(text));
      var typing = push("ai typing", "…");
      setTimeout(function () {
        typing.remove();
        var r = answer(text, getCtx());
        var d = push("ai", esc(r.a));
        if (r.go) {
          var b = document.createElement("button"); b.className = "btn sm go"; b.textContent = "Mutasd, hol adom meg: " + title(qById(r.go));
          b.addEventListener("click", function () { V.goTo(r.go); }); d.appendChild(b);
        }
        if (r.advanced) {
          var b2 = document.createElement("button"); b2.className = "btn sm go"; b2.textContent = "Haladó beállítások › Naptár";
          b2.addEventListener("click", function () { V.toast("Itt a mai űrlap nyílna meg (Haladó › Naptár)."); }); d.appendChild(b2);
        }
      }, 450);
    }
    form.addEventListener("submit", function (e) { e.preventDefault(); var t = inp.value.trim(); if (!t) return; inp.value = ""; ask(t); });
    function refreshChips() {
      var c = CHIPS[getCtx()] || ["Mi az időszak?", "Mi a minimum éjszaka?"];
      chips.innerHTML = c.map(function (x) { return '<button type="button" class="chip">' + esc(x) + "</button>"; }).join("");
      chips.querySelectorAll(".chip").forEach(function (b) { b.addEventListener("click", function () { ask(b.textContent); }); });
    }
    push("ai", "Jó napot! Kérdezzen bármit a foglalás beállításáról — elmagyarázom, és megmutatom, hol adhatja meg. Az adatokat Ön írja be, én nem módosítok semmit.");
    refreshChips();
    return { refreshChips: refreshChips, ask: ask };
  }

    function size(v) { frame.className = "frame " + v; bar.querySelectorAll("#sz button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === v); }); }
    function scen(v) { S = v === "edit" ? demoState() : emptyState(); KF.S = S; bar.querySelectorAll("#sc button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === v); }); onScenario(v); }
    bar.querySelectorAll("#sz button").forEach(function (b) { b.addEventListener("click", function () { size(b.dataset.v); }); });
    bar.querySelectorAll("#sc button").forEach(function (b) { b.addEventListener("click", function () { scen(b.dataset.v); }); });
    var p = new URLSearchParams(location.search);
    size(p.get("size") || (phone ? "mob" : "desk"));
    scen(p.get("sc") || "new");
  }
  function toast(frame, t) {
    var d = document.createElement("div"); d.className = "toast"; d.textContent = t; frame.appendChild(d);
    setTimeout(function () { d.remove(); }, 2600);
  }

  return {
    get S() { return S; }, set S(v) { S = v; },
    SECS: SECS, QS: QS, qById: qById, title: title, visibleQs: visibleQs, isDone: isDone, answerLine: answerLine,
    render: render, blockers: blockers, mountChat: mountChat, CHAT_HTML: CHAT_HTML, mockbar: mockbar, toast: toast,
    answer: answer, esc: esc, ACCOUNT_EMAIL: ACCOUNT_EMAIL
  };
})();
</script><script>/* Variant B — one page checklist: 6 sections, one open at a time, all its questions stacked. */
(function () {
  var frame = document.querySelector(".frame");
  var CHAT_SVG = '<svg class="ico" viewBox="0 0 24 24"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V16.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/></svg>';
  frame.innerHTML =
    '<div class="topbar"><span class="site">Nyugalom Vendégház</span><span class="crumb">› Foglalás beállítása</span><span class="sp"></span><button class="linkbtn" id="adv">Haladó beállítások</button></div>' +
    '<div class="b-grid"><main class="b-main"><div class="b-head"></div><div class="b-list"></div></main><div class="b-askbar"><button class="btn" id="fab">' + CHAT_SVG + "Kérdezzen a Segítőtől</button></div>" +
    '<aside class="chat b-chat">' + KF.CHAT_HTML + '</aside></div><div class="scrim"></div>';
  var open = null, ctx = "mode";
  var chatEl = frame.querySelector(".b-chat"), scrim = frame.querySelector(".scrim");
  var chat = KF.mountChat(chatEl, function () { return ctx; });
  function isMob() { return frame.classList.contains("mob"); }
  function sheet(o) { chatEl.classList.toggle("sheet", isMob()); chatEl.classList.toggle("open", o); scrim.classList.toggle("open", o && isMob()); chatEl.querySelector(".chat-close").style.display = isMob() ? "" : "none"; }
  frame.querySelector("#fab").addEventListener("click", function () { sheet(true); });
  scrim.addEventListener("click", function () { sheet(false); });
  chatEl.querySelector(".chat-close").addEventListener("click", function () { sheet(false); });
  frame.querySelector("#adv").addEventListener("click", function () { V.toast("Itt a mai űrlap nyílna meg (Szobák · Árak · Online foglalás) — megmarad, csak hátrébb kerül."); });

  function secQs(sid) { return KF.visibleQs().filter(function (q) { return q.sec === sid; }); }
  function secState(sid) {
    var qs = secQs(sid);
    var bad = KF.blockers().filter(function (b) { return qs.some(function (q) { return q.id === b.q; }) && b.sev === "bad"; }).length;
    var missing = qs.filter(function (q) { return !q.optional && !KF.isDone(q.id); }).length;
    if (bad) return { cls: "bad", t: bad + " akadály" };
    if (missing) return { cls: "warn", t: missing === qs.length ? "Még nincs kitöltve" : missing + " kérdés hiányzik" };
    return { cls: "ok", t: "Kész" };
  }
  function head() {
    var done = KF.SECS.filter(function (s) { return secState(s.id).cls === "ok"; }).length;
    var bl = KF.blockers();
    frame.querySelector(".b-head").innerHTML = '<h1 class="b-h1">Foglalás beállítása</h1><p class="lead" style="color:var(--citui-muted);margin:0">' + done + " / " + KF.SECS.length + " rész kész" +
      (bl.length ? " · " + bl.length + " dolog miatt a vendég nem, vagy nem jól tud foglalni" : done === KF.SECS.length ? " · a vendégek foglalhatnak" : "") + "</p>";
  }
  function draw() {
    head();
    var h = "";
    KF.SECS.forEach(function (s, i) {
      var st = secState(s.id), isOpen = open === s.id;
      h += '<section class="b-sec' + (isOpen ? " open" : "") + '" data-s="' + s.id + '"><button class="b-sh" aria-expanded="' + isOpen + '"><span class="b-num">' + (i + 1) + "</span><span class=\"b-st\"><b>" + KF.esc(s.t) + "</b>";
      if (!isOpen && s.id !== "check") h += "<small>" + secQs(s.id).filter(function (q) { return KF.S.answered[q.id] || KF.isDone(q.id); }).map(function (q) { return KF.esc(KF.answerLine(q.id)); }).join(" · ") + "</small>";
      h += '</span><span class="pill ' + st.cls + '">' + st.t + "</span></button>";
      if (isOpen) {
        h += '<div class="b-body">';
        secQs(s.id).forEach(function (q) { h += '<div class="b-q" data-qbox="' + q.id + '"></div>'; });
        var nxt = KF.SECS[i + 1];
        h += '<div class="b-foot">' + (nxt ? '<button class="btn pri" data-next="' + nxt.id + '">Mentés, tovább: ' + KF.esc(nxt.t) + "</button>" : '<button class="btn pri" data-fin="1"' + (KF.isDone("check") ? "" : " disabled") + ">Kész, bekapcsolom a foglalást</button>") + "</div></div>";
      }
      h += "</section>";
    });
    var list = frame.querySelector(".b-list");
    list.innerHTML = h;
    list.querySelectorAll(".b-sh").forEach(function (b) { b.addEventListener("click", function () { var sid = b.parentNode.dataset.s; openSec(open === sid ? null : sid); }); });
    list.querySelectorAll("[data-qbox]").forEach(function (box) {
      var id = box.dataset.qbox;
      KF.render(id, box, function (structural) { KF.S.answered[id] = true; if (structural) draw(); else head(); });
      box.addEventListener("focusin", function () { if (ctx !== id) { ctx = id; chat.refreshChips(); } });
    });
    list.querySelectorAll("[data-next]").forEach(function (b) { b.addEventListener("click", function () { markSeen(open); openSec(b.dataset.next); }); });
    list.querySelectorAll("[data-fin]").forEach(function (b) { b.addEventListener("click", function () { V.toast("A foglalás bekapcsolva. (Mock: semmi nem íródik.)"); }); });
  }
  function markSeen(sid) { secQs(sid).forEach(function (q) { if (["seasons", "stay", "ahead", "includes", "notify", "base"].indexOf(q.id) >= 0) KF.S.answered[q.id] = true; }); }
  function openSec(sid) {
    open = sid; draw();
    if (sid) { var q = secQs(sid)[0]; ctx = q ? q.id : ctx; chat.refreshChips(); var el = frame.querySelector('[data-s="' + sid + '"]'); el.scrollIntoView({ block: "start", behavior: "smooth" }); }
  }
  function goTo(qid) {
    sheet(false);
    var q = KF.qById(qid); open = q.sec; ctx = qid; draw(); chat.refreshChips();
    var box = frame.querySelector('[data-qbox="' + qid + '"]');
    if (box) { box.scrollIntoView({ block: "center", behavior: "smooth" }); box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash"); }
  }
  window.V = { goTo: goTo, toast: function (t) { KF.toast(frame, t); } };
  KF.mockbar("B · Ellenőrzőlista", function (v) {
    sheet(false);
    open = v === "edit" ? null : "rooms"; ctx = "mode"; draw();
  });
  new MutationObserver(function () { sheet(chatEl.classList.contains("open")); }).observe(frame, { attributes: true, attributeFilter: ["class"] });
})();
</script></body></html>
