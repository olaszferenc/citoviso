<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modul-státusz — 4. kör</title>
<style>:root {
  /* Brand palette */
  --citui-navy-950: #0a1f36; /* near-black navy — dark gradient end (sidebar) */
  --citui-navy-900: #0e2a47; /* deepest navy — hero/footer/CTA base */
  --citui-navy-800: #16283f; /* brand navy (logo) */
  --citui-navy-700: #203a59;
  --citui-cyan-500: #1fb6d6; /* accent cyan */
  --citui-cyan-400: #35c4e0; /* bright cyan */
  --citui-cyan-300: #6fd8eb; /* light cyan */
  --citui-glow-blue: #5081ff; /* decorative aurora glow (hero backgrounds only) */
  --citui-white:    #ffffff;

  /* Ink / neutrals (light-first) */
  --citui-ink:         #10243a; /* primary text */
  --citui-ink-inverse: #eaf3f8; /* text on dark navy surfaces */
  --citui-muted:       #5a6d82; /* secondary text — ≥4,6:1 on every light fill it sits on (surface-2, ok-soft, field, accent-soft); was #60748b = 4,17–4,48 there (console-dark-scan --light, 2026-09-25) */
  --citui-surface:     #f6fbfd; /* alt section background */
  --citui-surface-2:   #eef7fa; /* raised subtle */
  --citui-line:        rgba(14, 42, 71, 0.12);
  --citui-line-strong: rgba(14, 42, 71, 0.22);

  /* Semantic (for console / admin status) */
  --citui-ok:   #2fa96b;
  --citui-ok-soft: #e7f8ef; /* soft success background (saved pill) */
  --citui-warn: #d29922;
  --citui-bad:  #e5484d;
  --citui-info: var(--citui-cyan-500);

  /* ── SZÖVEG-VÁLTOZAT a jelentés-vivő színekhez (tulajdonosi döntés, 2026-09-15) ──
     ⛔⛔ MÉRT HIBA: a fenti hue-k JELZÉS-színek (keret, háttér, pötty) — világos
     háttéren FELIRATNAK viszont olvashatatlanok. Mérve a renderelt konzolon:
       --citui-ok      #2fa96b → 3,00 (a „Fizetek ▸" és a „Jóváhagyás" gomb, .q-good)
       --citui-bad     #e5484d → 3,91 (.con button.bad, .pg-head, .q-bad)
       --citui-warn    #d29922 → 2,52 (.q-mid, „elavult" jelvény)
       --citui-cyan-500 #1fb6d6 → 2,41 (MINDEN link a konzolon)
     A 4,5-ös küszöb alatt mind. A HUE VÁLTOZATLAN marad (keret/háttér/akcent), csak a
     FELIRAT kap sötétebb változatot — így a „színhang" megmarad, és a destruktív gomb
     nem lesz hangsúlyosabb, mint ma (a tulaj az „A — sötétebb felirat" változatot
     hagyta jóvá, `assets/design-refs/console/semantic-contrast/`).
     ⚠️ Az értékek nem tippeltek: minden TÉNYLEGES háttérre megoldva (fehér · felület ·
     felület-2 · ok-soft · a pill/pg-box színkeverékei), és a legrosszabb eset is
     TARTALÉKKAL megy át (≥5,3) — egy épphogy-átmenő érték a következő érme-feldobás.
     ⚠️ A `--citui-muted` SZÁNDÉKOSAN nem változik (tulajdonosi döntés): a 4,42–4,81
     a küszöb határán van, és a token átütne a tenant-adminra és a vendég-oldalra is.
     ⚠️ NYITOTT: a `[data-citui-theme="dark"]` hatókör ezeket NEM írja felül. Ma ez
     ártalmatlan — mérve: a sötét hatókörnek 0 használata van a repóban —, de aki
     bekapcsolja, annak ezt a négy értéket ki kell mérnie a sötét felületre. */
  --citui-ok-ink:   #19733f; /* legrosszabb mért: 5,35 (ok-soft pill) */
  --citui-bad-ink:  #b3262b; /* legrosszabb mért: 5,57 (rejected pill) */
  --citui-warn-ink: #7d5a12; /* legrosszabb mért: 5,67 (outdated pill) */
  --citui-link-ink: #10697a; /* legrosszabb mért: 5,81 (felület-2) */
  /* Text sitting ON a solid --citui-bad fill (danger button, alert head, frozen panel).
     Light: white on #e5484d → 3,91 (bold labels). The dark scope flips it. */
  --citui-on-bad: var(--citui-white);

  /* Elevation */
  --citui-shadow-sm: 0 10px 30px rgba(14, 42, 71, 0.08);
  --citui-shadow-md: 0 24px 60px rgba(14, 42, 71, 0.14);

  /* Radius */
  --citui-radius-sm:   14px;
  --citui-radius:      22px;
  --citui-radius-lg:   32px;
  --citui-radius-pill: 999px;

  /* Typography */
  --citui-font-display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --citui-font-text:    "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Layout / motion */
  --citui-container: 1180px;
  --citui-transition: 220ms ease;

  /* A lap alján FENNTARTOTT sáv, amit a lap aljára rögzített elemeknek ki kell
     kerülniük (ma: a süti-hozzájárulás sáv, `assets/runtime/cit-consent.css`).
     Alapból 0 — a honlapon és a jogi lapokon nincs mit kerülni. A mobil
     tenant-admin viszont saját alsó fül-sávot visel, ezért ott felüldefiniálódik
     (`citui-admin.css`) — nélküle a sáv MÉRTEN 11 fülből 6-ot eltakart. A GAZDALAP
     deklarálja, mennyi helyet tart fenn magának; nem a sáv találgat. */
  --citui-consent-bottom: 0px;

  /* A süti-sáv MÉRT magassága, amíg kinn van — a hozzájárulás-kezelő
     (`assets/runtime/cit-consent.js`) írja a gyökérre, és a döntés után TÖRLI.
     Így egy felület fenn tudja tartani a sáv helyét magának (a tenant-admin
     oldalsávja ezzel emeli a „Kilépés" gombot a sáv fölé) anélkül, hogy bárki
     egy kitalált magasság-konstanst hordozna. Alapból 0: nincs sáv, nincs foglalás. */
  --citui-consent-h: 0px;

  /* A kiküldött terv (/p/<token>) alján ülő RÖGZÍTETT réteg MÉRT magassága: a
     süti-sáv + a sablon saját Foglalás-sávja + a fölé mászó hívó pirula, együtt.
     A konfigurátor-futó (`assets/runtime/cit-configurator.js`, placeLaunch) írja
     a gyökérre, mert egyedül ő tudja, meddig kellett felmásznia. A jogi lábléc
     (`prospectNotice.ts`) ebből tart magának alsó térközt — mérve 2026-09-26,
     390 px-en 19 sablonból 19-en e nélkül a leiratkozó link a réteg ALATT volt.
     Alapból 0: pirula nélkül (már megvett oldal, JS nélkül) a süti-sáv magassága
     a tartalék. */
  --citui-cfg-clear: 0px;

  /* A tenant-admin MOBIL alsó fül-sávjának MÉRT magassága (a `citui-admin.css`
     állítja a ≤899px ágon; asztalin nincs alsó sáv, ezért 0). EGY forrás, KÉT
     fogyasztó: ennyi alsó tartalom-térköz kell, hogy a lap alja ne a fül-sáv alá
     essen, ÉS ennyivel ül feljebb a süti-sáv. Mérve 390px-en 186px — 11 fül HÁROM
     sorba tördelve (ADR-0084). ⛔ Ne írd át szabad kézzel: mérd újra. */
  --citui-admin-bottomnav-h: 0px;

  /* ── Felület-rétegek (ADR-0224, tenant-admin „Linear" nyelv) ──────────────────
     A `--citui-white` KÉT szerepet vitt: kártya-HÁTTÉR és fehér FELIRAT sötét
     mezőn. Sötét módban a kettő szétválik — a kártya sötét lesz, a felirat fehér
     marad —, ezért a HÁTTÉR-szerep saját tokent kap. Világosban az értékek a
     Linear-terv semleges szürkéi (nem brand-tintált), hogy a szín csak jelentést
     vigyen; a konzol/honlap ezeket nem használja, tehát változatlan marad. */
  --citui-bg:     #ffffff; /* the admin page canvas */
  --citui-panel:  #ffffff; /* card / drawer / dialog / top bar surface */
  --citui-side:   #fafafa; /* desktop sidebar */
  --citui-field:  #f6f7f8; /* input background */
  --citui-hover:  #f2f3f5; /* hover / active row */
  --citui-accent-ink: #06131b; /* text ON the cyan accent (measured 7,81:1) */
  --citui-accent-soft: color-mix(in srgb, var(--citui-cyan-500) 12%, transparent); /* active row / selected segment */

  /* ── Márka-navy SZÖVEG-szerepben (2026-09-25, konzol sötét módja) ──────────────
     A `--citui-navy-*` KÉT szerepet vitt: FELÜLET (sávok, gombok) és FELIRAT (alcím,
     aktív fül, másodlagos gomb, jelvény). Sötét módban a felirat-szerep 1,2:1-re esett
     a sötét panelen (mérve: scripts/console-dark-scan.mts, 21 lelet 12 képernyőn),
     ezért a felirat-szerep saját tokent kap. Világosban AZONOS a mai navyval. */
  --citui-ink-brand:   var(--citui-navy-900);
  --citui-ink-brand-2: var(--citui-navy-700);
}
/* Mock-only layout. Colours/fonts/radii come from the --citui-* tokens inlined above. */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--citui-surface-2);color:var(--citui-ink);font:13px/1.45 var(--citui-font-text);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--citui-link-ink)}
/* ── mock toolbar (outside the device) ── */
.mk{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--citui-navy-900);color:var(--citui-ink-inverse);font-size:12px}
.mk b{font-weight:600}
.mk .grp{display:flex;gap:4px;align-items:center}
.mk .grp>span{opacity:.7;margin-right:2px}
.mk button{background:transparent;border:1px solid color-mix(in srgb,var(--citui-white) 28%,transparent);color:var(--citui-ink-inverse);border-radius:6px;padding:4px 9px;cursor:pointer}
.mk button.on{background:var(--citui-cyan-500);border-color:var(--citui-cyan-500);color:var(--citui-accent-ink)}
.mk .note{opacity:.75;flex-basis:100%}
.stage{display:flex;justify-content:center;padding:16px 8px 60px}
.dev{width:1180px;max-width:100%;container-type:inline-size;background:var(--citui-bg);border:1px solid var(--citui-line);border-radius:10px;overflow:hidden;position:relative;min-height:760px}
body[data-size=mobile] .dev{width:390px;min-height:800px}
/* ── admin shell ── */
.shell{display:grid;grid-template-columns:1fr;min-height:inherit}
.side{display:none}
.top{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border-bottom:1px solid var(--citui-line);background:var(--citui-panel)}
.top .crumb{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb small{font-weight:400;color:var(--citui-muted)}
.main{padding:16px 16px 84px;min-width:0}
.bnav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);height:60px;border-top:1px solid var(--citui-line);background:var(--citui-panel)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--citui-muted);text-decoration:none;cursor:pointer}
.bnav a.on{color:var(--citui-ink)}
.bnav a.on svg{color:var(--citui-cyan-500)}
@container (min-width:900px){
  .shell{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;background:var(--citui-side);border-right:1px solid var(--citui-line);padding:12px 8px}
  .side .brand{display:flex;gap:8px;align-items:center;padding:4px 8px 12px}
  .side .brand b{display:block;font-size:14px}
  .side .brand small{display:block;color:var(--citui-muted);font-weight:400;font-size:11px}
  .side .g{font-size:11px;color:var(--citui-muted);font-weight:600;padding:12px 8px 4px}
  .side a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;color:var(--citui-ink);text-decoration:none;cursor:pointer}
  .side a:hover{background:var(--citui-hover)}
  .side a.on{background:var(--citui-accent-soft);font-weight:600}
  .side a .n{margin-left:auto;font-size:11px;color:var(--citui-muted)}
  .side a .pip{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--citui-warn)}
  .bnav{display:none}
  .top{padding:0 24px}
  .main{padding:28px 32px 40px}
  .mob-only{display:none!important}
}
@container (max-width:899px){.desk-only{display:none!important}}
/* ── primitives ── */
.ph h1{font:600 22px/1.2 var(--citui-font-display);margin:0 0 4px}
.ph p{margin:0 0 16px;color:var(--citui-muted)}
@container (min-width:900px){.ph h1{font-size:28px}}
.card{background:var(--citui-panel);border:1px solid var(--citui-line);border-radius:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--citui-line-strong);background:var(--citui-panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--citui-ink)}
.btn:hover{background:var(--citui-hover)}
.btn--p{background:var(--citui-cyan-500);border-color:var(--citui-cyan-500);color:var(--citui-accent-ink)}
.btn--p:hover{background:var(--citui-cyan-400)}
.btn--lg{padding:12px 18px;font-size:15px}
.btn--ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--citui-ink)}
.ib:hover{background:var(--citui-hover)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-done{color:var(--citui-ok-ink);background:var(--citui-ok-soft)}
.st-part,.st-miss{color:var(--citui-warn-ink);background:color-mix(in srgb,var(--citui-warn) 16%,transparent)}
.st-miss{color:var(--citui-bad-ink);background:color-mix(in srgb,var(--citui-bad) 12%,transparent)}
.st-opt,.st-decl{color:var(--citui-muted);background:var(--citui-hover)}
.muted{color:var(--citui-muted)}
.help{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--citui-link-ink);text-decoration:none;cursor:pointer}
.help:hover{text-decoration:underline}
.bar{height:6px;border-radius:999px;background:var(--citui-hover);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--citui-ok);border-radius:999px;transition:width .4s}
/* status icon (ring) */
.sic{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.sic.done{background:var(--citui-ok);color:var(--citui-white)}
.sic.part{border:2px solid var(--citui-warn);background:linear-gradient(90deg,var(--citui-warn) 50%,transparent 50%)}
.sic.miss{border:2px dashed var(--citui-bad)}
.sic.opt,.sic.decl{border:2px solid var(--citui-line-strong)}
/* ── wizard (shared engine, mounted by each variant) ── */
.wz-back{position:absolute;inset:0;z-index:30;background:color-mix(in srgb,var(--citui-navy-950) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.wz{background:var(--citui-panel);width:100%;max-height:96%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
@container (min-width:900px){.wz-back{align-items:center}.wz{width:760px;border-radius:12px;max-height:88%;display:grid;grid-template-columns:220px 1fr}}
.wz__steps{display:none}
@container (min-width:900px){
  .wz__steps{display:block;background:var(--citui-side);border-right:1px solid var(--citui-line);padding:18px 14px}
  .wz__steps h3{margin:0 0 2px;font-size:14px}
  .wz__steps ol{list-style:none;margin:14px 0 0;padding:0}
  .wz__steps li{display:flex;gap:8px;align-items:center;padding:6px 4px;color:var(--citui-muted)}
  .wz__steps li.on{color:var(--citui-ink);font-weight:600}
  .wz__steps li.ok{color:var(--citui-ok-ink)}
  .wz__steps li b{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none}
  .wz__steps li.ok b{background:var(--citui-ok);border-color:var(--citui-ok);color:var(--citui-white)}
}
.wz__body{display:flex;flex-direction:column;min-height:0}
.wz__h{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.wz__h .t{flex:1;font-weight:600}
.wz__prog{padding:8px 16px 0}
.wz__c{padding:12px 16px 16px;overflow:auto;flex:1}
.wz__c h2{font:600 19px/1.25 var(--citui-font-display);margin:4px 0 6px}
.wz__c p.lead{margin:0 0 14px;color:var(--citui-muted);font-size:14px}
.wz__f{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--citui-line);background:var(--citui-panel)}
.wz__f .sp{flex:1}
.field{display:block;margin:10px 0}
.field>span{display:block;font-weight:600;margin-bottom:4px}
.field input[type=text],.field input[type=email],.field input[type=url],.field select{width:100%;padding:11px 12px;border:1px solid var(--citui-line-strong);border-radius:6px;background:var(--citui-field);font-size:15px}
.field input.bad{border-color:var(--citui-bad)}
.err{color:var(--citui-bad-ink);font-size:12px;margin-top:4px}
.okmsg{color:var(--citui-ok-ink);font-size:12px;margin-top:4px}
.hint{color:var(--citui-muted);font-size:12px;margin-top:4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--citui-line-strong);border-radius:8px;margin:8px 0;cursor:pointer;background:var(--citui-panel)}
.opt:hover{background:var(--citui-hover)}
.opt.on{border-color:var(--citui-cyan-500);background:var(--citui-accent-soft)}
.opt input{margin-top:3px}
.opt b{display:block}
.opt small{color:var(--citui-muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--citui-line-strong);border-radius:8px;overflow:hidden}
.stepper button{width:46px;height:46px;border:0;background:var(--citui-field);font-size:20px;cursor:pointer}
.stepper output{min-width:64px;text-align:center;font-size:18px;font-weight:600}
.howto{counter-reset:h;list-style:none;padding:0;margin:8px 0}
.howto li{counter-increment:h;position:relative;padding:6px 0 6px 30px}
.howto li:before{content:counter(h);position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;background:var(--citui-accent-soft);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.box{border:1px solid var(--citui-line);border-radius:8px;padding:12px;background:var(--citui-surface)}
.box--ok{border-color:color-mix(in srgb,var(--citui-ok) 45%,transparent);background:var(--citui-ok-soft)}
.box--warn{border-color:color-mix(in srgb,var(--citui-warn) 45%,transparent);background:color-mix(in srgb,var(--citui-warn) 10%,transparent)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--citui-line-strong);border-top-color:var(--citui-cyan-500);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--citui-navy-900);color:var(--citui-ink-inverse);padding:9px 14px;border-radius:8px;z-index:40;font-size:13px;box-shadow:var(--citui-shadow-md);max-width:90%}
/* reminder preview (shared) */
.rem{margin-top:18px}
.rem h3{margin:0 0 6px;font-size:14px}
.sms{max-width:300px;background:var(--citui-hover);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:13px;margin:6px 0}
.mail{border:1px solid var(--citui-line);border-radius:8px;padding:10px 12px;font-size:13px;margin:6px 0;background:var(--citui-panel)}
.mail .subj{font-weight:600;margin-bottom:4px}
.tag-mock{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--citui-muted)}

@media (max-width:700px){.wz-back{position:fixed}.toast{position:fixed}.stage{padding:0}.dev{border:0;border-radius:0}}
.btn--sm{padding:4px 9px;font-size:12px}
body[data-size=desktop] .wz-back{position:fixed}
.wz-back{z-index:60}
@media (max-width:700px){.mk{position:static}}

.bstrip{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px}
.bstrip__t{flex:1 1 260px}
.bstrip__chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.bstrip>.btn{flex:1 1 100%;justify-content:center}
@container (min-width:900px){.bstrip>.btn{flex:0 0 auto}.bstrip__chips{order:3}}

// ── status: one predicate per module, from the data the server already holds ───
// st: done (kész) · part (félkész) · miss (hiányzik) · decl (Ön döntött így) · opt (nem kötelező)
/* MODS comes from the registry (registry.js) — one list, no hand-made copy. */

function status(id) {
  const s = S;
  switch (id) {
    case "rooms": {
      const noCap = s.units.filter((u) => !u.cap);
      if (!noCap.length) return { st: "done", line: s.units.length === 1 ? (s.units[0].whole ? "Egészben adja ki" : "1 szoba") + " · " + s.units[0].cap + " fő" : s.units.length + " szoba" };
      return { st: "part", line: noCap.map((u) => u.name).join(", ") + ": nincs megadva, hány fő fér el", miss: ["férőhely"] };
    }
    case "pricing": {
      // unitPriceStatus: complete | on_request | partial | none
      const st = s.units.map((u) => (u.por ? "on_request" : u.base ? "complete" : "none"));
      if (st.every((x) => x === "complete")) return { st: "done", line: s.units.map((u) => ft(u.base) + " / éj").join(", ") + " · min. " + s.minNights + " éj" };
      if (st.every((x) => x === "on_request")) return { st: "decl", line: "Ár kérésre — a vendég végösszeg helyett árajánlatot kér", miss: [] };
      if (st.every((x) => x === "none")) return { st: "miss", line: "Nincs ár — a vendég nem lát végösszeget, csak ajánlatot kérhet", miss: ["ár/éj"] };
      return { st: "part", line: s.units.filter((u, i) => st[i] === "none").length + " szobának nincs ára", miss: ["ár/éj"] };
    }
    case "calendar": {
      const c = s.cal;
      const bad = Object.keys(c.links).filter((k) => !c.links[k].ok);
      if (bad.length) return { st: "part", line: PORTALS[bad[0]].name + ": a link nem működik", miss: ["link"] };
      if (!c.asked) return { st: "miss", line: "Még nem mondta meg, hol hirdet még — dupla foglalás jöhet", miss: ["portálok"] };
      if (!c.portals.length) return { st: "done", line: "Csak itt hirdet — nincs mit összekötni" };
      const missing = c.portals.filter((p) => !c.links[p]);
      if (missing.length) return { st: "part", line: missing.map((p) => PORTALS[p].name).join(", ") + ": még nincs összekötve", miss: missing };
      const days = c.portals.reduce((a, p) => a + (c.links[p].days || 0), 0);
      return { st: "done", line: c.portals.map((p) => PORTALS[p].name).join(", ") + " összekötve · " + days + " foglalt nap beolvasva" };
    }
    case "booking": {
      if (!s.rulesAnswered) return { st: "part", line: "Még nem nézte át: legkevesebb éj, kinek szóljunk a kérésről", miss: ["szabályok"] };
      return { st: "done", line: "Legalább " + s.minNights + " éj · értesítés: " + (s.notify || "a fiókja e-mail címére") };
    }
    case "hours":
      return s.hours ? { st: "done", line: "Érkezés " + s.hours.inFrom + "–" + s.hours.inTo + " · távozás " + s.hours.outUntil + "-ig" } : { st: "miss", line: "Nincs megadva — az oldalon ez a rész most nem jelenik meg", miss: ["időpontok"] };
    case "amenities":
      return s.amenities ? { st: "done", line: s.amenities + " tétel látszik az oldalon" } : { st: "miss", line: "Üres — az oldalon ez a rész most nem jelenik meg", miss: ["tételek"] };
    case "email":
      if (!s.email) return null; // module not held → no row
      if (s.domain !== "live") return { st: "opt", line: "A saját webcímével együtt indul (" + s.email.localPart + "@…)" };
      return s.email.forwardTo ? { st: "done", line: s.email.localPart + "@" + s.host + " → " + s.email.forwardTo } : { st: "part", line: "Hová továbbítsuk a leveleket? — nincs megadva", miss: ["cím"] };
    case "photos":
      return s.photos.own ? { st: "done", line: s.photos.n + " saját fotó" } : { st: "opt", line: s.photos.n + " bemutató kép · ha szeretné, feltölthet sajátot" };
    case "reviews":
      return s.reviews.collect ? { st: "done", line: "Gyűjtés bekapcsolva · " + (s.reviews.n ? s.reviews.n + " vélemény" : "még nincs vélemény") } : { st: "opt", line: "A vendég írhat véleményt — Ön hagyja jóvá" };
    case "texts":
      return s.intro ? { st: "done", line: "A bemutatkozó szöveg kész" } : { st: "miss", line: "Írja meg a bemutatkozó szöveget", miss: ["szöveg"] };
  }
  return null;
}
const ST_LABEL = { done: "Kész", part: "Félkész", miss: "Hiányzik", decl: "Ön döntött így", opt: "Nem kötelező" };
const chip = (st) => '<span class="chip st-' + st + '"><i></i>' + ST_LABEL[st] + "</span>";
const sic = (st) => '<span class="sic ' + st + '">' + (st === "done" ? ic("check", 13) : "") + "</span>";
function rows() {
  return MODS.map((m) => ({ m: m, s: status(m.id) })).filter((r) => r.s);
}
function openRows() {
  return rows().filter((r) => r.s.st === "miss" || r.s.st === "part");
}
function counts() {
  const r = rows();
  const counted = r.filter((x) => x.s.st !== "opt");
  const done = counted.filter((x) => x.s.st === "done" || x.s.st === "decl").length;
  return { done: done, all: counted.length, open: openRows().length };
}
// "Can a guest book?" — the one sentence the owner cares about (ADR-0208 wording).
function guestSentence() {
  const p = status("pricing").st;
  const r = status("rooms").st;
  if (r !== "done") return "A vendég még nem látja, hány fő fér el a szálláson.";
  if (p === "miss" || p === "part") return "A vendég most nem lát végösszeget — foglalás helyett árajánlatot kér.";
  const cal = S.modules && S.modules.includes("booking") ? status("calendar").st : "done";
  const calWarn = cal === "miss" || cal === "part" ? " A portálos foglalások itt még nem látszanak — dupla foglalás jöhet." : "";
  if (p === "decl") return "A vendég árajánlatot kér — így döntött (ár kérésre)." + calWarn;
  return "A vendég végösszeget lát és foglalni tud." + calWarn;
}

function normPrice(raw) {
  // Same tolerance the price field gives: spaces, dots, "Ft" are fine; decimals are not.
  const s = String(raw || "").replace(/ft|huf/gi, "").replace(/[\s. ]/g, "");
  if (!s) return { val: null, err: null };
  if (!/^\d+$/.test(s)) return { val: null, err: "Csak számot írjon (pl. 35 000)." };
  const v = Number(s);
  if (v < 1000) return { val: v, err: "Ez nagyon kevés egy éjszakára — biztos, hogy forintban írta?" };
  if (v > 2000000) return { val: v, err: "Ez szokatlanul sok egy éjszakára — nézze meg a nullákat." };
  return { val: v, err: null };
}
function checkFeed(k, raw) {
  // sync.ts: webcal:// → https://, then it must be a web address; the portal check is the plan's addition.
  const v = String(raw || "").trim().replace(/^webcal:\/\//i, "https://");
  if (!v) return "Hiányzik a link.";
  let u;
  try { u = new URL(v); } catch (e) { return "A link nem érvényes webcím."; }
  if (!/^https?:$/.test(u.protocol)) return "A link nem érvényes webcím.";
  if (!PORTALS[k].host.test(u.hostname)) return "Ez nem " + PORTALS[k].name + "-link. A " + PORTALS[k].name + " naptár-exportját másolja ide.";
  if (k === "airbnb" && !/\.ics$/i.test(u.pathname)) return "Az Airbnb naptár-linkje .ics-re végződik — a „Export calendar” linket másolja.";
  return null;
}
function opt(name, value, cur, title, small) {
  return '<label class="opt' + (cur === value ? " on" : "") + '"><input type="radio" name="' + name + '" value="' + value + '"' + (cur === value ? " checked" : "") + "><span><b>" + title + "</b><small>" + small + "</small></span></label>";
}
function stepper(k, v, min, max) {
  return '<div class="stepper" data-min="' + min + '" data-max="' + max + '"><button type="button" data-d="-1" aria-label="Kevesebb">−</button><output data-k="' + k + '">' + v + '</output><button type="button" data-d="1" aria-label="Több">+</button></div>';

function sel(k, label, v) {
  const hrs = [];
  for (let h = 6; h <= 23; h++) hrs.push((h < 10 ? "0" : "") + h + ":00");
  return '<label class="field"><span>' + label + '</span><select data-k="' + k + '">' + hrs.map((x) => "<option" + (x === v ? " selected" : "") + ">" + x + "</option>").join("") + "</select></label>";
}
function bindCommon(root) {
  root.addEventListener("change", () => { const g = root.querySelector("[data-gerr]"); if (g) g.textContent = ""; });
  root.querySelectorAll(".stepper").forEach((st) => st.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {

    o.textContent = n;
  })));

// Guide runner — the container (modal / inline panel / full screen) is the variant's choice.
// Progress (draft + step) survives closing: „bezárható, később folytatható”.
function guideState(id) {
  return store.get(skey("guide-" + id)) || { step: 0 };
}
function visibleSteps(id, d) {
  return GUIDES[id].steps.filter((s) => !(s.skipIf && s.skipIf(d)));
}
function renderGuideBody(id, host, opts) {
  const g = GUIDES[id];
  const d = draftOf(id);
  const gs = guideState(id);
  const steps = visibleSteps(id, d);
  const i = Math.min(gs.step, steps.length - 1);
  const s = steps[i];
  host.innerHTML =
    '<div class="tag-mock">' + (opts.kicker || g.title) + " · " + (i + 1) + ". lépés / " + steps.length + "</div>" +
    "<h2>" + esc(s.t) + "</h2>" + '<p class="lead">' + esc(s.lead) + "</p>" +
    '<div data-step>' + s.render(d) + "</div>" +
    '<div class="err" data-gerr></div>' +
    '<p class="hint" style="margin-top:14px">' + esc(g.why) + ' <a class="help" data-kb="' + (MODS.find((m) => m.id === id) || {}).kb + '">' + ic("help", 14) + "Részletesen a súgóban</a></p>";
  bindCommon(host);
  if (s.bind) s.bind(host, d);
  return {
    steps: steps, i: i,
    next() {
      const err = s.read(host, d);
      saveDraft(id, d);
      host.querySelector("[data-gerr]").textContent = err || "";
      if (err) return "err";
      if (g.applyEach) { g.apply(d); persistSample(); } // per-unit topics save every answer at once
      const st2 = visibleSteps(id, d);
      if (i + 1 >= st2.length) {
        g.apply(d);
        store.set(skey("guide-" + id), { step: 0, done: true });
        persistSample();
        return { done: g.done(d) };
      }
      store.set(skey("guide-" + id), { step: i + 1 });
      return "next";
    },
    back() {
      s.read(host, d); saveDraft(id, d);
      store.set(skey("guide-" + id), { step: Math.max(0, i - 1) });
    },
  };
}
function stepTitles(id) {
  return visibleSteps(id, draftOf(id)).map((s) => s.t);
}

function stLetting() {

  return { st: ok ? "part" : "miss", line: (b.length === 1 ? "Nincs megadva, hány fő fér el" : ok + "/" + b.length + " " + word() + " van férőhelye"), miss: ["férőhely"] };

function stPrice() {

  if (!S.amenities) return { st: "miss", line: "Üres — az oldalon ez a rész most nem jelenik meg", miss: ["tételek"] };
  if (per !== null && per < roomsOf().length) return { st: "part", line: site + " · " + per + "/" + roomsOf().length + " szobánál saját felszereltség", miss: ["szobák"] };
  return { st: "done", line: site + (per !== null ? " · minden szobánál saját is" : "") };
}
function guestSentence() {
  const l = stLetting();
  if (l.st === "miss") return "A vendég még nem tudja, a házat vagy egy szobát foglal.";
  if (l.st === "part") return "A szobái a honlapon még nem látszanak.";
  if (holds("rooms") || holds("booking")) { const c = stCap(); if (c.st !== "done") return "A vendég még nem látja, hány fő fér el."; }
  if (!holds("pricing")) return "A vendég időpontot kér Öntől (árat a csomagja nem mutat).";
  const p = stPrice().st;
  const calWarn = holds("booking") && (status("calendar").st === "miss" || status("calendar").st === "part") ? " A portálos foglalások itt még nem látszanak — dupla foglalás jöhet." : "";
  if (p === "miss" || p === "part") return "A vendég nem lát végösszeget — foglalás helyett árajánlatot kér." + calWarn;
  if (p === "decl") return "A vendég árajánlatot kér — így döntött (ár kérésre)." + calWarn;
  return "A vendég végösszeget lát és foglalni tud." + calWarn;

  if (!errs.length) return head + "✓ module-setup-registry-check: " + nCat + " eladható modul · " + nReg + " bejegyzés · " + Object.keys(EXEMPT).length + " kivétel (indokkal) · 0 hiba\n  önteszt: 10/10 szintetikus sértés pirosat adott (①②③④⑤⑥⑧⑨⑩⑪)";
  return head + "✗ module-setup-registry-check: " + errs.length + " hiba — a land MEGÁLL\n" + errs.map((e, i) => "  " + e[0] + " " + e[1] + "\n     Javítás: " + e[2]).join("\n") + "\n[land] ✗ kapu bukott: module-setup-registry-check — nincs push.";
}

/* Round 2 — one design: first login → C wizard (all open guided items, live guest preview);
   "Később folytatom" / done → B tiles + overview strip; module page = steps embedded.
   Everything is driven by the registry (registry.js). */
"use strict";
// Sample facts the registry rules need beyond round 1 (prod, read-only, 2026-11-05).
SAMPLES.duna.modules = ["amenities", "booking", "enquiry", "gallery", "hours", "location", "poi", "pricing", "reviews", "rooms", "usp"];
SAMPLES.duna.geo = true;
SAMPLES.marilyn.modules = ["amenities", "booking", "email", "enquiry", "gallery", "hours", "location", "poi", "pricing", "reviews", "rooms", "usp"];
SAMPLES.marilyn.geo = true;
SAMPLES.marilyn.poiAuto = true;

let K_MOD = null;
let K_PREV = false;
let K_WIZ = false;
let K_PANEL = false;
let K_TOPICS = false;

const isOpen = (st) => st === "miss" || st === "part";
function guidedOpen() { return rows().filter((r) => isOpen(r.s.st) && hasGuide(r.m.id)); }
const titleOf = (id) => (GUIDES[id] ? GUIDES[id].title : (LANDED.find((e) => e.id === id) || {}).title || id);
// ── the walk: EVERY purchased topic (tulaj, 11-06), in the graph's order ──────────────
function kQueue() { return MODS.filter((m) => inWalk(m.id)).map((m) => m.id); }
function stOf(id) { const r = rows().find((x) => x.m.id === id); return r ? r.s.st : "done"; }
function skippedList() { return store.get(skey("skipped")) || []; }
// passed = done / own decision, or an optional topic the owner chose to skip
function kPassed(id) { const st = stOf(id); return st === "done" || st === "decl" || (st === "opt" && skippedList().includes(id)); }
function kDone(id) { const st = stOf(id); return st === "done" || st === "decl"; }
function lockOf(id) { const e = LANDED.find((x) => x.id === id); return e ? topicLock(e) || moduleLock(e) : null; }
function kCur() {
  const f = store.get(skey("focus"));
  if (f && kQueue().includes(f) && !lockOf(f)) return f;
  const q = kQueue(), sk = skippedList();
  return q.find((id) => !kPassed(id) && !lockOf(id) && !sk.includes(id)) || q.find((id) => !kPassed(id) && !lockOf(id)) || null;
}
function kFocus(id, step) { store.set(skey("focus"), id); store.set(skey("guide-" + id), { step: step || 0 }); }
function kPrevOf(id) { const q = kQueue(); for (let i = q.indexOf(id) - 1; i >= 0; i--) if (!lockOf(q[i])) return q[i]; return null; }
function lockLine(l) {
  if (l.need) return "Ehhez kell: " + l.need.map((m) => MOD_NAME[m] + " modul (" + PRICE[m] + " Ft/hó)").join(", ");
  return l.why;
}
function kWalkLeft() { return kQueue().some((id) => !kPassed(id)); }

function kPreview() {
  const b = bookable();
  const p = holds("pricing") ? stPrice().st : null;
  const busy = S.cal.links.szallas && S.cal.links.szallas.days;
  const unitRow = (u) => '<div class="cp__u"><b>' + esc(u.name) + '</b><span>' + (u.cap ? "max. " + u.cap + " fő" : (holds("rooms") || holds("booking") ? '<span class="cp__miss">férőhely: —</span>' : "")) + "</span><span>" + (!holds("pricing") ? "" : u.por ? "árajánlat" : u.base ? ft(u.base) + " / éj" : '<span class="cp__miss">nincs ár</span>') + "</span></div>";
  const units = S.letting === "rooms" && !holds("rooms") ? '<div class="cp__miss" style="font-size:12px">A szobák a Szobák modul nélkül nem látszanak — a vendég az egész szállásra kér időpontot.</div>' : b.map(unitRow).join("") + (roomsOf().length ? '<div class="muted" style="font-size:11px">+ az egész ház egyben (árajánlat)</div>' : "");
  return '<div class="cp"><div class="tag-mock">Így látja a vendég · ' + esc(S.host) + '</div><div class="cp__card"><b>' + esc(S.name) + "</b>" +
    '<div class="cp__units">' + (S.letting ? units : '<div class="cp__miss" style="font-size:12px">Még nem tudni: a házat vagy egy szobát foglal?</div>') + "</div>" +
    (holds("booking") ? '<div class="cp__cal">' + Array.from({ length: 14 }, (_, i) => '<i class="' + (busy && i % 5 === 3 ? "b" : "") + '">' + (i + 1) + "</i>").join("") + "</div>" : "") +
    '<div class="muted" style="font-size:12px">' + (holds("hours") ? (S.hours ? "Érkezés " + S.hours.inFrom + "–" + S.hours.inTo + " · távozás " + S.hours.outUntil + "-ig" : '<span class="cp__miss">Érkezés / távozás: —</span>') : "") + "</div>" +
    '<span class="btn btn--p" style="margin-top:8px;width:100%;justify-content:center">' + (!holds("booking") ? "Időpontot kérek" : p === "done" ? "Foglalási kérés elküldése" : "Árajánlatot kérek") + "</span></div></div>";
}

// ── C: the full-screen first-login walk ────────────────────────────────────────────
function kRail(id) {
  return "<ol>" + kQueue().map((x, i) => {
    const lk = !kDone(x) && lockOf(x);
    const st = stOf(x);
    const cls = x === id ? "on" : kDone(x) ? "ok" : lk ? "lk" : st === "opt" ? "op" : "";
    const sub = x === id ? "" : lk ? esc(lockLine(lk)) : kDone(x) ? "Kész — szerkeszthető" : st === "opt" ? (skippedList().includes(x) ? "Kihagyva — nem kötelező" : "Nem kötelező") : "";
    const inner = "<b>" + (kDone(x) && x !== id ? "✓" : lk ? ic("lock", 12) : i + 1) + "</b><span>" + esc(titleOf(x)) + (sub ? "<small>" + sub + "</small>" : "") + "</span>";
    return '<li class="' + cls + '">' + (lk || x === id ? inner : '<button type="button" data-jump="' + x + '">' + inner + "</button>") + "</li>";
  }).join("") + "</ol>";
}
function kWizard() {
  const q = kQueue();
  const id = kCur();
  const passedN = q.filter(kPassed).length;
  const top = '<div class="cf__top"><b>Állítsuk be együtt</b><span class="muted desk-only">&nbsp;· ' + q.length + ' téma — az összes megvett modul</span><span class="sp"></span><button class="btn btn--ghost btn--sm" data-later>Később folytatom</button></div>';
  const waiting = q.filter((x) => !kPassed(x) && lockOf(x));
  if (!id) return '<div class="cf">' + top + '<div class="cf__grid"><nav class="cf__rail desk-only">' + kRail(null) + '</nav><div class="cf__q">' + (waiting.length ? '<div class="box box--warn"><h2 style="margin:0 0 6px">Ezek még várnak</h2>' + waiting.map((x) => "<div><b>" + esc(titleOf(x)) + "</b> — " + esc(lockLine(lockOf(x))) + "</div>").join("") + "</div>" : '<div class="box box--ok"><h2 style="margin:0 0 6px">Kész — minden témán végigment.</h2>' + esc(guestSentence()) + "</div>") + '<p class="hint">Bármelyik témára kattintva újra szerkesztheti.</p><div class="mob-only">' + kRail(null) + '</div><button class="btn btn--p btn--lg" data-exit style="margin-top:14px">Tovább a honlapom adminjába</button></div><aside class="cf__pv desk-only">' + kPreview() + "</aside></div></div>";
  const e = LANDED.find((x) => x.id === id);
  const page = e.setup.kind === "page";
  const gs = guideState(id);
  const titles = page ? [e.setup.label] : stepTitles(id);
  const st = stOf(id);
  const prev = gs.step > 0 || kPrevOf(id);
  return '<div class="cf">' + top +
    '<div class="cf__prog mob-only"><button type="button" class="cf__topics" data-topics>' + (q.indexOf(id) + 1) + ". téma / " + q.length + " · " + esc(titleOf(id)) + " · " + (gs.step + 1) + "/" + titles.length + ' <span>Témák ▾</span></button><div class="bar"><i style="width:' + Math.round(((passedN + (gs.step + 1) / titles.length) / q.length) * 100) + '%"></i></div>' + (K_TOPICS ? '<div class="cf__rail cf__rail--m">' + kRail(id) + "</div>" : "") + "</div>" +
    '<div class="cf__grid"><nav class="cf__rail desk-only">' + kRail(id) + "</nav>" +
    '<div class="cf__q">' + (st === "opt" ? '<span class="chip st-opt"><i></i>Nem kötelező</span>' : "") + "<div data-c></div>" +
    '<div class="cf__f">' + (prev ? '<button class="btn btn--ghost" data-b>' + ic("back", 16) + (gs.step > 0 ? "Vissza" : "Vissza: " + esc(titleOf(kPrevOf(id)))) + "</button>" : "") +
    '<button class="btn btn--ghost" data-skip>' + (st === "opt" ? "Most kihagyom" : "Kihagyom") + '</button><span class="sp"></span><button class="btn btn--p btn--lg" data-n>' + (page ? "Tovább" : gs.step + 1 >= titles.length ? "Mentés, tovább" : "Tovább") + "</button></div>" +
    '<button class="btn btn--ghost mob-only" data-prev style="margin-top:10px;width:100%;justify-content:center">' + ic("preview", 16) + (K_PREV ? "Előnézet elrejtése" : "Így látja a vendég") + "</button>" + (K_PREV ? '<div class="mob-only" style="margin-top:8px">' + kPreview() + "</div>" : "") + "</div>" +
    '<aside class="cf__pv desk-only">' + kPreview() + "</aside></div></div>";
}

// ── B: overview strip + tiles + module page ─────────────────────────────────────────
function kOverview() {
  const o = rows().filter((r) => isOpen(r.s.st));
  const c = counts();
  const q = kQueue();
  const walkLeft = kWalkLeft();
  const nx = kCur();
  const band = walkLeft
    ? '<button class="card cband" data-resume><div class="cband__t"><b>Beállítás: ' + q.filter(kPassed).length + " / " + q.length + ' téma kész</b><div class="muted">' + (nx ? "Következő: " + esc(titleOf(nx)) + " — " : "") + esc(guestSentence()) + '</div></div><span class="btn btn--p">Folytatom</span></button>'
    : '<button class="card cband cband--quiet" data-resume><div class="cband__t"><b>Beállítás: mind a ' + q.length + ' téma kész</b><div class="muted">Bármelyiket lépésenként átnézheti vagy módosíthatja.</div></div><span class="btn">Beállítás átnézése</span></button>';
  const strip = o.length
    ? '<section class="card bstrip"><div class="bstrip__t"><b>' + o.length + " modul vár beállításra</b><div class=\"muted\">" + esc(guestSentence()) + '</div></div><div class="bstrip__chips">' + o.map((r) => '<button class="bchip" data-open="' + r.m.id + '">' + sic(r.s.st) + esc(r.m.title) + "</button>").join("") + '</div><button class="btn' + (walkLeft ? "" : " btn--p") + '" data-go="modulok">Modulok (' + c.done + "/" + c.all + " kész) ›</button></section>"
    : '<section class="card bstrip"><div class="box box--ok" style="flex:1">Minden modul kész. ' + esc(guestSentence()) + "</div></section>";
  const todo = '<section class="card" style="margin-top:14px"><div style="padding:10px 16px;font-weight:600">Teendők <span class="muted" style="font-weight:400">' + (S.trial ? 1 : 0) + ' nyitott</span></div><ul class="ctodo">' +
    (S.trial ? "<li>" + sic("part") + "<span><b>Próba: még " + S.trial.left + " nap</b> <span class=\"muted\">— " + esc(S.trial.until) + "-ig fut, kártyát nem kértünk.</span></span></li>" : "") +
    "<li>" + sic("done") + '<span><b>Az oldala élő és nyilvános</b> <span class="muted">— ' + esc(S.host) + "</span></span></li></ul>" +
    '<div class="hint" style="padding:0 16px 12px">A modulok beállítása fent és a Modulok lapon él; itt a többi teendő marad (foglalási kérés, díj, élesítés).</div></section>';
  return band + '<div class="ph"><h1>Áttekintés</h1><p>Az oldala állapota egy képernyőn — ami teendő, az itt sorban áll.</p></div>' + strip + todo;
}
function kTiles() {
  const r = rows();
  const c = counts();
  const tile = (x) => {
    const g = hasGuide(x.m.id);
    const e = x.m.entry;
    const lk = isOpen(x.s.st) && lockOf(x.m.id);
    if (lk) return '<button class="bt bt--lock" data-open="' + (lk.need ? x.m.id : lk.topic) + '"><span class="bt__ic">' + ic("lock", 20) + '</span><span class="bt__b"><span class="bt__t">' + esc(x.m.title) + '</span><span class="chip st-opt"><i></i>Vár</span><span class="bt__l">' + esc(x.s.line) + '</span><span class="bt__cta">' + esc(lockLine(lk)) + " ›</span></span></button>";
    const cta = isOpen(x.s.st) ? (g ? (guideState(x.m.id).step ? "Folytatom (" + (guideState(x.m.id).step + 1) + "/" + stepTitles(x.m.id).length + ")" : "Beállítom lépésenként") : "Megnyitom: " + e.setup.label) : g ? "" : "";
    return '<button class="bt bt--' + x.s.st + (x.m.id === "faq" ? " bt--new" : "") + '" data-open="' + x.m.id + '"><span class="bt__ic">' + ic(x.m.icon, 20) + "</span>" +
      '<span class="bt__b"><span class="bt__t">' + esc(x.m.title) + "</span>" + chip(x.s.st) + '<span class="bt__l">' + esc(x.s.line) + "</span>" + (cta ? '<span class="bt__cta">' + cta + " ›</span>" : "") + "</span></button>";
  };
  const groups = [["Ami a foglaláshoz kell", r.filter((x) => x.m.forBooking)], ["Az oldal többi része", r.filter((x) => !x.m.forBooking)]];
  return '<div class="ph"><h1>Modulok</h1><p>' + c.done + " / " + c.all + " kész. " + esc(guestSentence()) + "</p></div>" +
    groups.map((g) => '<h2 class="bg">' + g[0] + '</h2><div class="btiles">' + g[1].map(tile).join("") + "</div>").join("");
}
function kFake(id) {
  const u = S.units[0];
  if (id === "pricing") return '<div class="ff"><span>' + esc(u.name) + "</span><span>" + (u.por ? "Ár kérésre" : u.base ? ft(u.base) + " / éj" : "— nincs ár —") + '</span></div><div class="ff"><span>Legkevesebb éj</span><span>' + S.minNights + "</span></div>";
  if (id === "rooms") return '<div class="ff"><span>' + esc(u.name) + "</span><span>" + (u.cap ? u.cap + " fő" : "— férőhely nincs —") + "</span></div>";
  if (id === "calendar") return S.cal.portals.length ? S.cal.portals.map((k) => '<div class="ff"><span>' + PORTALS[k].name + "</span><span>" + (S.cal.links[k] ? "összekötve · " + S.cal.links[k].last : "nincs link") + "</span></div>").join("") : '<div class="ff"><span>Hirdeti máshol is?</span><span>—</span></div>';
  if (id === "hours") return '<div class="ff"><span>Érkezés</span><span>' + (S.hours ? S.hours.inFrom + "–" + S.hours.inTo : "—") + '</span></div><div class="ff"><span>Távozás</span><span>' + (S.hours ? S.hours.outUntil : "—") + "</span></div>";
  if (id === "faq") return (S.faq || []).map((x) => '<div class="ff"><span>' + esc(x) + "</span><span>✓</span></div>").join("") || '<div class="ff"><span>Kérdések</span><span>—</span></div>';
  return '<div class="ff"><span>Beállítások</span><span>…</span></div>';
}
function kModule() {
  const x = rows().find((y) => y.m.id === K_MOD);
  const open = isOpen(x.s.st);
  const hidden = store.get(skey("hide-" + x.m.id));
  const gs = guideState(x.m.id);
  const lk = open && lockOf(x.m.id);
  // A walk in progress stays on screen to its last question, even if the status turned "Kész" meanwhile.
  const panel = lk
    ? '<section class="card box--warn" style="padding:14px"><b>' + esc(lockLine(lk)) + "</b>" + (lk.need ? '<div class="muted" style="margin-top:4px">' + esc(lk.why) + '</div><button class="btn btn--p" style="margin-top:10px" data-buy="' + lk.need.join(",") + '">Megrendelem</button>' : '<div style="margin-top:10px"><button class="btn btn--p" data-open="' + lk.topic + '">' + esc(GUIDES[lk.topic].title) + " ›</button></div>") + "</section>"
    : (open || (gs.step > 0 && !gs.done)) && !hidden
    ? '<section class="card bpanel"><div class="bpanel__h"><span class="tag-mock">Lépésenként</span><span class="sp"></span><button class="btn btn--ghost btn--sm" data-hide>Elrejtem</button></div><div class="bdots">' + stepTitles(x.m.id).map((t, i) => '<i class="' + (i < gs.step ? "ok" : i === gs.step ? "on" : "") + '" title="' + esc(t) + '"></i>').join("") + '</div><div data-c class="bpanel__c"></div><div class="bpanel__f">' + (gs.step ? '<button class="btn btn--ghost" data-b>' + ic("back", 16) + "Vissza</button>" : "") + '<span class="sp"></span><button class="btn btn--p btn--lg" data-n>' + (gs.step + 1 >= stepTitles(x.m.id).length ? "Mentés" : "Tovább") + "</button></div></section>"
    : open
      ? '<button class="card bresume" data-unhide>' + sic(x.s.st) + "<span><b>Lépésenkénti beállítás</b> — " + (gs.step ? gs.step + 1 + ". lépésnél tart" : "még nem kezdte el") + '</span><span class="sp"></span><span class="btn btn--sm">Folytatom</span></button>'
      : '<button class="card bresume" data-unhide>' + sic("done") + '<span><b>' + ST_LABEL[x.s.st] + ".</b> Lépésenként is átnézheti.</span><span class=\"sp\"></span><span class=\"btn btn--sm btn--ghost\">Átnézem</span></button>";
  return '<div class="ph"><h1>' + esc(x.m.title) + '</h1></div><div class="bhead">' + chip(x.s.st) + "<span>" + esc(x.s.line) + '</span><a class="help" data-kb="' + x.m.kb + '">' + ic("help", 14) + "Súgó</a></div>" +
    '<div class="bmod"><div class="bmod__side">' + panel + '</div><div class="card afake"><div class="tag-mock">A mai „' + esc(x.m.title) + '” képernyő változatlanul itt marad</div>' + kFake(x.m.id) + "</div></div>";
}
function kOpen(id) {
  if (!hasGuide(id)) { const e = LANDED.find((y) => y.id === id); toast("A(z) „" + e.setup.label + "” lapra visz (a mockban nincs)."); return; }
  K_MOD = id; VIEW = "modulok"; kRender();
}

// ── render ───────────────────────────────────────────────────────────────────────
function kGo(v) { VIEW = v; K_MOD = null; kRender(); }
function kRender(first) {
  const dev = document.querySelector(".dev");
  const pn = document.querySelector(".panel");
  pn.hidden = !K_PANEL;
  document.querySelector(".stage").hidden = K_PANEL;
  if (K_PANEL) {
    pn.innerHTML = kPanel();
    pn.querySelectorAll("[data-ex]").forEach((b) => b.addEventListener("click", () => { EXAMPLE = Number(b.dataset.ex); LANDED = gateRun(catalogNow(), registryNow(), kbNow()).length ? REGISTRY_BASE : registryNow(); kRender(); }));
    const t = pn.querySelector("[data-try]");
    if (t) t.addEventListener("click", () => kTryNew());
    return;
  }
  refreshMods();
  if (first && !store.get(skey("seen")) && kWalkLeft()) K_WIZ = true;
  if (K_WIZ) return kRenderWizard(dev);
  const inner = K_MOD ? kModule() : VIEW === "modulok" ? kTiles() : kOverview();
  const crumb = esc(S.name) + (VIEW === "modulok" ? " <small>› Modulok" + (K_MOD ? " › " + esc(MODS.find((m) => m.id === K_MOD).title) : "") + "</small>" : "");
  const n = rows().filter((r) => isOpen(r.s.st)).length;
  dev.innerHTML = shell(inner, crumb, { modulok: n ? '<span class="n">' + n + " vár</span>" : "" });
  bindNav(dev, kGo);
  dev.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => kOpen(b.dataset.open)));
  dev.querySelectorAll("[data-kb]").forEach((a) => a.addEventListener("click", () => toast("Súgó: „" + a.dataset.kb + "”")));
  dev.querySelectorAll("[data-buy]").forEach((b) => b.addEventListener("click", () => { S.modules = S.modules.concat(b.dataset.buy.split(",")); persistSample(); toast("Kosárba téve — a mockban megvettnek vesszük."); kRender(); }));
  const res = dev.querySelector("[data-resume]");
  if (res) res.addEventListener("click", () => { if (!kWalkLeft()) kFocus(kQueue()[0], 0); K_WIZ = true; kRender(); });
  const hide = dev.querySelector("[data-hide]");
  if (hide) hide.addEventListener("click", () => { store.set(skey("hide-" + K_MOD), true); kRender(); toast("Elrejtve — a lap tetején folytathatja."); });
  const un = dev.querySelector("[data-unhide]");
  if (un) un.addEventListener("click", () => { store.del(skey("hide-" + K_MOD)); if (guideState(K_MOD).done) store.set(skey("guide-" + K_MOD), { step: 0 }); kRender(); });
  const host = dev.querySelector(".bpanel [data-c]");
  if (host) {
    const id = K_MOD;
    const run = renderGuideBody(id, host, { kicker: GUIDES[id].title });
    const b = dev.querySelector(".bpanel [data-b]");
    if (b) b.addEventListener("click", () => { run.back(); kRender(); });
    dev.querySelector(".bpanel [data-n]").addEventListener("click", () => {
      const r = run.next();
      if (r === "err") return;
      if (r === "next") return kRender();
      store.set(skey("hide-" + id), true);
      kRender();
      const nxt = guidedOpen()[0];
      const side = document.querySelector(".bmod__side");
      side.insertAdjacentHTML("afterbegin", '<section class="card box--ok" style="padding:14px;margin-bottom:10px"><b>' + esc(r.done) + "</b>" + (nxt ? '<div style="margin-top:8px">Következő: <button class="btn btn--sm btn--p" data-open="' + nxt.m.id + '">' + esc(nxt.m.title) + " ›</button></div>" : '<div class="muted">Minden kész, ami beállítható.</div>') + "</section>");
      side.querySelectorAll("[data-open]").forEach((x) => x.addEventListener("click", () => kOpen(x.dataset.open)));
    });
  }
}
function kRenderWizard(dev) {
  dev.innerHTML = kWizard();
  const leave = (msg) => { K_WIZ = false; K_TOPICS = false; store.set(skey("seen"), true); store.del(skey("focus")); VIEW = "attekintes"; K_MOD = null; kRender(); if (msg) toast(msg); };
  dev.querySelectorAll("[data-exit]").forEach((b) => b.addEventListener("click", () => leave()));
  const later = dev.querySelector("[data-later]");
  if (later) later.addEventListener("click", () => leave("Elmentettük. Az Áttekintés tetején és a Modulok lapon folytathatja."));
  // jump to any reachable topic (done ones re-open with their saved values)
  dev.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => { kFocus(b.dataset.jump, 0); K_TOPICS = false; kRender(); }));
  const tp = dev.querySelector("[data-topics]");
  if (tp) tp.addEventListener("click", () => { K_TOPICS = !K_TOPICS; kRender(); });
  const pv = dev.querySelector("[data-prev]");
  if (pv) pv.addEventListener("click", () => { K_PREV = !K_PREV; kRender(); });
  const id = kCur();
  if (!id) return;
  const e = LANDED.find((x) => x.id === id);
  const finish = (msg) => {
    store.del(skey("focus"));
    const sk = skippedList().filter((x) => x !== id);
    store.set(skey("skipped"), sk);
    kRender();
    if (msg) toast(msg);
  };
  const goPrev = () => { const p = kPrevOf(id); if (!p) return; const pe = LANDED.find((x) => x.id === p); kFocus(p, pe.setup.kind === "guide" ? stepTitles(p).length - 1 : 0); kRender(); };
  const skip = () => {
    store.set(skey("skipped"), skippedList().filter((x) => x !== id).concat(id));
    store.del(skey("focus"));
    const dep = kQueue().filter((x) => x !== id && (LANDED.find((y) => y.id === x).requires || []).some((r) => r.topic === id)).map(titleOf);
    toast((stOf(id) === "opt" ? "Kihagyva (nem kötelező): " : "A végére tettük: ") + titleOf(id) + (dep.length ? " — erre vár: " + dep.join(", ") : ""));
    kRender();
  };
  dev.querySelector("[data-skip]").addEventListener("click", skip);
  if (e.setup.kind === "page") {
    const host = dev.querySelector("[data-c]");
    host.innerHTML = '<div class="tag-mock">' + esc(e.title) + '</div><h2>' + esc(e.title) + '</h2><p class="lead">Ezt a meglévő „' + esc(e.setup.label) + '” lapon állítja be — megnyitjuk, és onnan ide tér vissza a következő témához.</p><div class="box">' + esc(stOf(id) === "done" || stOf(id) === "decl" ? rows().find((r) => r.m.id === id).s.line : "Még nincs beállítva.") + '</div><button type="button" class="btn btn--p" style="margin-top:12px" data-openpage>Megnyitom: ' + esc(e.setup.label) + "</button>";
    host.querySelector("[data-openpage]").addEventListener("click", () => openPageAndReturn(e, () => finish("Vissza a beállításhoz.")));
    const b = dev.querySelector("[data-b]");
    if (b) b.addEventListener("click", goPrev);
    dev.querySelector("[data-n]").addEventListener("click", () => finish());
    return;
  }
  const run = renderGuideBody(id, dev.querySelector("[data-c]"), { kicker: titleOf(id) });
  const b = dev.querySelector("[data-b]");
  if (b) b.addEventListener("click", () => { if (guideState(id).step > 0) { run.back(); kRender(); } else goPrev(); });
  dev.querySelector("[data-n]").addEventListener("click", () => {
    const r = run.next();
    if (r === "err") return;
    if (r === "next") return kRender();
    finish(r.done);
  });
}
function kTryNew() {
  // Example: Marilyn bought the new module; fresh first login.
  resetAll();
  loadSample("marilyn");
  S.modules = S.modules.concat(["faq"]);
  persistSample();
  K_PANEL = false; K_WIZ = false; VIEW = "attekintes"; K_MOD = null;
  document.querySelectorAll(".mk [data-panel]").forEach((x) => x.classList.remove("on"));
  kRender(true);
}
