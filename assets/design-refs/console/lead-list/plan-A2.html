<title>Lead-lista — A változat — vezérlők a fejlécben</title>
<style>
:root{
  --citui-navy-950:#0a1f36;--citui-navy-900:#0e2a47;--citui-navy-800:#16283f;--citui-navy-700:#203a59;
  --citui-cyan-500:#1fb6d6;--citui-cyan-400:#35c4e0;--citui-cyan-300:#6fd8eb;--citui-white:#fff;
  --citui-ink:#10243a;--citui-ink-inverse:#eaf3f8;--citui-muted:#60748b;
  --citui-surface:#f6fbfd;--citui-surface-2:#eef7fa;
  --citui-line:rgba(14,42,71,.12);--citui-line-strong:rgba(14,42,71,.22);
  --citui-ok:#2fa96b;--citui-ok-soft:#e7f8ef;--citui-warn:#d29922;--citui-bad:#e5484d;
  --citui-ok-ink:#19733f;--citui-bad-ink:#b3262b;--citui-warn-ink:#7d5a12;--citui-link-ink:#10697a;
  --citui-shadow-sm:0 10px 30px rgba(14,42,71,.08);--citui-shadow-md:0 24px 60px rgba(14,42,71,.14);
  --citui-radius-sm:14px;--citui-radius:22px;--citui-radius-pill:999px;
  --citui-font-display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --citui-font-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#dfe9f0;font-family:var(--citui-font-text);color:var(--citui-ink)}

/* ── draft chrome (NOT part of the design) ─────────────────────────────── */
.sizebar{position:sticky;top:0;z-index:99;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:10px 14px;background:var(--citui-navy-950);color:var(--citui-ink-inverse);font-size:13px}
.sizebar button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:6px 14px;
  border:1px solid rgba(255,255,255,.28);background:transparent;color:inherit}
.sizebar button.on{background:var(--citui-cyan-400);color:var(--citui-navy-950);border-color:transparent}
.sizebar .note{opacity:.8}
.stage{display:flex;justify-content:center;padding:18px 10px 40px}
.frame{container-type:inline-size;width:100%;max-width:1280px;background:var(--citui-surface);
  border-radius:12px;overflow:visible;box-shadow:var(--citui-shadow-md)}
body.m .frame{width:390px}

/* ── console shell ─────────────────────────────────────────────────────── */
.topnav{display:flex;align-items:center;gap:18px;padding:12px 16px;border-radius:12px 12px 0 0;
  background:linear-gradient(120deg,var(--citui-navy-900),var(--citui-navy-700));color:var(--citui-ink-inverse);
  font-weight:700;font-size:14px;overflow:hidden;white-space:nowrap}
.topnav .brand{font-family:var(--citui-font-display);font-size:17px;display:flex;align-items:center;gap:8px}
.topnav .dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--citui-cyan-400);border-right-color:transparent}
.topnav span.on{background:rgba(255,255,255,.14);padding:6px 12px;border-radius:8px}
.topnav .sp{margin-left:auto;opacity:.85;font-weight:600}
.panel{padding:18px 16px 22px}
@container (max-width:700px){.panel{padding:14px 10px 18px}}

.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.phead .sp{margin-left:auto;display:flex;gap:14px;font-size:13px}
.phead a{color:var(--citui-link-ink);font-weight:600;text-decoration:none;cursor:pointer}
.phead h1{font-family:var(--citui-font-display);font-size:22px;margin:0;color:var(--citui-navy-900)}
.helpq{width:26px;height:26px;border-radius:50%;border:1px solid var(--citui-line-strong);
  background:var(--citui-white);color:var(--citui-muted);font:700 14px/1 var(--citui-font-text);
  cursor:pointer;display:grid;place-items:center;padding:0}
.helpq:hover,.helpq:focus-visible{color:var(--citui-link-ink);border-color:var(--citui-cyan-500)}
.meta{margin:8px 0 0;font-size:13px;color:var(--citui-muted)}
.meta b{color:var(--citui-ink)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 12px;font-size:13px;color:var(--citui-muted)}
.toolbar .sp{margin-left:auto;display:flex;gap:14px}
.toolbar a{color:var(--citui-link-ink);font-weight:600;text-decoration:none;cursor:pointer}

/* ── table ─────────────────────────────────────────────────────────────── */
.tblwrap{border:1px solid var(--citui-line);border-radius:10px;background:var(--citui-white);
  max-height:620px;overflow:auto;position:relative}
@container (max-width:700px){.tblwrap{max-height:520px}}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
thead th{position:sticky;top:0;z-index:3;background:var(--citui-surface-2);
  border-bottom:1px solid var(--citui-line-strong);padding:0 8px;height:38px;
  text-align:left;white-space:nowrap;vertical-align:middle}
tbody td{height:44px;padding:0 8px;border-bottom:1px solid var(--citui-line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;background:var(--citui-white)}
tbody tr:hover td{background:var(--citui-surface)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td[data-col=region]{max-width:88px}
td[data-col=city]{max-width:96px}
th[data-col=country],td[data-col=country]{width:1%}
th[data-col=name],td[data-col=name]{position:sticky;left:0;z-index:2;max-width:150px}
@container (max-width:700px){th[data-col=name],td[data-col=name]{max-width:150px}}
/* ⑦ KÉT JELENTÉS = KÉT ALAK (a 2026-09-14-i kontraktus él tovább):
   DARABSZÁM = kerek, kitöltött · KÜSZÖB = szögletes, körvonalas, ≥ jellel. */
.bdg{display:inline-flex;align-items:center;justify-content:center;font-style:normal;
  font:800 9.5px/1 var(--citui-font-text);margin-left:4px;vertical-align:middle}
.bdg:empty{display:none}
.bdg.cnt{min-width:15px;height:15px;border-radius:50%;background:var(--citui-cyan-500);color:#fff}
.bdg.thr{height:15px;padding:0 4px;border-radius:4px;border:1px solid var(--citui-cyan-500);
  color:var(--citui-link-ink);background:var(--citui-white)}
.shint{margin:0 0 8px;font-size:12px;color:var(--citui-muted);display:none}
@container (max-width:700px){.shint{display:block}}
thead th[data-col=name]{z-index:5}
td[data-col=name]{box-shadow:1px 0 0 var(--citui-line)}
thead th[data-col=name]{box-shadow:1px 0 0 var(--citui-line)}
tbody tr:hover td[data-col=name]{background:var(--citui-surface)}
td[data-col=name] a{color:var(--citui-link-ink);font-weight:600;text-decoration:none}
.mut{color:var(--citui-muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;
  border:1px solid transparent}
.pill.nosite{color:var(--citui-bad-ink);background:color-mix(in srgb,var(--citui-bad) 10%,transparent)}
.pill.outdated{color:var(--citui-warn-ink);background:color-mix(in srgb,var(--citui-warn) 16%,transparent)}
.pill.approved{color:var(--citui-ok-ink);background:var(--citui-ok-soft)}
.pill.rejected{color:var(--citui-bad-ink);background:color-mix(in srgb,var(--citui-bad) 12%,transparent)}
.pill.generated{color:var(--citui-link-ink);background:color-mix(in srgb,var(--citui-cyan-500) 13%,transparent)}
.mark{font-size:10px;color:var(--citui-muted);border:1px solid var(--citui-line);border-radius:4px;
  padding:0 4px;margin-left:5px;vertical-align:middle}
.good{color:var(--citui-ok-ink);font-weight:700}
.mid{color:var(--citui-warn-ink);font-weight:700}
.bad{color:var(--citui-bad-ink);font-weight:700}
.foot{margin:10px 2px 0;font-size:12px;color:var(--citui-muted)}
@container (max-width:700px){.phead .sp{margin-left:0;width:100%}}

/* ── popovers ──────────────────────────────────────────────────────────── */
.pop{position:fixed;z-index:60;min-width:216px;max-width:270px;background:var(--citui-white);
  border:1px solid var(--citui-line-strong);border-radius:10px;box-shadow:var(--citui-shadow-md);
  padding:10px;font-size:13px;white-space:normal}
.pop[hidden]{display:none}
.pop .hint{color:var(--citui-muted);font-size:12px;line-height:1.4;margin:0 0 8px}
.pop label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer}
.pop label:hover{background:var(--citui-surface-2)}
.pop .list{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.pop input[type=text],.pop input[type=number]{width:100%;font:inherit;padding:6px 8px;
  border:1px solid var(--citui-line-strong);border-radius:8px;margin-bottom:8px}
.pop .cnt{margin-left:auto;color:var(--citui-muted);font-size:11px}
.pop .act{display:flex;gap:8px;justify-content:space-between;margin-top:9px;border-top:1px solid var(--citui-line);padding-top:9px}
.pop .act button{font:inherit;font-weight:700;font-size:12px;cursor:pointer;border-radius:8px;padding:6px 12px}
.pop .act .go{border:0;background:var(--citui-navy-900);color:#fff}
.pop .act .off{border:1px solid var(--citui-line-strong);background:var(--citui-white);color:var(--citui-muted)}

/* ── legend modal ──────────────────────────────────────────────────────── */
.back{position:fixed;inset:0;background:rgba(10,31,54,.5);z-index:80;display:grid;place-items:center;padding:16px}
.back[hidden]{display:none}
.modal{background:var(--citui-white);border-radius:16px;max-width:620px;width:100%;max-height:82vh;
  overflow:auto;box-shadow:var(--citui-shadow-md)}
.modal header{position:sticky;top:0;background:var(--citui-white);display:flex;align-items:center;gap:10px;
  padding:16px 18px 12px;border-bottom:1px solid var(--citui-line)}
.modal h2{font-family:var(--citui-font-display);font-size:18px;margin:0;color:var(--citui-navy-900)}
.modal .x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--citui-muted)}
.modal dl{margin:0;padding:14px 18px 20px;font-size:13.5px;line-height:1.55}
.modal dt{font-weight:800;color:var(--citui-navy-900);margin-top:12px}
.modal dt:first-child{margin-top:0}
.modal dd{margin:2px 0 0;color:var(--citui-muted)}
.modal .sec{margin:18px 18px 0;padding-top:14px;border-top:1px solid var(--citui-line);
  font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--citui-muted)}

thead th .sorth{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:0;
  font:800 10.5px/1 var(--citui-font-text);letter-spacing:.075em;text-transform:uppercase;
  color:var(--citui-muted);cursor:pointer}
thead th .sorth:hover{color:var(--citui-navy-900)}
thead th.on .sorth{color:var(--citui-navy-900)}
thead th .arr{font-size:9px;line-height:1;opacity:0;transition:opacity .12s}
thead th:hover .arr{opacity:.35}
thead th.on .arr{opacity:1;color:var(--citui-link-ink)}
thead th .fbtn{margin-left:6px;border:0;background:transparent;padding:2px;cursor:pointer;
  color:var(--citui-muted);opacity:0;transition:opacity .12s;vertical-align:middle;line-height:0}
thead th:hover .fbtn,thead th .fbtn:focus-visible{opacity:.5}
thead th .fbtn svg{width:11px;height:11px;display:block}
thead th .fbtn.on{opacity:1;color:var(--citui-link-ink)}
thead th .fbtn.on svg{width:11px;height:11px}
thead th .cellwrap{display:flex;align-items:center}
th.num .cellwrap{justify-content:flex-end}
@container (max-width:700px){thead th .fbtn{opacity:.5}}
</style>

 contact:{email:"e-mail",sms:"SMS",voice:"telefon",none:"nincs"},
 mock:{none:"nincs",generated:"legenerálva",approved:"jóváhagyva",rejected:"elutasítva"}};
const lab=(k,v)=>(LBL[k]&&LBL[k][v])||(v===""?"nincs besorolás":v);
const num=n=>n.toLocaleString("hu-HU");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── live state (the mock really filters and really sorts) ─────────────── */
const S={sort:"surveyed",dir:"desc",f:{qualification:["no_site","outdated"],material:1},defaulted:true};
const val=(r,k)=>k==="match"?(r[IDX.match]===null?-1:r[IDX.match]):k==="region"?(r[IDX.region]||"zzz nincs besorolás"):r[IDX[k]];

function pass(r){
  for(const k in S.f){const v=S.f[k];if(v===undefined||v===null)continue;
    if(k==="name"){if(!String(r[0]).toLowerCase().includes(String(v).toLowerCase()))return false;}
    else if(Array.isArray(v)){if(!v.length)continue;if(!v.includes(String(r[IDX[k]]??"")))return false;}
    else {if(!(val(r,k)>=v))return false;}}
  return true;
}
function view(){
  const out=ROWS.filter(pass);
  const c=COLS.find(c=>c.k===S.sort);
  out.sort((a,b)=>{let x=val(a,S.sort),y=val(b,S.sort);
    if(c.t==="num"){x=+x;y=+y;}else{x=String(x);y=String(y);return (S.dir==="asc"?1:-1)*x.localeCompare(y,"hu");}
    return (S.dir==="asc"?1:-1)*(x-y);});
  return out;
}
function opts(k){const m=new Map();ROWS.forEach(r=>{const v=String(r[IDX[k]]??"");m.set(v,(m.get(v)||0)+1);});
  return [...m.entries()].sort((a,b)=>a[0]===""?1:b[0]===""?-1:a[0].localeCompare(b[0],"hu"));}

function cell(r,k){
  switch(k){
    case "name":return '<a href="#" title="'+esc(r[0])+'">'+esc(r[0])+'</a>';
    case "surveyed":return '<span class="mut">'+r[1]+'</span>';
    case "region":case "country":case "city":{const v=r[IDX[k]];return v?esc(v):'<span class="mut">nincs besorolás</span>';}
    case "qualification":return '<span class="pill '+(r[5]==="no_site"?"nosite":"outdated")+'">'+lab("qualification",r[5])+'</span>';
    case "photos":{const p=r[6];let s=p>=10?'10<span class="mark">plafon</span>':String(p);
      if(r[7])s+='<span class="mark">SV</span>';return s;}
    case "material":return num(r[8]);
    case "match":{const m=r[9];if(m===null)return '<span class="mut">nincs találat</span>';
      const s=m.toLocaleString("hu-HU",{minimumFractionDigits:2,maximumFractionDigits:2});
      return Math.abs(m-0.85)<1e-9?s+'<span class="mark">alapérték</span>':s;}
    case "contact":{const c=r[10];return '<span class="'+(c==="email"?"good":c==="none"?"bad":"mid")+'">'+lab("contact",c)+'</span>';}
    case "mock":{const v=r[11];return v==="none"?'<span class="mut">nincs</span>':'<span class="pill '+v+'">'+lab("mock",v)+'</span>';}
  }
}
function renderBody(rows){
  document.getElementById("tb").innerHTML=rows.map(r=>"<tr>"+COLS.map(c=>
    '<td data-col="'+c.k+'"'+(c.t==="num"?' class="num"':'')
    +(c.k==="name"?' title="'+esc(r[0])+'"':'')+'>'+cell(r,c.k)+"</td>").join("")+"</tr>").join("");
}
function filterSentence(){
  const parts=[];for(const k in S.f){const v=S.f[k];if(v===undefined||v===null)continue;
    const c=COLS.find(c=>c.k===k);
    if(Array.isArray(v)){if(!v.length)continue;parts.push(c.l+": "+v.map(x=>lab(k,x)).join(", "));}
    else if(k==="name")parts.push(c.l+' tartalmazza: "'+v+'"');
    else parts.push(c.l+" ≥ "+String(v).replace(".",","));}
  return parts;
}
function paint(){
  const rows=view();
  renderBody(rows);
  const parts=filterSentence();
  // ⛔ A cím alatti két szöveg-blokk (számláló-sor + szűrő/sorrend-mondat) KIKERÜLT
  // (tulajdonosi döntés, 2026-09-19). Amit mondtak, azt most a felület MUTATJA:
  //   • MI SZŰR → a fejléc cián tölcsére + jelvénye, és a „Szűrők törlése" link léte
  //   • MI A SORREND → a rendező oszlop nyila a fejlécben
  //   • HÁNY SOR → egyetlen rövid sor a tábla ALATT, a szűrt és a teljes számmal együtt,
  //     hogy a leszűkített lista ne látsszon a teljes készletnek.
  document.getElementById("clear").style.display=parts.length?"":"none";
  document.getElementById("foot").textContent=parts.length
    ? num(rows.length)+" sor a "+num(COUNTS.active)+" aktív leadből — nincs lapozás, mind itt van."
    : num(rows.length)+" sor — nincs lapozás, mind itt van.";
  paintHead();
  if(typeof paintChips==="function")paintChips();
}
function setSort(k){if(S.sort===k){S.dir=S.dir==="asc"?"desc":"asc";}else{S.sort=k;S.dir=(COLS.find(c=>c.k===k).t==="num"||k==="surveyed")?"desc":"asc";}paint();}
function active(k){const v=S.f[k];return Array.isArray(v)?v.length>0:v!==undefined&&v!==null;}
/* Két jelentés, két ALAK: darabszám → kerek/kitöltött, küszöb → szögletes/≥. */
function badgeHtml(k){
  const v=S.f[k];if(v===undefined||v===null)return "";
  if(Array.isArray(v))return v.length?'<i class="bdg cnt" title="'+v.length+' kipipált érték">'+v.length+"</i>":"";
  if(k==="name")return '<i class="bdg cnt" title="névrészlet">1</i>';
  return '<i class="bdg thr" title="alsó határ">≥'+String(v).replace(".",",")+"</i>";
}

/* ── one popover at a time, anchored to its button ─────────────────────── */
let openPop=null;
function closePop(){if(openPop){openPop.remove();openPop=null;}}
document.addEventListener("click",closePop);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePop();closeHelp();}});
function place(el,btn){
  const r=btn.getBoundingClientRect();el.hidden=false;
  const w=el.offsetWidth,h=el.offsetHeight;
  let left=Math.min(Math.max(8,r.left),window.innerWidth-w-8);
  let top=r.bottom+6;if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-6);
  el.style.left=left+"px";el.style.top=top+"px";
}
function filterPop(k,btn,extraHtml){
  const c=COLS.find(c=>c.k===k);
  const el=document.createElement("div");el.className="pop";
  let inner=extraHtml||"";
  if(c.t==="enum"){
    const cur=Array.isArray(S.f[k])?S.f[k]:[];
    inner+='<p class="hint">Pipáld ki, mely értékek maradjanak a listán.</p>'
      +'<div class="list">'+opts(k).map(([v,n])=>'<label><input type="checkbox" value="'+esc(v)+'"'
      +(cur.includes(v)?" checked":"")+"> "+esc(lab(k,v))+'<span class="cnt">'+num(n)+"</span></label>").join("")+"</div>";
  } else if(c.t==="num"){
    inner+='<p class="hint">Csak azok a sorok maradnak, ahol a '+c.l+' értéke legalább ennyi.</p>'
      +'<input type="number" step="'+(k==="match"?"0,01":"1")+'" value="'+(S.f[k]??"")+'" placeholder="legalább…">';
  } else {
    inner+='<p class="hint">Névrészlet — a lista azonnal szűkül rá.</p>'
      +'<input type="text" value="'+esc(S.f[k]??"")+'" placeholder="név részlete…">';
  }
  inner+='<div class="act"><button type="button" class="off">Szűrő törlése</button><button type="button" class="go">Alkalmaz</button></div>';
  el.innerHTML=inner;
  el.addEventListener("click",e=>e.stopPropagation());
  el.querySelector(".go").addEventListener("click",()=>{
    if(c.t==="enum"){S.f[k]=[...el.querySelectorAll("input:checked")].map(i=>i.value);if(!S.f[k].length)delete S.f[k];}
    else if(c.t==="num"){const v=parseFloat(String(el.querySelector("input").value).replace(",","."));
      if(isNaN(v))delete S.f[k];else S.f[k]=v;}
    else {const v=el.querySelector("input").value.trim();if(!v)delete S.f[k];else S.f[k]=v;}
    S.defaulted=false;closePop();paint();});
  el.querySelector(".off").addEventListener("click",()=>{delete S.f[k];S.defaulted=false;closePop();paint();});
  document.body.appendChild(el);place(el,btn);openPop=el;
  const first=el.querySelector("input");if(first&&first.type!=="checkbox")first.focus();
}

/* ── legend: ONE question mark, one popup ──────────────────────────────── */
function openHelp(){document.getElementById("help").hidden=false;}
function closeHelp(){const h=document.getElementById("help");if(h)h.hidden=true;}
function buildHelp(){
  document.getElementById("helpBody").innerHTML=
    COLS.map(c=>"<dt>"+c.l+"</dt><dd>"+c.m+"</dd>").join("")
    +'</dl><div class="sec">Jelölések a cellákban</div><dl>'
    +MARKS.map(m=>"<dt>"+esc(m[0])+"</dt><dd>"+esc(m[1])+"</dd>").join("");
}
document.getElementById("helpBtn").addEventListener("click",e=>{e.stopPropagation();openHelp();});
document.getElementById("help").addEventListener("click",e=>{if(e.target.id==="help")closeHelp();});
document.getElementById("helpX").addEventListener("click",closeHelp);
buildHelp();

/* ── draft chrome: size switch ─────────────────────────────────────────── */
document.querySelectorAll(".sizebar button[data-size]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".sizebar button[data-size]").forEach(x=>x.classList.toggle("on",x===b));
  document.body.classList.toggle("m",b.dataset.size==="m");closePop();}));
if(window.innerWidth<=700){document.body.classList.add("m");
  document.querySelectorAll(".sizebar button[data-size]").forEach(x=>x.classList.toggle("on",x.dataset.size==="m"));}


document.getElementById("th").innerHTML="<tr>"+COLS.map(c=>
 '<th data-col="'+c.k+'"'+(c.t==="num"?' class="num"':'')+'><span class="cellwrap">'
 +'<button type="button" class="sorth" data-sort="'+c.k+'">'+c.l+'<i class="arr"></i></button>'
 +(c.t!=="none"?'<button type="button" class="fbtn" data-filter="'+c.k+'" aria-label="'+c.l+' szűrése"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 2h12a.6.6 0 0 1 .45 1L9 8.2V12l-4 1.6V8.2L.55 3A.6.6 0 0 1 1 2z" fill="currentColor"/></svg></button><span class="fb"></span>':"")
 +"</span></th>").join("")+"</tr>";
function paintHead(){
  document.querySelectorAll("#th th").forEach(th=>{
    const k=th.dataset.col,on=k===S.sort;th.classList.toggle("on",on);
    const a=th.querySelector(".arr");if(a)a.textContent=on?(S.dir==="asc"?"▲":"▼"):"▼";
    const f=th.querySelector(".fbtn");if(f){f.classList.toggle("on",active(k));
      th.querySelector(".fb").innerHTML=badgeHtml(k);}});
}
document.querySelectorAll("#th .sorth").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();closePop();setSort(b.dataset.sort);}));
document.querySelectorAll("#th .fbtn").forEach(b=>b.addEventListener("click",e=>{
  e.stopPropagation();const was=openPop;closePop();if(was&&was.dataset.for===b.dataset.filter)return;
  filterPop(b.dataset.filter,b);openPop.dataset.for=b.dataset.filter;}));

paint();

</script>
</body></html>
