    return `<span class="pl ${cls}"><i></i>próbázik · ${d===0?"ma jár le":d===1?"holnap lejár":"még "+d+" nap"}</span>`; }
  if(c.kind==="paid") return `<span class="pl paid"><i></i>előfizető</span>`;
  if(c.kind==="lapsed") return `<span class="pl lapsed"><i></i>próba lejárt${short?"":" · "+lapsedDays(c)+" napja"}</span>`;
  return "";
}
function bookingPill(l){
  const b=l.bookings; if(!b.length) return "";
  const pend=b.filter(x=>x.status==="pending");
  if(pend.length) return `<span class="pl wait">${pend.length} foglalás válaszra vár</span>`;
  const n=b.length;
  return `<span class="pl bk">${n} foglalás</span>`;
}
function matches(l){
  const f=S.filter, c=l.client;
  if(f==="all") return true;
  if(f==="trial") return c&&c.kind==="trial";
  if(f==="booking") return l.bookings.length>0;
  if(f==="paid") return c&&c.kind==="paid";
  if(f==="lapsed") return c&&c.kind==="lapsed";
  return true;
}
function counts(){ const k=f=>{const o=S.filter;S.filter=f;const n=LEADS.filter(matches).length;S.filter=o;return n;};
  return {trial:k("trial"),booking:k("booking"),paid:k("paid"),lapsed:k("lapsed")}; }

/* ---------------- shell ---------------- */
const NOTES = {
  A:"<b>A:</b> semmi új doboz. A lead lapján a meglévő munkamenet-sáv két utolsó lépése „Próba” és „Foglalás” lesz; koppintásra lenyílik a részlet. A listában a Mock-oszlop pirulája mondja meg, hogy próbázik, a meglévő szűrő kap egy „próbázik” opciót.",
  B:"<b>B:</b> a lead lapján a sáv alatt külön ügyfél-kártya (napok, élő oldal, foglalások táblázata). A listában két új oszlop (Ügyfél, Foglalás) és egy szűrő-sor a táblázat fölött.",
  C:"<b>C:</b> a legkisebb beavatkozás. A név mellé jelvény kerül, a lead lapján egy új „Ügyfél” fül van. Az élő ügyfelek az Irányítópulton állnak egy helyen.",
  N:"<b>Értesítés:</b> mi menjen, amikor új próba indul. Válts módot és időpontot: a levél és az SMS szövege, és az is, hogy mikor érkezik, élőben változik. A csendes óra a meglévő szabály (22–07)."
};
function render(){
  document.querySelectorAll("[data-var]").forEach(b=>b.classList.toggle("on",b.dataset.var===S.v));
  document.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("on",b.dataset.size===S.size));
  document.getElementById("stage").classList.toggle("m",S.size==="m");
  document.getElementById("note").innerHTML=NOTES[S.v];
  const views = S.v==="N"?[]:S.v==="C"?[["list","Lead-lista"],["lead","Lead-lap"],["dash","Irányítópult"]]:[["list","Lead-lista"],["lead","Lead-lap"]];
  const leadPick = (S.view==="lead") ? `<span style="margin-left:8px">Lead:</span>${LEADS.slice(0,4).map(l=>`<button data-pick="${l.id}" class="${S.lead===l.id?"on":""}">${esc(l.name.replace("[TESZT] ",""))}</button>`).join("")}` : "";
  document.getElementById("sub").innerHTML = views.map(([k,t])=>`<button data-view="${k}" class="${S.view===k?"on":""}">${t}</button>`).join("")+leadPick;
  const con=document.getElementById("con");
  con.innerHTML = S.v==="N"?notifView():S.view==="dash"?dashView():S.view==="lead"?leadView():listView();
  const f=document.getElementById("flt"); if(f) f.value=S.filter;
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("on"),2200); }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-var],[data-size],[data-view],[data-pick],[data-lead],[data-back],[data-f],[data-drawer],[data-tab],[data-live],[data-at],[data-nav]");
  if(!t) return;
  const d=t.dataset;
  if(d.var){ S.v=d.var; if(S.v!=="C"&&S.view==="dash") S.view="list"; S.filter="all"; S.drawer=null; S.tab="adatok"; }
  else if(d.size) S.size=d.size;
  else if(d.view){ S.view=d.view; S.drawer=null; }
  else if(d.pick){ S.lead=d.pick; S.drawer=null; S.tab = S.v==="C"?"ügyfél":"adatok"; }
  else if(d.lead){ S.lead=d.lead; S.view="lead"; S.drawer=null; S.tab = S.v==="C"?"ügyfél":"adatok"; if(S.v==="N") S.v="A"; }
  else if("back" in d){ S.view="list"; }
  else if(d.f) S.filter=d.f;
  else if(d.drawer){ S.drawer = S.drawer===d.drawer?null:d.drawer; }
  else if(d.tab){ S.tab=d.tab; }
  else if(d.live){ e.preventDefault(); toast(`Új lapon nyílna: https://${d.live}.citoviso.com`); return; }
  else if(d.at){ S.notif.at=d.at; }
  else if(d.nav){ if(d.nav==="Irányítópult"&&S.v==="C") S.view="dash"; else if(d.nav==="CRM"&&S.v!=="N") S.view="list"; else { toast(`„${d.nav}” — ebben a tervben nem változik`); return; } }
  render();
});
document.addEventListener("change",e=>{
  if(e.target.id==="flt"){ S.filter=e.target.value; render(); }
  else if(e.target.name==="m"){ S.notif.mode=e.target.value; render(); }
  else if(e.target.id==="pend"){ S.notif.pend=e.target.checked; render(); }
});
const qs=new URLSearchParams(location.search);
if(qs.get("v")) S.v=qs.get("v"); if(qs.get("view")) S.view=qs.get("view"); if(qs.get("lead")) S.lead=qs.get("lead");
if(qs.get("tab")) S.tab=qs.get("tab"); if(qs.get("drawer")) S.drawer=qs.get("drawer"); if(qs.get("at")) S.notif.at=qs.get("at");
S.size = qs.get("size") || (matchMedia("(max-width:600px)").matches?"m":"d");
render();
</script>
</body></html>
