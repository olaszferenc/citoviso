<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Próba törlés-levél — jóváhagyott terv</title>
<link rel="stylesheet" href="../../../../public/assets/ui/citui.css">
<style>
  body { margin: 0; background: var(--citui-bg, Canvas); font-family: var(--citui-font, system-ui); color: var(--citui-ink, CanvasText); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; align-items: center; }
  .bar button { font: inherit; padding: 6px 12px; border-radius: var(--citui-radius, 8px); border: 1px solid var(--citui-line, GrayText); background: transparent; color: inherit; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: var(--citui-navy, CanvasText); color: var(--citui-on-navy, Canvas); }
  .stage { padding: 0 16px 24px; }
  iframe { display: block; border: 1px solid var(--citui-line, GrayText); border-radius: var(--citui-radius, 8px); width: 100%; height: 1150px; margin: 0 auto; background: var(--citui-surface, Canvas); }
  .stage[data-size="mobile"] iframe { width: 390px; max-width: 100%; }
</style>
</head>
<body>
<!-- The three approved letters, rendered by the REAL builders (src/email/trialEmail.ts,
     src/email/loginEmail.ts) with sample data; the PNGs next to this file are the images
     the owner approved on 2026-10-09. -->
<div class="bar" role="toolbar">
  <button data-letter="level-a.html" aria-pressed="true">A · teljes (7 nap)</button>
  <button data-letter="level-a-hetvege.html" aria-pressed="false">A · hétvége → péntek (9 nap)</button>
  <button data-letter="level-a-kupon-nelkul.html" aria-pressed="false">A · kupon nélkül</button>
  <span style="flex:1"></span>
  <button data-size="mobile" aria-pressed="true">Mobil 390px</button>
  <button data-size="desktop" aria-pressed="false">Asztali</button>
</div>
<div class="stage" data-size="mobile"><iframe title="levél" src="level-a.html"></iframe></div>
<script>
  const stage = document.querySelector(".stage");
  const frame = stage.querySelector("iframe");
  const press = (sel, btn) => document.querySelectorAll(sel).forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
  document.querySelectorAll("[data-letter]").forEach((b) => b.addEventListener("click", () => { frame.src = b.dataset.letter; press("[data-letter]", b); }));
  document.querySelectorAll("[data-size]").forEach((b) => b.addEventListener("click", () => { stage.dataset.size = b.dataset.size; press("button[data-size]", b); }));
  if (window.innerWidth > 700) document.querySelector('button[data-size="desktop"]').click();
</script>
</body>
</html>
