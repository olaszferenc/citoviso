/* ② A KINYITOTT RÉSZ — ide költözött minden, ami a csukott kártyáról lekerült.
   Semmi nem tűnt el: a recept többi mezője, az AI-költség, a nyers adat, és a
   jóváhagyott mock műveletei (konvertálás, törlés) mind itt élnek tovább. */
.con .con-mk__det {
  border-top: 1px solid var(--citui-line); padding: 10px 12px; background: var(--citui-surface);
}
.con .con-mk__det[hidden] { display: none; }
.con .con-mk__det .con-recipe { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin-top: 0; }

/* ═══ A MOCK SZÖVEGE — KÉZI ÁTÍRÁS (A) — jóváhagyott terv: assets/design-refs/console/mock-copy-edit/
   (A + B, tulajdonosi döntés 2026-10-04, ADR-0323). Az űrlap egy harmad-szélességű kártyába nem
   fér: kinyitva a kártya a TELJES sort kapja (①), ahogy az aktív kép-kapué is. */
.con .con-mk:has(.con-mkcopy[open]) { grid-column: 1 / -1; }
.con .con-mkcopy__pill {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 10.5px; font-weight: 700;
  padding: 2px 8px; border-radius: var(--citui-radius-pill);
  background: color-mix(in srgb, var(--citui-warn) 18%, var(--citui-panel)); color: var(--citui-warn-ink);
}
.con .con-mkcopy {
  border: 1px solid var(--citui-line); border-radius: var(--citui-radius-sm); background: var(--citui-panel);
  padding: 10px 12px; margin-bottom: 10px;
}
.con .con-mkcopy &gt; summary {
  cursor: pointer; font-weight: 700; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  font-family: var(--citui-font-display);
}
.con .con-mkcopy &gt; summary .con-mkcopy__pill { margin-top: 0; font-family: var(--citui-font-text); }
.con .con-mkcopy__lede { font-size: 12.5px; color: var(--citui-muted); margin: 8px 0 10px; line-height: 1.5; }
.con .con-mkcopy__frozen {
  display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 10px 12px; margin-bottom: 10px;
  border-radius: 10px; background: color-mix(in srgb, var(--citui-warn) 12%, var(--citui-panel)); color: var(--citui-warn-ink);
}
.con .con-mkcopy fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.con .con-mkcopy__grp {
  border: 1px solid var(--citui-line); border-radius: 12px; padding: 9px 11px; margin-bottom: 9px; background: var(--citui-panel);
}
.con .con-mkcopy__grp &gt; summary { cursor: pointer; font-weight: 700; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.con .con-mkcopy__cnt, .con .con-mkcopy__hand {
  display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; padding: 2px 8px;
  border-radius: var(--citui-radius-pill); background: color-mix(in srgb, var(--citui-warn) 18%, var(--citui-panel));
  color: var(--citui-warn-ink);
}
.con .con-mkcopy__cnt { margin-left: auto; }
.con .con-mkcopy__cnt[hidden], .con .con-mkcopy__hand[hidden], .con .con-mkcopy__orig[hidden] { display: none; }
.con .con-mkcopy__grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 10px; }
@media (min-width: 900px) { .con .con-mkcopy__grid.two { grid-template-columns: 1fr 1fr; } }
.con .con-mkcopy__f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.con .con-mkcopy__top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.con .con-mkcopy__top label { font-size: 12px; font-weight: 700; }
.con .con-mkcopy__where { font-size: 11.5px; color: var(--citui-muted); }
.con .con-mkcopy__where b { color: var(--citui-warn-ink); font-weight: 700; }
.con .con-mkcopy__f textarea, .con .con-mkcopy__f input {
  width: 100%; font: 14px/1.45 var(--citui-font-text); padding: 8px 10px; border: 1px solid var(--citui-line-strong);
  border-radius: 10px; color: var(--citui-ink); background: var(--citui-panel); resize: vertical;
}
.con .con-mkcopy__f.is-changed textarea, .con .con-mkcopy__f.is-changed input {
  border-color: var(--citui-warn); background: color-mix(in srgb, var(--citui-warn) 5%, var(--citui-panel));
}
.con .con-mkcopy__f.is-err textarea, .con .con-mkcopy__f.is-err input {
  border-color: var(--citui-bad); background: color-mix(in srgb, var(--citui-bad) 5%, var(--citui-panel));
}
.con .con-mkcopy__live { font-family: var(--citui-font-display); font-size: 15px; }
.con .con-mkcopy__live em { color: var(--citui-link-ink); }
.con .con-mkcopy__orig {
  font-size: 12px; color: var(--citui-muted); background: var(--citui-surface-2); border-radius: 8px; padding: 6px 8px;
}
.con .con-mkcopy__msg { font-size: 12px; font-weight: 600; }
.con .con-mkcopy__msg:empty { display: none; }
.con .con-mkcopy__msg.bad { color: var(--citui-bad-ink); }
.con .con-mkcopy__msg.warn { color: var(--citui-warn-ink); }
.con .con-mkcopy__foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.con .con-mkcopy__n { margin-left: auto; color: var(--citui-muted); }
.con .con-mkcopy__n.over { color: var(--citui-bad-ink); font-weight: 700; }
.con .con-mkcopy__lnk {
  background: none; border: 0; padding: 0; font: 600 12px/1.2 var(--citui-font-text); color: var(--citui-link-ink);
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.con .con-mkcopy__lnk[disabled] { color: var(--citui-muted); text-decoration: none; cursor: default; }
.con .con-mkcopy__hl { display: flex; flex-direction: column; gap: 6px; }
.con .con-mkcopy__hlrow { display: flex; gap: 6px; align-items: center; }
.con .con-mkcopy__hlrow input { flex: 1; }
.con .con-mkcopy__x {
  flex: none; width: 36px; height: 36px; display: inline-grid; place-items: center; padding: 0;
  border: 1px solid var(--citui-line-strong); border-radius: 10px; background: var(--citui-panel); color: var(--citui-muted); cursor: pointer;
}
.con .con-mkcopy__x:hover { color: var(--citui-bad-ink); border-color: var(--citui-bad); }
.con .con-mkcopy__add { align-self: flex-start; font-size: 12px; padding: 8px 12px; }
.con .con-mkcopy__bar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 10px 12px; margin-top: 10px; border: 1px solid var(--citui-line-strong); border-radius: 12px;
  background: var(--citui-panel);
}
.con .con-mkcopy__sum { flex: 1 1 220px; min-width: 0; font-size: 13px; }
/* NOT sticky, on purpose: the card clips (overflow:hidden), so sticky never engaged — and on a
   phone a three-row floating bar would cover the form it saves (the owner&#x27;s 45 % finding on
   the B bar). The bar closes the form; the per-field state is on the fields themselves. */
.con .con-mkcopy__bar button { font-size: 12.5px; padding: 8px 12px; }
.con .con-mkcopy__gates { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.con .con-mkcopy__gl { font-size: 12px; color: var(--citui-muted); }
.con .con-mkcopy__why { flex-basis: 100%; font-size: 12px; color: var(--citui-bad-ink); }
.con .con-mkcopy__note {
  font-size: 12px; color: var(--citui-muted); border-left: 3px solid var(--citui-line-strong); padding: 4px 10px; margin: 12px 0 0;
}
.con .con-mkgen summary { color: var(--citui-ink); }

/* ⑥ ÖSSZEADÓDÓ SÁV — a három szakasz kiadja a nevezőt. */
.con .cp-sum { margin: 10px 0 4px; }
.con .cp-bar {
  display: flex; height: 26px; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--citui-line);
}
.con .cp-bar span {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 11.5px; font-weight: 700; color: var(--citui-white);
  overflow: hidden; white-space: nowrap; min-width: 0;
}
/* Ugyanaz: a sáv-szeleten FEHÉR felirat ül, ezért a HÁTTÉR a szöveg-token
   (fehér a mai zöldön 3,00, a mai sárgán még kevesebb). */
.con .cp-bar .b1 { background: var(--citui-ok-ink); }
.con .cp-bar .b2 { background: var(--citui-warn-ink); }
/* Semleges, NEM ítélő szín: az ismétlés se nem jó, se nem baj — a márka-tokenből keverve. */
.con .cp-bar .b3 { background: color-mix(in srgb, var(--citui-navy-700) 45%, var(--citui-panel)); }
.con .cp-leg { font-size: 12.5px; color: var(--citui-muted); line-height: 1.6; margin: 7px 0 0; }

/* ⑩ TELEFONON: a sáv FÜGGŐLEGES lista, a mock-tábla sorokká bomlik — KÜLÖN tervezői
   döntés, nem a desktop lelőve. Hat állomás 390 px-en vízszintesen vagy kigörögne,
   vagy olvashatatlanul összenyomódna. */
@media (max-width: 700px) {
  .con .con-wf { flex-direction: column; overflow: visible; }
  .con .con-wf__st {
    border-right: 0; border-bottom: 1px solid var(--citui-line);
    display: flex; gap: 10px; align-items: baseline; min-width: 0;
  }
  .con .con-wf__st:last-child { border-bottom: 0; }
  .con .con-wf__k { flex: 0 0 96px; }
  .con .con-wf__st.now { box-shadow: inset 3px 0 0 var(--citui-cyan-500); }
  .con .con-arttbl thead { display: none; }
  .con .con-arttbl tr { display: block; border-bottom: 1px solid var(--citui-line-strong); padding: 8px 0; }
  .con .con-arttbl td { display: flex; gap: 8px; border: 0; padding: 3px 4px; }
  .con .con-arttbl td::before {
    content: attr(data-l); flex: 0 0 104px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--citui-muted); font-weight: 700; padding-top: 2px;
  }
  .con .con-arttbl .num { text-align: left; }
  .con .con-arttbl .why { display: inline; margin-left: 6px; }
}

/* ── Megkeresés-panel: EGY ÉLŐ link, a többi korábbi ────────────────────────
   Jóváhagyott terv „A&quot; (assets/design-refs/console/outreach-link-live-archive/,
   tulajdonosi döntés 2026-09-14). A régi lapon semmi nem jelölte, melyik link az
   élő, és a három művelet-gomb (navigáció, navigáció, ÁLLAPOT-ÍRÁS) azonos navy
   gradienst viselt — a felület nem mondta meg, melyik kattintás ír. */
.con .con-linkcard {
  border: 1px solid var(--citui-line); border-radius: 12px;
  padding: 14px; margin-top: 12px; background: var(--citui-panel);
}
.con .con-linkcard--live {
  border: 2px solid var(--citui-navy-900);
  box-shadow: 0 6px 22px color-mix(in srgb, var(--citui-navy-900) 10%, transparent);
}
/* A korábbi kártya HALVÁNYABB HÁTTERŰ, de nem halvány SZÖVEGŰ: az adat ugyanúgy
   olvasható, csak a hangsúly kisebb. (Az opacity itt olvashatatlanná tenné.) */
.con .con-linkcard--old { background: var(--citui-surface); }
.con .con-pill-live {
  background: var(--citui-navy-900); color: var(--citui-white);
  border-color: transparent; font-weight: 600;
}
/* ④ A navigáció LINK, nem submit-gomb — így magától kimarad a navy gradiensből. */
.con .con-linkact {
  color: var(--citui-ink-brand-2); text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--citui-navy-700) 35%, transparent);
  font-size: 0.9rem;
}
.con .con-linkact:hover { color: var(--citui-ink-brand); border-bottom-color: var(--citui-ink-brand); }
.con .con-linkacts { gap: 14px; }
/* ③ Új link ELŐTT a képernyő kimondja, mi lesz a mostanival — állandóan látszik,
   JS nélkül is; a gomb megerősítése csak ráadás. */
.con .con-livewarn {
  margin-top: 10px; padding: 10px 12px; border-radius: 9px; font-size: 0.86rem;
  background: color-mix(in srgb, var(--citui-warn) 12%, transparent);
  /* A jelzés-szín keveréke a saját tintjén 3,31-et adott — a FELIRAT a szöveg-tokent
     kapja (a háttér és a keret marad a jelzés-színen). */
  color: var(--citui-warn-ink);
  border: 1px solid color-mix(in srgb, var(--citui-warn) 40%, transparent);
}
.con .con-oldlinks { margin-top: 12px; }
.con .con-oldlinks &gt; summary {
  cursor: pointer; font-size: 0.86rem; color: var(--citui-muted); padding: 6px 0;
}

/* ── MÁSODLAGOS gomb a konzolon: `.ghost` ───────────────────────────────────
   ⛔ EZ AZ OSZTÁLY HÓNAPOKIG HALOTT VOLT. A `class=&quot;ghost&quot;` hat helyen szerepelt a
   konzolban — a szándék „halvány, másodlagos&quot; —, de a `.ghost`-hoz EGYETLEN szabály
   sem tartozott, ezért a submit-gombok a fenti navy gradienst kapták. MÉRVE
   (2026-09-15, valódi konzol): a lead-lapon 2 ilyen gomb, a `/duplicates`-en pedig a
   HÁROM válaszból KETTŐ — vagyis az „Ugyanaz — összevonás&quot; (ami lead-rekordokat von
   össze) semmiben nem különbözött a másik két verdikttől.

   A kinézet a dizájn-mag MEGLÉVŐ ghost-mintája (`.citui-btn--ghost`): fehér lap,
   `line-strong` szegély, navy szöveg. Nem új stílus, hanem a meglévő szándék
   hatályba léptetése. A hover a konzol saját `.con button:hover` szabályára bízva.

   ⚠️ Ez EGYETLEN másodlagos osztály. Az ADR-0169-ben bevezetett `con-btn2` ide olvadt
   be: két osztály ugyanarra a szerepre két igazság lenne ugyanazon a képernyőn. */
.con button.ghost, .con button.ghost[type=&quot;submit&quot;] {
  background: var(--citui-panel);
  color: var(--citui-ink-brand);
  border: 1px solid var(--citui-line-strong);
}

/* ── A FIZETÉS ÁTJÁRÓJA ÉS A BUKÁS-LAP ──────────────────────────────────────────
   Jóváhagyott terv: assets/design-refs/console/pay-gateway-exit/ („A — a fizetés
   a főszereplő”, tulaj 2026-09-15).
   ⛔ Mért kiindulás: a „Fizetek ▸” és az „Elutasítom” BÁJTRA AZONOS volt — mindkettő
   35 px, `font-weight: 600`, 12,5 px, fehér háttér, 999 px lekerekítés; egyedül a
   szövegszín tért el. Semmi nem mondta meg, melyik a művelet. */
.con .pay-item {
  margin: 0 0 14px; padding: 11px 12px; text-align: left;
  border: 1px solid var(--citui-line);
  border-radius: 11px; background: var(--citui-surface-2);
}
.con .pay-item b { display: block; font-size: 0.95rem; }
.con .pay-item span { display: block; margin-top: 2px; font-size: 0.82rem; color: var(--citui-muted); }

/* A művelet-blokk: EGY hangos út, alatta a halk visszaút. Oszlopban, hogy a
   hierarchia 390 px-en se essen szét egymás melletti, egyforma pirulákká. */
.con .pay-act { display: flex; flex-direction: column; align-items: stretch; gap: 9px; margin-top: 16px; }
.con .pay-act form { display: flex; }
/* ⛔ SPECIFICITÁS: a generikus `.con button[type=submit]:not(.ok):not(.bad):not(.hp-alt)
   :not(.ghost)` (0,6,1) VERI a sima `.con .pay-act button[type=submit]`-et (0,3,1).
   Mérve 2026-09-15: az első változatom mindkét gombot NAVY GRADIENSSEL festette —
   a „halk” visszaút ugyanúgy kitöltött lett, mint a fizetés, vagyis a hierarchia,
   amiért ez a terv készült, egyáltalán nem látszott. A DOM-mérés (magasság,
   betűvastagság) HELYES volt; a KÉP mutatta meg, hogy a festés más.
   Ugyanaz a csapda, mint a `.con a` link-szabály a gomb-feliraton. */
.con .pay-act button[type=&quot;submit&quot;]:not(.ok):not(.bad):not(.hp-alt):not(.ghost) {
  flex: 1 1 auto; min-height: 48px; padding: 13px 20px; border-radius: 12px;
  border: 1px solid transparent; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  background: var(--citui-cyan-500); color: var(--citui-navy-900);
}
.con .pay-act button[type=&quot;submit&quot;]:not(.ok):not(.bad):not(.hp-alt):not(.ghost):hover { filter: brightness(1.06); }
/* ⭐ A halk visszaút: MÉRHETŐEN kisebb és könnyebb — nem csak más színű. De nem
   tűnik el, és nem megy a tapintható méret alá. */
.con .pay-act .pay-act__quiet button[type=&quot;submit&quot;]:not(.ok):not(.bad):not(.hp-alt):not(.ghost) {
  min-height: 40px; padding: 10px 14px; font-weight: 600; font-size: 0.85rem;
  background: transparent; color: var(--citui-muted);
  border: 1px solid var(--citui-line-strong);
}
.con .pay-act .pay-act__quiet button[type=&quot;submit&quot;]:not(.ok):not(.bad):not(.hp-alt):not(.ghost):hover {
  color: var(--citui-ink-brand); border-color: var(--citui-ink-brand); filter: none;
}

/* A hivatkozási azonosító MÁSOLHATÓ — egy kódot képernyőről átgépelni nem művelet. */
.con .pay-ref {
  display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
  margin: 14px 0 0; font-size: 0.82rem; color: var(--citui-muted);
}
.con .pay-ref button {
  min-height: 34px; padding: 7px 11px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--citui-line-strong);
  background: var(--citui-panel); color: var(--citui-ink-brand);
  font-weight: 600; font-size: 0.8rem;
}
.con .pay-ref button.is-done { border-color: var(--citui-ok); color: var(--citui-ok-ink); }

/* Minden lapról vezessen tovább nevesített út — néma zsákutca nincs (ADR-0129 ③). */
/* Elek F-2 (approved 2026-10-02): the outcome band above the payment headline.
   NEUTRAL for the buyer&#x27;s own back-out, BAD for a real decline — never colour alone:
   the band&#x27;s words carry the state too. */
.con .pay-state {
  display: inline-block; margin: 0 0 10px; padding: 4px 10px; border-radius: 999px;
  font-size: 0.78rem; font-weight: 600; border: 1px solid var(--citui-line-strong);
}
.con .pay-state--neutral { background: var(--citui-surface-2); color: var(--citui-navy-900); }
.con .pay-state--bad {
  background: color-mix(in srgb, var(--citui-bad) 10%, var(--citui-surface));
  border-color: color-mix(in srgb, var(--citui-bad) 35%, var(--citui-surface));
  color: var(--citui-bad-ink);
}
.con .pay-exits {
  margin: 16px 0 0; padding-top: 13px; border-top: 1px solid var(--citui-line);
  display: flex; gap: 10px 14px; flex-wrap: wrap; justify-content: center; align-items: center;
}
.con .pay-exits a { font-size: 0.85rem; font-weight: 600; }
@media (max-width: 560px) {
  .con .pay-exits { flex-direction: column; gap: 7px; }
}

/* ── A KÜLDÉS MEGERŐSÍTÉSE: őr-lelet felugró (tulajdonosi rendelet, 2026-09-17) ─────
   „max figyelmeztessen, de ha utána is továbbkattint, menjen ki&quot;. A doboz a fotó-kapu
   nyelvét beszéli (.pg-head/.pg-lead/.pg-list), mert ugyanaz a dolga: kimondja, mit
   talált a gép, és a döntést a kurátorra bízza.
   ⛔ `open` attribútummal jön, tehát JS NÉLKÜL is látszik — a `showModal()` csak a
   sötétített hátteret adja hozzá. A garancia amúgy sem itt van, hanem a szerveren. */
.vg-dlg {
  max-width: 540px; width: calc(100% - 32px);
  padding: 16px 18px; border-radius: var(--citui-radius);
  border: 1px solid color-mix(in srgb, var(--citui-bad) 38%, transparent);
  background: color-mix(in srgb, var(--citui-bad) 7%, var(--citui-panel));
  color: var(--citui-ink); box-shadow: var(--citui-shadow-md);
}
.vg-dlg::backdrop { background: color-mix(in srgb, var(--citui-navy-950) 55%, transparent); }
.vg-dlg__form { margin-top: 12px; padding-top: 12px;
  border-top: 1px solid color-mix(in srgb, var(--citui-bad) 22%, transparent); }
.vg-dlg__acts { display: flex; gap: 10px; align-items: center; justify-content: flex-end;
  flex-wrap: wrap; margin-top: 12px; }
/* A kiút NÉV szerint, nem csak egy „x&quot;: a mégsem is döntés, és látszania kell. */
.vg-dlg__cancel { font-size: 0.8rem; font-weight: 700; color: var(--citui-link-ink); text-decoration: none; }
.vg-dlg__cancel:hover { text-decoration: underline; }
/* MOBIL: a két válasz egymás alá, teljes szélességű hüvelykujj-cél. */
@media (max-width: 560px) {
  .vg-dlg__acts { flex-direction: column-reverse; align-items: stretch; }
  .vg-dlg__acts button { width: 100%; }
  .vg-dlg__cancel { text-align: center; padding: 8px 0; }
}
/* ADR-0226: próbakártya-választó a mock fizetőlapon (token-regisztráló fizetésnél) */
.con .pay-cards{border:1px solid var(--citui-line);border-radius:var(--citui-radius-sm);padding:8px 12px 10px;margin:0 0 10px;text-align:left}
.con .pay-cards legend{padding:0 4px}
.con .pay-cards__opt{display:block;font-size:.88rem;padding:3px 0;cursor:pointer}

/* ── Lead-ajánlatok on /pricing (ADR-0285; frozen plan:
   assets/design-refs/console/escalation-offer-admin/). The switch reuses .con-sell,
   the fields reuse .pr-field/.pr-input; only the error state, the preview and the
   live-offer notice are new. */
.pr-esc__head { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.pr-esc.is-off .pr-esc__gated .pr-input { opacity: 0.45; }
/* ADR-0286: the intro field sits OUTSIDE the switch, so only the gated block dims. */
.pr-esc__sub { margin: 4px 0 8px; font-size: 13px; }
.pr-esc__sub .mut { font-size: 12px; }
.pr-esc__days { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; cursor: pointer; }
.pr-esc.is-off .pr-esc__days { opacity: .55; cursor: default; }
.pr-hint { margin-top: 4px; font-size: 11.5px; color: var(--citui-muted); }
.pr-hint:empty, .pr-field.err .pr-hint { display: none; }
.pr-esc__live p { margin: 4px 0; }
.pr-field.err .pr-input { border-color: var(--citui-bad); }
.pr-field.err .pr-input__u { color: var(--citui-bad-ink); }
.pr-ferr { margin-top: 4px; font-size: 11.5px; color: var(--citui-bad-ink); }
.pr-ferr:empty { display: none; }
.pr-esc__preview {
  margin-top: 10px; padding: 10px 12px; font-size: 12.5px;
  border-left: 3px solid var(--citui-cyan-500); border-radius: 0 8px 8px 0;
  background: var(--citui-surface-2);
}
.pr-esc__preview.is-off { border-left-color: var(--citui-line-strong); color: var(--citui-muted); }
.pr-esc__live { margin-top: 6px; font-size: 12px; color: var(--citui-warn-ink); }
.pr-esc__sum { margin-left: 10px; font-size: 12px; color: var(--citui-bad-ink); }

/* ── ADR-0290: accommodation time zone on the lead page&#x27;s converted block
   (src/tenant/zonePicker.ts — the same markup the tenant admin styles). */
.tz-line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--citui-line); }
.tz-line__k { color: var(--citui-muted); font-size: 12.5px; min-width: 74px; }
.tz-edit &gt; summary { cursor: pointer; color: var(--citui-navy-700); text-decoration: underline; font-size: 12.5px; list-style: none; }
.tz-edit &gt; summary::-webkit-details-marker { display: none; }
.tzp { margin-top: 8px; max-width: 520px; }
.tzp__l { display: block; margin: 8px 0 4px; font-size: 12px; color: var(--citui-muted); }
.tzp__q, .tzp__s { width: 100%; padding: 7px 9px; border: 1px solid var(--citui-line-strong); border-radius: 8px; font: inherit; background: var(--citui-white); color: inherit; }
.tzp__none, .tzp__hint { margin-top: 6px; font-size: 12px; color: var(--citui-muted); }
.tzp__now { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--citui-cyan-500); background: var(--citui-surface-2); border-radius: 0 8px 8px 0; font-size: 12.5px; }
.tzp__warn { margin-top: 6px; font-size: 12px; color: var(--citui-warn-ink); }
.tzp__warn:empty { display: none; }
.tzp__reset { margin-top: 6px; padding: 0; border: 0; background: none; color: var(--citui-navy-700); text-decoration: underline; font: inherit; font-size: 12px; cursor: pointer; }

/* K2 / S-1 — the walk read-out (approved plan „A”: assets/design-refs/console/walk-readiness/) */
.con .tpl-card__walk {
  position: absolute; left: 6px; top: 68px; z-index: 2; display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; line-height: 1.2; padding: 3px 7px; border-radius: var(--citui-radius-pill);
  background: color-mix(in srgb, var(--citui-warn) 22%, var(--citui-panel)); color: var(--citui-warn-ink);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--citui-warn) 40%, transparent);
}
.con .tpl-card__walk[data-k=&quot;unknown&quot;] { background: var(--citui-surface-2); color: var(--citui-muted); box-shadow: 0 0 0 1px var(--citui-line); }
.con .tpl-walk-note {
  margin: 10px 0 4px; padding: 10px 12px; font-size: 13px; line-height: 1.5; border: 1px solid var(--citui-line);
  border-left: 3px solid var(--citui-warn); border-radius: var(--citui-radius-sm); background: var(--citui-panel); color: var(--citui-ink);
}
.con .tpl-walk-note[hidden], .con .tpl-walk-prev[hidden] { display: none; }
.con .tpl-walk-note[data-k=&quot;unknown&quot;] { border-left-color: var(--citui-line-strong); }
.con .tpl-walk-note__h { display: flex; gap: 6px; align-items: center; font-weight: 700; color: var(--citui-warn-ink); margin-bottom: 3px; }
.con .tpl-walk-note[data-k=&quot;unknown&quot;] .tpl-walk-note__h { color: var(--citui-muted); }
.con .tpl-walk-note__steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; padding: 0; list-style: none; }
.con .tpl-walk-note__steps li {
  font-size: 11.5px; padding: 2px 8px; border-radius: var(--citui-radius-pill);
  border: 1px dashed var(--citui-line-strong); color: var(--citui-muted);
}
.con .tpl-walk-note__steps li.have { border-style: solid; border-color: var(--citui-ok); background: var(--citui-ok-soft); color: var(--citui-ok-ink); font-weight: 600; }
.con .tpl-walk-note__steps li.coll { text-decoration: line-through; }
.con .tpl-walk-note__legend { font-size: 11px; color: var(--citui-muted); margin-bottom: 4px; }
.con .tpl-walk-prev { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 12.5px; line-height: 1.45; color: var(--citui-warn-ink); }

/* ═══ RIPORT MODUL — Tölcsér (B) + Viselkedés (frozen plan: assets/design-refs/console/riport/) ═══
   Emphasis charts: ONE hue (link-ink) + a ghost gray; a categorical trio only on the device
   panel (direct-labelled). Container queries, not media queries — the pages live inside the
   console column and must react to ITS width (phone: one column; desk: two). All colour from
   tokens or color-mix() of tokens; the dark scope re-derives every value from its own tokens. */
.con .con-main__in { container-type: inline-size; }
.rp-tab--soon { opacity: .45; cursor: default; }
.rp-tab--soon:hover { color: var(--citui-muted) !important; }

/* filter row — one row above every chart */
.rp-filt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
.rp-chips { display: inline-flex; border: 1px solid var(--citui-line); border-radius: var(--citui-radius-pill); overflow: hidden; background: var(--citui-panel); }
.rp-chips a { padding: 7px 12px; font: 600 12px/1 var(--citui-font-text); color: var(--citui-muted); min-height: 32px; display: inline-flex; align-items: center; text-decoration: none; }

.rp-filt select { min-height: 32px; border: 1px solid var(--citui-line); border-radius: var(--citui-radius-pill); padding: 0 12px; font: 600 12px var(--citui-font-text); background: var(--citui-panel); color: var(--citui-ink); margin: 0; width: auto; }

/* layout */

}

/* hypothesis cards */

.rp-spark { display: block; width: 100%; height: 26px; margin-top: 6px; }

/* pills + deltas (text tokens, never the hue itself — the 2026-09-15 contrast rule) */
.rp-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: var(--citui-radius-pill); font-size: 11px; font-weight: 600; border: 1px solid var(--citui-line); background: var(--citui-surface-2); color: var(--citui-ink); }
.rp-pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.rp-pill--ok { color: var(--citui-ok-ink); background: var(--citui-ok-soft); border-color: color-mix(in srgb, var(--citui-ok) 30%, transparent); }
.rp-pill--warn { color: var(--citui-warn-ink); background: color-mix(in srgb, var(--citui-warn) 12%, var(--citui-panel)); border-color: color-mix(in srgb, var(--citui-warn) 40%, transparent); }
.rp-pill--bad { color: var(--citui-bad-ink); background: color-mix(in srgb, var(--citui-bad) 10%, var(--citui-panel)); border-color: color-mix(in srgb, var(--citui-bad) 35%, transparent); }

.rp-delta { font-weight: 700; }
.rp-delta--up { color: var(--citui-ok-ink); }
.rp-delta--dn { color: var(--citui-bad-ink); }
.rp-delta--flat { color: var(--citui-muted); }

/* bars (returns, device, reasons) */
.rp-bar { position: relative; height: 14px; background: color-mix(in srgb, var(--citui-muted) 22%, var(--citui-panel)); border-radius: 4px; overflow: visible; min-width: 40px; flex: 1; }
.rp-bar--tall { height: 28px; }
.rp-bar--thin { height: 8px; }

.rp-bar__fill.rp-said { background: var(--citui-cyan-500); }
.rp-bar__fill.rp-ramp-2 { background: var(--citui-cyan-500); }
.rp-bar__fill.rp-ramp-3 { background: var(--citui-link-ink); }
.rp-bar__fill.rp-ramp-4 { background: color-mix(in srgb, var(--citui-link-ink) 55%, var(--citui-navy-900)); }

.rp-bar__r { position: absolute; right: 6px; top: 5px; line-height: 18px; padding: 0 6px; border-radius: 9px; background: color-mix(in srgb, var(--citui-panel) 88%, transparent); font-size: 11px; color: var(--citui-ink); font-variant-numeric: tabular-nums; }
.rp-fun { display: grid; gap: 7px; margin: 4px 0; }
.rp-frow { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; cursor: default; }
.rp-frow__l { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.rp-frow__l small { display: block; font-weight: 500; color: var(--citui-muted); font-size: 11px; }
.rp-frow:hover .rp-bar { outline: 2px solid var(--citui-cyan-500); outline-offset: 1px; }
.rp-dev { display: grid; gap: 8px; }
.rp-drow { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; font-size: 12.5px; }

/* tables */
.rp-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.rp-tbl th { text-align: left; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--citui-muted); padding: 6px; border-bottom: 1px solid var(--citui-line); white-space: nowrap; background: none; }
.rp-tbl td { padding: 7px 6px; border-bottom: 1px solid var(--citui-line); font-variant-numeric: tabular-nums; vertical-align: middle; }
.rp-tbl td.num, .rp-tbl th.num { text-align: right; }
.rp-tbl tr:last-child td { border-bottom: 0; }
.rp-tbl tr.rp-tot td { font-weight: 700; background: var(--citui-surface); }
.rp-mini { display: inline-block; height: 9px; border-radius: 3px; background: var(--citui-cyan-500); vertical-align: middle; margin-right: 6px; min-width: 2px; }
.rp-heat { display: inline-block; min-width: 54px; padding: 3px 7px; border-radius: 5px; text-align: right; font-weight: 700; color: var(--citui-ink); }

/* timeline */
.rp-chart svg { display: block; width: 100%; height: auto; }

.rp-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--citui-muted); margin: 6px 0 0; }
.rp-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.rp-legend i.rp-legend__ln { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.rp-notes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.rp-notes input[type=&quot;text&quot;] { flex: 1; min-width: 160px; }
.rp-notes input { min-height: 34px; border: 1px solid var(--citui-line); border-radius: var(--citui-radius-pill); padding: 0 12px; font: 13px var(--citui-font-text); margin: 0; width: auto; background: var(--citui-field, var(--citui-panel)); color: var(--citui-ink); }

/* exit map */
.rp-exitmap { display: grid; gap: 6px; }
.rp-ex { display: grid; grid-template-columns: 120px 1fr 56px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; cursor: default; }
.rp-ex__s { font-weight: 600; line-height: 1.2; }
.rp-ex__s small { display: block; font-weight: 500; color: var(--citui-muted); font-size: 10.5px; }

.rp-ex__reach { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--citui-link-ink) 22%, var(--citui-panel)); border-radius: 4px; }
.rp-ex__exit { position: absolute; left: 0; top: 4px; bottom: 4px; background: var(--citui-link-ink); border-radius: 3px; }
.rp-ex__p { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.rp-ex__p small { display: block; font-weight: 500; color: var(--citui-muted); font-size: 10.5px; }
.rp-ex:hover .rp-ex__t { outline: 2px solid var(--citui-cyan-500); outline-offset: 1px; }
.rp-ex--hot .rp-ex__p { color: var(--citui-bad-ink); }

/* reasons */
.rp-rs { display: grid; gap: 6px; }
.rp-rr { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; }

.rp-conf { font-size: 10.5px; color: var(--citui-muted); font-weight: 500; }

/* buyers + heat + survey preview */
.rp-buyers { display: grid; grid-template-columns: 1fr; gap: 10px; }
.rp-bprof { border: 1px solid var(--citui-line); border-radius: 12px; padding: 12px 14px; background: var(--citui-surface); }

.rp-survey__opts span { border: 1px solid var(--citui-line-strong); background: var(--citui-panel); border-radius: var(--citui-radius-pill); min-height: 38px; padding: 0 14px; font: 500 13px var(--citui-font-text); color: var(--citui-ink); display: flex; align-items: center; }
.rp-survey__foot { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.rp-survey__btn { display: inline-flex; align-items: center; min-height: 34px; padding: 0 14px; border-radius: var(--citui-radius-pill); font: 600 12.5px var(--citui-font-text); border: 1px solid var(--citui-line-strong); background: var(--citui-panel); color: var(--citui-ink-brand); opacity: .7; }
.rp-survey__btn--primary { background: var(--citui-navy-900); border-color: var(--citui-navy-900); color: var(--citui-ink-inverse); }

 * Citoviso console — dense document table (&quot;C&quot; irány, ADR-0064/0066).
 * The frozen design contract is assets/design-refs/console/finance-c-tabla.html.
 * Everything here dresses EXCLUSIVELY from the central design core

 * elsőbbség): no per-row direction icon (the Típus column carries direction),

/* ── Headline KPI band (per-currency, ADR-0064) ───────────────────────────── */
.con .dkpi {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  background: linear-gradient(180deg, var(--citui-navy-900), var(--citui-navy-950));

}

  font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase;

}

  font-family: var(--citui-font-display); font-size: 19px; font-weight: 700;
  font-variant-numeric: tabular-nums; margin-top: 2px;
}

  display: block; font-size: 12px; font-weight: 500;
  color: color-mix(in srgb, var(--citui-white) 60%, transparent);
}
.con .dkpi__fx { font-size: 12px; color: color-mix(in srgb, var(--citui-white) 60%, transparent); }
.con .dkpi__sep { width: 1px; height: 38px; background: color-mix(in srgb, var(--citui-panel) 16%, transparent); }
@media (max-width: 900px) { .con .dkpi { gap: 14px; } .con .dkpi__sep { display: none; } }

/* ── Table shell ──────────────────────────────────────────────────────────── */
.con .ctbl-wrap {
  border: 1px solid var(--citui-line); border-radius: var(--citui-radius);
  overflow: hidden; background: var(--citui-panel); margin-top: 10px;
}
.con .ctbl-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--citui-surface-2);
  border-bottom: 1px solid var(--citui-line);
}
.con .ctbl-bar .cnt { font-size: 13px; color: var(--citui-muted); }
.con .ctbl-bar .cnt b { color: var(--citui-ink); font-variant-numeric: tabular-nums; }

/* Active-filter chips (server-rendered — each ✕ is a link that drops one param) */
.con .ctbl-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.con .ctbl-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--citui-panel); border: 1px solid var(--citui-line-strong);
  border-radius: var(--citui-radius-pill); padding: 3px 6px 3px 11px;
  font-size: 12.5px; font-weight: 600; color: var(--citui-ink);
}
.con .ctbl-chip b { font-weight: 700; }
.con .ctbl-chip a {
  display: grid; place-items: center; width: 19px; height: 19px;
  border-radius: 50%; background: var(--citui-surface-2); color: var(--citui-muted);
  font-size: 13px; line-height: 1; text-decoration: none;
}
.con .ctbl-chip a:hover { background: var(--citui-bad); color: var(--citui-white); }
.con .ctbl-clear {
  margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--citui-line-strong); background: var(--citui-panel);
  color: var(--citui-ink); border-radius: var(--citui-radius-pill);
  padding: 6px 14px; font-size: 13px; font-weight: 600; text-decoration: none;
}
.con .ctbl-clear:hover { border-color: var(--citui-bad); color: var(--citui-bad); text-decoration: none; }

.con .ctbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.con table.ctbl { width: 100%; border-collapse: separate; border-spacing: 0; margin: 0; }
.con table.ctbl thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--citui-navy-900); color: var(--citui-ink-inverse);
  text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: 700; padding: 9px 10px 8px; white-space: nowrap; vertical-align: top;
  border: 0;
}
.con table.ctbl thead th.num { text-align: right; }
.con table.ctbl thead th .lbl { display: block; margin-bottom: 6px; opacity: 0.92; }
.con table.ctbl tbody td {
  padding: 8px 10px; border-bottom: 1px solid var(--citui-line);
  font-size: 13.5px; vertical-align: middle;
}
.con table.ctbl tbody tr:hover td { background: var(--citui-surface-2); }
.con table.ctbl tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
.con table.ctbl tbody tr.storno { color: var(--citui-muted); }

/* Column filter inputs live ON the dark header band (white-alpha fields) */
.con .ctbl-f { display: flex; flex-direction: column; gap: 4px; }
.con .ctbl-f input, .con .ctbl-f select {
  width: 100%; min-width: 78px; box-sizing: border-box; font: inherit; font-size: 12px;
  font-weight: 500; text-transform: none; letter-spacing: 0;
  border: 1px solid color-mix(in srgb, var(--citui-white) 22%, transparent);
  background: color-mix(in srgb, var(--citui-panel) 10%, transparent);
  color: var(--citui-white); border-radius: var(--citui-radius-sm); padding: 5px 9px;
}
.con .ctbl-f input::placeholder { color: color-mix(in srgb, var(--citui-white) 50%, transparent); }
.con .ctbl-f input:focus, .con .ctbl-f select:focus {
  outline: 2px solid var(--citui-cyan-400); outline-offset: -1px;
  background: color-mix(in srgb, var(--citui-panel) 17%, transparent);
}
/* A filled filter reads active — cyan field on the dark band */
.con .ctbl-f.on input, .con .ctbl-f.on select {
  background: var(--citui-cyan-500); border-color: var(--citui-cyan-400);

}

.con .ctbl-f .range { display: flex; gap: 4px; }

.con .ctbl-empty { padding: 26px 16px; text-align: center; color: var(--citui-muted); font-size: 14px; }

/* ── Pager: plain links, so it works with JS off like the GET-form filters ── */
.con .ctbl-pager {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;

.con .ctbl-pager__nav .cur,

}

}

/* ── Esedékesség readout (computed from Fiz. határidő, never stored) ───────── */
.con .du { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.con .du svg { width: 13px; height: 13px; flex: 0 0 auto; }
.con .du--late { color: var(--citui-bad); }
