orAll('img')[Number(b.getAttribute('data-gv-open'))];\n      var tap=im.parentElement&&im.parentElement.tagName==='FIGURE'?im.parentElement:im;tap.click();});\n  });\n  document.querySelectorAll('[data-gv-expand]').forEach(function(b){\n    b.addEventListener('click',function(){var sec=b.closest('[data-gv-sec]');var open=sec.classList.toggle('gv-open');\n      sec.querySelectorAll('[data-gv-extra]').forEach(function(x){x.hidden=!open});\n      b.textContent=open?b.getAttribute('data-less'):b.getAttribute('data-more');\n      if(!open)sec.scrollIntoView({block:'start'});});\n  });\n  document.querySelectorAll('.gv-deck').forEach(function(d){\n    var cards=[].slice.call(d.querySelectorAll('.gv-dcard')),i=0,c=d.parentElement.querySelector('[data-gv-count]');\n    function lay(){cards.forEach(function(el,k){var o=(k-i+cards.length)%cards.length;el.style.zIndex=String(cards.length-o);\n      el.style.transform=o===0?'none':o\u003c3?'translate('+(o*14)+'px,'+(o*10)+'px) rotate('+(o*3.2)+'deg)':'translate(28px,20px) rotate(6.4deg)';\n      el.style.opacity=o\u003c3?'1':'0';el.setAttribute('aria-hidden',o===0?'false':'true')});c.textContent=(i+1)+' / '+cards.length;}\n    d.parentElement.querySelector('[data-gv-prev]').onclick=function(){i=(i-1+cards.length)%cards.length;lay()};\n    d.parentElement.querySelector('[data-gv-next]').onclick=function(){i=(i+1)%cards.length;lay()};\n    lay();\n  });\n})();\u003c/script>\u003cstyle data-cit-runtime>\n/* Citoviso module runtime — shared widget styles (UI-CONTRACT §A/§B, ADR-0011).\n * Every rule reads ONLY the standard design tokens (with sane fallbacks), so a\n * single widget adopts each archetype's skin automatically. Archetypes MUST\n * declare the tokens in :root; the fallbacks here keep the widget usable if one\n * is missing. Light-DOM (no shadow) so CSS custom properties inherit naturally. */\n\n/* Fallback token defaults in a LOW-PRIORITY cascade layer: a layered :root always\n * loses to the page's own unlayered :root (the skin), regardless of source order — so\n * inlining this runtime AFTER the skin can no longer clobber the skin tokens. Standalone\n * widget fixtures (no page tokens) still get these fallbacks. */\n@layer cit-fallback {\n  :root {\n    --cit-accent: #b5122e;\n    --cit-on-accent: #ffffff;\n    --cit-ink: #1a1a1a;\n    --cit-muted: #6b6b6b;\n    --cit-bg: #ffffff;\n    --cit-surface: #f6f4f0;\n    --cit-line: #e3e0d8;\n    --cit-radius: 10px;\n    --cit-font-display: Georgia, \"Times New Roman\", serif;\n    --cit-font-body: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    --cit-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);\n  }\n  /* The shared module sections emit `.cit-btn` (review-form submit, the CTA band's link),\n     and 4 of the 19 templates never styled it (arch-frames, claymorphism, tilted-gallery,\n     wordmark-grow — measured 2026-09-26): a 21px unstyled \u003cbutton> and a 23px bare link\n     were the guest's \"send\" and \"book\". Layered fallback: any template rule outranks it. */\n  .cit-btn {\n    display: inline-block;\n    background: var(--cit-accent);\n    color: var(--cit-on-accent);\n    border: 1px solid var(--cit-accent);\n    border-radius: calc(var(--cit-radius) * 0.7);\n    padding: 13px 24px;\n    min-height: 44px;\n    font: inherit;\n    font-weight: 700;\n    line-height: 1.2;\n    text-decoration: none;\n    cursor: pointer;\n  }\n  .cit-btn-disabled { opacity: 0.55; pointer-events: none; }\n}\n\n.cit-book * { box-sizing: border-box; }\n\n.cit-book {\n  font-family: var(--cit-font-body);\n  color: var(--cit-ink);\n  background: var(--cit-surface);\n  border: 1px solid var(--cit-line);\n  border-radius: var(--cit-radius);\n  box-shadow: var(--cit-shadow);\n  padding: 18px;\n  display: grid;\n  gap: 14px;\n}\n\n.cit-book__title {\n  font-family: var(--cit-font-display);\n  font-size: 1.15rem;\n  font-weight: 600;\n  margin: 0;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  /* the nowrap MINTA badge beside the title gave the card a 364px min-content: in a\n     fit-content wrapper (editorial-press) the page grew to 404px on a 390px phone and\n     the browser zoomed out (guest-mobile-check, 2026-09-26) — the badge may wrap under. */\n  flex-wrap: wrap;\n}\n.cit-book__title svg { width: 20px; height: 20px; stroke: var(--cit-accent); fill: none; }\n/* ADR-0059 ④ — the demo widget's honest sample marker (§B.17): visible AT the form,\n   not a footnote somewhere below it. Token-themed like everything else here. */\n.cit-book__demo {\n  margin-left: auto;\n  font-family: var(--cit-font-body, inherit);\n  font-size: 0.68rem;\n  font-weight: 700;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: color-mix(in srgb, var(--cit-accent) 70%, var(--cit-ink));\n  border: 1px solid color-mix(in srgb, var(--cit-accent) 45%, transparent);\n  border-radius: 100px;\n  padding: 3px 10px;\n  white-space: nowrap;\n}\n\n.cit-book__fields { display: grid; gap: 12px; }\n/* The author display:grid outranks the UA's [hidden]{display:none} (author origin\n * always wins) — measured trap 2026-09-06: the \"hidden\" element stayed visible on\n * the screenshot everyone believed. Explicit rule, same specificity, later. */\n.cit-book__fields[hidden] { display: none; }\n.cit-book__field { display: grid; gap: 5px; }\n.cit-book__label {\n  font-size: 0.72rem;\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  color: var(--cit-muted);\n  font-weight: 600;\n}\n.cit-book__input {\n  font: inherit;\n  color: var(--cit-ink);\n  background: var(--cit-bg);\n  border: 1px solid var(--cit-line);\n  border-radius: calc(var(--cit-radius) * 0.6);\n  padding: 11px 12px;\n  width: 100%;\n}\n.cit-book__input:focus { outline: 2px solid var(--cit-accent); outline-offset: 1px; }\n\n/* Guests stepper */\n.cit-book__stepper {\n  display: inline-flex;\n  align-items: center;\n  border: 1px solid var(--cit-line);\n  border-radius: calc(var(--cit-radius) * 0.6);\n  background: var(--cit-bg);\n  overflow: hidden;\n  width: fit-content;\n}\n.cit-book__step {\n  font: inherit;\n  border: 0;\n  background: transparent;\n  color: var(--cit-ink);\n  width: 44px;\n  height: 44px;\n  font-size: 1.2rem;\n  cursor: pointer;\n  line-height: 1;\n}\n.cit-book__step:hover { background: var(--cit-surface); }\n.cit-book__count { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }\n\n.cit-book__submit {\n  font: inherit;\n  font-weight: 700;\n  cursor: pointer;\n  border: 0;\n  border-radius: calc(var(--cit-radius) * 0.7);\n  background: var(--cit-accent);\n  color: var(--cit-on-accent);\n  padding: 13px 18px;\n  transition: transform 0.15s ease, filter 0.15s ease;\n}\n.cit-book__submit:hover { transform: translateY(-1px); filter: brightness(1.05); }\n\n.cit-book__note { margin: 0; font-size: 0.78rem; color: var(--cit-muted); }\n.cit-book__note--err { color: var(--cit-accent); }\n\n/* Booking widget layout (owner decree 2026-08-23 — \"milyen gagyi az elrendezése\"):\n   the CALENDAR leads on the left (it is what sells the module), a compact request\n   panel on the right, one card, no floating islands. Single column on a phone. */\n.cit-book__cols { display: grid; gap: 22px; align-items: start; }\n@media (min-width: 860px) {\n  .cit-book__cols { grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.85fr); gap: 28px; }\n  .cit-book__formcol {\n    border-left: 1px solid var(--cit-line);\n    padding-left: 26px;\n  }\n}\n.cit-book__calcol { display: grid; gap: 12px; min-width: 0; }\n.cit-book__formcol { display: grid; gap: 14px; align-content: start; min-width: 0; }\n/* The picked range as a slim strip UNDER the calendar — real date inputs (OS picker\n   + keyboard path survive), but visually a summary, not two fat fields competing\n   with the calendar for attention. */\n.cit-book__dates {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  flex-wrap: wrap;\n  padding: 10px 12px;\n  border: 1px solid var(--cit-line);\n  border-radius: calc(var(--cit-radius) * 0.6);\n  background: color-mix(in srgb, var(--cit-ink) 3%, var(--cit-bg));\n}\n.cit-book__date { display: grid; gap: 2px; min-width: 0; }\n.cit-book__dinput {\n  font: inherit;\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--cit-ink);\n  background: transparent;\n  border: 0;\n  padding: 0;\n  min-width: 0;\n  max-width: 100%;\n}\n.cit-book__arrow { color: var(--cit-muted); font-size: 1rem; }\n/* Why book HERE — the process facts that answer the hesitation at the decision\n   point (and carry the module's own sales argument: no platform commission). */\n.cit-book__trust {\n  list-style: none;\n  margin: 2px 0 0;\n  padding: 0;\n  display: grid;\n  gap: 8px;\n}\n.cit-book__trust li {\n  display: flex;\n  align-items: flex-start;\n  gap: 9px;\n  font-size: 0.82rem;\n  line-height: 1.45;\n  color: var(--cit-muted);\n}\n.cit-book__trust svg {\n  width: 15px;\n  height: 15px;\n  flex: 0 0 auto;\n  margin-top: 2px;\n  stroke: var(--cit-accent);\n  fill: none;\n}\n.cit-book__nights {\n  margin-left: auto;\n  font-size: 0.78rem;\n  font-weight: 600;\n  color: var(--cit-accent);\n  white-space: nowrap;\n}\n\n/* Visible availability calendar: the guest SEES the owner-managed busy nights per\n   unit; tapping two free days fills the date inputs. Token-themed; two months side\n   by side where there is room, one on a phone. */\n.cit-book__field--wide { grid-column: 1 / -1; }\n.cit-book__cal {\n  display: grid;\n  gap: 10px;\n  padding: 14px;\n  border: 1px solid var(--cit-line);\n  border-radius: calc(var(--cit-radius) * 0.7);\n  background: color-mix(in srgb, var(--cit-ink) 3%, var(--cit-bg));\n}\n.cit-book__calhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }\n.cit-book__callabel {\n  font-size: 0.72rem;\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  color: var(--cit-muted);\n  font-weight: 600;\n}\n.cit-book__calnav {\n  width: 44px;\n  height: 44px;\n  flex: 0 0 44px; /* the flex head shrank it to 28px beside the long label */\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  border: 1px solid var(--cit-line);\n  background: var(--cit-bg);\n  color: var(--cit-ink);\n  border-radius: 8px;\n  cursor: pointer;\n  padding: 0;\n}\n.cit-book__calnav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }\n.cit-book__calnav--next svg { transform: rotate(180deg); }\n.cit-book__calnav:disabled { opacity: 0.35; cursor: default; }\n/* Two months side by side, but only where BOTH fit properly — a squeezed second\n   month is what made the grid read as scattered dots (measured: 225px minimum was\n   too generous, the columns stretched and the days floated apart). */\n/* auto-fit, NOT a viewport media query: the calendar lives in the left COLUMN, which\n   is far narrower than the screen — sizing cells off the viewport made the grid\n   overflow into the form column (measured at 1440px). auto-fit asks the real\n   container, so two months fit when the column can hold them and one when it cannot. */\n.cit-book__months {\n  display: grid;\n  gap: 16px;\n  grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));\n}\n/* On a phone ONE month at a time — two stacked months turned the widget into a\n   scroll marathon before the guest reached the fields. The chevrons page through. */\n@media (max-width: 559px) { .cit-book__months > .cit-book__month + .cit-book__month { display: none; } }\n/* A month never stretches beyond a comfortable measure: without this the seven\n   columns drift apart into the \"scattered dots\" the owner called gagyi. */\n.cit-book__month { width: 100%; max-width: 300px; margin-inline: auto; }\n.cit-book__mlabel {\n  margin: 0 0 8px;\n  font-size: 0.76rem;\n  font-weight: 700;\n  letter-spacing: 0.02em;\n  color: var(--cit-ink);\n  text-align: center;\n}\n/* Fixed 7 × 32px tracks, centred: the row does not stretch to the container width,\n   so the days stay a compact block instead of drifting to the far edges. */\n/* Fluid 7 columns inside the month's capped measure: the cells grow with the space\n   they actually have and can never overflow the column. */\n.cit-book__mgrid {\n  display: grid;\n  grid-template-columns: repeat(7, minmax(0, 1fr));\n  gap: 3px;\n}\n.cit-book__dow {\n  font-size: 0.62rem;\n  font-weight: 600;\n  color: var(--cit-muted);\n  text-align: center;\n  padding: 0 0 4px;\n  line-height: 1;\n}\n.cit-book__day {\n  aspect-ratio: 1;\n  min-height: 38px;\n  min-width: 0;\n  border: 1px solid transparent;\n  background: transparent;\n  font: inherit;\n  font-size: 0.8rem;\n  line-height: 1;\n  color: var(--cit-ink);\n  border-radius: 7px;\n  cursor: pointer;\n  padding: 0;\n  transition: background 0.12s, color 0.12s, border-color 0.12s;\n}\n.cit-book__day:hover:not(:disabled) {\n  background: color-mix(in srgb, var(--cit-accent) 14%, transparent);\n  border-color: color-mix(in srgb, var(--cit-accent) 45%, transparent);\n}\n.cit-book__day:disabled { color: color-mix(in srgb, var(--cit-muted) 45%, transparent); cursor: default; }\n.cit-book__day--busy {\n  text-decoration: line-through;\n  background: color-mix(in srgb, var(--cit-muted) 14%, transparent);\n  color: var(--cit-muted);\n}\n.cit-book__day--sel {\n  background: var(--cit-accent);\n  color: var(--cit-on-accent, #fff);\n  font-weight: 700;\n}\n.cit-book__day--range { background: color-mix(in srgb, var(--cit-accent) 16%, transparent); }\n/* ⛔ KONTRAKTUS ⑦: OLVASHATÓ JELMAGYARÁZAT. Mérve a régi lapon: 11,84 px,\n   kontraszt 3,99 (az AA-küszöb 4,5), és a „szabad\" minta FEHÉR A FEHÉREN egy halvány\n   1 px-es kerettel. Itt: nagyobb betű, sötétebb szöveg (a szöveg-tokenből, nem a\n   muted-ból), és MINDEN mintának erős kerete van — színvakon is elkülönül. */\n.cit-book__legend {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  flex-wrap: wrap;\n  font-size: 0.82rem;\n  font-weight: 600;\n  color: var(--cit-ink);\n}\n.cit-book__lg { width: 15px; height: 15px; border-radius: 5px; display: inline-block;\n  border: 1.5px solid color-mix(in srgb, var(--cit-ink) 70%, transparent); }\n.cit-book__lg--free { background: var(--cit-bg); }\n.cit-book__lg--busy { background: color-mix(in srgb, var(--cit-muted) 30%, transparent); }\n.cit-book__legend .cit-book__lg--busy { margin-left: 8px; }\n\n/* Variant: bar — a compact horizontal booking bar (wide screens). */\n@media (min-width: 720px) {\n  .cit-book--bar { grid-template-columns: 1fr auto; align-items: end; }\n  .cit-book--bar .cit-book__title { grid-column: 1 / -1; }\n  .cit-book--bar .cit-book__fields {\n    grid-column: 1;\n    grid-template-columns: repeat(3, minmax(120px, 1fr));\n    align-items: end;\n  }\n  .cit-book--bar .cit-book__submit { grid-column: 2; height: 44px; align-self: end; white-space: nowrap; }\n  .cit-book--bar .cit-book__note { grid-column: 1 / -1; }\n  /* Approved \"B\" contract: once the contact block is open it takes the full bar\n     width and the submit moves under it — the button belongs after the fields\n     the guest is being asked to fill. */\n  .cit-book--bar [data-contact] { grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(140px, 1fr)); }\n  .cit-book--bar:has([data-contact]:not([hidden])) .cit-book__submit {\n    grid-column: 1 / -1;\n    justify-self: start;\n  }\n}\n\n/* Variant: request — the REAL booking form (ADR-0044), mounted when the owner\n   bought the booking module. It carries more fields than the enquiry bar, so it\n   stays one readable column on a phone and only splits in two on a real screen. */\n.cit-book--request .cit-book__fields { gap: 14px; }\n.cit-book--request .cit-book__submit { width: 100%; margin-top: 4px; }\n.cit-book--request .cit-book__submit[disabled] { opacity: 0.55; cursor: not-allowed; }\n.cit-book--request textarea.cit-book__input { resize: vertical; min-height: 74px; }\n@media (min-width: 720px) {\n  .cit-book--request .cit-book__fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .cit-book--request .cit-book__field--wide { grid-column: 1 / -1; }\n  .cit-book--request .cit-book__submit { width: auto; min-width: 240px; }\n}\n/* …but inside the two-column layout the request panel is the NARROW column, so its\n   fields stay stacked and the CTA spans it fully (a 2-up grid there produced the\n   cramped half-width inputs). Wins on specificity over the rule above. */\n@media (min-width: 860px) {\n  .cit-book__formcol .cit-book__fields { grid-template-columns: 1fr; gap: 12px; }\n  .cit-book__formcol .cit-book__submit { width: 100%; min-width: 0; }\n}\n/* ── PHONE: TWO STEPS (owner's choice B, 2026-09-26 — contract:\n   design-refs/tenant-site/booking-mobile-two-step/README.md). Everything here is scoped to\n   narrow widths; on a desktop these elements stay hidden and the two-column card is untouched. */\n.cit-book__status, .cit-book__go, .cit-book__sum { display: none; }\n.cit-book__formcol, .cit-book__calcol { scroll-margin-top: var(--cit-stick, 0px); }\n@media (max-width: 559px) {\n  .cit-book__status.cit-book__status { display: block; margin: 8px 0 0; padding: 10px 12px; border-radius: calc(var(--cit-radius) * 0.6);\n    font-size: 0.9rem; line-height: 1.4; font-weight: 600; color: var(--cit-accent);\n    background: color-mix(in srgb, var(--cit-accent) 10%, var(--cit-bg));\n    border: 1px solid color-mix(in srgb, var(--cit-accent) 40%, transparent); }\n  .cit-book__status[hidden] { display: none; }\n  .cit-book__go { display: block; width: 100%; margin: 14px 0 0; padding: 0 16px; min-height: 48px; border: 0;\n    border-radius: calc(var(--cit-radius) * 0.7); background: var(--cit-accent); color: var(--cit-on-accent);\n    font: inherit; font-weight: 700; cursor: pointer; }\n  .cit-book__go[disabled] { opacity: 0.55; cursor: not-allowed; }\n  .cit-book--request:not(.cit-book--step2) .cit-book__formcol { display: none; }\n  .cit-book--step2 .cit-book__calcol { display: none; }\n  .cit-book--step2 .cit-book__sum { display: grid; gap: 4px; padding: 12px 14px; margin: 0 0 14px;\n    border-radius: calc(var(--cit-radius) * 0.6); background: color-mix(in srgb, var(--cit-ink) 4%, var(--cit-bg));\n    border: 1px solid var(--cit-line); font-size: 0.9rem; }\n  .cit-book__sum b { font-size: 1rem; }\n  /* booking-unit-default ②–③: the unit picker leads step 1 (moved here by the runtime),\n     and the step-2 summary names the unit */\n  .cit-book__calcol > .cit-book__field { margin: 0 0 14px; }\n  .cit-book__sumunit { font-weight: 700; }\n  /* the mirrored total line keeps the bar's own size and weight — only the amount's nowrap comes along */\n  .cit-book__sum span b { font-size: inherit; font-weight: inherit; }\n  .cit-book__edit { justify-self: start; font: inherit; font-weight: 700; color: var(--cit-accent); background: none;\n    border: 0; padding: 8px 0; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }\n}\n\n/* After sending, the form is REPLACED by the confirmation — a form left standing\n   invites the same guest to send the identical request twice. */\n.cit-book--done .cit-book__note { margin-top: 8px; }\n\n/* Variant: card — a stacked vertical panel (default / narrow / sidebar). */\n.cit-book--card { max-width: 420px; }\n\n/* ── gallery lightbox (module: gallery) ─────────────────────────────────────\n * Progressive enhancement: the in-skin \u003cimg>s stay as authored; JS only adds a\n * zoom affordance + this overlay. Token-themed so it matches every archetype. */\n[data-cit-module=\"gallery\"] img { cursor: zoom-in; }\n[data-cit-module=\"gallery\"] img:focus-visible {\n  outline: 3px solid var(--cit-accent);\n  outline-offset: 2px;\n}\n\n.cit-lb {\n  position: fixed;\n  inset: 0;\n  z-index: 9999;\n  display: none;\n  align-items: center;\n  justify-content: center;\n  font-family: var(--cit-font-body);\n}\n.cit-lb[data-open] { display: flex; }\n.cit-lb__scrim { position: absolute; inset: 0; background: rgba(12, 10, 9, 0.88); }\n.cit-lb__stage {\n  position: relative;\n  margin: 0;\n  max-width: 92vw;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 12px;\n}\n.cit-lb__img {\n  display: block;\n  max-width: 92vw;\n  max-height: 82vh;\n  object-fit: contain;\n  border-radius: var(--cit-radius);\n  box-shadow: var(--cit-shadow);\n  background: var(--cit-surface);\n}\n.cit-lb__cap {\n  color: #f3efe9;\n  font-size: 0.85rem;\n  opacity: 0.9;\n  text-align: center;\n  max-width: 60ch;\n}\n.cit-lb__btn {\n  position: absolute;\n  z-index: 1;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 46px;\n  height: 46px;\n  padding: 0;\n  border: 0;\n  border-radius: 999px;\n  background: var(--cit-accent);\n  color: var(--cit-on-accent);\n  cursor: pointer;\n  transition: transform 0.15s ease, filter 0.15s ease;\n}\n.cit-lb__btn:hover { transform: scale(1.06); filter: brightness(1.08); }\n.cit-lb__btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }\n.cit-lb__btn--close { top: 18px; right: 18px; }\n.cit-lb__btn--prev { top: 50%; left: 18px; transform: translateY(-50%); }\n.cit-lb__btn--next { top: 50%; right: 18px; transform: translateY(-50%) scaleX(-1); }\n.cit-lb__btn--prev:hover { transform: translateY(-50%) scale(1.06); }\n.cit-lb__btn--next:hover { transform: translateY(-50%) scaleX(-1) scale(1.06); }\n.cit-lb__count {\n  position: absolute;\n  bottom: 18px;\n  left: 50%;\n  transform: translateX(-50%);\n  color: #f3efe9;\n  font-size: 0.78rem;\n  letter-spacing: 0.04em;\n  opacity: 0.8;\n}\n@media (max-width: 560px) {\n  .cit-lb__btn { width: 44px; height: 44px; }\n  .cit-lb__btn--prev { left: 8px; }\n  .cit-lb__btn--next { right: 8px; }\n}\n\n/* ── map / location (module: map) ───────────────────────────────────────────\n * Click-to-load facade → lazy Google embed only after opt-in (privacy). */\n.cit-map { margin-top: 16px; border-radius: var(--cit-radius); overflow: hidden; border: 1px solid var(--cit-line); }\n.cit-map__load {\n  font: inherit;\n  font-family: var(--cit-font-body);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 9px;\n  width: 100%;\n  min-height: 200px;\n  padding: 24px;\n  border: 0;\n  cursor: pointer;\n  color: var(--cit-ink);\n  background: var(--cit-surface);\n  font-weight: 600;\n}\n.cit-map__load:hover { filter: brightness(0.98); }\n.cit-map__load svg { width: 22px; height: 22px; stroke: var(--cit-accent); fill: none; }\n.cit-map__frame { display: block; width: 100%; height: 340px; border: 0; }\n\n/* ── reviews carousel (module: reviews) ─────────────────────────────────────\n * The in-skin [data-cit-track] of real review cards becomes a snap scroller. */\n.cit-rev__track {\n  display: flex;\n  gap: 18px;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  -webkit-overflow-scrolling: touch;\n  scrollbar-width: none;\n  padding-bottom: 4px;\n}\n.cit-rev__track::-webkit-scrollbar { display: none; }\n.cit-rev__slide { scroll-snap-align: center; flex: 0 0 min(100%, 420px); }\n.cit-rev__nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }\n.cit-rev__btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 40px;\n  height: 40px;\n  border: 1px solid var(--cit-line);\n  border-radius: 999px;\n  background: var(--cit-bg);\n  color: var(--cit-ink);\n  cursor: pointer;\n  transition: border-color 0.15s ease, transform 0.15s ease;\n}\n.cit-rev__btn:hover { border-color: var(--cit-accent); }\n.cit-rev__btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }\n.cit-rev__btn--next svg { transform: scaleX(-1); }\n.cit-rev__dots { display: inline-flex; align-items: center; gap: 8px; }\n.cit-rev__dot {\n  width: 8px;\n  height: 8px;\n  padding: 0;\n  border: 0;\n  border-radius: 999px;\n  background: var(--cit-line);\n  cursor: pointer;\n  transition: background 0.15s ease, transform 0.15s ease;\n}\n.cit-rev__dot[aria-current=\"true\"] { background: var(--cit-accent); transform: scale(1.3); }\n\n/* SAMPLE-photo watermark (owner decree 2026-08-23): a room photo standing in for a\n   room we do not know about must be unmistakable ON THE PICTURE — the lead who sees\n   an invented room reads it as a false claim about their own property and drops the\n   whole mock (\"nálam nincs is apartman, ez nem az én szállásom\"). A corner ribbon\n   was clipped by the card's overflow, so this is the classic centred watermark:\n   readable at any card size, drawn by the runtime over any flagged \u003cimg> so all 16\n   templates get it from one place. */\n/* Tight wrapper around the flagged image — the band belongs ON the picture, not on\n   whatever box happens to contain it (a table cell swallowed it whole).\n   ⛔⛔ `height:100%` MADE IT SWALLOW THE CARD AGAIN (measured 2026-09-13, 19 templates).\n   In a column-flex room card the li has a definite height (it is stretched by its row),\n   so the wrapper's 100% resolved against the WHOLE CARD instead of the picture: the\n   rotated band spilled past the card edges and covered the room name. That is the same\n   failure the tight wrapper was invented to fix — reintroduced by a sizing shortcut.\n   The wrapper now HUGS the image by default; where the picture genuinely filled its\n   frame's height, the runtime re-grants `height:100%` (it measures that, see\n   markSamplePhotos) instead of every wrapper claiming it blind.\n   Guard: scripts/room-card-overflow-check.mts */\n.cit-wmwrap {\n  position: relative;\n  display: block;\n  line-height: 0;\n  container-type: inline-size;\n  width: 100%;\n}\n.cit-wmwrap[data-cit-wmfill] {\n  height: 100%;\n}\n/* ⛔⛔ THE BAND IS ROTATED, SO ITS BOX IS BIGGER THAN THE PICTURE. A -14° rotation of a\n   300×200 slot reaches ~33px above and below it — enough to land the corners on the room\n   name underneath and to stick out past the card's edge. Measured on 19 templates\n   (2026-09-13) as \"a kép takarja a szöveget\", and it happened with a PERFECTLY LOADED\n   photo too, so it was never only a broken-image problem.\n   The clip layer is the answer that does not need a new number per template: the mark may\n   live anywhere ON the picture and nowhere else. It wraps the band (never the image), so a\n   template that rotates its own photo — tilted-gallery, scrapbook — keeps its picture\n   untouched. Guard: scripts/room-card-overflow-check.mts */\n.cit-wmclip {\n  position: absolute;\n  inset: 0;\n  z-index: 3;\n  overflow: hidden;\n  border-radius: inherit;\n  pointer-events: none;\n}\n/* APPROVED PLAN, variant C (owner's pick, 2026-09-14 — assets/design-refs/engine/\n   roomcard-sample-mark/): a small \"MINTA\" pill in a corner of the picture instead of the\n   diagonal wash that covered the whole photo. The owner's reasoning: the photo is what\n   sells, so the mark must be unmistakable without dimming the image. §B.17 is still met —\n   the pill sits ON the picture it qualifies, and the section keeps its own \"Minta\" note. */\n.cit-wm {\n  position: absolute;\n  top: 8px;\n  z-index: 3;\n  display: flex;\n  align-items: center;\n  padding: 4px 9px;\n  border-radius: 100px;\n  font-family: var(--cit-font-body);\n  font-size: 0.66rem;\n  font-weight: 800;\n  letter-spacing: 0.12em;\n  line-height: 1.3;\n  white-space: nowrap;\n  color: #fff;\n  background: rgba(0, 0, 0, 0.55);\n  pointer-events: none;\n}\n/* WHICH CORNER IS MEASURED, NOT ASSUMED. Templates draw their own things on the picture —\n   `horizontal` puts the chapter number at top-LEFT, `watercolor`/`aurora` put a capacity\n   badge elsewhere. An opaque pill dropped on a fixed corner would bury one of them, and\n   unlike the old translucent wash it does not let the text through. The runtime picks the\n   free corner (see markSamplePhotos); this is only the default.\n   Guard: scripts/room-card-overflow-check.mts */\n.cit-wm { left: 8px; }\n.cit-wm--right { left: auto; right: 8px; }\n.cit-wm--bottom { top: auto; bottom: 8px; }\n/* A tiny picture (the transit row thumbnail is 50×36 on a phone) cannot hold a padded\n   pill: it would be clipped to a stub, which is not a mark but a defect. Smaller type,\n   tighter tracking, and it hugs the corner. */\n.cit-wm--sm {\n  top: 3px;\n  padding: 2px 5px;\n  letter-spacing: 0.04em;\n  font-size: 9px;\n}\n.cit-wm--sm.cit-wm--right { right: 3px; }\n.cit-wm--sm.cit-wm--bottom { top: auto; bottom: 3px; }\n.cit-wm--sm:not(.cit-wm--right) { left: 3px; }\n\n/* The rating badge is a link when we can point at Google's own reviews — it must\n   look clickable (owner request 2026-08-23). */\na.cit-grat { transition: border-color 0.15s ease, transform 0.15s ease; }\na.cit-grat:hover {\n  border-color: var(--cit-accent);\n  transform: translateY(-1px);\n}\n\n/* Server-side map embed (owner ruling 2026-09-01: the map renders, it is not a\n   click-to-load facade). Fills the slot it sits in; the address pin card behind it\n   stays as the no-frame fallback. */\n.cit-map__frame--inline { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }\n\n/* THE MAP SLOT IS NEVER JUST THE FRAME (Elek FK-004b H-1, measured 2026-09-13).\n   Until now the module-section map WAS the bare iframe, sized and framed by this\n   sheet — so the one time the embed did not paint, the lead was handed a 1120×340 px\n   bordered void: no map, no text, no error, nothing to tell them whether something\n   broke or it was built that way. The box now holds the pin card underneath (the\n   property's own name — real content, not a placeholder), and the frame floats over\n   it on z-index 1. Guard: scripts/lead-page-surface-check.mts ①. */\n.cit-modsec .cit-map-box { position: relative; min-height: 340px; margin-top: 16px;\n  border-radius: var(--cit-radius); overflow: hidden; border: 1px solid var(--cit-line);\n  background: var(--cit-surface); }\n.cit-map-pin { position: absolute; inset: 0; display: flex; flex-direction: column;\n  align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 24px; }\n/* The shared pin icon is an OUTLINE everywhere else in a module section (stroke, no\n   fill) — `color` alone left it a solid black blob here. Same treatment as\n   .cit-modsec__item svg, one size up. */\n.cit-map-pin svg { width: 34px; height: 34px; stroke: var(--cit-accent); fill: none; stroke-width: 1.6; }\n.cit-map-pin strong { font-family: var(--cit-font-display); font-size: 1.2rem; color: var(--cit-ink); }\n\n/* ── stay quote (owner decree 2026-09-06) + NYITOTT BONTÁS (tulaj 2026-09-14,\n   design-refs/tenant-site/booking-price-clarity „A\"): a bontás MINDIG látszik, az alap\n   ki van mondva, és a HELYSZÍNEN fizetendő külön dobozban áll — mert nem része a\n   szállásdíjnak. ── */\n.cit-book__quote{display:block;margin-top:10px;padding:12px 13px;border-radius:12px;\n  background:var(--cit-bg);border:1.5px solid var(--cit-accent)}\n.cit-book__quote:empty{display:none;border:0;padding:0}\n.cit-book__qh{display:block;font-size:.73rem;font-weight:800;letter-spacing:.05em;\n  text-transform:uppercase;color:var(--cit-accent);margin-bottom:8px}\n.cit-book__qline{display:block;font-size:.83rem;color:var(--cit-ink,#10243a);line-height:1.55}\n.cit-book__qbasis{display:block;font-size:.78rem;color:var(--cit-muted,#60748b);\n  line-height:1.5;margin:4px 0 6px}\n.cit-book__qrow{display:flex;justify-content:space-between;gap:12px;font-size:.83rem;\n  line-height:1.55;padding:2px 0}\n.cit-book__qtotal{display:block;font-size:1rem;font-weight:700;margin-top:6px;padding-top:7px;\n  color:var(--cit-ink,#10243a);border-top:1px solid var(--cit-line)}\n.cit-book__qtotal b{float:right}\n/* An amount never breaks between its digits and its unit (\"72 000 / Ft\" on the phone's\n   step-2 bar, measured 2026-09-27): the string stays plain-spaced (ADR-0162 ⑤), the\n   element carries the rule. Written by cit-runtime.js moneyHtml(). */\n.cit-amt{white-space:nowrap}\n.cit-book__later{margin-top:9px;padding:9px 11px;border-radius:10px;font-size:.81rem;\n  line-height:1.5;color:var(--cit-ink,#10243a);\n  background:color-mix(in srgb,var(--cit-accent) 8%, var(--cit-bg));\n  border:1px solid color-mix(in srgb,var(--cit-accent) 30%, transparent)}\n/* ÁRAJÁNLAT-MÓD (kontraktus: design-refs/tenant-site/quote-request, tulaj 2026-09-22).\n   Ez a doboz ÁLL OTT, ahol eddig néma üresség volt: ha a tartózkodásra nem áll össze ár,\n   a vendég megtudja, MIÉRT nincs szám. A skin akcentszínéből derivál (nincs nyers hex),\n   de a sima ár-doboznál hangsúlyosabb kerettel — más állapot, más súly. */\n/* ⛔ A doboznak NINCS saját kerete: a `.cit-book__quote` konténer MÁR visel egy\n   1,5 px-es akcent-keretet + hátteret, és az első változatom egy másodikat tett bele —\n   kettős keret, a KÉPEN látszott, a gépi állításaim mind zölden álltak. Az ÁLLAPOTOT\n   ezért a konténer viseli (`--ask`), a tartalom csak tartalom. */\n.cit-book__ask{font-size:.86rem;line-height:1.5;color:var(--cit-ink,#10243a)}\n.cit-book__ask b{display:block;margin-bottom:3px}\n.cit-book__ask span{display:block}\n.cit-book__ask-sub{margin-top:5px;font-size:.8rem;color:var(--cit-muted)}\n/* DEMO (mock): the sample-price sentence under the total — the same muted voice as the\n   quote-mode footnote, so the box reads as one thing, with the word MINTA in it. */\n.cit-book__qsample{display:block;margin-top:6px;font-size:.78rem;line-height:1.5;color:var(--cit-muted,#60748b)}\n/* Az árajánlat-állapot a KONTÉNEREN jelenik meg — egy keret, erősebb hangsúllyal. */\n.cit-book__quote--ask{background:color-mix(in srgb,var(--cit-accent) 10%, var(--cit-bg))}\n/* A gomb is más állapotot visel — de a felirat kontrasztja marad a mérce. */\n.cit-book__submit[data-cit-mode=\"ask\"]{\n  background:color-mix(in srgb,var(--cit-accent) 82%, var(--cit-ink))}\n\n/* ⑤ a nyugta LÉPÉSEI — teendő, nem csak kód */\n.cit-book__steph{margin:12px 0 7px;font-size:.73rem;font-weight:800;letter-spacing:.05em;\n  text-transform:uppercase;color:var(--cit-accent)}\n.cit-book__steps{counter-reset:citstep;list-style:none;margin:0;padding:0;display:grid;gap:9px}\n.cit-book__steps li{counter-increment:citstep;position:relative;padding-left:32px;\n  font-size:.85rem;line-height:1.5;color:var(--cit-ink,#10243a)}\n.cit-book__steps li::before{content:counter(citstep);position:absolute;left:0;top:0;\n  width:23px;height:23px;border-radius:999px;background:var(--cit-accent);color:#fff;\n  display:grid;place-items:center;font-size:.76rem;font-weight:800}\n/* ⑥ a nyugta KIÚTJA — a vendég feladata itt véget ért; a kártya mutassa, merre tovább.\n   Körvonalas (másodlagos) gomb: nem versenyez a nyugtával, de ≥ 44 px-es koppintási cél.\n   `.cit-book--done a.…` — a sablonok saját `a`-szabályai ne színezzék át. */\n.cit-book__homep{margin:16px 0 0}\n.cit-book--done a.cit-book__home{display:flex;align-items:center;justify-content:center;\n  min-height:44px;padding:0 16px;border:1.5px solid var(--cit-accent);\n  border-radius:calc(var(--cit-radius) * 0.6);color:var(--cit-accent);background:transparent;\n  font-size:.85rem;font-weight:700;text-decoration:none}\n@media(min-width:560px){.cit-book--done a.cit-book__home{display:inline-flex;padding:0 28px}}\n.cit-book--done a.cit-book__home:hover{background:color-mix(in srgb,var(--cit-accent) 8%, transparent)}\n/* ── egy-egységes szállás: teljes szélességű panel (kontraktus ⑨) ── */\n.cit-whole{display:grid;gap:14px;border:1px solid var(--cit-line);\n  border-radius:var(--cit-radius);padding:16px}\n@media(min-width:760px){.cit-whole{grid-template-columns:1fr 1fr;align-items:start}}\n.cit-whole__img{width:100%;aspect-ratio:3/2;object-fit:cover;\n  border-radius:calc(var(--cit-radius) * 0.4)}\n.cit-whole__t{margin:0;font-size:1.05rem;font-weight:700;color:var(--cit-ink)}\n.cit-whole__note{margin:6px 0 0;font-size:.9rem;line-height:1.6;color:var(--cit-muted)}\n.cit-whole__facts{list-style:none;margin:12px 0 0;padding:0;display:grid;\n  grid-template-columns:1fr 1fr;gap:9px}\n.cit-whole__facts li{background:color-mix(in srgb,var(--cit-ink) 4%,transparent);\n  border-radius:10px;padding:9px 11px;font-size:.86rem;color:var(--cit-ink)}\n.cit-whole__facts b{display:block;font-size:.71rem;font-weight:700;letter-spacing:.05em;\n  text-transform:uppercase;color:var(--cit-muted);margin-bottom:2px}\n\n/* ── the guest's RECEIPT after sending (Elek FK-007, 2026-09-11) ──\n   Label/value rows so the numbers line up on a 390 px screen too: the label\n   shrinks, the value never wraps mid-figure (a broken \"32 000\" reads as two\n   prices). The total keeps the quote's own styling, so the number the guest\n   saw before sending and the number they read after are visibly the same one. */\n.cit-book__receipt{display:block;margin:10px 0;padding:12px 14px;border-radius:12px;\n  background:var(--cit-surface-2,rgba(16,36,58,.04));border:1px solid var(--cit-line,rgba(16,36,58,.12))}\n.cit-book__rrow{display:flex;gap:12px;align-items:baseline;justify-content:space-between;\n  font-size:.86rem;line-height:1.65}\n.cit-book__rrow>span{color:var(--cit-muted,#60748b);flex:0 1 auto}\n.cit-book__rrow>b{color:var(--cit-ink,#10243a);text-align:right;flex:1 1 auto;\n  white-space:nowrap;font-variant-numeric:tabular-nums}\n.cit-book__receipt .cit-book__qline{margin-top:2px}\n.cit-book__receipt .cit-book__qtotal{margin-top:8px;padding-top:8px;font-size:1rem;\n  border-top:1px solid var(--cit-line,rgba(16,36,58,.12))}\n\n/* ══ ROOM CARD + DETAILS POPOVER ═══════════════════════════════════════════════\n   APPROVED PLAN, variant B (owner, 2026-09-21 — assets/design-refs/tenant-site/\n   rooms-card/: README.md is the contract, plan.html the reference implementation).\n\n   ONE markup, themed only from --cit-* → in-skin in all 19 templates by itself\n   (ADR-0011 hydrating runtime, ADR-0057 in-skin module). ⛔ A generic white modal\n   is forbidden: it would look borrowed on every single skin.\n\n   ⚠️ @container, NOT @media: the popover sits inside the page's own box and has to\n   react to THAT box. (The measurement frame the plan was judged in is 390px wide\n   while the window is not — a @media rule would have answered the wrong question.) */\n.cit-rooms-js .cit-rmore { display: none; }   /* JS lifts it into the popover */\n.cit-room__open { color: inherit; text-decoration: none; cursor: pointer; }\n.cit-room__open:focus-visible { outline: 2px solid var(--cit-accent); outline-offset: 4px; }\n/* ⛔ ZERO specificity on purpose (:where). The shell wraps markup each template\n   already lays out with its OWN class — `.cit-whole` is a flex panel, several room\n   cards are grids. A plain `.cit-room__open{display:block}` sits LATER in this sheet\n   than those rules and, at equal specificity, would silently win and flatten them.\n   (The console already paid for that exact lesson: a link rule ate a button's colour.)\n   `:where()` lets a template class take the layout back, while an anchor that\n   declares nothing still stops being inline. */\n:where(.cit-room__open) { display: block; }\n\n/* The badge is absolutely placed, so the photo box must be its positioning context.\n   `.tb-thumbwrap` is transit's table-row thumbnail; the others are the shared block. */\n.cit-whole__imwrap, .cit-modsec__roomim { position: relative; display: block; }\n/* ⛔⛔ THE SHELL MUST NOT SHRINK. `.cit-modsec__item` is a column flex with\n   align-items:flex-start, so wrapping the card's contents in the clickable shell turned\n   them into ONE flex item that shrank to its content — measured: the room photo went\n   from full card width to 75×50px, and the badge nearly covered the whole picture.\n   The wrapper is a shell, not a new layout: it inherits the width it replaced. */\n.cit-modsec__item > .cit-room__open, .cit-modsec__item > .cit-rmore { width: 100%; align-self: stretch; }\n/* ⛔ AND IT KEEPS THE COLUMN IT REPLACED. The name, the capacity and the price used to\n   be the \u003cli>'s own column-flex children; inside the block shell they became inline\n   runs and read \"Nádas apartman4 fő24 000 Ft / éj\" (FK-014, 2026-09-28). */\n.cit-modsec__room.cit-room__open { display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none; }\n.tb-thumbwrap { position: relative; display: inline-block; vertical-align: middle; }\n\n/* The explicit \"Részletek\" control next to Foglalás. One neutral, token-only style so\n   the affordance does not have to be re-styled in each of the 12 card markups. */\n.cit-rmbtn {\n  background: 0; border: 0; padding: 4px; cursor: pointer; font: inherit;\n  font-size: 11px; letter-spacing: .2em; text-transform: uppercase;\n  color: var(--cit-muted); text-decoration: underline; text-underline-offset: 4px;\n}\n.cit-rmbtn:hover { color: var(--cit-accent); }\n\n/* ── the badge ON the photo ────────────────────────────────────────────────────\n   ⭐ Owner ruling: the PHOTO must say it is clickable, and it must say so WITHOUT\n   hover — a phone has none. Measured opacity:1 with no interaction. It also reports\n   how many photos wait inside, a promise the popover then keeps. */\n.cit-rmhint {\n  position: absolute; right: 9px; bottom: 9px; z-index: 3;\n  display: flex; align-items: center; gap: 7px;\n  background: color-mix(in srgb, var(--cit-bg) 74%, transparent);\n  border: 1px solid color-mix(in srgb, var(--cit-accent) 55%, transparent);\n  color: var(--cit-ink); font-size: 10px; letter-spacing: .2em; text-transform: uppercase;\n  padding: 7px 10px; backdrop-filter: blur(2px); transition: .25s;\n  max-width: calc(100% - 18px); white-space: nowrap; overflow: hidden;\n  /* ⛔ NO pointer-events:none. It was here so the whole card would be the click target\n     — which it is anyway, since the badge sits INSIDE the card's \u003ca>. What it actually\n     did was make the badge invisible to hit-testing, so the room-card overflow guard\n     probed the badge's own text, got the IMG underneath, and reported \"the photo covers\n     the text\" on seven templates. The pill is painted ABOVE the photo; a measurement\n     that cannot see it will conclude the opposite. */\n}\n/* ⛔ The badge is absolutely placed, so it needs a positioned ancestor — and the photo\n   frame is a DIFFERENT element in each of the 12 card markups (.ad-im, .cn-im2, .og-im,\n   a bare \u003cfigure>…). Measured without this: on four templates the pill anchored to some\n   far ancestor and painted 200-900px away from its picture, one of them at y=-219, i.e.\n   off-screen. `:has` names the frame by what it CONTAINS instead of by 12 class names;\n   `:where` keeps it at zero specificity so a template that positions its own frame\n   deliberately still wins. */\n:where(.cit-room__open *:has(> .cit-rmhint)) { position: relative; }\n.cit-rmhint svg { flex: none; color: var(--cit-accent); }\n.cit-room__open:hover .cit-rmhint, .cit-room__open:focus-visible .cit-rmhint {\n  background: var(--cit-accent); color: var(--cit-on-accent); border-color: var(--cit-accent);\n}\n.cit-room__open:hover .cit-rmhint svg, .cit-room__open:focus-visible .cit-rmhint svg {\n  color: var(--cit-on-accent);\n}\n/* A thumbnail cannot hold a padded pill (the transit row image is 50×36 on a phone):\n   there the badge is the magnifier alone, riding the corner. Same lesson the SAMPLE\n   band already paid for. */\n.cit-rmhint--sm { right: 2px; bottom: 2px; padding: 3px; gap: 0; letter-spacing: 0; }\n.cit-rmhint--sm > span { display: none; }\n\n/* ── no-JS fallback: the SAME content, opened on the card ──────────────────── */\n.cit-rmore { margin-top: 14px; text-align: left; }\n.cit-rmore > summary {\n  cursor: pointer; font-size: 11px; letter-spacing: .2em; text-transform: uppercase;\n  color: var(--cit-accent); text-align: center; padding: 8px;\n}\n.cit-rmore__ph { display: flex; gap: 6px; overflow-x: auto; list-style: none; margin: 10px 0; padding: 0; }\n.cit-rmore__ph img { width: 96px; aspect-ratio: 4/3; object-fit: cover; display: block; }\n.cit-rmore__desc { color: var(--cit-muted); font-size: 14.5px; margin: 12px 0; }\n.cit-rmore__h {\n  font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--cit-accent);\n  margin-top: 14px;\n}\n.cit-rmore__am { display: grid; gap: 8px 14px; grid-template-columns: 1fr 1fr; margin: 10px 0 0; padding: 0; }\n.cit-rmore__am li { display: flex; align-items: center; gap: 9px; list-style: none; font-size: 14px; }\n.cit-rmore__am svg { flex: none; color: var(--cit-accent); }\n/* catalogue icons carry no size of their own: the sample unit's list painted 120px glyphs (2026-09-26) */\n.cit-rmore__am svg, .cit-rd__am li svg { width: 20px; height: 20px; flex: none; }\n.cit-rmore__empty { color: var(--cit-muted); font-size: 13.5px; font-style: italic; margin-top: 10px; }\n\n/* Anchor jumps (the nav's \"Foglalás\" → #cit-booking) land the target's top edge at the\n   screen's top edge — exactly where the sticky/fixed bar paints, so the section title was\n   hidden under it (measured on editorial + card-sidebar at 390px, 2026-09-26). The runtime\n   measures the bar and sets --cit-stick; every jump target keeps that much clear. */\n[data-cit-module], [id], .cit-book--done { scroll-margin-top: var(--cit-stick, 0px); }\n\n/* ── the popover ──────────────────────────────────────────────────────────── */\n.cit-rd { display: none; container-type: inline-size; }\n.cit-rd[data-open] { display: block; }\n/* ⛔⛔ !important, DELIBERATELY — an overlay a template can push off-screen is not an\n   overlay, so its position is not negotiable by page CSS.\n   MEASURED, not feared: `aurora`'s glass trick is\n       body>*:not(.au-aurora):not(.au-nav){position:relative;z-index:1}\n   which scores (0,2,1). A plain `.cit-rd` (0,1,0) lost, and so did a doubled\n   `.cit-rd.cit-rd` (0,2,0) — the \"fixed\" popover opened 4029px DOWN THE DOCUMENT with\n   zero height: the guest clicked a card and nothing happened. Specificity escalation is\n   a race a template can always win by adding one more `:not()`; a stated rule is not.\n   The SAME page rule has been silently hitting the shared lightbox all along, so it is\n   pinned here too. Any template may own its own stacking — neither may own these two. */\n.cit-rd { position: fixed !important; inset: 0 !important; z-index: 9000 !important; }\n.cit-lb { position: fixed !important; inset: 0 !important; z-index: 9999 !important; }\n/* ⛔ …AND THE STACKING ORDER (measured 2026-09-26, guest-mobile-check on aurora): the\n   position was pinned, the z-index was not — the same (0,2,1) rule set z-index:1 on the\n   popover and the lightbox, so aurora's fixed app bar (z 100) and mobile CTA bar (z 120)\n   painted OVER them: the X of both overlays sat under the bar, unreachable by thumb. */\n.cit-rd__veil {\n  position: absolute; inset: 0;\n  background: color-mix(in srgb, var(--cit-bg) 82%, transparent); backdrop-filter: blur(3px);\n}\n.cit-rd__panel {\n  position: absolute; inset: 0; overflow: hidden;\n  background: var(--cit-bg); color: var(--cit-ink); font-family: var(--cit-font-body);\n  border: 1px solid color-mix(in srgb, var(--cit-accent) 45%, transparent);\n  display: flex; flex-direction: column; box-shadow: var(--cit-shadow);\n}\n/* Desktop: a centred dialog, never taller than the viewport.\n   ⛔ NOT 100cqh — the container is container-type:inline-size, so the block-axis cq\n   unit does not resolve against it. Measured on the plan: the panel overflowed by\n   141px and pushed the Foglalás button 106px out of the frame. The panel is absolutely\n   positioned inside .cit-rd (inset:0), so plain % is both correct and simpler. */\n@container (min-width: 900px) {\n  .cit-rd__panel {\n    /* ⚠️ 40→24px keret. A hangolás skin-függő volt (ami artdeco-n átment, a\n       wordmark-grow betűivel megbukott), ezért a helyet SZERKEZETILEG adjuk hozzá:\n       a párbeszéd közelebb ül a képernyő széléhez, és a nyert 32px minden skinen\n       ugyanannyi — nem a betűméret szerencséje. */\n    inset: 24px auto auto 50%; transform: translateX(-50%);\n    width: min(1060px, 92%); max-height: calc(100% - 48px);\n  }\n}\n.cit-rd__x {\n  position: absolute; top: 10px; right: 10px; z-index: 6; width: 44px; height: 44px;\n  border: 0; cursor: pointer; font-family: inherit; font-size: 22px; line-height: 1;\n  background: color-mix(in srgb, var(--cit-bg) 72%, transparent); color: var(--cit-ink);\n}\n.cit-rd__x:hover { color: var(--cit-accent); }\n.cit-rd__body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }\n\n/* gallery half — flex-shrink 1 so a long amenity list can reclaim its rows.\n   ⛔ IT IS A COLUMN FLEX ITSELF, and that is the whole point: when the wrapper gives\n   space back, the STAGE must absorb it and the thumb strip must keep its 68px. My own\n   first shrink-fix skipped this and the strip bled 5-13px OUT of its wrapper on three\n   templates — the same \"the height sits on the wrapper\" defect the plan already paid\n   for, re-created by the fix for something else. */\n.cit-rd__gal {\n  position: relative; flex: 0 1 auto; min-height: 0; background: #000;\n  display: flex; flex-direction: column;\n}\n.cit-rd__gal img { width: 100%; height: 100%; object-fit: cover; display: block; }\n/* ⭐⭐ THE FACTS GET THE SPACE; THE PICTURE TAKES WHAT IS LEFT.\n   Measured three times over: a 4/3 stage ate 292px of a 780px sheet and left 1 of 9\n   amenities in front of the guest. Tuning the stage to a fixed 16/10 then passed on\n   artdeco and still failed on arch-frames, tilted-gallery and wordmark-grow — because\n   the popover wears the SKIN's fonts, so a pixel budget that fits one skin is not a\n   rule, it is a coincidence (the \"barely passing value\" trap).\n   So the stage is ELASTIC (flex-shrink on the gallery, a vh target with a floor) and\n   the text column is what the layout protects. vh, not cq: this overlay is fixed to\n   the VIEWPORT — the @container rules below still own the LAYOUT. */\n.cit-rd__stage { flex: 0 1 auto; height: 24vh; min-height: 96px; max-height: 230px;\n  position: relative; cursor: zoom-in; }\n.cit-rd__nav {\n  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;\n  border: 0; cursor: pointer; font-family: inherit; font-size: 20px;\n  background: color-mix(in srgb, var(--cit-bg) 60%, transparent); color: var(--cit-ink);\n}\n.cit-rd__nav:hover { background: var(--cit-accent); color: var(--cit-on-accent); }\n.cit-rd__nav--prev { left: 0; } .cit-rd__nav--next { right: 0; }\n.cit-rd__count {\n  position: absolute; bottom: 8px; right: 10px; font-size: 11px; letter-spacing: .14em;\n  padding: 4px 9px;\n  background: color-mix(in srgb, var(--cit-bg) 66%, transparent); color: var(--cit-ink);\n}\n.cit-rd__thumbs {\n  display: flex; gap: 6px; padding: 6px; overflow-x: auto; flex: none;\n  background: color-mix(in srgb, var(--cit-bg) 88%, #000);\n}\n/* ⛔⛔ display:flex BEATS the [hidden] attribute's UA display:none. Measured: with a\n   single photo the thumb strip still painted — a dead control the guest can SEE while\n   el.hidden === true. Three of four test units have exactly one photo, so this is the\n   BASE case, not the edge. Every hideable control below repeats the rule on purpose. */\n.cit-rd__thumbs[hidden], .cit-rd__nav[hidden], .cit-rd__count[hidden],\n.cit-rd__desc[hidden], .cit-rd__cap[hidden], .cit-rd__price[hidden],\n.cit-rd__empty[hidden], .cit-rd__gal[hidden] { display: none; }\n/* Without a photo the text column is the top of the sheet — it steps below the\n   44px close button instead of running under it. */\n.cit-rd[data-nophoto] .cit-rd__txt { padding-top: 64px; }\n.cit-rd__thumbs button {\n  flex: none; width: 74px; aspect-ratio: 4/3; border: 1px solid transparent; padding: 0;\n  cursor: pointer; background: 0;\n}\n.cit-rd__thumbs button[aria-current=\"true\"] { border-color: var(--cit-accent); }\n.cit-rd__thumbs img { width: 100%; height: 100%; object-fit: cover; opacity: .62; }\n.cit-rd__thumbs button[aria-current=\"true\"] img { opacity: 1; }\n\n/* text half */\n.cit-rd__txt { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 20px 18px; }\n.cit-rd__brow {\n  font-size: 11px; letter-spacing: .4em; text-transform: uppercase;\n  color: var(--cit-accent); font-weight: 600;\n}\n.cit-rd__txt h3 {\n  font-family: var(--cit-font-display); font-weight: 400; letter-spacing: .06em;\n  font-size: clamp(26px, 6vw, 38px); margin: 8px 0 4px;\n}\n.cit-rd__cap {\n  font-style: italic; font-size: 17px;\n  color: color-mix(in srgb, var(--cit-accent) 60%, var(--cit-ink));\n}\n.cit-rd__price { font-weight: 600; font-size: 16px; margin-top: 6px; }\n.cit-rd__desc { color: var(--cit-muted); font-size: 15px; line-height: 1.7; margin-top: 12px; }\n.cit-rd__h4 {\n  font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: var(--cit-accent);\n  margin-top: 16px; padding-top: 12px;\n  border-top: 1px solid color-mix(in srgb, var(--cit-accent) 24%, transparent);\n}\n/* ⛔⛔ TWO COLUMNS ALREADY ON A PHONE. One column measured 1 of 9 amenities in front of\n   the guest — the contract binds SIX without scrolling, and \"the \u003cli> exists\" is exactly\n   the answer that once reported 9 while the guest saw none. */\n.cit-rd__am { display: grid; gap: 9px 14px; grid-template-columns: 1fr 1fr; margin: 12px 0 0; padding: 0; }\n.cit-rd__am li {\n  display: flex; align-items: center; gap: 10px; list-style: none; font-size: 14.5px;\n  color: var(--cit-ink);\n}\n.cit-rd__am svg { flex: none; color: var(--cit-accent); }\n.cit-rd__empty { color: var(--cit-muted); font-size: 13.5px; font-style: italic; margin-top: 18px; }\n.cit-rd__cta {\n  flex: none; padding: 14px 18px; background: var(--cit-bg);\n  border-top: 1px solid color-mix(in srgb, var(--cit-accent) 28%, transparent);\n}\n.cit-rd__cta a {\n  display: block; width: 100%; text-align: center; text-decoration: none;\n  background: var(--cit-accent); color: var(--cit-on-accent);\n  font-size: 12px; letter-spacing: .24em; text-transform: uppercase; font-weight: 700;\n  padding: 16px 38px; font-family: inherit; transition: .25s;\n}\n.cit-rd__cta a:hover { filter: brightness(1.08); }\n/* ── DESKTOP ─────────────────────────────────────────────────────────────────\n   ⚠️ LAST in the file ON PURPOSE. The first version put this block right after\n   .cit-rd__stage, so every base rule below it — the 1-column amenity grid, the phone\n   padding — came LATER and silently won at equal specificity. Measured on a 1280px\n   viewport: 2 of 9 amenities in front of the guest where the contract binds all nine.\n   The rule read correctly and did nothing. */\n@container (min-width: 900px) {\n  /* ⛔ Measured on the plan: height + overflow:hidden on the WRAPPER put the 68px thumb\n     strip entirely below the box and clipped it away — the gallery the owner approved\n     did not exist. The height belongs on the STAGE; the wrapper grows with it. */\n  /* ⚠️ A padló 120→96: a dátum-mondat hozzáadása ~25px-et vitt el, és két sablonon\n     a 9. felszereltség a hajtás alá esett. A KÉP enged, nem a tények. */\n  .cit-rd__stage { height: 22vh; min-height: 96px; max-height: 250px; }\n  .cit-rd__txt { text-align: center; padding: 22px 44px 18px; }\n  .cit-rd__desc { margin-top: 10px; }\n  .cit-rd__am { grid-template-columns: repeat(3, 1fr); justify-items: center; }\n  .cit-rd__cta { text-align: center; border-top: 0; padding-bottom: 34px; }\n  .cit-rd__cta a { display: inline-block; width: auto; min-width: 280px; }\n}\n\n/* ── whole-unit-band (contract design-refs/tenant-site/whole-unit-band, owner: „C”) ──\n   The whole place as its own band beside the rooms. Its own box-sizing and font, because\n   on the 12 native templates it sits inside the template's section, not a .cit-modsec.\n   Container query, not @media: the band follows the width it is given. */\n.cit-wholeband {\n  box-sizing: border-box; container-type: inline-size; width: 100%; max-width: 1120px;\n  margin: 16px auto 0; padding: 20px; text-align: left;\n  border: 1px solid var(--cit-line); border-radius: calc(var(--cit-radius) * 0.9);\n  background: color-mix(in srgb, var(--cit-accent) 7%, var(--cit-surface, var(--cit-bg)));\n  color: var(--cit-ink); font-family: var(--cit-font-body, inherit);\n}\n.cit-wholeband *, .cit-wholeband *::before, .cit-wholeband *::after { box-sizing: border-box; }\n/* ADR-0257 (contract whole-only A): \"main\" — the house is the ONLY offer, so the band is\n   the lead, not a footnote: a full accent frame and a stronger tint. */\n.cit-wholeband[data-cit-whole-mode=\"main\"] {\n  margin: 0 auto 16px; border: 2px solid var(--cit-accent);\n  background: color-mix(in srgb, var(--cit-accent) 10%, var(--cit-surface, var(--cit-bg)));\n}\n.cit-wholeband[data-cit-whole-mode=\"main\"] .cit-wholeband__t { font-size: 1.55rem; }\n.cit-wholeband[data-cit-whole-mode=\"main\"] .cit-wholeband__price { font-size: 1.1rem; }\n/* Placed BEFORE a template's full-bleed rooms section, it keeps the page gutter and air. */\n.cit-wholeband[data-cit-whole-mode=\"main\"]:has(+ section, + .h-rail) {\n  width: min(1120px, calc(100% - 32px)); margin: 40px auto 8px;\n}\n/* Where the template's rooms container IS its full-bleed section (tilted-gallery,\n   arch-frames, wordmark-grow) or a full-bleed rail (horizontal), the band lands outside\n   any padded column — measured 0..390 px on a phone, edge to edge. It keeps a gutter. */\nsection + .cit-wholeband, .h-rail + .cit-wholeband { width: min(1120px, calc(100% - 32px)); }\n.cit-wholeband__in { display: flex; flex-direction: column; gap: 12px; }\n.cit-wholeband .cit-wholeband__txt {\n  display: flex; flex-direction: column; gap: 4px; color: inherit; text-decoration: none; min-width: 0;\n}\n.cit-wholeband p { margin: 0; line-height: 1.5; }\n.cit-wholeband__brow {\n  font-size: 11px; letter-spacing: .3em; text-transform: uppercase; font-weight: 700;\n  color: var(--cit-accent);\n}\n.cit-wholeband__t {\n  font-family: var(--cit-font-display, inherit); font-size: 1.4rem; font-weight: 600; line-height: 1.25;\n}\n.cit-wholeband__cap { color: var(--cit-muted); }\n.cit-wholeband__price { font-weight: 700; }\n.cit-wholeband__custom b { display: block; font-weight: 700; }\n.cit-wholeband__custom span { display: block; font-size: .85rem; color: var(--cit-muted); }\n.cit-wholeband__cta {\n  align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px;\n  padding: 9px 18px; border: 0; cursor: pointer; text-decoration: none;\n  font: 700 .9rem/1.2 var(--cit-font-body, inherit); letter-spacing: .02em;\n  background: var(--cit-accent); color: var(--cit-on-accent);\n  border-radius: calc(var(--cit-radius) * 0.6);\n}\n.cit-wholeband__cta:hover { filter: brightness(1.07); }\n@container (min-width: 640px) {\n  .cit-wholeband__in { flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; padding: 2px 8px; }\n  .cit-wholeband__cta { align-self: center; flex: none; }\n}\n\n/* A bare photo-box for the three minimal templates whose card is just \u003cfigure> + caption:\n   they have no image wrapper of their own to hang the badge on. */\n.cit-rmbox { position: relative; display: block; }\n\n/* A közös tartalék szoba-kártyájának foglalás-gombja. Mérve 2026-09-22: a hét\n   tartalékra bízott sablonon NULLA volt belőle, vagyis ott a „szobánál a Foglalásra\n   kattintok\" folyamat nem létezett — miközben a 12 saját szekciót rajzoló sablonon\n   végig megvolt. */\n.cit-modsec__roomcta {\n  display: inline-block; margin-top: 4px; padding: 9px 18px; text-decoration: none;\n  font-size: .82rem; font-weight: 700; letter-spacing: .04em;\n  background: var(--cit-accent); color: var(--cit-on-accent);\n  border-radius: calc(var(--cit-radius) * 0.6);\n}\n.cit-modsec__roomcta:hover { filter: brightness(1.07); }\n/* ADR-0257: a presentation room's button opens its details — secondary, not a booking. */\n.cit-modsec__roomcta--more {\n  border: 0; cursor: pointer; font-family: inherit;\n  background: transparent; color: var(--cit-accent); box-shadow: inset 0 0 0 2px var(--cit-accent);\n}\n.cit-modsec__sub {\n  margin: 28px 0 12px; font-family: var(--cit-font-display, inherit); font-size: 1.25rem; font-weight: 600;\n}\n/* \"A ház része — a házzal együtt foglalható.\" — on every template's presentation card. */\n.cit-book__onlyname { margin: 0; line-height: 1.45; }\n.cit-book__onlyname span { font-size: .85rem; color: var(--cit-muted); }\n.cit-room__part { display: block; margin-top: 4px; font-size: .82rem; line-height: 1.4; color: var(--cit-muted); }\n.cit-whole__cta { margin: 14px 0 0; }\n.cit-rd__pricenote { color: var(--cit-muted); font-size: 12.5px; font-style: italic;\n  margin-top: 2px; line-height: 1.45; }\n.cit-rd__pricenote[hidden] { display: none; }\n\n/* Ár a három szikár sablon szoba-feliratában (arch-frames, tilted-gallery,\n   wordmark-grow). Tulajdonosi döntés 2026-09-22: „szobáknál is legyen ár\" — ezeken\n   a kártyákon eddig EGYÁLTALÁN nem volt ár, miközben a többi 16-on igen. A sablon\n   rajzát nem írja át: ugyanaz a felirat-stílus, egy sorral lejjebb. */\n.a-price, .w-price, .t-price { font-weight: 600; opacity: .95; }\n\n/* Touch ergonomics — at the END of the sheet on purpose: same-specificity rules above\n   (.cit-book__dinput{font-size:.9rem}) would otherwise win by source order.\n   (guest-mobile-check (guest-mobile-check, 2026-09-26 — measured on 38 mocks × 3 phone\n   viewports): below 16px iOS zooms the whole page when a field gets focus, and the\n   templates' body font is 13.8–14.4px, so every field inherited a zooming size. On a\n   phone the fields, the date strip and the review form's controls read at 16px, and\n   every control the thumb has to hit is at least 44px tall. */\n@media (max-width: 559px), (max-height: 500px) {\n  .cit-book__input, .cit-book__dinput,\n  .cit-rev-f input:not([type=checkbox]), .cit-rev-f select, .cit-rev-f textarea { font-size: 16px; }\n  .cit-book__input, .cit-rev-f input:not([type=checkbox]), .cit-rev-f select { min-height: 44px; }\n  .cit-book__dinput { min-height: 44px; }\n  .cit-price__tab, .cit-modsec__roomcta { min-height: 44px; display: inline-flex; align-items: center; }\n  .cit-rmbtn { min-height: 44p
