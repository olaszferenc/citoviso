it-details-marker{display:none}\n  .og-faq summary::after{content:\"○\";color:var(--cit-accent);font-size:17px}\n  .og-faq details[open] summary::after{content:\"●\"}\n  .og-faq details p{padding:0 22px 18px;color:var(--cit-muted);font-size:15px}\n\n  /* contact split */\n  .og-reach{display:grid;gap:30px;grid-template-columns:1fr;margin-top:50px;align-items:stretch}\n  @media(min-width:920px){.og-reach{grid-template-columns:1.1fr .9fr}}\n  .og-conphoto{position:relative;border-radius:26px;overflow:hidden;min-height:340px;background:color-mix(in srgb, var(--cit-ink) 10%, var(--cit-surface))}\n  .og-conphoto img{width:100%;height:100%;object-fit:cover}\n  .og-conphoto--flat{background:linear-gradient(155deg, var(--cit-surface), color-mix(in srgb, var(--cit-accent) 30%, var(--cit-surface)))}\n  .og-concard{background:var(--cit-surface);border:1px solid var(--cit-line);border-radius:26px;padding:30px}\n  .og-concard h3{font-size:22px;margin-bottom:18px}\n  .og-conline{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--cit-line);font-size:15.5px}\n  .og-conline:first-of-type{border-top:none}\n  .og-conline svg{width:22px;height:22px;color:var(--cit-accent);flex:none}\n  .og-conline b{font-family:var(--cit-font-display);font-size:16px}\n  .og-conline small{color:var(--cit-muted);font-size:13px;display:block}\n\n  /* footer — rounded */\n  .og-foot{background:color-mix(in srgb, var(--cit-bg) 88%, black);color:color-mix(in srgb, var(--cit-ink) 70%, transparent);padding:60px 0 30px;margin-top:90px;border-radius:44px 44px 0 0}\n  .og-fg{display:grid;gap:34px;grid-template-columns:1fr;margin-bottom:40px}\n  @media(min-width:800px){.og-fg{grid-template-columns:2fr 1fr 1fr}}\n  .og-foot h4{color:var(--cit-ink);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}\n  .og-foot .og-brand{font-family:var(--cit-font-display);font-size:20px;color:var(--cit-ink)}\n  .og-foot p{font-size:14.5px;margin-top:12px;max-width:290px}\n  .og-foot a{display:block;padding:5px 0;font-size:14.5px;transition:.2s}\n  .og-foot a:hover{color:var(--cit-accent)}\n  .og-fb{border-top:1px solid var(--cit-line);padding-top:24px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:13px}\n\n  /* mobile fixed CTA */\n  .og-mobcta{display:none;position:fixed;bottom:var(--citui-consent-h,0px);left:0;right:0;z-index:110;background:color-mix(in srgb, var(--cit-surface) 96%, transparent);border-top:1px solid var(--cit-line);backdrop-filter:blur(10px);padding:12px 16px;gap:12px;align-items:center;justify-content:space-between}\n  .og-mobcta span{font-size:14px;color:var(--cit-ink)}\n  .og-mobcta b{color:var(--cit-accent)}\n  @media(max-width:700px){.og-mobcta{display:flex}body{padding-bottom:64px}}\n\n\n  .cit-mast{position:relative;z-index:40;text-align:center;\n    color:var(--mast-ink,var(--cit-ink));padding:30px 24px 0}\n  .cit-mast-name{display:block;padding:8px 0;margin:-8px 0;font-family:var(--mast-font,var(--cit-font-display));\n    font-weight:var(--mast-weight,400);font-size:clamp(28px,3vw,40px);\n    letter-spacing:var(--mast-track,.5px);line-height:1.1;color:inherit;text-decoration:none}\n  .cit-mast-place{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}\n  .cit-mast-place::before,.cit-mast-place::after{content:\"\";height:1px;width:min(70px,9vw);\n    background:var(--mast-rule,color-mix(in srgb, var(--cit-ink) 30%, transparent))}\n  .cit-mast-place span{font-size:10.5px;letter-spacing:4.5px;text-transform:uppercase;font-weight:500;\n    color:var(--mast-sub,color-mix(in srgb, var(--cit-ink) 70%, transparent))}\n  .cit-mast-links{display:flex;justify-content:center;gap:30px;align-items:center;margin:16px auto 0;\n    padding:0;max-width:640px;\n    border-top:1px solid var(--mast-line,color-mix(in srgb, var(--cit-ink) 18%, transparent));\n    border-bottom:1px solid var(--mast-line,color-mix(in srgb, var(--cit-ink) 18%, transparent))}\n  /* The 12px row padding moved INTO the links (guest-mobile-check, 2026-09-26): the same\n     look, but the booking link's tap target is a MEASURED 44px instead of 21px — the thumb\n     hits the rule lines' whole band, not a hairline of text. min-height + inline-flex, not\n     padding arithmetic: 13px+line-height+13px came to 43px where a template set a tighter\n     line-height (brutalism, measured by the parent session) — a rule that passes by 1px\n     is a dead rule. The hot underline is a text-decoration so it stays under the letters. */\n  .cit-mast-links a{color:var(--mast-linkink,var(--cit-ink));\n    text-decoration:none;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:500;transition:.25s;\n    padding:0 4px;min-height:44px;display:inline-flex;align-items:center;box-sizing:border-box}\n  .cit-mast-links a:hover{color:var(--mast-hover,var(--cit-accent))}\n  .cit-mast-links a.cit-mast-hot{font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;\n    text-decoration-color:var(--mast-hotline,var(--cit-accent))}\n  /* PHONE (≤720px) — contract amendment 2026-09-26 (design-refs/engine/name-masthead/phone,\n     FK-009 V2): the structure stays (name → place → band) but the band collapses to the hot\n     link as a CHIP in the template's shape (--mast-chip), the air tightens, and where the\n     template carries a fixed booking bar the band is dropped altogether — the CTA lives in\n     the bar. Measured: 148–200px → 69–96px on the bar templates, 155 → 140 with the chip;\n     the desktop lockup is byte-identical. Overlay heads also drop the hairlines so the top\n     of the photo belongs to the name and the picture, not to two rules. Orientation is\n     not width (a landscape phone is 844px wide and 390px high): the same compact head\n     applies under 500px of height, where the desktop lockup would take 45% of the screen. */\n  @media(max-width:720px),(max-height:500px){\n    /* .cit-mast.cit-mast (0,2,0): the templates' own dialect rule (body.cit-tpl-x .cit-mast, 0,1,1)\n       sets padding-top 34–38px and would win over a plain .cit-mast here — measured on a\n       landscape phone: claymorphism 180px, scrapbook 159px, dopamine 151px with the chip. */\n    .cit-mast.cit-mast{padding-top:var(--mast-pad-m,22px)}\n    .cit-mast-name{font-size:26px}\n    .cit-mast-place{margin-top:6px;gap:10px}\n    .cit-mast-place span{letter-spacing:3px;font-size:10px}\n    \n    .cit-mast-links{border:0;margin-top:8px;gap:0;max-width:none}\n    .cit-mast-links a:not(.cit-mast-hot){display:none}\n    .cit-mast-links a.cit-mast-hot{text-decoration:none;padding:0 18px;\n      border:1px solid var(--mast-line,color-mix(in srgb, var(--cit-ink) 30%, transparent));\n      border-radius:var(--mast-chip,999px)}\n  }\n  /* The band is dropped ONLY where the template's fixed booking bar is actually shown — the\n     bars live behind max-width:700px, so on a landscape phone (844 wide, 390 high) the\n     compact CHIP stays: measured 2026-09-26, tying this to max-height too left 12 templates\n     with no booking CTA on the landscape first screen. */\n  @media(max-width:700px){\n    .cit-mast[data-cit-mast-bar] .cit-mast-links{display:none}\n  }\n  /* landscape phone (390px high): the chip stays, the name steps down a size so the lockup\n     holds ≤150px even where the template pads the head (measured 114–180 → ≤150) */\n  @media(max-height:500px) and (min-width:701px){\n    .cit-mast-name{font-size:22px}\n    .cit-mast-links{margin-top:6px}\n  }\n\n  .cit-mobcta__t{display:flex;flex-direction:column;min-width:0;line-height:1.25;gap:1px}\n  .cit-mobcta__t b{font-size:17px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .cit-mobcta__t b svg{width:14px;height:14px;flex:none}\n  .cit-mobcta__t small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;text-transform:none;font-family:var(--cit-font-body)}\n  \u003c/style>\n\u003cstyle data-cit-modsec>\n/* The 16 templates do not agree on a global box-sizing reset, so every box here\n   states its own. Measured, not assumed: without this the amenity cards overran\n   their section by 27px on fullbleed and pushed editorial into a 12px horizontal\n   scroll — a sideways-scrolling page is the classic broken-on-a-phone symptom. */\n.cit-modsec,.cit-modsec *{box-sizing:border-box}\n/* Template-native contract (ADR-0057): each art template overrides these vars to its\n   OWN section rhythm, so a paid module reads as part of the site instead of a generic\n   grey appendix. The defaults reproduce the pre-contract look verbatim, so a template\n   that sets nothing renders byte-identically to before. This is O(templates) one-liners\n   per template, NOT the O(templates × modules) trap — the module MARKUP stays single-\n   source here; only the section's rhythm/card treatment is themed per template. */\n.cit-modsec{\n  --_py:var(--cit-modsec-py,56px);\n  --_maxw:var(--cit-modsec-maxw,1120px);\n  --_px:var(--cit-modsec-px,4vw);\n  --_align:var(--cit-modsec-head-align,left);\n  --_head-mb:var(--cit-modsec-head-mb,22px);\n  --_head-size:var(--cit-modsec-head-size,clamp(1.3rem,3.2vw,1.9rem));\n  --_head-weight:var(--cit-modsec-head-weight,700);\n  --_card-bg:var(--cit-modsec-card-bg,var(--cit-bg));\n  --_card-border:var(--cit-modsec-card-border,1px solid var(--cit-line));\n  --_card-radius:var(--cit-modsec-card-radius,calc(var(--cit-radius) * 0.6));\n  --_card-pad:var(--cit-modsec-card-pad,12px 14px);\n  padding:var(--_py) 0;border-top:var(--cit-modsec-divider,1px solid var(--cit-line));\n  overflow-x:hidden}\n.cit-modsec__in{width:100%;max-width:var(--_maxw);margin:0 auto;padding:0 var(--_px)}\n.cit-modsec h2{font-family:var(--cit-font-display,inherit);font-size:var(--_head-size);\n  font-weight:var(--_head-weight);text-align:var(--_align);\n  margin:0 0 var(--_head-mb);color:var(--cit-ink)}\n.cit-modsec__grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}\n.cit-modsec__item{display:flex;align-items:flex-start;gap:10px;padding:var(--_card-pad);\n  border:var(--_card-border);border-radius:var(--_card-radius);\n  background:var(--_card-bg);color:var(--cit-ink)}\n.cit-modsec__item svg{flex:0 0 auto;width:18px;height:18px;stroke:var(--cit-accent);\n  fill:none;stroke-width:1.8;margin-top:2px}\n.cit-modsec__facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.cit-modsec__fact{padding:var(--_card-pad);border:var(--_card-border);\n  border-radius:var(--_card-radius);background:var(--_card-bg)}\n.cit-modsec__fact b{display:block;font-size:1.25rem;color:var(--cit-ink)}\n.cit-modsec__fact span{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;\n  color:var(--cit-muted);font-weight:600}\n.cit-modsec__note{margin:16px 0 0;color:var(--cit-muted)}\n.cit-modsec__badge{margin:0 0 16px}\n.cit-modsec table{width:100%;border-collapse:collapse;table-layout:fixed}\n.cit-modsec th,.cit-modsec td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--cit-line);\n  overflow-wrap:anywhere}\n.cit-modsec th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--cit-muted)}\n.cit-modsec td{color:var(--cit-ink)}\n/* A 3-column price table cannot shrink below its content, which pushed a narrow\n   template into horizontal scroll (measured: 23px on card-sidebar). On a phone the\n   right answer is not a scrollable table but stacked rows, each labelled. */\n@media (max-width:560px){\n  .cit-modsec table,.cit-modsec tbody,.cit-modsec tr,.cit-modsec td{display:block;width:100%}\n  .cit-modsec thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n  .cit-modsec tr{padding:12px 0;border-bottom:1px solid var(--cit-line)}\n  .cit-modsec td{border:0;padding:2px 0}\n  .cit-modsec td:first-child{font-weight:600}\n  .cit-modsec td:empty{display:none}\n  /* ⛔ \"each labelled\" — the comment above promised it, the CSS never delivered it.\n     While the cells were an EMPTY one (hidden by :empty) and a self-describing\n     money amount, nothing showed. The sample table's B form (owner's choice,\n     2026-09-14) carries a dashed placeholder and „Ön írja be\" — two cells that mean\n     NOTHING without their column name once the header row is hidden. Measured at\n     390 px: „Főszezon / ▭▭▭▭ / Ön írja be\", and no way to tell which is the date and\n     which is the price. A cell that needs its column says so. */\n  .cit-modsec td[data-cit-col]::before{content:attr(data-cit-col) \" \";\n    font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;\n    color:var(--cit-muted);font-weight:600;font-style:normal}\n}\n.cit-news{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}\n.cit-news input{flex:1;min-width:220px;font:inherit;padding:12px 14px;color:var(--cit-ink);\n  background:var(--cit-bg);border:1px solid var(--cit-line);\n  border-radius:calc(var(--cit-radius) * 0.6)}\n/* Review form: one column on a phone, two where there is room. minmax(0,1fr) not\n   1fr — a bare 1fr refuses to shrink below its content and re-creates the sideways\n   scroll the box-sizing note above describes. */\n.cit-rev-f{display:grid;gap:14px;grid-template-columns:1fr;margin-top:6px}\n@media (min-width:620px){.cit-rev-f{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.cit-rev-f__wide{grid-column:1/-1}\n.cit-rev-f__lbl{display:flex;flex-direction:column;gap:6px;font-size:.86rem;\n  color:var(--cit-muted);font-weight:600}\n.cit-rev-f input,.cit-rev-f select,.cit-rev-f textarea{font:inherit;padding:12px 14px;\n  color:var(--cit-ink);background:var(--cit-bg);border:1px solid var(--cit-line);\n  border-radius:calc(var(--cit-radius) * 0.6);width:100%;max-width:100%}\n.cit-rev-f textarea{resize:vertical}\n/* ADR-0110: the publication-consent tick-box. A checkbox must NOT inherit the\n   full-width input rule above, or it renders as a giant square. */\n.cit-rev-f__consent{display:flex;align-items:flex-start;gap:10px;font-size:.86rem;\n  line-height:1.5;color:var(--cit-ink)}\n.cit-rev-f__consent input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;\n  margin-top:2px;padding:0;accent-color:var(--cit-accent)}\n.cit-rev-f__consent a{color:var(--cit-accent)}\n/* Google rating badge — a number and a way to verify it. */\n.cit-grat{display:inline-flex;align-items:center;gap:14px;text-decoration:none;\n  padding:14px 20px;border:1px solid var(--cit-line);background:var(--cit-bg);\n  border-radius:calc(var(--cit-radius) * 0.6);color:var(--cit-ink);max-width:100%}\n.cit-grat__icon svg{width:26px;height:26px;stroke:var(--cit-accent);fill:none;stroke-width:1.8}\n.cit-grat__num{font-size:1.7rem;font-weight:700;line-height:1}\n.cit-grat__meta{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--cit-muted)}\n.cit-grat__meta em{font-style:normal;color:var(--cit-accent);font-weight:600}\n/* ADR-0061 — the honest sample marker on a NATIVE-styled demo section (§B.17): the\n   module is the real one, only its data is representative. Same pill language as the\n   booking demo ribbon, token-themed. */\n.cit-modsec__minta{display:inline-block;vertical-align:middle;margin-left:12px;\n  font-family:var(--cit-font-body);font-size:.58em;font-weight:700;\n  letter-spacing:.08em;text-transform:uppercase;\n  color:color-mix(in srgb, var(--cit-accent) 70%, var(--cit-ink));\n  border:1px solid color-mix(in srgb, var(--cit-accent) 45%, transparent);\n  border-radius:100px;padding:3px 10px;white-space:nowrap}\n/* Per-room price switcher (owner decree 2026-08-23): with several rooms the guest\n   reads ONE room's prices at a time. The tabs are built by the runtime; without JS\n   every block stays visible under its own heading (nothing hides behind a script). */\n.cit-price__tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}\n.cit-price__tab{font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;\n  padding:9px 16px;border:1px solid var(--cit-line);background:var(--cit-bg);\n  color:var(--cit-muted);border-radius:100px;transition:.15s}\n.cit-price__tab:hover{border-color:var(--cit-accent);color:var(--cit-ink)}\n.cit-price__tab[aria-selected=\"true\"]{background:var(--cit-accent);\n  border-color:var(--cit-accent);color:var(--cit-on-accent)}\n.cit-price__unit[hidden]{display:none}\n/* With tabs the block's own heading is redundant — the selected tab names it. */\n.cit-price--tabbed .cit-price__name{display:none}\n.cit-price--tabbed .cit-price__unit table{margin-top:0}\n/* The SAMPLE price table (owner's choice „B — kitöltendő mezők\", 2026-09-14): a cell\n   the owner will fill LOOKS like one. It used to be an empty \u003ctd> and an em dash, so\n   the lead read a finished table that happened to be blank — and the caption talked\n   about prices that were not on the screen at all. The dashed rule is a placeholder,\n   not data: nothing here can be mistaken for a number. */\n.cit-price__fill{display:inline-block;min-width:110px;max-width:100%;height:10px;\n  border-radius:3px;vertical-align:middle;\n  background:repeating-linear-gradient(90deg,var(--cit-line) 0 9px,transparent 9px 15px)}\n.cit-price__you{color:var(--cit-muted);font-style:italic;white-space:nowrap}\n/* ── Heti programajánló (poi) — approved contract A, design-refs/public-site/programajanlo/.\n   Mobile: 5 rows + a show-more toggle; ≥720px CONTAINER: two columns, all rows. The\n   toggle is a CSS checkbox, so the rest opens without JS (no-JS empty-band rule). */\n.cit-ev{container-type:inline-size}\n.cit-ev__lead{margin:-8px 0 20px;color:var(--cit-muted)}\n.cit-ev__minta{color:var(--cit-ink)}\n.cit-ev__list{list-style:none;margin:0;padding:0;display:grid}\n.cit-ev__row{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--cit-line)}\n.cit-ev__date{text-align:center;border:1px solid var(--cit-line);border-radius:var(--_card-radius);padding:6px 0;\n  background:var(--cit-surface,var(--_card-bg));align-self:start}\n.cit-ev__date b{display:block;font-family:var(--cit-font-display,inherit);font-size:1.6rem;line-height:1;color:var(--cit-ink)}\n.cit-ev__date span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--cit-accent);font-weight:700}\n.cit-ev__row h3{margin:0;font-family:var(--cit-font-body,inherit);font-size:1.02rem;line-height:1.3;color:var(--cit-ink);overflow-wrap:anywhere}\n.cit-ev__meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:6px 0 0;font-size:.88rem;color:var(--cit-muted)}\n.cit-ev__where{display:inline-flex;align-items:center;gap:4px}\n.cit-ev svg{width:14px;height:14px;fill:none;stroke-width:1.8;flex:0 0 auto}\n.cit-ev__where svg{stroke:var(--cit-accent)}\n.cit-ev__dist{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--cit-line);\n  font-size:.78rem;font-weight:600;color:var(--cit-ink)}\n.cit-ev__dist.is-here{background:var(--cit-accent);border-color:var(--cit-accent);color:var(--cit-on-accent);\n  text-transform:uppercase;letter-spacing:.05em}\n.cit-ev__src{margin:6px 0 0;font-size:.8rem;color:var(--cit-muted)}\n.cit-ev__src a{display:inline-flex;align-items:center;gap:3px;color:var(--cit-muted);text-decoration:underline;text-underline-offset:2px}\n.cit-ev__src a svg{stroke:currentColor}\n.cit-ev__row.is-more{display:none}\n/* Visually hidden but FOCUSABLE: a keyboard user tabs to it and toggles with space. */\n.cit-ev__toggle{position:absolute;width:1px;height:1px;opacity:0;margin:0;pointer-events:none}\n.cit-ev__toggle:checked ~ .cit-ev__list .cit-ev__row.is-more{display:grid}\n.cit-ev__more{display:inline-block;margin-top:16px;padding:10px 18px;border-radius:var(--_card-radius);\n  border:1px solid var(--cit-accent);color:var(--cit-accent);font-weight:600;font-size:.95rem;cursor:pointer}\n.cit-ev__toggle:checked ~ .cit-ev__more{display:none}\n.cit-ev__toggle:focus-visible ~ .cit-ev__more{outline:2px solid var(--cit-accent);outline-offset:2px}\n@container (min-width:720px){\n  .cit-ev__list{grid-template-columns:1fr 1fr;column-gap:40px}\n  .cit-ev__row.is-more{display:grid}\n  .cit-ev__more,.cit-ev__toggle{display:none}\n}\n\u003c/style>\u003c/head>\n\u003cbody class=\"cit-tpl-organic\" data-cit-native=\"rooms selling-points gallery hours usp map reviews booking\">\n    \u003cheader class=\"cit-mast\" data-cit-mast-bar>\n    \u003ca class=\"cit-mast-name\" href=\"#top\">Kemencés Vendégház\u003c/a>\n    \u003cdiv class=\"cit-mast-place\">\u003cspan>Szentbékkálla, Balaton-felvidék\u003c/span>\u003c/div>\n    \u003cnav class=\"cit-mast-links\">\u003ca href=\"#og-rooms\">Szobák\u003c/a>\u003ca href=\"#og-rhythm\">A birtok élete\u003c/a>\u003ca href=\"#og-gallery\">Galéria\u003c/a>\u003ca href=\"#og-contact\">Kapcsolat\u003c/a>\u003ca class=\"cit-mast-hot\" href=\"#cit-booking\">Foglalás\u003c/a>\u003c/nav>\n  \u003c/header>\n    \u003cheader class=\"og-hero\" id=\"top\">\n    \u003cdiv class=\"og-hero-grad\">\u003c/div>\n    \u003cdiv class=\"og-wrap og-hero-in\">\n      \u003cdiv>\n        \u003ch1>Fedett nyári konyha, grillező kert és kutyabarát porta \u003cem>a Kék túra útvonalán\u003c/em>\u003c/h1>\n        \u003cp>Szentbékkállai kőfalas portán, a Kék túra útvonalán, kutyabarát fogadtatással.\u003c/p>\n        \u003cdiv>\n          \u003ca class=\"cit-btn\" href=\"#cit-booking\">Szabad időpontot kérek\u003c/a>\n          \u003ca class=\"cit-btn cit-btn-ghost\" href=\"#og-rhythm\">A birtok élete\u003c/a>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"og-hero-visual\">\n        \u003cdiv class=\"og-hv1 og-blob-a\">\u003cimg src=\"/uploads/4b27db3b-b31a-4079-aea3-853da7cfaa50/d633cc74d4869812.jpg\" alt=\"Kemencés Vendégház\">\u003c/div>\n        \u003cdiv class=\"og-hv2 og-blob-b\">\u003cimg src=\"/uploads/4b27db3b-b31a-4079-aea3-853da7cfaa50/f669099f059c76d7.jpg\" alt=\"Kemencés Vendégház\">\u003c/div>\n        \u003cdiv class=\"og-hv-leaf og-blob-c\">\u003c/div>\n      \u003c/div>\n    \u003c/div>
