<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A — Masthead: a név a lap fejlécének közepén</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cit-accent:#44361d; --cit-bg:#f7f2ea; --cit-ink:#241a17; --cit-line:#e2d9cb;
    --cit-font-display:'Fraunces',Georgia,serif; --cit-font-body:'Jost',system-ui,sans-serif;
  }
  body{margin:0;background:#dcd5c9;font-family:var(--cit-font-body)}
  .bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;background:#0e2a47;color:#fff;font:600 13px/1 var(--cit-font-body);flex-wrap:wrap}
  .bar button{font:600 13px/1 var(--cit-font-body);padding:8px 16px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;border-radius:4px}
  .bar button.on{background:#fff;color:#0e2a47}
  .stage{margin:16px auto;container-type:inline-size;width:min(1216px,96vw);box-shadow:0 8px 40px rgba(0,0,0,.25);transition:width .3s}
  body.mobile .stage{width:390px}

  /* ── DESIGN: editorial masthead floating over the photo ──────────────
     The name is the FIRST thing read — not by being huge, but by owning
     the top-center position with rules and spaced-caps, like a paper's
     masthead (reference: 05-editorial / Kékfestő Porta). */
  .t-mast{position:absolute;inset:0 0 auto 0;z-index:5;text-align:center;color:#fff;padding:30px 24px 0}
  .t-mastname{font-family:var(--cit-font-display);font-weight:400;font-size:clamp(28px,3cqw,40px);letter-spacing:.5px;line-height:1.1}
  .t-mastsub{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
  .t-mastsub::before,.t-mastsub::after{content:"";height:1px;width:min(70px,9cqw);background:rgba(255,255,255,.4)}
  .t-mastsub span{font-size:10.5px;letter-spacing:4.5px;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:500}
  .t-mastlinks{display:flex;justify-content:center;gap:30px;align-items:center;margin-top:16px;padding:12px 0;border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22);max-width:640px;margin-left:auto;margin-right:auto}
  .t-mastlinks a{color:rgba(255,255,255,.85);text-decoration:none;font-size:11px;letter-spacing:2.5px;text-transform:uppercase}
  .t-mastlinks a.hot{color:#fff;font-weight:600;border-bottom:1px solid color-mix(in srgb,var(--cit-accent) 40%,#fff);padding-bottom:2px}

  .cit-btn{display:inline-block;background:var(--cit-accent);color:#fff;text-decoration:none;font:600 12px/1 var(--cit-font-body);letter-spacing:2.5px;text-transform:uppercase;padding:16px 32px;border-radius:2px}
  .cit-btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.6)}
  .t-hero{position:relative;height:720px;display:flex;align-items:flex-end;justify-content:center;text-align:center;color:#fff;overflow:hidden}

    .t-mastsub span{letter-spacing:3.5px}
    .t-mastlinks{gap:18px;max-width:330px}
    .t-mastlinks a:not(.hot){display:none}
    .t-mastlinks{justify-content:center}
    .t-hero{height:760px}
    .t-hero h1{font-size:clamp(30px,8.5cqw,38px)}
    .t-heroin{padding-bottom:64px}
  }
</style>
</head>
<body>
<div class="bar">
  <span>A — MASTHEAD</span>
  <button id="bm" onclick="setM(true)">Mobil 390px</button>
  <button id="bd" onclick="setM(false)">Asztali</button>
</div>
<div class="stage">
  <div style="position:relative">
    <header class="t-hero">
      <div class="t-herobg"></div>
      <div class="t-mast">
        <div class="t-mastname">Levendula Vendégház</div>
        <div class="t-mastsub"><span>Balatonföldvár</span></div>
        <nav class="t-mastlinks">
          <a href="#">Szolgáltatások</a><a href="#">Galéria</a><a href="#">Vélemények</a><a href="#">Kapcsolat</a>
          <a class="hot" href="#">Foglalás</a>
        </nav>
      </div>
      <div class="t-heroin">
        <h1>Ahol a terasz árnyéka <em>pihenni hív</em></h1>
        <p class="t-herosub">Fedett terasz, tágas kert és otthonos béke egy nyaraláshoz</p>
        <div class="t-heroctas">
          <a class="cit-btn" href="#">Szabad időpontot kérek</a>
          <a class="cit-btn cit-btn-ghost" href="#">Nézzen körül</a>
        </div>
      </div>
    </header>
  </div>
</div>
<script>
  function setM(m){document.body.classList.toggle("mobile",m);
    document.getElementById("bm").classList.toggle("on",m);
    document.getElementById("bd").classList.toggle("on",!m);}
  setM(matchMedia("(max-width:700px)").matches);
</script>
</body>
</html>
