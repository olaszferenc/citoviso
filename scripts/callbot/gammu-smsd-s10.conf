# Drop-in: /etc/systemd/system/gammu-smsd.service.d/s10.conf
# The modem SIM lives in the Galaxy S10 since 2026-11-06. The gammu-smsd unit now runs the
# S10 bridge (scripts/callbot/s10_smsd.py), which keeps the gammu SQL schema (minereal_sms),
# so Citoviso and MineREAL keep working unchanged. Remove this file (and daemon-reload) to
# go back to the SIM800C with the real gammu-smsd.
[Service]
Type=simple
PIDFile=
User=citoviso
SupplementaryGroups=plugdev
ExecStart=
ExecStart=/usr/bin/python3 -u /home/citoviso/citoviso/scripts/callbot/s10_smsd.py
ExecReload=
ExecStopPost=
Restart=always
RestartSec=5
